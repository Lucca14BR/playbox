<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PlayBox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B0F8C"/>
      <stop offset="1" stop-color="#1A0545"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="250" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDBA4D" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#F97316" stop-opacity=".45"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="1" stop-color="#FFB020"/>
    </linearGradient>
  </defs>

  <!-- Fundo: roxo escuro liso, para a caixa e a carinha saltarem mesmo em tamanho pequeno -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="250" r="190" fill="url(#glow)"/>

  <!-- Tampa aberta, inclinada para trás -->
  <g transform="rotate(-16 170 150)">
    <rect x="84" y="118" width="250" height="62" rx="16" fill="#7C3AED"/>
    <rect x="84" y="118" width="250" height="22" rx="11" fill="#A78BFA"/>
    <rect x="186" y="118" width="46" height="62" fill="#FB923C"/>
  </g>

  <!-- Carinha saindo da caixa (o ponto que mais chama atenção) -->
  <circle cx="262" cy="228" r="92" fill="url(#face)"/>
  <path d="M220 214 q14 -20 28 0" fill="none" stroke="#5B2A00" stroke-width="13" stroke-linecap="round"/>
  <path d="M276 214 q14 -20 28 0" fill="none" stroke="#5B2A00" stroke-width="13" stroke-linecap="round"/>
  <path d="M214 248 q48 52 96 0 z" fill="#5B2A00"/>
  <path d="M236 272 q26 16 52 0 q-26 -10 -52 0 z" fill="#F43F5E"/>

  <!-- Caixa: frente grande, com a faixa laranja bem larga -->
  <path d="M96 290 h320 l-14 156 q-2 22 -24 22 H134 q-22 0 -24 -22 z" fill="url(#front)"/>
  <path d="M232 290 h52 l-6 178 h-40 z" fill="#FB923C"/>
  <rect x="86" y="272" width="340" height="40" rx="14" fill="#A78BFA"/>
  <rect x="226" y="272" width="64" height="40" fill="#FDBA74"/>

  <!-- Poucos confetes, grandes (os pequenos somem no ícone do celular) -->
  <path d="M404 96 l12 28 28 12 -28 12 -12 28 -12 -28 -28 -12 28 -12 z" fill="#FFE45C"/>
  <rect x="78" y="226" width="30" height="16" rx="6" transform="rotate(-30 93 234)" fill="#F472B6"/>
  <rect x="404" y="220" width="30" height="16" rx="6" transform="rotate(25 419 228)" fill="#FB923C"/>
  <circle cx="140" cy="96" r="11" fill="#FB923C"/>
</svg>
