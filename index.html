  id: 'lobisomem', name: 'Lobisomem Relâmpago', tag: 'Dedução social', icon: 'moon', color: '#7C3AED', lip: '#5B21B6', min: 4, rounds: 1,
  how: 'Cada um recebe um papel secreto. À noite o lobisomem ataca, a vidente investiga e o médico protege. De dia, a vila conversa no chat e vota para eliminar alguém. A vila vence se tirar o lobisomem; os lobos vencem se ficarem em igual número. O time vencedor ganha +3, e quem sobrevive leva +1.',
  first: 'roles',
  init(g) {
    const ids = shuffle(g.roster), n = ids.length, nw = n >= 7 ? 2 : 1, roles = {};
    ids.forEach((id, i) => { roles[id] = i < nw ? 'lobo' : i === nw ? 'vidente' : i === nw + 1 && n >= 5 ? 'medico' : 'aldeao'; });
    g.data = { roles, alive: [...g.roster], ok: {}, night: 0, act: {}, votes: {}, seen: {}, dawn: null, dusk: null, winner: null };
  },
  phases: {
    roles: { label: 'Seu papel', dur: 12, bot: [1, 3], next: 'night', allIn: (g, s) => active(g, s).every(id => g.data.ok[id]) },
    night: { label: 'Noite', dur: 25, bot: [2, 12], next: 'dawn', hideTimer: false,
      enter(g) { g.data.night++; g.data.act = {}; },
      allIn: (g, s) => wolfPowers(g, s).every(id => id in g.data.act) },
    dawn: { label: 'Amanheceu', dur: 7, next: g => g.data.winner ? 'reveal' : 'day',
      enter(g) {
        const d = g.data, picks = {};
        Object.entries(d.act).forEach(([pid, t]) => { if (d.roles[pid] === 'lobo') add(picks, t, 1); });
        const max = Math.max(0, ...Object.values(picks)), top = Object.keys(picks).filter(t => picks[t] === max);
        const target = top.length ? pick(top) : null;
        const saved = Object.entries(d.act).some(([pid, t]) => d.roles[pid] === 'medico' && t === target);
        d.dawn = { target, saved };
        if (target && !saved) d.alive = d.alive.filter(id => id !== target);
        d.winner = wolfWinner(d);
      } },
    day: { label: 'Votação da vila', dur: 50, perP: 2, bot: [8, 35], next: 'dusk', enter(g) { g.data.votes = {}; },
      allIn: (g, s) => active(g, s).filter(id => g.data.alive.includes(id)).every(id => id in g.data.votes) },
    dusk: { label: 'A vila decidiu', dur: 7, next: g => g.data.winner || g.data.night >= 3 ? 'reveal' : 'night',
      enter(g) {
        const d = g.data, { top } = voteCounts(d.votes), out = top.length === 1 ? top[0] : null;
        d.dusk = { out, tie: top.length > 1 };
        if (out) d.alive = d.alive.filter(id => id !== out);
        d.winner = wolfWinner(d);
      } },
    reveal: { label: 'Fim de jogo', dur: 15, enter(g, s) {
      const d = g.data, deltas = {};
      if (!d.winner) d.winner = wolfAlive(d, 'lobos').length ? 'lobos' : 'vila';
      g.roster.forEach(id => { if (WOLF_ROLES[d.roles[id]].team === d.winner) { add(deltas, id, 3 + (d.alive.includes(id) ? 1 : 0)); if (d.alive.includes(id)) matchStat(s, id, 'survive'); } });
      updateScores(s, deltas);
    } },
  },
  handle(g, s, pid, a) {
    const d = g.data, role = d.roles[pid], alive = d.alive.includes(pid);
    if (!inRoster(g, pid)) return false;
    if (g.phase === 'roles' && a.type === 'ok') { d.ok[pid] = 1; return true; }
    if (g.phase === 'night' && a.type === 'night' && alive && role !== 'aldeao' && !(pid in d.act) && d.alive.includes(a.target)) {
      if (role === 'lobo' && d.roles[a.target] === 'lobo') return false;
      if (role === 'vidente' && a.target === pid) return false;
      d.act[pid] = a.target;
      if (role === 'vidente') (d.seen[pid] = d.seen[pid] || []).push({ id: a.target, wolf: d.roles[a.target] === 'lobo' });
      return true;
    }
    if (g.phase === 'day' && a.type === 'vote' && alive && a.target !== pid && d.alive.includes(a.target)) { d.votes[pid] = a.target; return true; }
    return false;
  },
  done(g, pid) {
    const d = g.data;
    return g.phase === 'roles' ? !!d.ok[pid] : g.phase === 'night' ? pid in d.act || d.roles[pid] === 'aldeao' || !d.alive.includes(pid)
      : g.phase === 'day' ? pid in d.votes || !d.alive.includes(pid) : false;
  },
  bot(g, s, pid) {
    const d = g.data, role = d.roles[pid], others = d.alive.filter(id => id !== pid);
    if (g.phase === 'roles') return { type: 'ok' };
    if (!d.alive.includes(pid)) return null;
    if (g.phase === 'night') {
      if (role === 'lobo') { const t = others.filter(id => d.roles[id] !== 'lobo'); return t.length ? { type: 'night', target: pick(t) } : null; }
      if (role === 'vidente') { const seen = (d.seen[pid] || []).map(x => x.id), t = others.filter(id => !seen.includes(id)); return { type: 'night', target: pick(t.length ? t : others) }; }
      if (role === 'medico') return { type: 'night', target: Math.random() < .3 ? pid : pick(others) };
      return null;
    }
    if (g.phase === 'day') {
      // Vidente-bot que já achou o lobo vota nele; lobo-bot nunca vota no parceiro.
      const found = (d.seen[pid] || []).find(x => x.wolf && d.alive.includes(x.id));
      const pool = role === 'lobo' ? others.filter(id => d.roles[id] !== 'lobo') : others;
      return pool.length ? { type: 'vote', target: found ? found.id : pick(pool) } : null;
    }
    return null;
  },
  view(g, s, me) {
    const d = g.data, role = d.roles[me], R = role && WOLF_ROLES[role], alive = d.alive.includes(me);
    // Plateia vê os papéis de todo mundo; o telão (que a mesa toda olha) não.
    const omni = myRole() === 'spectator', who = id => `${avatar(s.players[id], 'sm')}<span>${esc(nameOf(s, id))}</span>`;
    const roleTag = id => omni || g.phase === 'reveal' ? `<span class="tag wolf-tag">${WOLF_ROLES[d.roles[id]].e} ${WOLF_ROLES[d.roles[id]].name}</span>` : '';
    const villagers = `<ul class="wolf-people">${g.roster.filter(id => s.players[id]).map(id => `<li class="${d.alive.includes(id) ? '' : 'is-dead'}">${who(id)}${roleTag(id)}${d.alive.includes(id) ? '' : '<span class="wolf-rip">💀</span>'}</li>`).join('')}</ul>`;
    const mates = role === 'lobo' ? g.roster.filter(id => id !== me && d.roles[id] === 'lobo') : [];
    const myCard = R ? `<div class="wolf-card role-${role}"><span class="wolf-e">${R.e}</span><div><p class="wolf-role">Você é: <b>${R.name}</b></p><p class="hint">${R.desc}</p>
      ${mates.length ? `<p class="hint">Seu parceiro: <b>${mates.map(id => esc(nameOf(s, id))).join(', ')}</b></p>` : ''}</div></div>` : '';
    const pickList = (act, ids, chosen) => `<div class="pick-grid">${ids.map(id => `<button class="pick ${chosen === id ? 'on' : ''}" data-act="${act}" data-id="${id}" ${chosen ? 'disabled' : ''}>${avatar(s.players[id], 'md')}<span class="pick-name">${esc(nameOf(s, id))}</span></button>`).join('')}</div>`;
    if (g.phase === 'roles') {
      if (!R) return `<p class="verdict center">🌕 A vila vai dormir…</p>${villagers}<p class="hint center">Cada jogador está vendo o próprio papel em segredo.</p>`;
      const flipped = Store.local.wolfFlip === `${g.round}:${me}`;
      return `<div class="wolf-flip ${flipped ? 'is-open' : ''}">${flipped ? myCard : `<button class="wolf-cover" data-act="g:flip">🌕<b>Toque para ver seu papel</b><small>Esconda a tela dos outros!</small></button>`}</div>
        ${flipped && !d.ok[me] ? `<button class="btn game big" data-act="g:ok" style="display:flex;margin:14px auto 0">Entendi</button>` : d.ok[me] ? '<p class="hint center">Pronto. Esperando a galera.</p>' : ''}`;
    }
    if (g.phase === 'night') {
      const head = `<p class="verdict center">🌙 Noite ${d.night}</p>`;
      if (!R || !alive) return head + `<p class="hint center">${R ? 'Você foi eliminado. Agora é só assistir.' : 'A vila dorme. Os poderes estão agindo em segredo.'}</p>${villagers}`;
      const chosen = d.act[me];
      if (role === 'aldeao') return head + myCard + waitCard('Feche os olhos… a vila dorme', 'Os lobos estão escolhendo uma vítima');
      if (role === 'lobo') {
        const mate = mates.filter(id => id in d.act).map(id => `${esc(nameOf(s, id))} quer atacar ${esc(nameOf(s, d.act[id]))}`).join('. ');
        return head + `<h2 class="ask center">Quem você vai atacar?</h2>${pickList('g:target', d.alive.filter(id => d.roles[id] !== 'lobo'), chosen)}${mate ? `<p class="hint center">${mate}.</p>` : ''}`;
      }
      if (role === 'vidente') {
        const seen = (d.seen[me] || []).map(x => `<li>${who(x.id)}<b class="${x.wolf ? 'is-wolf' : ''}">${x.wolf ? 'É LOBISOMEM! 🐺' : 'é inocente'}</b></li>`).join('');
        return head + (chosen ? '' : `<h2 class="ask center">Quem você quer investigar?</h2>${pickList('g:target', d.alive.filter(id => id !== me), chosen)}`) + (seen ? `<ul class="wolf-seen">${seen}</ul>` : '');
      }
      return head + `<h2 class="ask center">Quem você quer proteger?</h2>${pickList('g:target', d.alive, chosen)}`;
    }
    if (g.phase === 'dawn') {
      const t = d.dawn?.target;
      return `<p class="verdict center">☀️ Amanheceu</p><p class="wolf-news">${!t ? 'Os lobos não atacaram ninguém.' : d.dawn.saved ? `Os lobos atacaram <b>${esc(nameOf(s, t))}</b>, mas o médico chegou a tempo!` : `<b>${esc(nameOf(s, t))}</b> foi atacado durante a noite. 💀`}</p>${villagers}`;
    }
    if (g.phase === 'day') {
      const { counts } = voteCounts(d.votes), mine = d.votes[me];
      const tally = `<ul class="wolf-people">${d.alive.map(id => `<li>${who(id)}${roleTag(id)}<span class="wolf-votes">${counts[id] ? '🗳️'.repeat(counts[id]) : ''}</span>
        ${alive && R && id !== me ? `<button class="btn ${mine === id ? 'game' : 'ghost'} pill sm" data-act="g:vote" data-id="${id}">${mine === id ? 'Seu voto' : 'Votar'}</button>` : ''}</li>`).join('')}</ul>`;
      return `<p class="verdict center">Quem é o lobisomem?</p>${R && alive ? myCard : ''}
        <p class="hint center">${R && alive ? 'Converse no chat e vote. Dá para trocar o voto até o tempo acabar.' : 'A vila está votando.'}</p>${tally}`;
    }
    if (g.phase === 'dusk') {
      const o = d.dusk?.out;
      return `<p class="verdict center">🌆 A vila decidiu</p><p class="wolf-news">${o ? `<b>${esc(nameOf(s, o))}</b> foi eliminado. Era <b>${WOLF_ROLES[d.roles[o]].e} ${WOLF_ROLES[d.roles[o]].name}</b>!` : 'Empate! Ninguém saiu hoje.'}</p>${villagers}`;
    }
    const win = d.winner === 'lobos';
    return `<p class="verdict center">${win ? '🐺 Os lobos venceram!' : '🏡 A vila venceu!'}</p>${villagers}`;
  },
  ui: {
    flip() { const g = Store.room.game; Store.local.wolfFlip = `${g.round}:${Store.me.id}`; render(); },
    ok() { dispatch({ type: 'ok' }); },
    target(el) { dispatch({ type: 'night', target: el.dataset.id }); },
    vote(el) { dispatch({ type: 'vote', target: el.dataset.id }); },
  },
};

/* ---------- 22. Quem Disse Isso? ---------- */
const QD_Q = ['Qual foi a comida mais estranha que você já comeu?', 'Qual é o seu talento inútil?', 'Que mania você tem que ninguém sabe?', 'Qual foi o maior mico da sua vida?', 'Se pudesse ter um superpoder bobo, qual seria?', 'Qual música você canta escondido?', 'Qual foi o pior presente que você já ganhou?', 'O que você compraria com mil reais agora?', 'Qual seria o nome da sua banda?', 'Qual é o seu medo mais bobo?', 'Que profissão você teria em outra vida?', 'Qual o lugar mais estranho onde você já dormiu?', 'Qual filme você já viu mais de três vezes?', 'Qual seria o título da sua biografia?', 'Qual é a sua comida de conforto?', 'Que objeto você nunca joga fora?'];
const QD_BOT = ['pizza de banana', 'dormir de olho aberto', 'conversar com as plantas', 'nunca perdi no par ou ímpar', 'chorei vendo desenho animado', 'uma meia sem par', 'um carrinho de rolimã', 'astronauta de meio período', 'Os Barulhentos', 'medo de pombo', 'cantar no chuveiro', 'comprar um pato', 'miojo com ovo', 'Minha vida em 3 cochilos'];
Games.quemdisse = {
  id: 'quemdisse', name: 'Quem Disse Isso?', tag: 'Conheça a galera', icon: 'quote', color: '#FB7185', lip: '#BE123C', min: 3,
  how: 'Todo mundo responde a uma pergunta sobre si mesmo, em segredo. Depois aparecem algumas respostas e a galera tenta adivinhar quem escreveu cada uma. Acertar vale +1, e cada pessoa que errar a sua resposta te dá +1.',
  first: 'write',
  init(g) { g.data = { qi: drawItem(g, QD_Q), ans: {}, cards: [], guesses: {} }; },
  phases: {
    write: { label: 'Responda em segredo', dur: 40, bot: [5, 25], next: 'guess', allIn: (g, s) => active(g, s).every(id => id in g.data.ans) },
    guess: { label: 'Quem disse isso?', dur: 35, perP: 1, bot: [5, 25], next: 'reveal',
      enter(g) { g.data.cards = shuffle(Object.keys(g.data.ans)).slice(0, 4); },
      allIn: (g, s) => active(g, s).every(id => Games.quemdisse.todo(g, id).every(k => (g.data.guesses[id] || {})[k] !== undefined)) },
    reveal: { label: 'Eram eles!', dur: 14, enter(g, s) {
      const d = g.data, deltas = {};
      Object.entries(d.guesses).forEach(([pid, gs]) => Object.entries(gs).forEach(([k, who]) => {
        const author = d.cards[k];
        if (who === author) add(deltas, pid, 1); else if (author) add(deltas, author, 1);
      }));
      updateScores(s, deltas);
    } },
  },
  todo(g, pid) { return g.data.cards.map((a, k) => a === pid ? -1 : k).filter(k => k >= 0); },
  handle(g, s, pid, a) {
    const d = g.data;
    if (!inRoster(g, pid)) return false;
    if (g.phase === 'write' && a.type === 'submit' && !(pid in d.ans)) {
      const t = String(a.text || '').trim().slice(0, 80);
      if (!t) return false;
      d.ans[pid] = t; return true;
    }
    if (g.phase === 'guess' && a.type === 'who') {
      const k = a.k | 0;
      if (!d.cards[k] || d.cards[k] === pid || a.target === pid || !inRoster(g, a.target)) return false;
      (d.guesses[pid] = d.guesses[pid] || {})[k] = a.target; return true;
    }
    return false;
  },
  done(g, pid) { return g.phase === 'write' ? pid in g.data.ans : g.phase === 'guess' ? this.todo(g, pid).every(k => (g.data.guesses[pid] || {})[k] !== undefined) : false; },
  bot(g, s, pid) {
    const d = g.data;
    if (g.phase === 'write') { const used = Object.values(d.ans); return { type: 'submit', text: pick(QD_BOT.filter(x => !used.includes(x))) || pick(QD_BOT) }; }
    if (g.phase === 'guess') return this.todo(g, pid).map(k => ({ type: 'who', k, target: pick(g.roster.filter(id => id !== pid)) }));
    return null;
  },
  view(g, s, me) {
    const d = g.data, can = inRoster(g, me), q = `<p class="prompt center">${esc(QD_Q[d.qi])}</p>`;
    if (g.phase === 'write') {
      if (!can) return q + waitCard('A galera está respondendo', 'Você joga na próxima rodada');
      if (me in d.ans) return q + waitCard(`Você respondeu: <b>${esc(d.ans[me])}</b>`, 'Esperando a galera');
      return q + `<p class="hint center">Responda com sinceridade (ou tente despistar).</p><form class="answer-form center" data-form="g:ans" novalidate><label class="sr-only" for="qdIn">Sua resposta</label>
        <input class="input" id="qdIn" data-keep="qd-${g.round}" data-autofocus maxlength="80" autocomplete="off" placeholder="Sua resposta"><button class="btn game big pill">Enviar</button></form>`;
    }
    const others = g.roster.filter(id => id !== me && s.players[id]), mine = d.guesses[me] || {}, reveal = g.phase === 'reveal';
    return q + `<div class="qd-cards">${d.cards.map((author, k) => {
      const own = author === me;
      const who = reveal ? `<p class="qd-author">Foi ${avatar(s.players[author], 'sm')}<b>${esc(nameOf(s, author))}</b>
          <span class="hint">${Object.values(d.guesses).filter(gs => gs[k] === author).length} acertaram</span>${mine[k] !== undefined ? (mine[k] === author ? '<span class="tag tag-good">Você acertou</span>' : '<span class="tag">Você errou</span>') : ''}</p>`
        : own ? '<p class="hint">Essa é a sua! Torça para errarem.</p>'
        : can ? `<div class="qd-who">${others.map(id => `<button class="qd-pick ${mine[k] === id ? 'on' : ''}" data-act="g:who" data-k="${k}" data-id="${id}" aria-pressed="${mine[k] === id}">${avatar(s.players[id], 'sm')}<span>${esc(nameOf(s, id))}</span></button>`).join('')}</div>` : '';
      return `<div class="qd-card"><p class="qd-text">“${esc(d.ans[author])}”</p>${who}</div>`;
    }).join('')}</div>${!reveal && can ? '<p class="hint center">Dá para trocar os palpites até o tempo acabar.</p>' : ''}`;
  },
  ui: { who(el) { dispatch({ type: 'who', k: +el.dataset.k, target: el.dataset.id }); } },
  forms: { ans() { const i = $('#qdIn'), t = (i.value || '').trim(); if (!t) return i.focus(); dispatch({ type: 'submit', text: t }); } },
};

const MM_PAL = ['😀','😂','😍','😱','😭','😡','🤔','😴','🤢','😎','👻','💀','🤖','👽','👑','❤️','💔','🔥','💧','⭐','🌙','☀️','🌧️','❄️','🌊','🌳','🌹','🍕','🍔','🍰','🍿','☕','🐶','🐱','🦁','🐟','🦈','🐍','🦇','🕷️','🐘','🐒','🦖','🐉','🚗','✈️','🚀','🚢','🏠','🏰','💰','💍','🎩','🗡️','⚽','🎤','🎬','📚','💡','⏰','👶','👨','👩','👴','🧙','🦸','🧛','🧜','➡️','❓','❌','➕','🔟','🌎'];
const graphemes = t => typeof Intl !== 'undefined' && Intl.Segmenter ? [...new Intl.Segmenter('pt', { granularity: 'grapheme' }).segment(t)].map(x => x.segment) : Array.from(t);
Games.mimica = {
  id: 'mimica', name: 'Mímica de Emoji', tag: 'Conte um filme só com emojis', icon: 'palette', color: '#FACC15', lip: '#A16207', min: 2,
  how: 'Um jogador escolhe um filme ou expressão e conta só com emojis, um por um. O resto tenta adivinhar digitando. Quem acerta primeiro ganha mais, e quem conta ganha um ponto por acerto.',
  first: 'pick',
  init(g, s) {
    const humans = g.roster.filter(id => !s.players[id]?.isBot);
    g.data = { teller: humans.length ? humans[(g.round - 1) % humans.length] : g.roster[0], opts: [0, 1, 2].map(() => drawItem(g, EMOJI_Q)), qi: null, seq: [], guessed: {}, order: [], feed: [], botStep: 0 };
  },
  phases: {
    pick: { label: 'Escolhendo o filme', dur: 10, bot: [1, 3], next: 'tell', allIn: g => g.data.qi !== null },
    tell: { label: 'Conte com emojis', dur: 75, bot: [12, 55], next: 'reveal',
      enter(g) { if (g.data.qi === null) g.data.qi = g.data.opts[0]; },
      allIn: (g, s) => active(g, s).filter(id => id !== g.data.teller).every(id => id in g.data.guessed) },
    reveal: { label: 'Era…', dur: 9, enter(g, s) {
      const d = g.data, deltas = {};
      d.order.forEach((pid, k) => add(deltas, pid, Math.max(1, 3 - k)));
      if (d.order.length) add(deltas, d.teller, Math.min(3, d.order.length));
      updateScores(s, deltas);
    } },
  },
  handle(g, s, pid, a) {
    const d = g.data;
    if (!inRoster(g, pid)) return false;
    if (g.phase === 'pick' && pid === d.teller && a.type === 'choose' && d.opts.includes(+a.i) && d.qi === null) { d.qi = +a.i; return true; }
    if (g.phase !== 'tell') return false;
    if (pid === d.teller) {
      if (a.type !== 'emo' || !Array.isArray(a.seq)) return false;
      const seq = a.seq.slice(0, 12).map(x => String(x).slice(0, 12));
      if (seq.some(x => /[a-z0-9]/i.test(x))) return false;
      d.seq = seq; return true;
    }
    if (a.type !== 'guess' || pid in d.guessed || !d.seq.length) return false;
    const text = String(a.text || '').trim().slice(0, 60);
    if (!text) return false;
    if (emjMatch(text, EMOJI_Q[d.qi])) { d.guessed[pid] = d.order.length; d.order.push(pid); d.feed.push({ pid, ok: true }); }
    else d.feed.push({ pid, text });
    if (d.feed.length > 40) d.feed.shift();
    return true;
  },
  // Bot que conta revela os emojis originais aos poucos.
  tick(g, s) {
    const d = g.data;
    if (g.phase !== 'tell' || !s.players[d.teller]?.isBot) return false;
    const all = graphemes(EMOJI_Q[d.qi].e).filter(x => x.trim());
    if (d.botStep >= all.length || now() < g.phaseStart + 2500 + d.botStep * 3500) return false;
    d.seq = all.slice(0, ++d.botStep); return true;
  },
  done(g, pid) { return g.phase === 'pick' ? pid === g.data.teller && g.data.qi !== null : g.phase === 'tell' ? pid in g.data.guessed : false; },
  bot(g, s, pid) {
    const d = g.data;
    if (g.phase === 'pick' && pid === d.teller) return { type: 'choose', i: pick(d.opts) };
    if (g.phase === 'tell' && pid !== d.teller && d.seq.length) return { type: 'guess', text: Math.random() < botP(.6) ? EMOJI_Q[d.qi].t : pick(EMOJI_Q).t };
    return null;
  },
  seqHTML(d) { return `<div class="mm-seq" id="mmSeq" aria-label="Emojis">${d.seq.length ? d.seq.map(e => `<span>${e}</span>`).join('') : '<small>Os emojis aparecem aqui…</small>'}</div>`; },
  feedHTML(g, s) { return dwFeedHTML(g.data, s); },
  view(g, s, me) {
    const d = g.data, teller = d.teller === me, can = inRoster(g, me);
    if (g.phase === 'pick') {
      if (!teller) return waitCard(`${avatar(s.players[d.teller], 'lg')}<br>${esc(nameOf(s, d.teller))} vai contar com emojis`, 'Escolhendo o filme');
      return `<h2 class="ask center">O que você vai contar?</h2><div class="dw-choices">${d.opts.map(i => `<button class="dw-choice" data-act="g:choose" data-v="${i}">${esc(EMOJI_Q[i].t)}<small>${EMOJI_Q[i].c}</small></button>`).join('')}</div>
        <p class="hint center">Ninguém mais vê essas opções.</p>`;
    }
    const q = EMOJI_Q[d.qi];
    if (g.phase === 'reveal') return `${this.seqHTML(d)}<p class="verdict center">Era ${esc(q.t)}</p>${d.order.length ? `<ul class="dw-solvers">${d.order.map((pid, k) => `<li>${avatar(s.players[pid], 'sm')}<b>${esc(nameOf(s, pid))}</b><span>${k + 1}º</span></li>`).join('')}</ul>` : '<p class="hint center">Ninguém acertou.</p>'}`;
    if (teller) return `<p class="dw-word">Conte: <b>${esc(q.t)}</b></p>${this.seqHTML(d)}
      <div class="mm-tools"><button class="btn sm pill" data-act="g:back">${icon('backspace')}Apagar</button><button class="btn sm ghost pill" data-act="g:wipe">${icon('trash')}Limpar</button></div>
      <div class="mm-pal" role="group" aria-label="Emojis">${MM_PAL.map(e => `<button data-act="g:emo" data-v="${e}" aria-label="${e}">${e}</button>`).join('')}</div>
      <ul class="dw-feed" id="mmFeed" aria-label="Chutes">${this.feedHTML(g, s)}</ul>`;
    const guess = !can ? '' : me in d.guessed ? `<p class="dw-got" id="mmBox">${icon('check')} Você acertou!</p>`
      : `<form class="dw-guess" id="mmBox" data-form="g:guess" novalidate><label class="sr-only" for="mmIn">Seu chute</label>
          <input class="input" id="mmIn" data-keep="mm-${g.round}" maxlength="60" autocomplete="off" spellcheck="false" placeholder="Qual é o filme ou a expressão?"><button class="btn game pill">Chutar</button></form>`;
    return `<div class="tb-giver">${avatar(s.players[d.teller], 'md')}<span><b>${esc(nameOf(s, d.teller))}</b> está contando</span></div>${this.seqHTML(d)}<p class="hint center">${esc(q.c)}</p>${guess}
      <ul class="dw-feed" id="mmFeed" aria-label="Chutes">${this.feedHTML(g, s)}</ul>`;
  },
  patch(g, s, me) {
    if (g.phase !== 'tell') { $('.stage-body').innerHTML = this.view(g, s, me); return; }
    const d = g.data, seq = $('#mmSeq'), feed = $('#mmFeed'), box = $('#mmBox');
    if (seq) seq.outerHTML = this.seqHTML(d);
    if (feed) feed.innerHTML = this.feedHTML(g, s);
    if (box && box.tagName === 'FORM' && me in d.guessed) box.outerHTML = `<p class="dw-got" id="mmBox">${icon('check')} Você acertou!</p>`;
  },
  ui: {
    choose(el) { dispatch({ type: 'choose', i: +el.dataset.v }); },
    emo(el) { const d = Store.room.game.data; if (d.seq.length < 12) dispatch({ type: 'emo', seq: [...d.seq, el.dataset.v] }); },
    back() { dispatch({ type: 'emo', seq: Store.room.game.data.seq.slice(0, -1) }); },
    wipe() { dispatch({ type: 'emo', seq: [] }); },
  },
  forms: { guess() { const i = $('#mmIn'), t = (i.value || '').trim(); if (!t) return; const q = EMOJI_Q[Store.room.game.data.qi]; if (!emjMatch(t, q)) Sound.play('wrong'); i.value = ''; dispatch({ type: 'guess', text: t }); i.focus(); } },
};

/* ---------- 24. Leilão Maluco ---------- */
const AUC_PRIZES = [
  { e: '🏆', n: 'Troféu de ouro', v: 6 }, { e: '💎', n: 'Diamante', v: 5 }, { e: '🎮', n: 'Videogame', v: 4 }, { e: '📦', n: 'Caixa de bombons', v: 3 },
  { e: '🍕', n: 'Pizza gigante', v: 3 }, { e: '🎟️', n: 'Ingresso de show', v: 2 }, { e: '🍫', n: 'Barra de chocolate', v: 2 }, { e: '🧸', n: 'Ursinho', v: 1 },
  { e: '🦆', n: 'Patinho de borracha', v: 1 }, { e: '🧱', n: 'Tijolo', v: 0 }, { e: '🧦', n: 'Meia furada', v: -1 }, { e: '🥾', n: 'Bota velha', v: -1 },
  { e: '🐟', n: 'Peixe de três dias', v: -2 }, { e: '🧾', n: 'Boleto vencido', v: -2 }, { e: '🎁', n: 'Presente surpresa', v: 4 }, { e: '🪙', n: 'Moeda antiga', v: 2 },
];
const AUC_START = 12;
Games.leilao = {
  id: 'leilao', name: 'Leilão Maluco', tag: 'Lances às cegas', icon: 'gavel', color: '#F59E0B', lip: '#B45309', min: 2,
  how: `Cada um começa o jogo com ${AUC_START} moedas. A cada rodada vai a leilão um lote fechado, com uma dica do valor. Os lances são secretos: quem der o maior lance paga e leva o lote, que pode valer pontos… ou ser um mico que tira pontos.`,
  first: 'bid',
  init(g) {
    g.bank = g.bank || {};
    g.roster.forEach(id => { if (!(id in g.bank)) g.bank[id] = AUC_START; });
    const p = AUC_PRIZES[drawItem(g, AUC_PRIZES)], lo = p.v - Math.floor(Math.random() * 4);
    g.data = { p, hint: [lo, lo + 3], bids: {}, win: null };
  },
  phases: {
    bid: { label: 'Dê seu lance', dur: 20, bot: [3, 15], next: 'reveal', allIn: (g, s) => active(g, s).every(id => id in g.data.bids) },
    reveal: { label: 'Arrematado!', dur: 10, enter(g, s) {
      const d = g.data, e = Object.entries(d.bids).filter(([, b]) => b.v > 0).sort((a, b) => b[1].v - a[1].v || a[1].t - b[1].t);
      if (!e.length) return;
      const [pid, b] = e[0], v = d.p.v;
      d.win = { pid, bid: b.v };
      g.bank[pid] = Math.max(0, (g.bank[pid] || 0) - b.v);
      if (v > 0) updateScores(s, { [pid]: v });
      else if (v < 0) { g.noMult = true; updateScores(s, { [pid]: -Math.min(-v, s.players[pid]?.score || 0) }); g.noMult = false; }
      if (v < 0 && b.v >= 3) addMoment(s, { k: 'auction', pid, bid: b.v, e: d.p.e, name: d.p.n });
    } },
  },
  handle(g, s, pid, a) {
    if (!inRoster(g, pid) || g.phase !== 'bid' || a.type !== 'bid' || pid in g.data.bids) return false;
    const v = Math.round(+a.v);
    if (!Number.isFinite(v) || v < 0 || v > (g.bank[pid] || 0)) return false;
    g.data.bids[pid] = { v, t: now() }; return true;
  },
  done(g, pid) { return g.phase === 'bid' && pid in g.data.bids; },
  bot(g, s, pid) {
    const [lo, hi] = g.data.hint, mid = (lo + hi) / 2, bank = g.bank[pid] || 0;
    return { type: 'bid', v: mid <= .5 ? 0 : clamp(Math.round(mid * (.5 + Math.random())), 0, bank) };
  },
  view(g, s, me) {
    const d = g.data, can = inRoster(g, me), bank = g.bank[me] ?? 0, [lo, hi] = d.hint;
    const lot = `<div class="auc-lot ${g.phase === 'reveal' ? 'is-open' : ''}"><span class="auc-e">${g.phase === 'reveal' ? d.p.e : '📦'}</span>
      <div><p class="auc-name">${g.phase === 'reveal' ? esc(d.p.n) : `Lote nº ${g.round}`}</p><p class="hint">${g.phase === 'reveal' ? `Valia <b>${d.p.v > 0 ? '+' : ''}${d.p.v}</b> ${Math.abs(d.p.v) === 1 ? 'ponto' : 'pontos'}` : `Dica: vale entre <b>${lo}</b> e <b>${hi}</b> pontos`}</p></div></div>`;
    const coins = can ? `<p class="auc-bank">🪙 Você tem <b>${bank}</b> ${bank === 1 ? 'moeda' : 'moedas'}</p>` : '';
    if (g.phase === 'bid') {
      if (!can) return lot + waitCard('A galera está dando lances', 'Você joga na próxima rodada');
      if (me in d.bids) return lot + coins + waitCard(`Seu lance: <b>${d.bids[me].v}</b>`, 'Esperando os outros lances');
      return lot + coins + `<form class="answer-form auc-form" data-form="g:bid" novalidate><label class="sr-only" for="aucIn">Seu lance</label>
        <div class="num-field"><input class="input" id="aucIn" data-keep="auc-${g.round}" data-autofocus inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">moedas</span></div>
        <div class="row"><button class="btn game big pill">Dar lance</button><button type="button" class="btn ghost pill" data-act="g:pass">Passar</button></div><p class="err" id="formErr" role="alert"></p></form>
        <p class="hint">Lance secreto. Empate: vale quem deu o lance primeiro.</p>`;
    }
    const rows = Object.entries(d.bids).sort((a, b) => b[1].v - a[1].v);
    return lot + `<p class="verdict center">${d.win ? `${esc(nameOf(s, d.win.pid))} levou por ${plural(d.win.bid, 'moeda', 'moedas')}${d.p.v < 0 ? '. Que mico!' : '!'}` : 'Ninguém quis o lote.'}</p>
      <ul class="res-list">${rows.map(([pid, b]) => `<li class="res-row ${d.win?.pid === pid ? 'is-top' : ''}">${avatar(s.players[pid], 'sm')}<span class="res-who"><span class="res-name">${esc(nameOf(s, pid))}</span><span class="res-sub">🪙 ${g.bank[pid] ?? 0} sobrando</span></span>
        <span class="res-val">${b.v}</span>${g.roundDelta[pid] ? `<span class="delta ${g.roundDelta[pid] < 0 ? 'neg' : ''}">${g.roundDelta[pid] > 0 ? '+' : ''}${g.roundDelta[pid]}</span>` : '<span></span>'}</li>`).join('')}</ul>`;
  },
  ui: { pass() { dispatch({ type: 'bid', v: 0 }); } },
  forms: {
    bid() {
      const g = Store.room.game, i = $('#aucIn'), v = Math.round(parseNum(i.value || '0')), bank = g.bank[Store.me.id] || 0;
      if (!Number.isFinite(v) || v < 0) { $('#formErr').textContent = 'Digite um número de moedas.'; return; }
      if (v > bank) { $('#formErr').textContent = `Você só tem ${plural(bank, 'moeda', 'moedas')}.`; return; }
      dispatch({ type: 'bid', v });
    },
  },
};

/* ---------- 25. Caça ao Detalhe ---------- */
const SPOT_EMO = ['🌳','🌲','🏠','🚗','🐶','🐱','🌻','🌷','🍎','🍌','⚽','🎈','☁️','☀️','🐦','🦋','🐞','🍄','🚲','⛵','🐟','🍦','🎁','🧢','👓','🐸','🦆','🍩','🎸','🚀'];
const SPOT_N = 5;
const spotRight = it => ({ ...it, ...(it.d || {}) });
Games.detalhe = {
  id: 'detalhe', name: 'Caça ao Detalhe', tag: 'Ache as 5 diferenças', icon: 'search', color: '#38BDF8', lip: '#0369A1', min: 1,
  how: 'Duas cenas quase iguais. Toque nas 5 diferenças, em qualquer uma das cenas. Cada diferença vale +1, e quem achar todas primeiro ganha +2. Tocar no lugar errado trava o dedo por um segundo.',
  first: 'find',
  init(g, s) {
    const items = [];
    for (let tries = 0; items.length < 16 && tries < 600; tries++) {
      const x = 70 + Math.random() * 860, y = 70 + Math.random() * 560;
      if (items.every(o => Math.hypot(o.x - x, o.y - y) > 125)) items.push({ e: pick(SPOT_EMO), x: Math.round(x), y: Math.round(y), z: 62 + Math.floor(Math.random() * 30) });
    }
    shuffle(items.map((_, i) => i)).slice(0, SPOT_N).forEach(i => {
      const it = items[i], k = pick(['swap', 'gone', 'big', 'move']);
      it.d = k === 'swap' ? { e: pick(SPOT_EMO.filter(e => e !== it.e)) } : k === 'gone' ? { gone: 1 } : k === 'big' ? { z: Math.round(it.z * 1.6) } : { x: clamp(it.x + (Math.random() < .5 ? -90 : 90), 60, 940) };
    });
    g.data = { items, found: {}, done: [], bots: {} };
    g.roster.forEach(id => { if (s.players[id]?.isBot) g.data.bots[id] = Array.from({ length: SPOT_N }, () => (6000 + Math.random() * 48000) / botSpeed()).sort((a, b) => a - b); });
  },
  phases: {
    find: { label: 'Ache as diferenças', dur: 60, next: 'reveal', allIn: (g, s) => active(g, s).every(id => (g.data.found[id] || []).length >= SPOT_N) },
    reveal: { label: 'Eram estas', dur: 10, enter(g, s) {
      const d = g.data, deltas = {};
      Object.entries(d.found).forEach(([pid, f]) => { add(deltas, pid, f.length); matchStat(s, pid, 'found', f.length); });
      if (d.done[0]) add(deltas, d.done[0], 2);
      updateScores(s, deltas);
    } },
  },
  diffs(g) { return g.data.items.map((it, i) => it.d ? i : -1).filter(i => i >= 0); },
  handle(g, s, pid, a) {
    const d = g.data, f = d.found[pid] || (d.found[pid] = []);
    if (!inRoster(g, pid) || g.phase !== 'find' || a.type !== 'find' || !d.items[a.i]?.d || f.includes(a.i)) return false;
    f.push(a.i);
    if (f.length >= SPOT_N) d.done.push(pid);
    return true;
  },
  tick(g) {
    if (g.phase !== 'find') return false;
    const d = g.data, diffs = this.diffs(g);
    let ch = false;
    for (const [pid, times] of Object.entries(d.bots)) {
      const f = d.found[pid] || (d.found[pid] = []);
      if (f.length < times.length && now() - g.phaseStart >= times[f.length]) { f.push(diffs.find(i => !f.includes(i))); if (f.length >= SPOT_N) d.done.push(pid); ch = true; }
    }
    return ch;
  },
  done(g, pid) { return g.phase === 'find' && (g.data.found[pid] || []).length >= SPOT_N; },
  sceneSVG(g, right, marks) {
    const items = g.data.items.map(it => right ? spotRight(it) : it).filter(it => !it.gone);
    return `<svg class="sp-scene" viewBox="0 0 1000 700" data-side="${right ? 1 : 0}" role="img" aria-label="${right ? 'Cena da direita' : 'Cena da esquerda'}">
      <rect width="1000" height="700" rx="28" fill="url(#spBg)"/>${items.map(it => `<text x="${it.x}" y="${it.y}" font-size="${it.z}" text-anchor="middle" dominant-baseline="central">${it.e}</text>`).join('')}
      ${marks.map(i => { const it = right ? spotRight(g.data.items[i]) : g.data.items[i]; return `<circle cx="${it.x}" cy="${it.y}" r="${Math.max(55, it.z * .75)}" class="sp-mark"/>`; }).join('')}</svg>`;
  },
  view(g, s, me) {
    const d = g.data, can = inRoster(g, me), reveal = g.phase === 'reveal', mine = d.found[me] || [];
    const marks = reveal ? this.diffs(g) : mine;
    const defs = '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="spBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BAE6FD"/><stop offset="1" stop-color="#D9F99D"/></linearGradient></defs></svg>';
    const head = reveal ? '' : `<p class="sp-count">${can ? `Você achou <b>${mine.length}</b> de ${SPOT_N}` : 'A galera está procurando'}</p>`;
    const board = `${defs}<div class="sp-pair ${can && !reveal && mine.length < SPOT_N ? 'can-tap' : ''}">${this.sceneSVG(g, false, marks)}${this.sceneSVG(g, true, marks)}</div>`;
    const lanes = g.roster.filter(id => s.players[id]).map(id => `<li>${avatar(s.players[id], 'sm')}<span>${esc(nameOf(s, id))}</span><b>${(d.found[id] || []).length}/${SPOT_N}</b>${d.done[0] === id ? '<span class="tag tag-good">1º</span>' : ''}${reveal ? deltaBadge(g.roundDelta[id]) : ''}</li>`).join('');
    return `${head}${board}<ul class="sp-lanes">${lanes}</ul>`;
  },
  mount(g, s, me) {
    const pair = $('.sp-pair.can-tap');
    if (!pair || pair.dataset.bound) return;
    pair.dataset.bound = '1';
    pair.addEventListener('pointerdown', e => {
      const svg = e.target.closest('.sp-scene'), L = Store.local;
      if (!svg || (L.spLock && now() < L.spLock)) return;
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 1000, y = (e.clientY - r.top) / r.height * 700, right = svg.dataset.side === '1';
      const d = Store.room.game.data, mine = d.found[Store.me.id] || [];
      const hit = d.items.findIndex((it, i) => { if (!it.d || mine.includes(i)) return false; const a = right ? spotRight(it) : it; return Math.hypot(a.x - x, a.y - y) < Math.max(60, a.z * .8); });
      if (hit >= 0) { Sound.play('correct'); buzz(30); dispatch({ type: 'find', i: hit }); return; }
      L.spLock = now() + 1000;
      Sound.play('wrong'); buzz(90);
      pair.classList.add('is-locked'); setTimeout(() => pair.classList.remove('is-locked'), 1000);
    });
  },
};

/* ---------- 26. No Ritmo ---------- */
const RT_LEAD = 1800;
Games.ritmo = {
  id: 'ritmo', name: 'No Ritmo', tag: 'Toque na batida', icon: 'music', color: '#F97316', lip: '#C2410C', min: 1,
  how: 'Uma batida acende e toca no ritmo. Toque no círculo bem no tempo de cada batida (e não toque nas pausas!). Quanto mais certeiro, mais pontos: o melhor leva +3, o segundo +2 e todo mundo que pontuar leva +1.',
  first: 'ready',
  init(g) {
    const bpm = pick([84, 96, 108, 120, 132]), n = 14, rests = [];
    while (rests.length < 3) { const k = 4 + Math.floor(Math.random() * (n - 5)); if (!rests.some(r => Math.abs(r - k) < 2)) rests.push(k); }
    g.data = { bpm, n, rests, scores: {} };
  },
  phases: {
    ready: { label: 'Prepare o dedo', dur: 4, hideTimer: true, rush: false, next: 'play' },
    play: { label: 'No ritmo!', dur: 12, rush: false, hideTimer: true, next: 'reveal',
      enter(g) { const d = g.data, len = (RT_LEAD + d.n * 60000 / d.bpm + 2500) / 1000; g.dur = len; g.deadline = g.phaseStart + len * 1000; },
      allIn: (g, s) => active(g, s).every(id => id in g.data.scores) },
    reveal: { label: 'Resultado', dur: 10, enter(g, s) {
      const e = Object.entries(g.data.scores).filter(([, v]) => v.pts > 0).sort((a, b) => b[1].pts - a[1].pts), deltas = {};
      e.forEach(([pid], k) => add(deltas, pid, Math.max(1, 3 - k)));
      Object.entries(g.data.scores).forEach(([pid, v]) => matchStat(s, pid, 'rhythm', v.perfect || 0));
      updateScores(s, deltas);
    } },
  },
  handle(g, s, pid, a) {
    const d = g.data, max = (d.n - d.rests.length) * 3;
    if (!inRoster(g, pid) || g.phase !== 'play' || a.type !== 'score' || pid in d.scores) return false;
    d.scores[pid] = { pts: clamp(a.pts | 0, 0, max), perfect: clamp(a.perfect | 0, 0, d.n), miss: clamp(a.miss | 0, 0, 99) }; return true;
  },
  tick(g, s) {
    if (g.phase !== 'play') return false;
    const d = g.data, end = g.phaseStart + RT_LEAD + d.n * 60000 / d.bpm + 400;
    if (now() < end) return false;
    let ch = false;
    g.roster.forEach(id => {
      if (!s.players[id]?.isBot || id in d.scores) return;
      const skill = clamp(.45 + Math.random() * .5 + BotIQ.lv.shift, .1, .98), beats = d.n - d.rests.length, perfect = Math.round(beats * skill * .6);
      d.scores[id] = { pts: Math.round(beats * 3 * skill), perfect, miss: Math.floor(Math.random() * 3) }; ch = true;
    });
    return ch;
  },
  done(g, pid) { return g.phase === 'play' && pid in g.data.scores; },
  view(g, s, me) {
    const d = g.data, can = inRoster(g, me);
    if (g.phase === 'ready') return `<div class="ty-ready"><p class="ask center">${d.bpm} batidas por minuto</p><span class="ty-count" data-count-to="${g.phaseStart + g.dur * 1000}">3</span>
      <p class="hint center">Toque no círculo junto com cada batida. Nas pausas (círculo apagado), não toque.</p></div>`;
    if (g.phase === 'play') {
      const mine = d.scores[me];
      return `<div class="rt-wrap"><div class="rt-beats" id="rtBeats">${Array.from({ length: d.n }, (_, k) => `<i class="${d.rests.includes(k) ? 'rest' : ''}" data-k="${k}"></i>`).join('')}</div>
        <button class="rt-pad" id="rtPad" ${!can || mine ? 'disabled' : ''} aria-label="Tocar na batida"><span class="rt-ring" id="rtRing"></span><span class="rt-core" id="rtMsg">${mine ? `${mine.pts} pts` : can ? 'Prepare…' : '♪'}</span></button>
        <p class="hint center" id="rtInfo">${mine ? `${mine.perfect} perfeitas, ${plural(mine.miss, 'erro', 'erros')}. Esperando a galera.` : can ? 'Toque no círculo (ou aperte espaço).' : 'A galera está tocando.'}</p></div>`;
    }
    const rows = Object.entries(d.scores).sort((a, b) => b[1].pts - a[1].pts);
    return `<ul class="res-list">${rows.map(([pid, v]) => `<li class="res-row">${avatar(s.players[pid], 'sm')}<span class="res-who"><span class="res-name">${esc(nameOf(s, pid))}</span></span>
      <span class="res-val">${v.pts} pts<span class="res-sub">${v.perfect} perfeitas · ${plural(v.miss, 'erro', 'erros')}</span></span>${deltaBadge(g.roundDelta[pid])}</li>`).join('') || '<li class="hint">Ninguém tocou.</li>'}</ul>`;
  },
  mount(g, s, me) {
    if (g.phase === 'ready') return Games.digita.mount.call(Games.digita, g, s, me);
    if (g.phase !== 'play' || !inRoster(g, me)) return;
    const d = g.data, key = `${g.round}:${g.phaseStart}`, L = Store.local;
    // O compasso é contado a partir de quando a fase apareceu neste aparelho: justo para todo mundo, mesmo com atraso de rede.
    if (!L.rt || L.rt.key !== key) {
      const ib = 60000 / d.bpm, t0 = performance.now() + RT_LEAD;
      L.rt = { key, t0, ib, hits: {}, miss: 0, sent: false };
      if (Sound.on && Sound.ctx) { const base = Sound.ctx.currentTime; for (let k = 0; k < d.n; k++) if (!d.rests.includes(k)) Sound.tone(k % 4 ? 660 : 990, .07, { at: (RT_LEAD + k * ib) / 1000 + (Sound.ctx.currentTime - base), type: 'square' }); }
    }
    const R = L.rt, pad = $('#rtPad');
    const tap = () => {
      if (R.sent || d.scores[Store.me.id]) return;
      const t = performance.now(), k = Math.round((t - R.t0) / R.ib);
      if (k < 0 || k >= d.n || d.rests.includes(k) || R.hits[k] !== undefined || Math.abs(t - (R.t0 + k * R.ib)) > 220) { R.miss++; buzz(60); return; }
      const err = Math.abs(t - (R.t0 + k * R.ib));
      R.hits[k] = err <= 45 ? 3 : err <= 100 ? 2 : 1;
      const msg = $('#rtMsg'); if (msg) msg.textContent = R.hits[k] === 3 ? 'Perfeito!' : R.hits[k] === 2 ? 'Bom!' : 'Quase';
      buzz(15);
    };
    if (pad && !pad.dataset.bound) { pad.dataset.bound = '1'; pad.addEventListener('pointerdown', e => { e.preventDefault(); tap(); }); }
    if (!R.key2) { R.key2 = 1; document.addEventListener('keydown', R.kd = e => { if (e.code === 'Space' && Store.local.rt === R && !e.target.closest('input,textarea')) { e.preventDefault(); tap(); } }); }
    const loop = () => {
      if (Store.local.rt !== R) { R.running = false; return; }
      const t = performance.now(), k = Math.floor((t - R.t0) / R.ib), frac = ((t - R.t0) / R.ib) - k;
      const ring = $('#rtRing'), beats = $$('#rtBeats i');
      if (ring) { const next = (t - R.t0) < 0 ? 1 - ((R.t0 - t) % R.ib) / R.ib : frac; ring.style.setProperty('--s', (2.1 - next * 1.1).toFixed(3)); ring.classList.toggle('is-rest', d.rests.includes(k + 1)); }
      beats.forEach((b, i) => { b.classList.toggle('on', i === Math.round((t - R.t0) / R.ib)); b.classList.toggle('hit', R.hits[i] !== undefined); });
      if (t > R.t0 + d.n * R.ib + 300 && !R.sent) {
        R.sent = true;
        const pts = Math.max(0, Object.values(R.hits).reduce((a, b) => a + b, 0) - R.miss), perfect = Object.values(R.hits).filter(v => v === 3).length;
        document.removeEventListener('keydown', R.kd);
        dispatch({ type: 'score', pts, perfect, miss: R.miss });
        R.running = false;
        return;
      }
      requestAnimationFrame(loop);
    };
    if (!R.running && !R.sent) { R.running = true; requestAnimationFrame(loop); }
  },
};

  first: 'choose',

function matchStat(s, pid, k, n = 1) {
  if (!s.players[pid] || !n) return;
  const st = s.match.stats || (s.match.stats = {}), p = st[pid] || (st[pid] = {});
  p[k] = (p[k] || 0) + n;
}
function matchMedals(s) {
  const st = s.match.stats || {};

    const e = Object.entries(st).filter(([pid, v]) => s.players[pid] && v[m.k] > 0);
    if (!e.length) return null;
    const n = Math.max(...e.map(([, v]) => v[m.k]));

const MyStats = {
  key: 'playbox:stats',
  get() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch { return {}; } },
  save(v) { try { localStorage.setItem(this.key, JSON.stringify(v)); } catch {} },
  record(s) {
    const me = Store.me?.id, id = s.match.id || `${s.pin}:${s.createdAt}`;
    if (!me || !plays(s, me) || !s.players[me]) return;
    const v = this.get();
    if ((v.seen || []).includes(id)) return;
    v.seen = [...(v.seen || []).slice(-40), id];
    const ranked = s.order.filter(x => plays(s, x) && s.players[x]).sort((a, b) => s.players[b].score - s.players[a].score), pos = ranked.indexOf(me);
    v.matches = (v.matches || 0) + 1;
    if (pos === 0) v.wins = (v.wins || 0) + 1;
    if (pos >= 0 && pos < 3) v.podiums = (v.podiums || 0) + 1;
    v.points = (v.points || 0) + (s.players[me].score || 0);
    v.games = v.games || {};

    v.medals = v.medals || {};
    matchMedals(s).forEach(x => { if (x.ids.includes(me)) v.medals[x.m.k] = (v.medals[x.m.k] || 0) + 1; });

// Imagens para mandar no grupo (pódio e correntes do Telefone sem Fio).
function shareCanvas(cv, name) {
  cv.toBlob(async blob => {
    if (!blob) return;
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'PlayBox' }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }, 'image/png');
}

  c.font = `800 44px ${getComputedStyle(document.body).fontFamily}`; c.fillStyle = '#A5B4FC'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  if (LOGO_IMG.complete && LOGO_IMG.naturalWidth) { c.drawImage(LOGO_IMG, w / 2 - 150, 30, 64, 64); c.textAlign = 'left'; c.fillText('PlayBox', w / 2 - 74, 78); c.textAlign = 'center'; }
  else c.fillText('PlayBox', w / 2, 80);

}

function podiumImage(s) {

  if (cur.screen !== 'game' || !g) return;

  if (cur.round !== p.round && cur.phase !== 'final') {

    const e = Object.entries(g.roundDelta || {}).filter(([id, n]) => n > 0 && s.players[id]).sort((a, b) => b[1] - a[1])[0];

function roundRevealExtras(s) {

/* =====================================================================

   ===================================================================== */
const MODES = {
  classico: { name: 'Clássico', icon: 'crown', desc: 'Cada um por si. Vence quem somar mais pontos.' },
  equipes: { name: 'Equipes', icon: 'users', desc: 'Time Azul contra Time Laranja: seus pontos vão para o seu time.' },
  territorio: { name: 'Território', icon: 'flag', desc: 'Quem vence a rodada conquista um pedaço do mapa.' },
  apostas: { name: 'Apostas', icon: 'coin', desc: 'Antes de cada rodada, aposte pontos em quem vai ganhar.' },
};
const modeOf = s => MODES[s?.settings?.mode] ? s.settings.mode : 'classico';
const TEAMS = { a: { name: 'Time Azul', short: 'Azul', color: '#3B82F6' }, b: { name: 'Time Laranja', short: 'Laranja', color: '#F97316' } };

// Quem joga de verdade: jogadores (não plateia nem telão). O host pode só apresentar.
function plays(s, id) {
  const p = s.players[id];
  return !!p && (p.role || 'player') === 'player' && !(id === s.hostId && s.settings.hostPlays === false);
}
const playerIds = s => s.order.filter(id => plays(s, id));
const seatIds = s => s.order.filter(id => s.players[id] && (s.players[id].role || 'player') === 'player');

const isWatcher = () => { const s = Store.room, me = Store.me?.id; return !!(s && me && !plays(s, me)); };

/* ---------- Equipes ---------- */
function ensureTeams(s) {
  if (modeOf(s) !== 'equipes') return;
  s.teams = s.teams || {};
  const ids = playerIds(s);
  Object.keys(s.teams).forEach(id => { if (!ids.includes(id)) delete s.teams[id]; });
  ids.forEach(id => {
    if (s.teams[id]) return;
    const na = ids.filter(x => s.teams[x] === 'a').length, nb = ids.filter(x => s.teams[x] === 'b').length;
    s.teams[id] = na <= nb ? 'a' : 'b';
  });
}
function shuffleTeams(s) { s.teams = {}; shuffle(playerIds(s)).forEach((id, i) => { s.teams[id] = i % 2 ? 'b' : 'a'; }); }
function teamScores(s) {
  const t = { a: 0, b: 0 };
  playerIds(s).forEach(id => { const k = s.teams?.[id]; if (k) t[k] += s.players[id].score; });
  return t;
}
function teamsHTML(s, host) {

    <div class="teams">${['a', 'b'].map(k => `<div class="team-col" style="--t:${TEAMS[k].color}">
      <div class="team-head"><b>${TEAMS[k].name}</b><span>${sc[k]} pts</span></div>

    ${host ? '<p class="hint" style="margin-top:8px">Toque em alguém para trocar de time.</p>' : ''}</section>`;

/* ---------- Conquista de território ---------- */
const TERR_NAMES = ['Castelo', 'Vulcão', 'Praia', 'Floresta', 'Deserto', 'Geleira', 'Pântano', 'Cânion', 'Ilha', 'Selva', 'Planície', 'Montanha', 'Lago', 'Caverna', 'Oásis', 'Recife', 'Savana', 'Colina', 'Baía'];
function makeTerr() {
  const cells = [];
  for (let q = -2; q <= 2; q++) for (let r = -2; r <= 2; r++) if (Math.abs(q + r) <= 2) cells.push({ q, r });
  const ring = c => (Math.abs(c.q) + Math.abs(c.r) + Math.abs(c.q + c.r)) / 2;
  cells.sort((a, b) => ring(a) - ring(b));
  return { cells: cells.map((c, i) => ({ ...c, name: TERR_NAMES[i], owner: null })), last: [] };
}
function ensureTerr(s) { if (modeOf(s) === 'territorio' && !s.terr) s.terr = makeTerr(); }
const hexAdj = (a, b) => { const dq = a.q - b.q, dr = a.r - b.r; return Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr) === 2; };
const terrCount = (s, id) => (s.terr?.cells || []).filter(c => c.owner === id).length;
// Quem fez mais pontos na rodada conquista um território vizinho (ou rouba do líder quando o mapa enche).
function conquer(s) {
  const g = s.game;
  ensureTerr(s);
  const ids = g.roster.filter(id => plays(s, id));
  const max = Math.max(0, ...ids.map(id => g.roundDelta[id] || 0));
  g.conquest = [];
  s.terr.last = [];
  if (!max) return;
  const cells = s.terr.cells;
  ids.filter(id => (g.roundDelta[id] || 0) === max).forEach(pid => {
    const mine = cells.filter(c => c.owner === pid), free = cells.filter(c => !c.owner);
    let target = pick(free.filter(c => mine.some(m => hexAdj(m, c))) || []) || (free.length ? pick(free) : null), from = null;
    if (!target) {
      const leader = ids.filter(id => id !== pid).sort((a, b) => terrCount(s, b) - terrCount(s, a))[0];
      const theirs = cells.filter(c => c.owner === leader);
      if (theirs.length) { target = theirs.find(c => mine.some(m => hexAdj(m, c))) || pick(theirs); from = leader; }
    }
    if (!target) return;
    target.owner = pid;
    s.terr.last.push(target.name);
    g.conquest.push({ pid, name: target.name, from });
  });
}
function terrSVG(s, o = {}) {
  const t = s.terr;
  if (!t) return '';
  const R = 30, W = Math.sqrt(3) * R;
  const pts = (x, y) => [0, 1, 2, 3, 4, 5].map(i => { const a = Math.PI / 180 * (60 * i - 30); return `${(x + R * Math.cos(a)).toFixed(1)},${(y + R * Math.sin(a)).toFixed(1)}`; }).join(' ');
  const cells = t.cells.map(c => {
    const x = W * (c.q + c.r / 2), y = 1.5 * R * c.r, p = c.owner && s.players[c.owner], hot = (t.last || []).includes(c.name);
    return `<g class="hex ${hot ? 'hot' : ''}"><polygon points="${pts(x, y)}" class="${p ? 'owned' : ''}" style="--c:${p ? p.color : '#1F2230'}"><title>${esc(c.name)}${p ? ': ' + esc(p.name) : ''}</title></polygon>
      ${p ? `<text x="${x.toFixed(1)}" y="${(y + 7).toFixed(1)}" text-anchor="middle" font-size="20">${p.avatar}</text>` : o.mini ? '' : `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="middle" class="hex-name">${esc(c.name)}</text>`}</g>`;
  }).join('');
  return `<svg class="terr-map ${o.mini ? 'mini' : ''}" viewBox="${(-2.5 * W - 3).toFixed(1)} ${-4 * R - 3} ${(5 * W + 6).toFixed(1)} ${8 * R + 6}" role="img" aria-label="Mapa de territórios">${cells}</svg>`;
}
function terrPanelHTML(s) {
  ensureTerr(s);
  const own = playerIds(s).map(id => [id, terrCount(s, id)]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
  return `<section class="panel" aria-labelledby="trTitle"><h2 class="panel-title" id="trTitle">Mapa da conquista</h2>${terrSVG(s)}
    ${own.length ? `<ol class="terr-rank">${own.map(([id, n]) => `<li>${avatar(s.players[id], 'sm')}<span>${esc(s.players[id].name)}</span><b>${plural(n, 'território', 'territórios')}</b></li>`).join('')}</ol>`
      : '<p class="hint center">Ninguém conquistou nada ainda. Quem vencer cada rodada pega um território.</p>'}</section>`;
}

/* ---------- Apostas ---------- */
function placeBet(s, pid, a) {
  const g = s.game;
  if (!a || !inRoster(g, pid) || !inRoster(g, a.t)) return false;
  g.bets = g.bets || {};
  g.bets[pid] = { t: a.t, k: clamp(a.k | 0, 0, 3) };
  return true;
}
function botBet(g, s, id) {
  const ids = active(g, s), lead = [...ids].sort((a, b) => s.players[b].score - s.players[a].score)[0];
  return { type: 'bet', t: Math.random() < .5 ? lead : pick(ids), k: pick([1, 1, 2, 3]) };
}
// Acertou quem ganhou a rodada: leva o dobro. Errou: perde o que apostou (nunca fica negativo).
function settleBets(s) {
  const g = s.game, ids = g.roster;
  const max = Math.max(0, ...ids.map(id => g.roundDelta[id] || 0));
  const winners = max ? ids.filter(id => (g.roundDelta[id] || 0) === max) : [];
  const deltas = {};
  g.betResult = [];
  Object.entries(g.bets || {}).forEach(([pid, b]) => {
    if (!b.k || !s.players[pid]) return;
    const win = winners.includes(b.t), d = win ? 2 * b.k : -Math.min(b.k, s.players[pid].score);
    if (d) add(deltas, pid, d);
    g.betResult.push({ pid, t: b.t, k: b.k, win, d });
  });
  updateScores(s, deltas);
}
function betView(g, s, me) {
  if (!inRoster(g, me)) return waitCard('Rolando as apostas', 'Os jogadores estão apostando em quem ganha a rodada');
  const mine = g.bets?.[me], k = Store.local.betK || 1, ids = g.roster.filter(id => s.players[id]);
  return `<h2 class="ask center">Quem vai ganhar esta rodada?</h2>
    <p class="hint center">Acertou: ganha o dobro do que apostou. Errou: perde a aposta.</p>
    <div class="bet-stakes" role="group" aria-label="Valor da aposta">${[1, 2, 3].map(v => `<button data-act="betK" data-k="${v}" aria-pressed="${k === v}">${plural(v, 'ponto', 'pontos')}</button>`).join('')}</div>
    <div class="pick-grid">${ids.map(id => `<button class="pick ${mine?.t === id && mine.k ? 'on' : ''}" data-act="bet" data-id="${id}">${avatar(s.players[id], 'md')}
      <span class="pick-name">${esc(nameOf(s, id))}${id === me ? ' (você)' : ''}</span><span class="pick-val">${s.players[id].score} pts</span></button>`).join('')}</div>
    ${mine && mine.k ? `<p class="hint center">Sua aposta: <b>${plural(mine.k, 'ponto', 'pontos')}</b> em <b>${esc(nameOf(s, mine.t))}</b>. Dá para trocar até o tempo acabar.</p>`
      : mine ? '<p class="hint center">Você ficou de fora desta aposta.</p>' : '<button class="linkish quick" data-act="bet" data-skip="1">Não apostar nesta rodada</button>'}`;
}

/* ---------- Votação do próximo jogo ---------- */
function openVote(s) {
  const ok = GAME_ORDER.filter(id => gameOn(s, id) && rosterOf(s).length >= Games[id].min);
  const fresh = ok.filter(id => !s.match.played.includes(id));
  const options = shuffle(fresh.length >= 3 ? fresh : ok).slice(0, 3);
  if (!options.length) return false;
  s.vote = { options, votes: {}, deadline: now() + (s.settings.rush ? 9000 : 15000), bots: {} };
  rosterOf(s).filter(id => s.players[id].isBot).forEach(id => { s.vote.bots[id] = now() + rand(1500, 5000); });
  return true;
}
function voteTick(s) {
  const v = s.vote;
  if (!v) return false;
  let changed = false;
  Object.entries(v.bots).forEach(([id, t]) => { if (t && now() >= t) { v.votes[id] = pick(v.options); v.bots[id] = 0; changed = true; } });
  const voters = rosterOf(s);
  if (now() >= v.deadline || (voters.length && voters.every(id => id in v.votes))) {
    const c = {};
    Object.values(v.votes).forEach(id => add(c, id, 1));
    const max = Math.max(0, ...Object.values(c));
    const winner = pick(max ? v.options.filter(id => c[id] === max) : v.options);
    s.vote = null;
    engineStart(s, winner, s.settings.rounds);
    s.game.voted = true;
    return true;
  }
  return changed;
}
function voteHTML(s) {
  const v = s.vote;
  if (!v) return '';
  const me = Store.me.id, mine = v.votes[me], can = plays(s, me), c = {};
  Object.values(v.votes).forEach(id => add(c, id, 1));
  return `<section class="panel vote-panel" aria-labelledby="vtTitle">
    <div class="vote-head"><h2 class="panel-title" id="vtTitle">${icon('vote')}Vote no próximo jogo</h2>
      <span class="vote-time"><b data-countdown="${v.deadline}">${Math.max(0, Math.ceil((v.deadline - now()) / 1000))}</b>s</span></div>
    <div class="vote-grid">${v.options.map(id => { const m = Games[id];
      return `<button class="vote-card ${mine === id ? 'on' : ''}" style="${gameVars(m)}" data-act="gvote" data-id="${id}" ${can ? '' : 'disabled'}>
        <span class="gc-icon">${gameIcon(m)}</span><b>${m.name}</b><small>${m.tag}</small><span class="vote-n">${c[id] || 0}</span>
        <span class="vote-avs">${Object.entries(v.votes).filter(([, x]) => x === id).map(([p]) => avatar(s.players[p], 'sm')).join('')}</span></button>`; }).join('')}</div>
    ${!can ? '<p class="hint center" style="margin-top:10px">Só os jogadores votam. Você está assistindo.</p>' : ''}
    ${isHost() ? '<button class="linkish quick" data-act="voteCancel" style="display:block;margin:10px auto 0">Cancelar votação</button>' : ''}</section>`;
}

/* =====================================================================
   Host: processa ações e transmite o estado
   ===================================================================== */
function commit() {
  const s = Store.room;
  ensureTeams(s); ensureTerr(s);
  s.version = (s.version || 0) + 1;
  saveRoom(s);
  Transport.send({ kind: 'state', state: s });
  render();
}
function mkPlayer(id, pr, isBot) {
  return { id, name: pr.name, avatar: pr.avatar, color: pr.color, cry: String(pr.cry || '').slice(0, 40), score: 0, isBot, connected: true, lastSeen: now() };
}
function uniqueName(s, name) {
  const taken = new Set(Object.values(s.players).map(p => norm(p.name)));
  if (!taken.has(norm(name))) return name;
  for (let i = 2; ; i++) if (!taken.has(norm(`${name} ${i}`))) return `${name} ${i}`;
}
const cleanName = n => String(n || '').replace(/\s+/g, ' ').trim().slice(0, 14);

function hostHandle(from, a) {
  const s = Store.room;
  if (!s || !a) return;
  let changed = false;
  const p = s.players[from];
  if (p && !p.isBot) {
    p.lastSeen = now();
    if (!p.connected) { p.connected = true; changed = true; }
  }
  if (a.type === 'join') {
    const pl = a.player || {};
    if (!pl.id) return;
    if (s.players[pl.id]) { changed = true; }
    else if (s.settings.locked) {

/** Entra numa sala (outra aba ou outro aparelho). Resolve com { ok, reason }. */
function joinRoom(pin, profile, existingId, onProgress) {
  pin = String(pin || '').toUpperCase().trim();
  const id = existingId || 'p-' + uid(8);
  Store.me = { id, pin, isHost: false, profile };
  Stale.since = 0; Stale.missing = 0; Store.room = null;
  Transport.open(pin, onMessage, 'client');
  const started = now();
  let lastAsk = now();
  const ask = () => { lastAsk = now(); Transport.send({ kind: 'action', from: id, action: { type: 'join', player: { id, ...profile } } }); };
  return new Promise(resolve => {
    joinWait = { done: res => {
      clearInterval(watch);
      if (res.ok) {
        Session.save(Store.me);
        lastHostSignal = now();
        startPresence();
        Wake.on();
        history.replaceState(null, '', '#' + pin);
      } else { Transport.close(); Store.me = null; }
      resolve(res);
    } };
    const fail = reason => { if (!joinWait) return; const w = joinWait; joinWait = null; w.done({ ok: false, reason }); };
    // Reenvia o pedido até o host responder. Cobre conexão lenta e host que acabou de voltar à tela.
    const watch = setInterval(() => {
      const t = now() - started;
      onProgress && onProgress(t);
      if (now() - lastAsk > 2500) ask();
      if (t > 25000) fail(Transport.status === 'offline'
        ? 'Sem conexão com a internet. Verifique a rede e tente de novo.'
        : `A sala ${pin} não respondeu. Confira o código e peça para quem criou a sala deixar a tela do PlayBox aberta.`);
    }, 500);
    ask();
  });
}

function leaveRoom(msg, silent) {
  const me = Store.me;
  if (me) {
    if (me.isHost) { Transport.send({ kind: 'closed' }); stopHost(); dropRoom(me.pin); }
    else if (!silent) dispatch({ type: 'leave' });
  }
  clearInterval(pingTimer);
  Transport.close();
  Wake.off();
  Store.local.invite = false;
  Store.me = null; Store.room = null; Store.hostLost = false; joinWait = null;
  Session.clear();
  history.replaceState(null, '', location.pathname + location.search);
  render();
  if (msg) toast(msg);
}

const nameOf = (s, id) => s.players[id]?.name ?? 'Alguém';
function avatar(p, size = 'md') {
  if (!p) return '';
  return `<span class="av av-${size}" style="--c:${p.color}" aria-hidden="true">${p.avatar}</span>`;
}
const gameVars = m => `--g:${m.color};--gl:${m.lip}`;
const waitCard = (main, sub) => `<div class="wait"><div class="wait-main">${main}</div><p class="hint">${sub}<span class="dots"></span></p></div>`;
const deltaBadge = n => n ? `<span class="delta">+${n}</span>` : '<span></span>';

let lastSig = '';
function render() {
  const s = Store.room, app = $('#app');
  soundCues(s);
  const tvRole = !!(s && Store.me && myRole() === 'tv');
  document.documentElement.classList.toggle('tv', tvRole || !!(s && Store.me && Store.local.tvView));
  document.documentElement.classList.toggle('tv-role', tvRole);
  document.documentElement.classList.toggle('ctrl', ctrlMode(s));
  // No jogo, a tela inteira cabe na janela: só a área do meio rola (quando precisa).
  document.body.classList.toggle('in-game', !!(s && Store.me && s.screen === 'game' && s.game && s.game.phase !== 'final'));
  document.documentElement.classList.toggle('in-room', !!(s && Store.me));
  measureTop();
  renderChat();
  renderTop();
  // Brilho radial do fundo segue a cor do jogo ativo (índigo fora das partidas).
  document.body.style.setProperty('--glow', s && Store.me && s.screen === 'game' && s.game ? Games[s.game.id].color : '#6366F1');
  let html, sig;
  if (!s || !Store.me) { sig = 'home'; html = viewHome(); }
  else if (s.screen === 'lobby') { sig = 'lobby'; html = viewLobby(s); }
  else if (s.screen === 'game' && s.game) {
    sig = `game:${s.game.id}:${s.game.round}:${s.game.phase}${s.game.paused ? ':p' : ''}`;
    // Mesma fase e o jogo sabe se atualizar por partes: não redesenha a tela toda.
    const mod = Games[s.game.id];
    if (sig === lastSig && mod.patch && s.game.phase !== 'final' && s.game.phase !== 'reveal' && !mod.phases[s.game.phase]?.betting && !Store.hostLost && !$('.banner', app) && $('.stage-body', app)) {
      mod.patch(s.game, s, Store.me.id);
      const strip = $('.strip', app);
      if (strip) strip.outerHTML = stripHTML(s, s.game, mod);
      return;
    }
    html = viewGame(s);
  }
  else { sig = 'podium'; html = viewPodium(s); }
  if (s && !isHost() && Store.hostLost) html = `<div class="banner" role="alert">Sem sinal do host há alguns segundos. Se a aba do host foi fechada, a sala acabou.</div>` + html;
  const kept = captureInputs(app);
  // Mesma tela e mesma fase: a área que rola continua onde estava (antes voltava ao topo a cada atualização).
  const sbTop = sig === lastSig ? ($('.stage-body', app)?.scrollTop || 0) : 0;
  app.innerHTML = html;
  restoreInputs(app, kept);
  if (sbTop) { const sb = $('.stage-body', app); if (sb) sb.scrollTop = sbTop; }
  if (sig !== lastSig) {
    // Pausar ou continuar não conta como tela nova: sem animação de entrada e sem voltar ao topo.
    const same = sig.replace(/:p$/, '') === lastSig.replace(/:p$/, '');
    lastSig = sig;
    if (sig === 'lobby' && myRole() !== 'tv' && !Tour.seen()) setTimeout(() => { if (!Tour.seen() && !$('#modalRoot').innerHTML && Store.room?.screen === 'lobby') Tour.open(); }, 700);
    if (!same) { $('.screen', app)?.classList.add('enter'); window.scrollTo({ top: 0 }); }
    const af = $('[data-autofocus]', app);
    if (af && !af.disabled && matchMedia('(pointer:fine)').matches) af.focus({ preventScroll: true });
  }
  afterRender(s);
}

const foldOpen = k => !!(Store.local.fold || {})[k];
const foldHead = (k, id, title, summary) => `<button class="fold-head" data-act="fold" data-k="${k}" aria-expanded="${foldOpen(k)}" aria-controls="fold-${k}"><span class="panel-title" id="${id}">${title}</span>${summary ? `<small>${summary}</small>` : ''}${icon('down')}</button>`;
function measureTop() {
  const tb = $('.topbar');
  if (tb && tb.offsetHeight !== measureTop.h) { measureTop.h = tb.offsetHeight; document.documentElement.style.setProperty('--top-h', tb.offsetHeight + 'px'); }
}
addEventListener('resize', measureTop);
function captureInputs(root) {
  const vals = {};
  let focus = null;
  $$('[data-keep]', root).forEach(el => {
    vals[el.dataset.keep] = el.value;
    if (el === document.activeElement) focus = { k: el.dataset.keep, a: el.selectionStart, b: el.selectionEnd };
  });
  return { vals, focus };
}
function restoreInputs(root, { vals, focus }) {
  $$('[data-keep]', root).forEach(el => { if (el.dataset.keep in vals) el.value = vals[el.dataset.keep]; });
  if (focus) {
    const el = root.querySelector(`[data-keep="${focus.k}"]`);
    if (el && !el.disabled) { el.focus({ preventScroll: true }); try { el.setSelectionRange(focus.a, focus.b); } catch {} }
  }
}

function afterRender(s) {
  syncPinSlots();
  $$('canvas[data-tel]:not([data-painted])').forEach(cv => { cv.dataset.painted = '1'; try { padPaint(cv, JSON.parse(cv.dataset.tel) || []); } catch {} });
  if (s?.screen === 'podium') MyStats.record(s);
  const g = s?.game;
  if (!g || s.screen !== 'game') return;
  if (g.id === 'stop') {
    refreshStopUI();
    const key = `${g.round}:${g.phaseStart}`;
    if (g.phase === 'stopped' && Store.local.stopSent !== key && inRoster(g, Store.me.id)) {
      Store.local.stopSent = key;
      const answers = stopInputs();
      setTimeout(() => dispatch({ type: 'submit', answers }), 0);
    }
  }
  const mod = Games[g.id];
  if (g.phase !== 'final' && mod.mount) mod.mount(g, s, Store.me.id);
}

function renderTop() {
  const el = $('#topRight'), s = Store.room;
  const snd = `<button class="icon-btn snd" data-act="sound" aria-pressed="${Sound.on}" aria-label="${Sound.on ? 'Desligar os sons' : 'Ligar os sons'}" title="${Sound.on ? 'Sons ligados' : 'Sons desligados'}">${icon(Sound.on ? 'volume' : 'mute')}</button>`;
  if (!s || !Store.me) { el.innerHTML = snd; return; }
  const me = s.players[Store.me.id];
  el.innerHTML = `${snd}<span class="room-chip"><span>Sala </span><b>${s.pin}</b></span>${me ? avatar(me, 'sm') : ''}<button class="btn ghost xs" data-act="leave">Sair</button>`;
}

function viewLobby(s) {
  if (myRole() === 'tv') return viewLobbyTV(s);
  const host = isHost(), me = Store.me.id, set = s.settings, mode = modeOf(s);
  const ids = seatIds(s), aud = s.order.filter(id => s.players[id] && !seatIds(s).includes(id));
  const scored = ids.some(id => s.players[id].score > 0);
  const list = scored ? [...ids].sort((a, b) => s.players[b].score - s.players[a].score) : ids;
  const leader = scored ? list[0] : s.hostId;
  const rows = list.map(id => {
    const p = s.players[id], on = p.connected || p.isBot, t = mode === 'equipes' ? s.teams?.[id] : null;
    const tags = `${id === s.hostId ? '<span class="tag tag-host">Host</span>' : ''}${id === s.hostId && set.hostPlays === false ? '<span class="tag">Só apresenta</span>' : ''}${p.isBot ? '<span class="tag">Bot</span>' : ''}${on ? '' : '<span class="tag">Sem sinal</span>'}${id === me ? '<span class="tag tag-me">Você</span>' : ''}${t ? `<span class="tag team-tag team-${t}">${TEAMS[t].short}</span>` : ''}`;
    return `<li class="pl-row ${on ? '' : 'off'}" data-pid="${id}"><span class="throw-tgt" data-act="throwAt" data-id="${id}" title="Toque para arremessar">${avatar(p, 'sm')}</span><span class="pl-name">${esc(p.name)}${tags}${p.ready ? '<span class="tag tag-good">Pronto</span>' : ''}</span>
      ${host ? `<span class="pl-adj"><button data-act="score" data-id="${id}" data-d="-1" aria-label="Tirar 1 ponto de ${esc(p.name)}" ${p.score ? '' : 'disabled'}>−</button><span class="pl-pts">${p.score} pts</span><button data-act="score" data-id="${id}" data-d="1" aria-label="Dar 1 ponto para ${esc(p.name)}">+</button></span>`
        : `<span class="pl-pts">${p.score} pts</span>`}<span class="crown" ${id === leader ? `title="${scored ? 'Na liderança' : 'Host da sala'}"` : ''}>${id === leader ? icon('crown') : ''}</span>
      ${host && id !== s.hostId ? `<span class="pl-tools"><button class="pl-role" data-act="role" data-id="${id}" data-role="spectator" aria-label="Mandar ${esc(p.name)} para a plateia" title="Mandar para a plateia">${icon('eye')}</button><button class="pl-kick" data-act="kick" data-id="${id}" aria-label="Remover ${esc(p.name)} da sala">×</button></span>` : ''}</li>`;
  }).join('');
  const waiting = ids.length < maxP(s) && !set.locked ? `<li class="pl-row waiting"><span class="wait-dot">${icon('user')}</span><span>Aguardando<span class="dots"></span></span><span></span><span class="ring"></span></li>` : '';
  const n = rosterOf(s).length;
  const gcat = GAME_CATS[Store.local.gcat] ? Store.local.gcat : 'all';
  const catChips = `<div class="cat-chips" role="group" aria-label="Filtrar jogos por categoria">${[['all', 'Todos', GAME_ORDER.length], ...Object.entries(GAME_CATS).map(([k, label]) => [k, label, GAME_ORDER.filter(id => Games[id].cat === k).length])]
    .map(([k, label, c]) => `<button class="cat-chip" data-act="gcat" data-v="${k}" aria-pressed="${gcat === k}">${label}<small>${c}</small></button>`).join('')}</div>`;
  const cards = GAME_ORDER.filter(id => gcat === 'all' || Games[id].cat === gcat).map(id => {
    const m = Games[id], lacking = n < m.min, played = s.match.played.includes(id);
    const inner = `<span class="gc-icon">${gameIcon(m)}</span><span class="gc-name">${m.name}</span>
      <span class="gc-tag">${lacking ? `Precisa de ${m.min} jogadores` : m.tag}</span>${played ? `<span class="gc-done" title="Já jogado nesta partida">${icon('check')}</span>` : ''}`;
    const sug = (s.suggest || {})[id] || [], off = !gameOn(s, id);
    const inner2 = inner + (sug.length ? `<span class="gc-sug" title="Sugestões da galera">💡${sug.length}</span>` : '') + (off ? '<span class="gc-off">fora do sorteio</span>' : '');
    return host ? `<button class="game-card ${off ? 'is-off' : ''}" style="${gameVars(m)}" data-act="startGame" data-game="${id}" ${lacking && !Store.local.offEdit ? 'disabled' : ''}>${inner2}</button>`
      : `<button class="game-card ${off ? 'is-off' : ''} ${sug.includes(me) ? 'is-sug' : ''}" style="${gameVars(m)}" data-act="suggest" data-game="${id}" aria-pressed="${sug.includes(me)}" ${lacking ? 'disabled' : ''}>${inner2}</button>`;
  }).join('');
  const toggle = (key, ic, title, desc, on = !!set[key], act = 'toggle') => `<button class="tgl" role="switch" aria-checked="${on}" data-act="${act}" data-k="${key}">
    <span class="tgl-ic">${icon(ic)}</span><span class="tgl-txt"><b>${title}</b><small>${desc}</small></span><span class="tgl-sw" aria-hidden="true"><i></i></span></button>`;
  const modeCards = Object.entries(MODES).map(([k, m]) => `<button class="mode-card" data-act="mode" data-k="${k}" aria-pressed="${mode === k}"><span class="mode-ic">${icon(m.icon)}</span><b>${m.name}</b><small>${m.desc}</small></button>`).join('');
  const setSummary = [MODES[mode].name, set.rush && 'Rush', set.auto && 'sequência', set.events && 'eventos', set.zoeira === false && 'sem zoeira', set.locked && 'trancada'].filter(Boolean).join(' · ');
  const settingsPanel = host ? `${presetPanelHTML(s)}<section class="panel fold ${foldOpen('set') ? 'is-open' : ''}" aria-labelledby="setTitle">${foldHead('set', 'setTitle', 'Ajustes da partida', setSummary)}<div class="fold-body" id="fold-set">
    <p class="hint set-sub">Modo de jogo</p><div class="mode-grid">${modeCards}</div>
    <div class="tgl-list">${toggle('rush', 'bolt', 'Modo Rush', 'Tempos e transições quase pela metade.')}
    ${toggle('auto', 'shuffle', 'Jogos em sequência', 'Quando um jogo acaba, o próximo começa sozinho.')}
    ${toggle('voteNext', 'vote', 'Próximo jogo por votação', 'Na sequência automática, a galera vota em vez de sortear.')}
    ${toggle('hostPlays', 'user', 'Host também joga', 'Desligue para só apresentar e controlar a partida.', set.hostPlays !== false)}
    ${toggle('helps', 'bulb', 'Ajudas pagas', 'Dicas, 50/50 e letras reveladas custam 1 ponto.', set.helps !== false)}
    ${toggle('locked', 'lock', 'Trancar a sala', 'Ninguém novo entra. Quem já está continua.')}
    ${toggle('ctrl', 'tv', 'Celular como controle', 'Com um telão conectado, o celular mostra só o necessário para jogar.')}
    ${toggle('events', 'flame', 'Eventos surpresa', 'Às vezes a rodada vem com regra especial: relâmpago, roubo, dobro…')}
    ${toggle('finalDouble', 'crown', 'Rodada final em dobro', 'A última rodada de cada jogo vale pontos em dobro.')}
    ${toggle('handicap', 'target', 'Handicap', 'Quem está em último usa ajudas de graça; o líder fica sem ajudas.')}
    ${toggle('family', 'users', 'Modo família', 'Esconde palavrões do chat e tira as perguntas mais ousadas.')}
    ${toggle('zoeira', 'smile', 'Zoeira liberada', 'Arremessos, buzina e grito aparecem na tela de todo mundo.', set.zoeira !== false)}
    ${toggle('joker', 'coin', 'Coringa', 'Cada jogador pode dobrar os pontos de uma rodada por partida.', set.joker !== false)}
    ${toggle('tv', 'tv', 'Modo telão nesta tela', 'Deixa tudo grande, para mostrar na TV. Só neste aparelho.', !!Store.local.tvView, 'tvView')}</div></div></section>${customizePanelHTML(s)}${contentPanelHTML(s)}`
    : `<p class="set-chips"><span class="tag">${icon(MODES[mode].icon)}${MODES[mode].name}</span>${presetOf(s) && presetOf(s) !== 'padrao' ? `<span class="tag">${PRESETS[presetOf(s)].e} ${PRESETS[presetOf(s)].name}</span>` : ''}${set.rush ? `<span class="tag tag-rush">${icon('bolt')}Modo Rush</span>` : ''}${set.auto ? '<span class="tag">Jogos em sequência</span>' : ''}${set.locked ? '<span class="tag">Sala trancada</span>' : ''}</p>`;
  const audPanel = aud.length || myRole() === 'spectator' ? `<section class="panel" aria-labelledby="auTitle"><h2 class="panel-title" id="auTitle">Plateia (${aud.length})</h2>
    ${myRole() === 'spectator' ? '<p class="hint">Você está na plateia: assiste, conversa, reage e dá o prêmio do público no fim de cada rodada.</p>' : ''}
    <ul class="aud-list">${aud.map(id => { const p = s.players[id];
      return `<li class="aud-row">${avatar(p, 'sm')}<span>${esc(p.name)}</span>${icon(p.role === 'tv' ? 'tv' : 'eye')}
        ${host && p.role !== 'tv' ? `<button class="btn xs" data-act="role" data-id="${id}" data-role="player" ${ids.length >= maxP(s) ? 'disabled' : ''}>Pôr para jogar</button>` : ''}</li>`; }).join('')}</ul></section>` : '';
  return `<section class="screen lobby">
    ${voteHTML(s)}
    ${set.title ? `<h1 class="room-title">${esc(set.title)}</h1>` : ''}<p class="lobby-caption">Sala criada por <b>${esc(nameOf(s, s.hostId))}</b> · <button type="button" class="linkish tour-link" data-act="tour">${icon('question')}Como jogar</button></p>
    <div class="lobby-grid">
      <div class="lobby-left">
        <section class="panel pin-block" aria-label="PIN da sala">
          <p class="label-caps">PIN da sala</p>
          <div class="pin-keys" aria-label="${s.pin.split('').join(' ')}">${s.pin.split('').map(c => `<span class="key" aria-hidden="true">${c}</span>`).join('')}</div>
          <div class="row center"><button class="btn xs primary" data-act="share">${icon('link')}Convidar</button><button class="btn xs" data-act="copyCode">${icon('copy')}Copiar código</button><button class="btn xs" data-act="tvLink" title="Abra esse link no navegador da TV ou do notebook">${icon('tv')}Telão</button><button class="btn xs" data-act="qr">${icon('qr')}QR code</button></div>
          ${netStatusHTML()}
        </section>
        <section class="panel" aria-labelledby="plTitle">
          <div class="panel-head"><h2 class="panel-title" id="plTitle">Jogadores (${ids.length}/${maxP(s)})${ids.some(id => s.players[id].ready) ? ` · ${ids.filter(id => s.players[id].ready).length} prontos` : ''}</h2>
            <span class="row">${plays(s, me) ? `<button class="btn xs ready-btn ${s.players[me]?.ready ? 'is-on' : ''}" data-act="lobbyReady">${s.players[me]?.ready ? 'Pronto ✓' : 'Estou pronto'}</button>` : ''}${host ? `<button class="btn xs" data-act="addBot" ${ids.length >= maxP(s) ? 'disabled' : ''}>${icon('plus')}Bot</button>` : ''}</span></div>
          <ul class="pl-list">${rows}${waiting}</ul>
        </section>
        ${mode === 'equipes' ? teamsHTML(s, host) : ''}
        ${audPanel}
        ${settingsPanel}
      </div>
      <div class="lobby-right">
        ${myRole() !== 'tv' ? devicePanelHTML() + warmPanelHTML(s) : ''}
        ${mode === 'territorio' ? terrPanelHTML(s) : ''}

          <div class="gp-head">
            <div><h2 class="panel-title" id="gmTitle">${host ? 'Escolha um jogo' : 'O host escolhe o jogo'}</h2><p class="hint">Rodadas por jogo</p></div>
            ${host ? cfgStepHTML(s, 'rounds') : `<span class="seg-static">${set.rounds}</span>`}
          </div>
          ${suggestBarHTML(s, host)}
          ${host ? `<div class="lobby-actions"><button class="btn primary pill" data-act="random">${icon('shuffle')}Jogo surpresa</button><button class="btn pill" data-act="openVote" ${s.vote ? 'disabled' : ''}>${icon('vote')}Galera vota</button></div>` : ''}
          ${playlistHTML(s, host)}${catChips}<div class="game-grid is-12">${cards}</div>
