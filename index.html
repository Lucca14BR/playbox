/* =====================================================================
   Modos de partida, votação de jogos, plateia e telão
   ===================================================================== */
const MODES = {
  classico: { name: 'Clássico', icon: 'crown', desc: 'Cada um por si. Vence quem somar mais pontos.' },
  equipes: { name: 'Equipes', icon: 'users', desc: 'Time Azul contra Time Laranja: seus pontos vão para o seu time.' },
  territorio: { name: 'Território', icon: 'flag', desc: 'Quem vence a rodada conquista um pedaço do mapa.' },
  apostas: { name: 'Apostas', icon: 'coin', desc: 'Antes de cada rodada, aposte pontos em quem vai ganhar.' },
};
const modeOf = s => MODES[s?.settings?.mode] ? s.settings.mode : 'classico';
const TEAMS = { a: { name: 'Time Azul', short: 'Azul', color: '#3B82F6' }, b: { name: 'Time Laranja', short: 'Laranja', color: '#F97316' } };

// Quem joga de verdade: jogadores (não plateia nem telão). O host pode só apresentar.
function plays(s, id) {
  const p = s.players[id];
  return !!p && (p.role || 'player') === 'player' && !(id === s.hostId && s.settings.hostPlays === false);
}
const playerIds = s => s.order.filter(id => plays(s, id));
const seatIds = s => s.order.filter(id => s.players[id] && (s.players[id].role || 'player') === 'player');
const myRole = () => Store.room?.players[Store.me?.id]?.role || Store.me?.profile?.role || 'player';
const isWatcher = () => { const s = Store.room, me = Store.me?.id; return !!(s && me && !plays(s, me)); };

/* ---------- Equipes ---------- */
function ensureTeams(s) {
  if (modeOf(s) !== 'equipes') return;
  s.teams = s.teams || {};
  const ids = playerIds(s);
  Object.keys(s.teams).forEach(id => { if (!ids.includes(id)) delete s.teams[id]; });
  ids.forEach(id => {
    if (s.teams[id]) return;
    const na = ids.filter(x => s.teams[x] === 'a').length, nb = ids.filter(x => s.teams[x] === 'b').length;
    s.teams[id] = na <= nb ? 'a' : 'b';
  });
}
function shuffleTeams(s) { s.teams = {}; shuffle(playerIds(s)).forEach((id, i) => { s.teams[id] = i % 2 ? 'b' : 'a'; }); }
function teamScores(s) {
  const t = { a: 0, b: 0 };
  playerIds(s).forEach(id => { const k = s.teams?.[id]; if (k) t[k] += s.players[id].score; });
  return t;
}
function teamsHTML(s, host) {
  const sc = teamScores(s);
  return `<section class="panel" aria-labelledby="tmTitle">
    <div class="panel-head"><h2 class="panel-title" id="tmTitle">Equipes</h2>${host ? `<button class="btn xs" data-act="shuffleTeams">${icon('shuffle')}Sortear times</button>` : ''}</div>
    <div class="teams">${['a', 'b'].map(k => `<div class="team-col" style="--t:${TEAMS[k].color}">
      <div class="team-head"><b>${TEAMS[k].name}</b><span>${sc[k]} pts</span></div>
      <ul>${playerIds(s).filter(id => s.teams?.[id] === k).map(id => `<li>${host
        ? `<button class="team-mem" data-act="team" data-id="${id}" title="Trocar de time">${avatar(s.players[id], 'sm')}<span>${esc(s.players[id].name)}</span></button>`
        : `<span class="team-mem">${avatar(s.players[id], 'sm')}<span>${esc(s.players[id].name)}</span></span>`}</li>`).join('') || '<li class="hint">Ninguém ainda</li>'}</ul></div>`).join('')}</div>
    ${host ? '<p class="hint" style="margin-top:8px">Toque em alguém para trocar de time.</p>' : ''}</section>`;
}

/* ---------- Conquista de território ---------- */
const TERR_NAMES = ['Castelo', 'Vulcão', 'Praia', 'Floresta', 'Deserto', 'Geleira', 'Pântano', 'Cânion', 'Ilha', 'Selva', 'Planície', 'Montanha', 'Lago', 'Caverna', 'Oásis', 'Recife', 'Savana', 'Colina', 'Baía'];
function makeTerr() {
  const cells = [];
  for (let q = -2; q <= 2; q++) for (let r = -2; r <= 2; r++) if (Math.abs(q + r) <= 2) cells.push({ q, r });
  const ring = c => (Math.abs(c.q) + Math.abs(c.r) + Math.abs(c.q + c.r)) / 2;
  cells.sort((a, b) => ring(a) - ring(b));
  return { cells: cells.map((c, i) => ({ ...c, name: TERR_NAMES[i], owner: null })), last: [] };
}
function ensureTerr(s) { if (modeOf(s) === 'territorio' && !s.terr) s.terr = makeTerr(); }
const hexAdj = (a, b) => { const dq = a.q - b.q, dr = a.r - b.r; return Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr) === 2; };
const terrCount = (s, id) => (s.terr?.cells || []).filter(c => c.owner === id).length;
// Quem fez mais pontos na rodada conquista um território vizinho (ou rouba do líder quando o mapa enche).
function conquer(s) {
  const g = s.game;
  ensureTerr(s);
  const ids = g.roster.filter(id => plays(s, id));
  const max = Math.max(0, ...ids.map(id => g.roundDelta[id] || 0));
  g.conquest = [];
  s.terr.last = [];
  if (!max) return;
  const cells = s.terr.cells;
  ids.filter(id => (g.roundDelta[id] || 0) === max).forEach(pid => {
    const mine = cells.filter(c => c.owner === pid), free = cells.filter(c => !c.owner);
    let target = pick(free.filter(c => mine.some(m => hexAdj(m, c))) || []) || (free.length ? pick(free) : null), from = null;
    if (!target) {
      const leader = ids.filter(id => id !== pid).sort((a, b) => terrCount(s, b) - terrCount(s, a))[0];
      const theirs = cells.filter(c => c.owner === leader);
      if (theirs.length) { target = theirs.find(c => mine.some(m => hexAdj(m, c))) || pick(theirs); from = leader; }
    }
    if (!target) return;
    target.owner = pid;
    s.terr.last.push(target.name);
    g.conquest.push({ pid, name: target.name, from });
  });
}
function terrSVG(s, o = {}) {
  const t = s.terr;
  if (!t) return '';
  const R = 30, W = Math.sqrt(3) * R;
  const pts = (x, y) => [0, 1, 2, 3, 4, 5].map(i => { const a = Math.PI / 180 * (60 * i - 30); return `${(x + R * Math.cos(a)).toFixed(1)},${(y + R * Math.sin(a)).toFixed(1)}`; }).join(' ');
  const cells = t.cells.map(c => {
    const x = W * (c.q + c.r / 2), y = 1.5 * R * c.r, p = c.owner && s.players[c.owner], hot = (t.last || []).includes(c.name);
    return `<g class="hex ${hot ? 'hot' : ''}"><polygon points="${pts(x, y)}" class="${p ? 'owned' : ''}" style="--c:${p ? p.color : '#1F2230'}"><title>${esc(c.name)}${p ? ': ' + esc(p.name) : ''}</title></polygon>
      ${p ? `<text x="${x.toFixed(1)}" y="${(y + 7).toFixed(1)}" text-anchor="middle" font-size="20">${p.avatar}</text>` : o.mini ? '' : `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="middle" class="hex-name">${esc(c.name)}</text>`}</g>`;
  }).join('');
  return `<svg class="terr-map ${o.mini ? 'mini' : ''}" viewBox="${(-2.5 * W - 3).toFixed(1)} ${-4 * R - 3} ${(5 * W + 6).toFixed(1)} ${8 * R + 6}" role="img" aria-label="Mapa de territórios">${cells}</svg>`;
}
function terrPanelHTML(s) {
  ensureTerr(s);
  const own = playerIds(s).map(id => [id, terrCount(s, id)]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
  return `<section class="panel" aria-labelledby="trTitle"><h2 class="panel-title" id="trTitle">Mapa da conquista</h2>${terrSVG(s)}
    ${own.length ? `<ol class="terr-rank">${own.map(([id, n]) => `<li>${avatar(s.players[id], 'sm')}<span>${esc(s.players[id].name)}</span><b>${plural(n, 'território', 'territórios')}</b></li>`).join('')}</ol>`
      : '<p class="hint center">Ninguém conquistou nada ainda. Quem vencer cada rodada pega um território.</p>'}</section>`;
}

/* ---------- Apostas ---------- */
function placeBet(s, pid, a) {
  const g = s.game;
  if (!a || !inRoster(g, pid) || !inRoster(g, a.t)) return false;
  g.bets = g.bets || {};
  g.bets[pid] = { t: a.t, k: clamp(a.k | 0, 0, 3) };
  return true;
}
function botBet(g, s, id) {
  const ids = active(g, s), lead = [...ids].sort((a, b) => s.players[b].score - s.players[a].score)[0];
  return { type: 'bet', t: Math.random() < .5 ? lead : pick(ids), k: pick([1, 1, 2, 3]) };
}
// Acertou quem ganhou a rodada: leva o dobro. Errou: perde o que apostou (nunca fica negativo).
function settleBets(s) {
  const g = s.game, ids = g.roster;
  const max = Math.max(0, ...ids.map(id => g.roundDelta[id] || 0));
  const winners = max ? ids.filter(id => (g.roundDelta[id] || 0) === max) : [];
  const deltas = {};
  g.betResult = [];
  Object.entries(g.bets || {}).forEach(([pid, b]) => {
    if (!b.k || !s.players[pid]) return;
    const win = winners.includes(b.t), d = win ? 2 * b.k : -Math.min(b.k, s.players[pid].score);
    if (d) add(deltas, pid, d);
    g.betResult.push({ pid, t: b.t, k: b.k, win, d });
  });
  updateScores(s, deltas);
}
function betView(g, s, me) {
  if (!inRoster(g, me)) return waitCard('Rolando as apostas', 'Os jogadores estão apostando em quem ganha a rodada');
  const mine = g.bets?.[me], k = Store.local.betK || 1, ids = g.roster.filter(id => s.players[id]);
  return `<h2 class="ask center">Quem vai ganhar esta rodada?</h2>
    <p class="hint center">Acertou: ganha o dobro do que apostou. Errou: perde a aposta.</p>
    <div class="bet-stakes" role="group" aria-label="Valor da aposta">${[1, 2, 3].map(v => `<button data-act="betK" data-k="${v}" aria-pressed="${k === v}">${plural(v, 'ponto', 'pontos')}</button>`).join('')}</div>
    <div class="pick-grid">${ids.map(id => `<button class="pick ${mine?.t === id && mine.k ? 'on' : ''}" data-act="bet" data-id="${id}">${avatar(s.players[id], 'md')}
      <span class="pick-name">${esc(nameOf(s, id))}${id === me ? ' (você)' : ''}</span><span class="pick-val">${s.players[id].score} pts</span></button>`).join('')}</div>
    ${mine && mine.k ? `<p class="hint center">Sua aposta: <b>${plural(mine.k, 'ponto', 'pontos')}</b> em <b>${esc(nameOf(s, mine.t))}</b>. Dá para trocar até o tempo acabar.</p>`
      : mine ? '<p class="hint center">Você ficou de fora desta aposta.</p>' : '<button class="linkish quick" data-act="bet" data-skip="1">Não apostar nesta rodada</button>'}`;
}
// Junta a etapa de apostas no começo da rodada de todos os jogos.
function addBetPhase(m) {
  m.phases.bet = { label: 'Apostas', dur: 14, bot: [1, 5], next: m.first, betting: true, allIn: (g, s) => active(g, s).every(id => id in (g.bets || {})) };
}

/* ---------- Resumo do modo no resultado da rodada ---------- */
function modeRevealHTML(s, g) {
  if (g.phase !== 'reveal') return '';
  if (g.betResult && g.betResult.length) {
    return `<div class="mode-banner"><b>${icon('coin')}Apostas da rodada</b><ul>${g.betResult.map(r => `<li>${avatar(s.players[r.pid], 'sm')}
      <span>${esc(nameOf(s, r.pid))} apostou ${r.k} em ${esc(nameOf(s, r.t))}</span><b class="${r.win ? 'win' : 'lose'}">${r.d > 0 ? '+' + r.d : r.d < 0 ? r.d : 'errou (sem pontos a perder)'}</b></li>`).join('')}</ul></div>`;
  }
  if (g.conquest && modeOf(s) === 'territorio') {
    return `<div class="mode-banner terr-banner">${terrSVG(s, { mini: true })}<div>${g.conquest.length
      ? g.conquest.map(c => `<p>${avatar(s.players[c.pid], 'sm')}<b>${esc(nameOf(s, c.pid))}</b> ${c.from ? `roubou <b>${esc(c.name)}</b> de ${esc(nameOf(s, c.from))}` : `conquistou <b>${esc(c.name)}</b>`}</p>`).join('')
      : '<p class="hint">Ninguém pontuou: nenhum território mudou de dono.</p>'}</div></div>`;
  }
  return '';
}

/* ---------- Votação do próximo jogo ---------- */
function openVote(s) {
  const ok = GAME_ORDER.filter(id => rosterOf(s).length >= Games[id].min);
  const fresh = ok.filter(id => !s.match.played.includes(id));
  const options = shuffle(fresh.length >= 3 ? fresh : ok).slice(0, 3);
  if (!options.length) return false;
  s.vote = { options, votes: {}, deadline: now() + (s.settings.rush ? 9000 : 15000), bots: {} };
  rosterOf(s).filter(id => s.players[id].isBot).forEach(id => { s.vote.bots[id] = now() + rand(1500, 5000); });
  return true;
}
function voteTick(s) {
  const v = s.vote;
  if (!v) return false;
  let changed = false;
  Object.entries(v.bots).forEach(([id, t]) => { if (t && now() >= t) { v.votes[id] = pick(v.options); v.bots[id] = 0; changed = true; } });
  const voters = rosterOf(s);
  if (now() >= v.deadline || (voters.length && voters.every(id => id in v.votes))) {
    const c = {};
    Object.values(v.votes).forEach(id => add(c, id, 1));
    const max = Math.max(0, ...Object.values(c));
    const winner = pick(max ? v.options.filter(id => c[id] === max) : v.options);
    s.vote = null;
    engineStart(s, winner, s.settings.rounds);
    s.game.voted = true;
    return true;
  }
  return changed;
}
function voteHTML(s) {
  const v = s.vote;
  if (!v) return '';
  const me = Store.me.id, mine = v.votes[me], can = plays(s, me), c = {};
  Object.values(v.votes).forEach(id => add(c, id, 1));
  return `<section class="panel vote-panel" aria-labelledby="vtTitle">
    <div class="vote-head"><h2 class="panel-title" id="vtTitle">${icon('vote')}Vote no próximo jogo</h2>
      <span class="vote-time"><b data-countdown="${v.deadline}">${Math.max(0, Math.ceil((v.deadline - now()) / 1000))}</b>s</span></div>
    <div class="vote-grid">${v.options.map(id => { const m = Games[id];
      return `<button class="vote-card ${mine === id ? 'on' : ''}" style="${gameVars(m)}" data-act="gvote" data-id="${id}" ${can ? '' : 'disabled'}>
        <span class="gc-icon">${gameIcon(m)}</span><b>${m.name}</b><small>${m.tag}</small><span class="vote-n">${c[id] || 0}</span>
        <span class="vote-avs">${Object.entries(v.votes).filter(([, x]) => x === id).map(([p]) => avatar(s.players[p], 'sm')).join('')}</span></button>`; }).join('')}</div>
    ${!can ? '<p class="hint center" style="margin-top:10px">Só os jogadores votam. Você está assistindo.</p>' : ''}
    ${isHost() ? '<button class="linkish quick" data-act="voteCancel" style="display:block;margin:10px auto 0">Cancelar votação</button>' : ''}</section>`;
}

/* ---------- Plateia: prêmio do público ---------- */
function applauseHTML(s, g, me) {
  const done = (g.applause || {})[me];
  return `<div class="applause"><b>👏 Prêmio do público</b>
    <span class="hint">${done ? `Você aplaudiu ${esc(nameOf(s, done))}: +1 ponto para essa pessoa.` : 'Dê +1 ponto para quem mandou bem nesta rodada.'}</span>
    ${done ? '' : `<div class="applause-row">${g.roster.filter(id => s.players[id]).map(id => `<button data-act="applaud" data-id="${id}" aria-label="Aplaudir ${esc(nameOf(s, id))}">${avatar(s.players[id], 'md')}<small>${esc(nameOf(s, id))}</small></button>`).join('')}</div>`}</div>`;
}

/* ---------- Telão: lobby em formato de TV ---------- */
function viewLobbyTV(s) {
  const ids = playerIds(s), mode = MODES[modeOf(s)], link = roomLink();
  let qr = '';
  try { const q = qrcode(0, 'M'); q.addData(link); q.make(); qr = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); } catch {}
  return `<section class="screen lobby tv-lobby">${voteHTML(s)}
    <div class="tv-hero">
      <div class="tv-join"><p class="label-caps">Entre pelo celular</p><p class="tv-link">${esc(link.replace(/^https?:\/\//, '').split('#')[0])}</p>
        <div class="pin-keys">${s.pin.split('').map(c => `<span class="key">${c}</span>`).join('')}</div>
        <p class="hint">Digite o código ou aponte a câmera para o QR code.</p></div>
      ${qr ? `<div class="qr-box tv-qr">${qr}</div>` : ''}
    </div>
    <div class="tv-meta"><span class="tag">${icon(mode.icon)}${mode.name}</span>${s.settings.rush ? `<span class="tag tag-rush">${icon('bolt')}Rush</span>` : ''}<span class="tag">${plural(ids.length, 'jogador', 'jogadores')}</span></div>
    <ul class="tv-players">${ids.map(id => `<li>${avatar(s.players[id], 'xl')}<b>${esc(s.players[id].name)}</b><span>${s.players[id].score} pts</span></li>`).join('') || '<li class="hint">Esperando a galera entrar…</li>'}</ul>
    ${modeOf(s) === 'equipes' ? teamsHTML(s, false) : ''}${modeOf(s) === 'territorio' ? terrPanelHTML(s) : ''}
  </section>`;
}

/* =====================================================================
   Host: processa ações e transmite o estado
   ===================================================================== */
function commit() {
  const s = Store.room;
  ensureTeams(s); ensureTerr(s);
  s.version = (s.version || 0) + 1;
  saveRoom(s);
  Transport.send({ kind: 'state', state: s });
  render();
}
function mkPlayer(id, pr, isBot) {
  return { id, name: pr.name, avatar: pr.avatar, color: pr.color, score: 0, isBot, connected: true, lastSeen: now() };
}
function uniqueName(s, name) {
  const taken = new Set(Object.values(s.players).map(p => norm(p.name)));
  if (!taken.has(norm(name))) return name;
  for (let i = 2; ; i++) if (!taken.has(norm(`${name} ${i}`))) return `${name} ${i}`;
}
const cleanName = n => String(n || '').replace(/\s+/g, ' ').trim().slice(0, 14);

function hostHandle(from, a) {
  const s = Store.room;
  if (!s || !a) return;
  let changed = false;
  const p = s.players[from];
  if (p && !p.isBot) {
    p.lastSeen = now();
    if (!p.connected) { p.connected = true; changed = true; }
  }
  if (a.type === 'join') {
    const pl = a.player || {};
    if (!pl.id) return;
    if (s.players[pl.id]) { changed = true; }
    else if (s.settings.locked) {
      Transport.send({ kind: 'reject', to: pl.id, reason: 'O host trancou esta sala. Peça para liberar a entrada e tente de novo.' });
      return;
    } else if (Object.keys(s.players).length >= 40) {
      Transport.send({ kind: 'reject', to: pl.id, reason: 'Essa sala está lotada (40 pessoas, contando a plateia).' });
      return;
    } else {
      // Até 12 jogadores; quem chega depois (ou pede) fica na plateia. O telão é só uma tela.
      let role = ['spectator', 'tv'].includes(pl.role) ? pl.role : 'player';
      const full = role === 'player' && seatIds(s).length >= MAX_PLAYERS;
      if (full) role = 'spectator';
      const name = uniqueName(s, cleanName(pl.name) || (role === 'tv' ? 'Telão' : 'Jogador'));
      const np = mkPlayer(pl.id, { name, avatar: role === 'tv' ? '📺' : AVATARS.includes(pl.avatar) ? pl.avatar : pick(AVATARS), color: COLORS.includes(pl.color) ? pl.color : pick(COLORS) }, false);
      if (role !== 'player') np.role = role;
      s.players[pl.id] = np;
      s.order.push(pl.id);
      pushChat(s, { sys: true, text: role === 'tv' ? 'Um telão foi conectado' : role === 'spectator' ? `${name} está assistindo${full ? ' (os 12 lugares de jogador estão ocupados)' : ''}` : `${name} entrou na sala` });
      changed = true;
    }
  } else if (a.type === 'ping') {
    // só presença
  } else if (a.type === 'leave') {
    if (p) {
      if (s.screen === 'lobby') { delete s.players[from]; s.order = s.order.filter(id => id !== from); }
      else p.connected = false;
      changed = true;
    }
  } else if (!p) {
    return;
  } else if (a.type === 'chat') {
    changed = hostChat(s, from, a.text) || changed;
  } else if (a.type === 'react') {
    hostReact(s, from, a.e);
  } else if (a.type === 'gvote') {
    if (s.vote && plays(s, from) && s.vote.options.includes(a.id)) { s.vote.votes[from] = a.id; changed = true; }
  } else if (a.type === 'applaud') {
    // Prêmio do público: cada pessoa da plateia dá +1 ponto a um jogador por rodada.
    const g = s.game;
    if (g && g.phase === 'reveal' && p.role === 'spectator' && inRoster(g, a.id) && !(g.applause || {})[from]) {
      (g.applause = g.applause || {})[from] = a.id;
      updateScores(s, { [a.id]: 1 });
      Transport.send({ kind: 'fx', pid: from, e: '👏' });
      spawnFx('👏', p);
      changed = true;
    }
  } else if (a.type.startsWith('host:')) {
    if (from === s.hostId) changed = hostCommand(s, a) || changed;
  } else if (s.game && s.game.phase && s.game.phase !== 'final' && !s.game.paused) {
    if (a.type === 'bet') { if (Games[s.game.id].phases[s.game.phase]?.betting) changed = placeBet(s, from, a) || changed; }
    else if (a.type === 'help') changed = useHelp(s, from) || changed;
    else changed = Games[s.game.id].handle(s.game, s, from, a) || changed;
  }
  if (changed) commit();
}

function hostCommand(s, a) {
  switch (a.type) {
    case 'host:addBot': {
      if (seatIds(s).length >= MAX_PLAYERS) return false;
      const used = new Set(Object.values(s.players).map(p => p.name));
      const name = BOT_NAMES.find(n => !used.has(n)) || uniqueName(s, 'Bot');
      const id = 'bot-' + uid(6);
      s.players[id] = mkPlayer(id, { name, avatar: pick(AVATARS), color: pick(COLORS) }, true);
      s.order.push(id);
      return true;
    }
    case 'host:kick':
      if (s.screen !== 'lobby' || a.id === s.hostId || !s.players[a.id]) return false;
      delete s.players[a.id];
      s.order = s.order.filter(id => id !== a.id);
      return true;
    case 'host:rounds':
      s.settings.rounds = clamp(Number(a.n) || 3, 1, 10);
      return true;
    case 'host:start': {
      const m = Games[a.game];
      if (!m || rosterOf(s).length < m.min) return false;
      engineStart(s, a.game, s.settings.rounds);
      return true;
    }
    case 'host:restart':
      if (!s.game) return false;
      markPlayed(s);
      engineStart(s, s.game.id, s.settings.rounds);
      return true;
    case 'host:next':
      if (!s.game || s.game.phase === 'final') return false;
      engineAdvance(s);
      return true;
    case 'host:lobby':
      markPlayed(s);
      s.game = null; s.screen = 'lobby';
      return true;
    case 'host:end':
      markPlayed(s);
      s.game = null; s.screen = 'podium';
      return true;
    case 'host:toggle':
      if (!['rush', 'auto', 'locked', 'voteNext', 'hostPlays', 'helps'].includes(a.key)) return false;
      // Estes começam ligados mesmo em salas antigas (sem o campo).
      if (['hostPlays', 'helps'].includes(a.key)) s.settings[a.key] = s.settings[a.key] === false;
      else s.settings[a.key] = !s.settings[a.key];
      return true;
    case 'host:mode':
      if (!MODES[a.mode] || s.screen !== 'lobby') return false;
      s.settings.mode = a.mode;
      return true;
    case 'host:shuffleTeams':
      if (modeOf(s) !== 'equipes') return false;
      shuffleTeams(s);
      return true;
    case 'host:team':
      if (modeOf(s) !== 'equipes' || !plays(s, a.id)) return false;
      ensureTeams(s);
      s.teams[a.id] = s.teams[a.id] === 'a' ? 'b' : 'a';
      return true;
    case 'host:role': {
      const p = s.players[a.id];
      if (!p || a.id === s.hostId || p.role === 'tv' || !['player', 'spectator'].includes(a.role)) return false;
      if (a.role === 'player') { if (seatIds(s).length >= MAX_PLAYERS) return false; delete p.role; }
      else p.role = 'spectator';
      return true;
    }
    case 'host:vote':
      if (s.screen === 'game' && s.game?.phase === 'final') { markPlayed(s); s.game = null; s.screen = 'lobby'; }
      if (s.screen !== 'lobby') return false;
      return openVote(s);
    case 'host:voteCancel':
      if (!s.vote) return false;
      s.vote = null;
      return true;
    case 'host:random': {
      const ok = GAME_ORDER.filter(id => rosterOf(s).length >= Games[id].min);
      const fresh = ok.filter(id => !s.match.played.includes(id) && id !== s.game?.id);
      const id = pick(fresh.length ? fresh : ok);
      if (!id) return false;
      markPlayed(s);
      engineStart(s, id, s.settings.rounds);
      s.game.surprise = true;
      return true;
    }
    case 'host:pause':
      if (!s.game || s.game.phase === 'final' || s.game.paused) return false;
      s.game.paused = { at: now() };
      return true;
    case 'host:resume': {
      const g = s.game;
      if (!g || !g.paused) return false;
      const d = now() - g.paused.at;
      delete g.paused;
      shiftTimers(g, d);
      return true;
    }
    case 'host:addTime': {
      const g = s.game;
      if (!g || !g.deadline || g.phase === 'final' || g.paused || Games[g.id].phases[g.phase].hideTimer) return false;
      g.deadline = Math.max(g.deadline, now()) + 15000; g.dur += 15;
      return true;
    }
    case 'host:score': {
      const p = s.players[a.id];
      if (!p) return false;
      p.score = Math.max(0, p.score + (a.d > 0 ? 1 : -1));
      return true;
    }
    case 'host:newMatch':
      Object.values(s.players).forEach(p => { p.score = 0; });
      s.match.played = []; s.match.byGame = {}; s.terr = null; s.vote = null; s.game = null; s.screen = 'lobby';
      return true;
  }
  return false;
}
/* ---------- Chat e reações (o host recebe, filtra e repassa) ---------- */
const REACTS = ['😂', '🔥', '👏', '😱', '❤️', '🤯'];
const BOT_CHAT = ['kkkkk', 'essa foi difícil', 'gg', 'tô ficando bom nisso', 'próxima eu ganho', 'que isso 😂', 'eita', 'quase!'];
const ChatRT = { last: {}, lastReact: {} };
function pushChat(s, m) {
  s.chat = s.chat || [];
  s.chatSeq = (s.chatSeq || 0) + 1;
  s.chat.push({ n: s.chatSeq, t: now(), ...m });
  if (s.chat.length > 40) s.chat.splice(0, s.chat.length - 40);
}
// Mensagens que entregariam a resposta da rodada ficam escondidas (cada jogo diz o que é segredo).
function chatLeaks(s, text) {
  const g = s.game, mod = g && g.phase && g.phase !== 'final' ? Games[g.id] : null;
  if (!mod || !mod.secret) return false;
  const flat = norm(text).replace(/[^a-z0-9]/g, '');
  return (mod.secret(g, s) || []).map(x => norm(x).replace(/[^a-z0-9]/g, '')).some(x => x.length >= 3 && flat.includes(x));
}
function hostChat(s, pid, raw) {
  const text = String(raw || '').replace(/\s+/g, ' ').trim().slice(0, 140);
  if (!text || now() - (ChatRT.last[pid] || 0) < 600) return false;
  ChatRT.last[pid] = now();
  const hid = chatLeaks(s, text);
  pushChat(s, { pid, name: s.players[pid].name, text: hid ? '' : text, hid });
  return true;
}
function hostReact(s, pid, e) {
  // Margem menor que a do aparelho (350 ms) para absorver atrasos da rede.
  if (!REACTS.includes(e) || now() - (ChatRT.lastReact[pid] || 0) < 200) return;
  ChatRT.lastReact[pid] = now();
  Transport.send({ kind: 'fx', pid, e });
  if (pid !== Store.me?.id) spawnFx(e, s.players[pid]);
}
// Bots reagem aos resultados (e de vez em quando comentam no chat).
function botsReact(s) {
  if (!isHost() || !s.game) return;
  s.game.roster.filter(id => s.players[id]?.isBot).forEach(id => {
    if (Math.random() < .45) setTimeout(() => { if (Store.room?.players[id]) hostReact(Store.room, id, pick(REACTS)); }, rand(500, 2600));
    if (Math.random() < .12) setTimeout(() => {
      const room = Store.room, p = room?.players[id];
      if (p && isHost()) { pushChat(room, { pid: id, name: p.name, text: pick(BOT_CHAT) }); commit(); }
    }, rand(1500, 4500));
  });
}

// Depois de uma pausa, empurra para frente todos os horários marcados da partida.
function shiftTimers(g, d) {
  if (g.deadline) g.deadline += d;
  g.phaseStart += d;
  Object.keys(HostRT.botAt).forEach(k => { HostRT.botAt[k] += d; });
  if (HostRT.allInAt) HostRT.allInAt += d;
  const x = g.data || {};
  if (x.botStopAt) x.botStopAt += d;
  if (x.botAt) x.botAt += d;
  if (x.bots) Object.values(x.bots).forEach(pl => { pl.times = pl.times.map(t => t + d); });
}
// Jogos em sequência: sorteia um jogo ainda não jogado; se acabaram, vai para o pódio.
function autoNext(s) {
  markPlayed(s);
  const ok = GAME_ORDER.filter(id => rosterOf(s).length >= Games[id].min && !s.match.played.includes(id));
  if (!ok.length) { s.game = null; s.screen = 'podium'; return; }
  if (s.settings.voteNext) { s.game = null; s.screen = 'lobby'; openVote(s); return; }
  engineStart(s, pick(ok), s.settings.rounds);
  s.game.surprise = true;
}
function markPlayed(s) {
  if (s.game && s.game.phase === 'final' && !s.match.played.includes(s.game.id)) s.match.played.push(s.game.id);
}

function hostTick() {
  const s = Store.room;
  if (!s || !isHost()) return;
  let changed = false;
  for (const p of Object.values(s.players)) {
    if (!p.isBot && p.id !== s.hostId && p.connected && now() - p.lastSeen > 10000) { p.connected = false; changed = true; }
  }
  if (s.screen === 'lobby' && s.vote && voteTick(s)) changed = true;
  const g = s.game;
  if (g && g.phase === 'final' && s.settings.auto) {
    if (!g.autoAt) { g.autoAt = now() + 9000; changed = true; }
    else if (now() >= g.autoAt) { autoNext(s); changed = true; }
  }
  if (g && g.phase && g.phase !== 'final' && !g.paused) {
    const mod = Games[g.id], ph = mod.phases[g.phase];
    if (ph.bot) {
      for (const id of g.roster) {
        if (!s.players[id]?.isBot) continue;
        const key = `${g.pkey}:${id}`;
        if (HostRT.botDone.has(key)) continue;
        if (!HostRT.botAt[key]) { HostRT.botAt[key] = now() + rand(ph.bot[0], ph.bot[1]) * 1000 * (rushOn(s, ph) ? RUSH : 1); continue; }
        if (now() < HostRT.botAt[key]) continue;
        HostRT.botDone.add(key); delete HostRT.botAt[key];
        if (ph.betting) { if (placeBet(s, id, botBet(g, s, id))) changed = true; }
        else for (const act of [].concat(mod.bot(g, s, id) || [])) if (mod.handle(g, s, id, act)) changed = true;
      }
    }
    if (mod.tick && mod.tick(g, s)) changed = true;
    const cur = mod.phases[g.phase];
    if (g.deadline && now() >= g.deadline) { engineAdvance(s); changed = true; }
    else if (cur.allIn && cur.allIn(g, s)) {
      if (!HostRT.allInAt) HostRT.allInAt = now() + (s.settings.rush ? 300 : 700);
      else if (now() >= HostRT.allInAt) { engineAdvance(s); changed = true; }
    } else HostRT.allInAt = null;
  }
  if (changed) commit();
}
function startHost() {
  stopHost();
  HostRT.timer = setInterval(hostTick, 200);
  HostRT.beat = setInterval(() => Transport.send({ kind: 'beat' }), 2500);
}
function stopHost() {
  clearInterval(HostRT.timer); clearInterval(HostRT.beat);
  HostRT.timer = HostRT.beat = null; HostRT.botAt = {}; HostRT.botDone = new Set(); HostRT.allInAt = null;
}

/* =====================================================================
   Cliente: conexão com a sala
   ===================================================================== */
let joinWait = null, lastHostSignal = 0, pingTimer = null;

function onMessage(msg) {
  const me = Store.me;
  if (!me) return;
  if (isHost()) {
    // Ações do próprio host nunca chegam pela rede; ignora quem tenta se passar por ele.
    if (msg.kind === 'action' && msg.from && msg.from !== me.id) hostHandle(msg.from, msg.action);
    else if (msg.kind === 'hello') Transport.send({ kind: 'state', state: Store.room });
    return;
  }
  if (msg.kind === 'state' && msg.state) {
    lastHostSignal = now();
    const inside = !!msg.state.players[me.id];
    if (joinWait) {
      if (!inside) return;
      const w = joinWait; joinWait = null; w.done({ ok: true });
    } else if (!inside) {
      leaveRoom('Você foi removido da sala.', true);
      return;
    }
    if (Store.room && msg.state.version < Store.room.version && msg.state.pin === Store.room.pin) return;
    Store.room = msg.state;
    if (Store.hostLost) Store.hostLost = false;
    render();
  } else if (msg.kind === 'fx') {
    if (msg.pid !== me.id) spawnFx(msg.e, Store.room?.players[msg.pid]);
  } else if (msg.kind === 'beat') {
    lastHostSignal = now();
    if (Store.hostLost) { Store.hostLost = false; render(); }
  } else if (msg.kind === 'closed') {
    leaveRoom('O host encerrou a sala.', true);
  } else if (msg.kind === 'reject' && msg.to === me.id && joinWait) {
    const w = joinWait; joinWait = null; w.done({ ok: false, reason: msg.reason });
  }
}

function dispatch(action) {
  const me = Store.me;
  if (!me) return;
  if (me.isHost) hostHandle(me.id, action);
  else Transport.send({ kind: 'action', from: me.id, action });
}

function startPresence() {
  clearInterval(pingTimer);
  pingTimer = setInterval(() => {
    if (!Store.me || isHost()) return;
    dispatch({ type: 'ping' });
    const lost = now() - lastHostSignal > 9000;
    if (lost !== Store.hostLost) { Store.hostLost = lost; render(); }
  }, 3000);
}

function genPin() {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let pin;
  do { pin = Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join(''); } while (loadRoom(pin));
  return pin;
}

/** Cria a sala; quem cria vira host e também joga. */
function createRoom(profile) {
  const pin = genPin(), id = 'p-' + uid(8);
  Store.me = { id, pin, isHost: true, profile };
  Store.room = { pin, hostId: id, createdAt: now(), version: 0, screen: 'lobby', players: { [id]: mkPlayer(id, profile, false) }, order: [id], settings: { rounds: 3, rush: false, auto: false, locked: false, mode: 'classico', hostPlays: true, voteNext: false }, match: { played: [] }, game: null };
  Session.save(Store.me);
  Transport.open(pin, onMessage, 'host');
  startHost();
  history.replaceState(null, '', '#' + pin);
  commit();
  Wake.on();
  return pin;
}

/** Entra numa sala (outra aba ou outro aparelho). Resolve com { ok, reason }. */
function joinRoom(pin, profile, existingId, onProgress) {
  pin = String(pin || '').toUpperCase().trim();
  const id = existingId || 'p-' + uid(8);
  Store.me = { id, pin, isHost: false, profile };
  Transport.open(pin, onMessage, 'client');
  const started = now();
  let lastAsk = now();
  const ask = () => { lastAsk = now(); Transport.send({ kind: 'action', from: id, action: { type: 'join', player: { id, ...profile } } }); };
  return new Promise(resolve => {
    joinWait = { done: res => {
      clearInterval(watch);
      if (res.ok) {
        Session.save(Store.me);
        lastHostSignal = now();
        startPresence();
        Wake.on();
        history.replaceState(null, '', '#' + pin);
      } else { Transport.close(); Store.me = null; }
      resolve(res);
    } };
    const fail = reason => { if (!joinWait) return; const w = joinWait; joinWait = null; w.done({ ok: false, reason }); };
    // Reenvia o pedido até o host responder. Cobre conexão lenta e host que acabou de voltar à tela.
    const watch = setInterval(() => {
      const t = now() - started;
      onProgress && onProgress(t);
      if (now() - lastAsk > 2500) ask();
      if (t > 25000) fail(Transport.status === 'offline'
        ? 'Sem conexão com a internet. Verifique a rede e tente de novo.'
        : `A sala ${pin} não respondeu. Confira o código e peça para quem criou a sala deixar a tela do PlayBox aberta.`);
    }, 500);
    ask();
  });
}

function leaveRoom(msg, silent) {
  const me = Store.me;
  if (me) {
    if (me.isHost) { Transport.send({ kind: 'closed' }); stopHost(); dropRoom(me.pin); }
    else if (!silent) dispatch({ type: 'leave' });
  }
  clearInterval(pingTimer);
  Transport.close();
  Wake.off();
  Store.local.invite = false;
  Store.me = null; Store.room = null; Store.hostLost = false; joinWait = null;
  Session.clear();
  history.replaceState(null, '', location.pathname + location.search);
  render();
  if (msg) toast(msg);
}

let lastSig = '';
function render() {
  const s = Store.room, app = $('#app');
  soundCues(s);
  const tvRole = !!(s && Store.me && myRole() === 'tv');
  document.documentElement.classList.toggle('tv', tvRole || !!(s && Store.me && Store.local.tvView));
  document.documentElement.classList.toggle('tv-role', tvRole);
  renderChat();
  renderTop();
  // Brilho radial do fundo segue a cor do jogo ativo (índigo fora das partidas).
  document.body.style.setProperty('--glow', s && Store.me && s.screen === 'game' && s.game ? Games[s.game.id].color : '#6366F1');
  let html, sig;
  if (!s || !Store.me) { sig = 'home'; html = viewHome(); }
  else if (s.screen === 'lobby') { sig = 'lobby'; html = viewLobby(s); }
  else if (s.screen === 'game' && s.game) {
    sig = `game:${s.game.id}:${s.game.round}:${s.game.phase}${s.game.paused ? ':p' : ''}`;
    // Mesma fase e o jogo sabe se atualizar por partes: não redesenha a tela toda.
    const mod = Games[s.game.id];
    if (sig === lastSig && mod.patch && s.game.phase !== 'final' && s.game.phase !== 'reveal' && !mod.phases[s.game.phase]?.betting && !Store.hostLost && !$('.banner', app) && $('.stage-body', app)) {
      mod.patch(s.game, s, Store.me.id);
      const strip = $('.strip', app);
      if (strip) strip.outerHTML = stripHTML(s, s.game, mod);
      return;
    }
    html = viewGame(s);
  }
  else { sig = 'podium'; html = viewPodium(s); }
  if (s && !isHost() && Store.hostLost) html = `<div class="banner" role="alert">Sem sinal do host há alguns segundos. Se a aba do host foi fechada, a sala acabou.</div>` + html;
  const kept = captureInputs(app);
  app.innerHTML = html;
  restoreInputs(app, kept);
  if (sig !== lastSig) {
    // Pausar ou continuar não conta como tela nova: sem animação de entrada e sem voltar ao topo.
    const same = sig.replace(/:p$/, '') === lastSig.replace(/:p$/, '');
    lastSig = sig;
    if (!same) { $('.screen', app)?.classList.add('enter'); window.scrollTo({ top: 0 }); }
    const af = $('[data-autofocus]', app);

  }

}

function captureInputs(root) {
  const vals = {};
  let focus = null;
  $$('[data-keep]', root).forEach(el => {
    vals[el.dataset.keep] = el.value;
    if (el === document.activeElement) focus = { k: el.dataset.keep, a: el.selectionStart, b: el.selectionEnd };
  });
  return { vals, focus };
}
function restoreInputs(root, { vals, focus }) {
  $$('[data-keep]', root).forEach(el => { if (el.dataset.keep in vals) el.value = vals[el.dataset.keep]; });
  if (focus) {
    const el = root.querySelector(`[data-keep="${focus.k}"]`);
    if (el && !el.disabled) { el.focus({ preventScroll: true }); try { el.setSelectionRange(focus.a, focus.b); } catch {} }
  }
}

function afterRender(s) {
  syncPinSlots();
  const g = s?.game;
  if (!g || s.screen !== 'game') return;
  if (g.id === 'stop') {
    refreshStopUI();
    const key = `${g.round}:${g.phaseStart}`;
    if (g.phase === 'stopped' && Store.local.stopSent !== key && inRoster(g, Store.me.id)) {
      Store.local.stopSent = key;
      const answers = stopInputs();
      setTimeout(() => dispatch({ type: 'submit', answers }), 0);
    }
  }
  const mod = Games[g.id];
  if (g.phase !== 'final' && mod.mount) mod.mount(g, s, Store.me.id);
}

}

/* ---------- Telas ---------- */
function viewHome() {
  const pr = Store.local.profile, open = Store.local.pickerOpen;
  // Quem chega por um link de convite vê só a entrada naquela sala.
  const invite = Store.local.invite && /^[A-Z0-9]{4}$/.test(Store.local.pinDraft || '') ? Store.local.pinDraft : null;
  const tab = invite ? 'join' : Store.local.homeTab;
  const games = GAME_ORDER.map(id => { const m = Games[id]; return `<li class="game-card" style="${gameVars(m)}"><span class="gc-icon">${gameIcon(m)}</span>
    <span class="gc-name">${m.name}</span><span class="gc-tag">${m.tag}</span></li>`; }).join('');
  const tabBtn = (id, label) => `<button type="button" class="tab" role="tab" id="tab-${id}" data-act="tab" data-v="${id}" aria-controls="panel-${id}" aria-selected="${tab === id}" tabindex="${tab === id ? 0 : -1}">${label}</button>`;
  const slots = [0, 1, 2, 3].map(i => `<span class="slot empty" data-slot="${i}"></span>`).join('');
  return `<section class="screen home">
    <div class="home-hero">
      <h1 class="hero-title"><span>Abra a caixa.</span><span class="accent">Chame a galera.</span></h1>
      <p class="lede">${invite ? `Você foi chamado para a sala ${invite}. Escolha um apelido e entre.` : '6 jogos. 1 sala. Quem será o maior? Crie uma sala ou entre com o código que um amigo te passou.'}</p>
    </div>
    <div class="home-art">${cubeArt()}</div>

    <form class="home-form ${invite ? 'invite' : ''}" data-form="home" novalidate aria-label="Jogar">
      <section class="panel profile" aria-label="Seu jogador">
        <button type="button" class="av-btn" data-act="picker" aria-expanded="${open}" aria-controls="picker" aria-label="Trocar avatar"><span id="avPreview">${avatar(pr, 'lg')}</span></button>
        <div class="profile-main">
          <div class="nick-field"><label for="nick">Seu apelido</label>
            <span class="nick-wrap"><input class="nick-input" id="nick" data-keep="nick" maxlength="14" autocomplete="nickname" placeholder="Como te chamam?" value="${esc(pr.name)}" ${invite && !pr.name ? 'data-autofocus' : ''}>${icon('pencil')}</span></div>
          <div class="swatches" role="radiogroup" aria-label="Cor do avatar">${COLORS.map((c, i) => `<button type="button" class="sw ${c === pr.color ? 'on' : ''}" style="--c:${c}" data-act="color" data-v="${c}" role="radio" aria-checked="${c === pr.color}" aria-label="Cor ${i + 1}"></button>`).join('')}</div>
        </div>
        <button type="button" class="icon-btn chev" data-act="picker" aria-expanded="${open}" aria-controls="picker" aria-label="Escolher avatar">${icon('down')}</button>
        <div class="picker" id="picker" ${open ? '' : 'hidden'}>
          <div class="emoji-grid" role="radiogroup" aria-label="Avatar">${AVATARS.map(a => `<button type="button" class="emo ${a === pr.avatar ? 'on' : ''}" data-act="avatar" data-v="${a}" role="radio" aria-checked="${a === pr.avatar}">${a}</button>`).join('')}</div>
        </div>
        <p class="err" id="nickErr" role="alert"></p>
      </section>

      <div class="tabs" role="tablist" aria-label="Como você quer jogar">${tabBtn('join', 'Entrar na sala')}${tabBtn('create', 'Criar sala')}</div>

      <section class="panel tab-body join-card" id="panel-join" role="tabpanel" aria-labelledby="tab-join" ${tab === 'join' ? '' : 'hidden'}>
        <p class="tb-title">${invite ? `Entrar na sala ${invite}` : 'Entrar na sala'}</p>
        <div class="field"><label for="pin">PIN da sala (4 letras)</label>
          <div class="pin-row">
            <div class="pin-slots">${slots}<input class="pin-input" id="pin" data-keep="pin" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(Store.local.pinDraft || '')}"></div>
            <button class="btn primary pin-go" id="joinArrow" aria-label="Entrar na sala">${icon('arrow')}</button>
          </div></div>
        <p class="err" id="joinErr" role="alert"></p>
        <label class="aud-opt"><input type="checkbox" id="asAudience"><span>Só assistir (entrar na plateia)</span></label>
        <button class="btn primary big pill join-big" id="joinBtn">${invite ? 'Entrar na sala' : 'Entrar'}</button>
        <p class="hint" id="joinHint" role="status" hidden></p>
        <button type="button" class="linkish quick" data-act="joinTv">${icon('tv')}Usar esta tela como telão</button>
        ${invite ? '<button type="button" class="linkish quick" data-act="uninvite">Quero criar outra sala</button>' : ''}
      </section>

      <section class="tab-body create-card" id="panel-create" role="tabpanel" aria-labelledby="tab-create" ${tab === 'create' ? '' : 'hidden'}>
        <button class="create-btn" id="createBtn">${icon('plus')}Criar sala</button>
        <p class="hint">Você vira o host: escolhe os jogos e passa o código para a galera.</p>
        <button type="button" class="linkish quick" data-act="quick">Testar sozinho com 3 bots</button>
      </section>
    </form>

    <section class="showcase" aria-labelledby="scTitle">
      <h2 class="sec-title" id="scTitle">Conheça os jogos</h2>
      <ul class="game-grid">${games}</ul>
    </section>
  </section>`;
}

function viewLobby(s) {
  if (myRole() === 'tv') return viewLobbyTV(s);
  const host = isHost(), me = Store.me.id, set = s.settings, mode = modeOf(s);
  const ids = seatIds(s), aud = s.order.filter(id => s.players[id] && !seatIds(s).includes(id));
  const scored = ids.some(id => s.players[id].score > 0);
  const list = scored ? [...ids].sort((a, b) => s.players[b].score - s.players[a].score) : ids;
  const leader = scored ? list[0] : s.hostId;
  const rows = list.map(id => {
    const p = s.players[id], on = p.connected || p.isBot, t = mode === 'equipes' ? s.teams?.[id] : null;
    const tags = `${id === s.hostId ? '<span class="tag tag-host">Host</span>' : ''}${id === s.hostId && set.hostPlays === false ? '<span class="tag">Só apresenta</span>' : ''}${p.isBot ? '<span class="tag">Bot</span>' : ''}${on ? '' : '<span class="tag">Sem sinal</span>'}${id === me ? '<span class="tag tag-me">Você</span>' : ''}${t ? `<span class="tag team-tag team-${t}">${TEAMS[t].short}</span>` : ''}`;
    return `<li class="pl-row ${on ? '' : 'off'}">${avatar(p, 'sm')}<span class="pl-name">${esc(p.name)}${tags}</span>
      ${host ? `<span class="pl-adj"><button data-act="score" data-id="${id}" data-d="-1" aria-label="Tirar 1 ponto de ${esc(p.name)}" ${p.score ? '' : 'disabled'}>−</button><span class="pl-pts">${p.score} pts</span><button data-act="score" data-id="${id}" data-d="1" aria-label="Dar 1 ponto para ${esc(p.name)}">+</button></span>`
        : `<span class="pl-pts">${p.score} pts</span>`}<span class="crown" ${id === leader ? `title="${scored ? 'Na liderança' : 'Host da sala'}"` : ''}>${id === leader ? icon('crown') : ''}</span>
      ${host && id !== s.hostId ? `<span class="pl-tools"><button class="pl-role" data-act="role" data-id="${id}" data-role="spectator" aria-label="Mandar ${esc(p.name)} para a plateia" title="Mandar para a plateia">${icon('eye')}</button><button class="pl-kick" data-act="kick" data-id="${id}" aria-label="Remover ${esc(p.name)} da sala">×</button></span>` : ''}</li>`;
  }).join('');
  const waiting = ids.length < MAX_PLAYERS && !set.locked ? `<li class="pl-row waiting"><span class="wait-dot">${icon('user')}</span><span>Aguardando<span class="dots"></span></span><span></span><span class="ring"></span></li>` : '';
  const n = rosterOf(s).length;
  const gcat = GAME_CATS[Store.local.gcat] ? Store.local.gcat : 'all';
  const catChips = `<div class="cat-chips" role="group" aria-label="Filtrar jogos por categoria">${[['all', 'Todos', GAME_ORDER.length], ...Object.entries(GAME_CATS).map(([k, label]) => [k, label, GAME_ORDER.filter(id => Games[id].cat === k).length])]
    .map(([k, label, c]) => `<button class="cat-chip" data-act="gcat" data-v="${k}" aria-pressed="${gcat === k}">${label}<small>${c}</small></button>`).join('')}</div>`;
  const cards = GAME_ORDER.filter(id => gcat === 'all' || Games[id].cat === gcat).map(id => {
    const m = Games[id], lacking = n < m.min, played = s.match.played.includes(id);
    const inner = `<span class="gc-icon">${gameIcon(m)}</span><span class="gc-name">${m.name}</span>
      <span class="gc-tag">${lacking ? `Precisa de ${m.min} jogadores` : m.tag}</span>${played ? `<span class="gc-done" title="Já jogado nesta partida">${icon('check')}</span>` : ''}`;
    return host ? `<button class="game-card" style="${gameVars(m)}" data-act="startGame" data-game="${id}" ${lacking ? 'disabled' : ''}>${inner}</button>`
      : `<div class="game-card" style="${gameVars(m)}">${inner}</div>`;
  }).join('');
  const toggle = (key, ic, title, desc, on = !!set[key], act = 'toggle') => `<button class="tgl" role="switch" aria-checked="${on}" data-act="${act}" data-k="${key}">
    <span class="tgl-ic">${icon(ic)}</span><span class="tgl-txt"><b>${title}</b><small>${desc}</small></span><span class="tgl-sw" aria-hidden="true"><i></i></span></button>`;
  const modeCards = Object.entries(MODES).map(([k, m]) => `<button class="mode-card" data-act="mode" data-k="${k}" aria-pressed="${mode === k}"><span class="mode-ic">${icon(m.icon)}</span><b>${m.name}</b><small>${m.desc}</small></button>`).join('');
  const settingsPanel = host ? `<section class="panel" aria-labelledby="setTitle"><h2 class="panel-title" id="setTitle">Ajustes da partida</h2>
    <p class="hint set-sub">Modo de jogo</p><div class="mode-grid">${modeCards}</div>
    <div class="tgl-list">${toggle('rush', 'bolt', 'Modo Rush', 'Tempos e transições quase pela metade.')}
    ${toggle('auto', 'shuffle', 'Jogos em sequência', 'Quando um jogo acaba, o próximo começa sozinho.')}
    ${toggle('voteNext', 'vote', 'Próximo jogo por votação', 'Na sequência automática, a galera vota em vez de sortear.')}
    ${toggle('hostPlays', 'user', 'Host também joga', 'Desligue para só apresentar e controlar a partida.', set.hostPlays !== false)}
    ${toggle('helps', 'bulb', 'Ajudas pagas', 'Dicas, 50/50 e letras reveladas custam 1 ponto.', set.helps !== false)}
    ${toggle('locked', 'lock', 'Trancar a sala', 'Ninguém novo entra. Quem já está continua.')}
    ${toggle('tv', 'tv', 'Modo telão nesta tela', 'Deixa tudo grande, para mostrar na TV. Só neste aparelho.', !!Store.local.tvView, 'tvView')}</div></section>`
    : `<p class="set-chips"><span class="tag">${icon(MODES[mode].icon)}${MODES[mode].name}</span>${set.rush ? `<span class="tag tag-rush">${icon('bolt')}Modo Rush</span>` : ''}${set.auto ? '<span class="tag">Jogos em sequência</span>' : ''}${set.locked ? '<span class="tag">Sala trancada</span>' : ''}</p>`;
  const audPanel = aud.length || myRole() === 'spectator' ? `<section class="panel" aria-labelledby="auTitle"><h2 class="panel-title" id="auTitle">Plateia (${aud.length})</h2>
    ${myRole() === 'spectator' ? '<p class="hint">Você está na plateia: assiste, conversa, reage e dá o prêmio do público no fim de cada rodada.</p>' : ''}
    <ul class="aud-list">${aud.map(id => { const p = s.players[id];
      return `<li class="aud-row">${avatar(p, 'sm')}<span>${esc(p.name)}</span>${icon(p.role === 'tv' ? 'tv' : 'eye')}
        ${host && p.role !== 'tv' ? `<button class="btn xs" data-act="role" data-id="${id}" data-role="player" ${ids.length >= MAX_PLAYERS ? 'disabled' : ''}>Pôr para jogar</button>` : ''}</li>`; }).join('')}</ul></section>` : '';
  return `<section class="screen lobby">
    ${voteHTML(s)}
    <p class="lobby-caption">Sala criada por <b>${esc(nameOf(s, s.hostId))}</b></p>
    <div class="lobby-grid">
      <div class="lobby-left">
        <section class="panel pin-block" aria-label="PIN da sala">
          <p class="label-caps">PIN da sala</p>
          <div class="pin-keys" aria-label="${s.pin.split('').join(' ')}">${s.pin.split('').map(c => `<span class="key" aria-hidden="true">${c}</span>`).join('')}</div>
          <div class="row center"><button class="btn xs primary" data-act="share">${icon('link')}Convidar</button><button class="btn xs" data-act="copyCode">${icon('copy')}Copiar código</button><button class="btn xs" data-act="qr">${icon('qr')}QR code</button></div>
          ${netStatusHTML()}
        </section>
        <section class="panel" aria-labelledby="plTitle">
          <div class="panel-head"><h2 class="panel-title" id="plTitle">Jogadores (${ids.length}/${MAX_PLAYERS})</h2>
            ${host ? `<button class="btn xs" data-act="addBot" ${ids.length >= MAX_PLAYERS ? 'disabled' : ''}>${icon('plus')}Bot</button>` : ''}</div>
          <ul class="pl-list">${rows}${waiting}</ul>
        </section>
        ${mode === 'equipes' ? teamsHTML(s, host) : ''}
        ${audPanel}
        ${settingsPanel}
      </div>
      <div class="lobby-right">
        ${mode === 'territorio' ? terrPanelHTML(s) : ''}
        <section class="panel" aria-labelledby="gmTitle">
          <div class="gp-head">
            <div><h2 class="panel-title" id="gmTitle">${host ? 'Escolha um jogo' : 'O host escolhe o jogo'}</h2><p class="hint">Rodadas por jogo</p></div>
            ${host ? `<div class="seg" role="group" aria-label="Rodadas por jogo">${[3, 5, 7].map(k => `<button data-act="rounds" data-n="${k}" aria-pressed="${set.rounds === k}">${k}</button>`).join('')}</div>` : `<span class="seg-static">${set.rounds}</span>`}
          </div>
          ${host ? `<div class="lobby-actions"><button class="btn primary pill" data-act="random">${icon('shuffle')}Jogo surpresa</button><button class="btn pill" data-act="openVote" ${s.vote ? 'disabled' : ''}>${icon('vote')}Galera vota</button></div>` : ''}
          ${catChips}<div class="game-grid is-12">${cards}</div>
          ${host ? `<div class="lobby-foot"><p class="hint">${scored ? 'O placar soma todos os jogos desta partida.' : 'Os pontos de cada jogo vão para um placar geral.'}</p>
            <button class="btn xs" data-act="endMatch" ${scored ? '' : 'disabled'}>Encerrar partida e ver pódio</button></div>` : ''}
        </section>
      </div>
    </div>
  </section>`;
}

// Link limpo da sala: sem parâmetros de teste (como ?rede=), só a página e o código.
const roomLink = () => location.origin + location.pathname + '#' + Store.room.pin;

function netStatusHTML() {
  const st = Transport.status;
  const text = st === 'online'
    ? (isHost() ? 'Online. Mande o convite e deixe esta tela aberta: a sala roda neste aparelho.' : 'Online. Você está conectado à sala.')
    : st === 'connecting' ? 'Conectando à internet…'

  const fileNote = location.protocol === 'file:' && st === 'online'
    ? '<p class="hint">O arquivo está aberto direto do disco, então o link só funciona neste computador. Nos outros aparelhos, abra o PlayBox e digite o código.</p>' : '';

}

function viewGame(s) {
  const g = s.game, mod = Games[g.id], me = Store.me.id, host = isHost();
  if (g.phase === 'final') return viewGameFinal(s);
  const ph = mod.phases[g.phase], watcher = isWatcher(), role = myRole(), mode = modeOf(s);
  const firstStep = g.round === 1 && (g.phase === mod.first || ph.betting);
  const reveal = g.phase === 'reveal';
  const showTimer = !!g.deadline && !ph.hideTimer;
  const left = showTimer ? Math.max(0, g.deadline - now()) : 0;
  const timerAttrs = showTimer ? `data-deadline="${g.deadline}" data-dur="${g.dur}" style="--p:${g.dur ? left / (g.dur * 1000) : 0}"` : '';
  const rush = s.settings.rush;
  let body = ph.betting ? betView(g, s, me) : mod.view(g, s, me);
  // Plateia e telão não "entram na próxima rodada": estão assistindo.
  if (watcher) body = body.replace(/Você (entra|joga) na próxima rodada\.?/g, 'Você está assistindo.');
  let teamPill = '';

  return `<section class="screen game ${rush ? 'is-rush' : ''}" style="${gameVars(mod)}">
    <div class="game-top ${showTimer ? 'timer' : ''} ${showTimer && left < 5000 ? 'low' : ''}" ${timerAttrs}>
      ${role === 'tv' ? '<span></span>' : `<button class="icon-btn" data-act="${host ? 'toLobby' : 'leave'}" aria-label="${host ? 'Voltar ao lobby' : 'Sair da partida'}">${icon('back')}</button>`}
      <span class="gt-round">Rodada ${g.round}/${g.total}${rush ? `<span class="rush-pill">${icon('bolt')}Rush</span>` : ''}${teamPill}</span>
      <span class="gt-time">${showTimer ? `${icon('clock')}<span class="timer-num">${Math.ceil(left / 1000)}s</span>` : ph.hideTimer ? `${icon('clock')}<span>???</span>` : ''}</span>
      <div class="timer-track" role="progressbar" aria-label="Tempo restante"><div class="timer-fill"></div></div>
    </div>
    ${watcher && role !== 'tv' ? `<p class="watch-pill">${icon('eye')}${host ? 'Você está só apresentando' : 'Você está na plateia'}</p>` : ''}
    <div class="stage">
      <header class="stage-head"><span class="sh-icon">${gameIcon(mod)}</span>
        <div><h1 class="sh-name">${mod.name}</h1><p class="sh-sub">${ph.label}</p></div></header>
      ${firstStep && g.surprise ? `<p class="surprise-pill">${icon('shuffle')}Jogo surpresa!</p>` : ''}
      ${firstStep && g.voted ? `<p class="surprise-pill">${icon('vote')}A galera escolheu!</p>` : ''}
      ${firstStep ? `<p class="sh-how">${esc(mod.how)}</p>` : ''}
      <div class="stage-body">${body}</div>
      ${modeRevealHTML(s, g)}
      ${watcher && role === 'spectator' && reveal ? applauseHTML(s, g, me) : ''}
      ${stripHTML(s, g, mod)}
      ${g.paused ? `<div class="pause-veil" role="status"><span class="pv-ic">${icon('pause')}</span><b>Jogo pausado</b>
        <span>${host ? 'Toque em Continuar quando a galera estiver pronta.' : 'O host pausou o jogo. Já, já continua.'}</span></div>` : ''}
    </div>
    ${host ? `<div class="hostbar"><span class="hb-label">Controles do host</span>
      <button class="btn sm pill" data-act="${g.paused ? 'resume' : 'pause'}">${icon(g.paused ? 'play' : 'pause')}${g.paused ? 'Continuar' : 'Pausar'}</button>
      ${showTimer && !reveal ? `<button class="btn sm pill" data-act="addTime" ${g.paused ? 'disabled' : ''} title="Dar mais 15 segundos nesta etapa">${icon('plus')}15s</button>` : ''}

  </section>`;
}

function stripHTML(s, g, mod) {
  const ph = mod.phases[g.phase] || {}, team = modeOf(s) === 'equipes' ? s.teams || {} : null;
  const ids = [...g.roster, ...s.order.filter(id => !g.roster.includes(id) && plays(s, id))].filter(id => s.players[id]);
  return `<ul class="strip" aria-label="Jogadores">${ids.map(id => {
    const p = s.players[id], inR = inRoster(g, id), delta = g.phase === 'reveal' ? g.roundDelta[id] || 0 : 0;
    const done = inR && (ph.betting ? id in (g.bets || {}) : mod.done(g, id));
    const stat = delta ? `<span class="sp-stat delta ${delta < 0 ? 'neg' : ''}">${delta > 0 ? '+' : ''}${delta}</span>`

      : `<span class="sp-stat ${inR ? 'is-wait' : 'is-out'}" title="${inR ? 'Ainda pensando' : 'Entra na próxima rodada'}"></span>`;

}

function rankRows(items) {
  // items: [{ p, main, sub, value }] já ordenados; a barra é proporcional ao maior value.
  const max = Math.max(1, ...items.map(x => x.value));
  return items.map((x, i) => `<li class="rk-row"><span class="rk-pos">${i === 0 && x.value > 0 ? icon('crown') : i + 1}</span>${avatar(x.p, 'sm')}
    <div class="rk-mid"><span class="rk-name">${esc(x.p.name)}</span><span class="rk-bar"><i style="--w:${Math.max(2, x.value / max * 100)}%;--c:${x.p.color}"></i></span></div>
    <span class="rk-score">${x.main}${x.sub ? `<small>${x.sub}</small>` : ''}</span></li>`).join('');
}

function viewPodium(s) {
  const mode = modeOf(s), terr = mode === 'territorio';
  const val = p => terr ? terrCount(s, p.id) : p.score;
  const unit = n => terr ? plural(n, 'território', 'territórios') : plural(n, 'ponto', 'pontos');
  const ranked = s.order.filter(id => plays(s, id)).map(id => s.players[id]).sort((a, b) => val(b) - val(a) || b.score - a.score);
  const best = ranked[0] ? val(ranked[0]) : 0;
  const winners = ranked.filter(p => val(p) === best);
  let title = 'Fim de jogo!';
  let sub = !ranked.length ? '' : winners.length > 1 ? `Empate no topo entre ${winners.map(p => esc(p.name)).join(' e ')}.` : `${esc(winners[0].name)} venceu com ${unit(best)}.`;
  let extra = '';
  if (mode === 'equipes') {
    const sc = teamScores(s), w = sc.a === sc.b ? null : sc.a > sc.b ? 'a' : 'b', mx = Math.max(1, sc.a, sc.b);

    extra = `<div class="team-result">${['a', 'b'].map(k => `<div class="tr-row" style="--t:${TEAMS[k].color}"><b>${TEAMS[k].name}</b><span class="tr-bar"><i style="--w:${sc[k] / mx * 100}%"></i></span><span>${sc[k]}</span></div>`).join('')}</div>`;
  }

  const step = (p, place, d) => p ? `<div class="pod pod-${place}" style="--d:${d}s">
      <div class="pod-who">${place === 1 ? `<span class="pod-crown">${icon('crown')}</span>` : ''}${avatar(p, 'xl')}<b>${esc(p.name)}</b><span class="pod-pts">${terr ? unit(val(p)) : p.score + ' pts'}</span></div>
      <div class="pod-step">${place}</div></div>` : '<div class="pod"></div>';
  const rows = rankRows(ranked.map(p => ({ p, value: val(p), main: val(p), sub: terr ? `${p.score} pts` : '' })));
  const conf = Array.from({ length: 34 }, () => `<i style="--x:${rand(0, 100).toFixed(1)}%;--c:${pick(['#FBBF24','#EC4899','#14B8A6','#3B82F6','#A3E635','#FF5F57','#6366F1'])};--d:${rand(1.6, 3.4).toFixed(2)}s;--t:${rand(3, 5).toFixed(2)}s;--dx:${rand(-70, 70).toFixed(0)}px;--r:${rand(240, 900).toFixed(0)}deg"></i>`).join('');
  return `<section class="screen podium-screen">
    <div class="pod-layout">
      <div>
        <div class="pod-head"><span class="crown-big">${icon('crown')}</span><h1 class="podium-title">${title}</h1><p class="lede">${sub} Confira o pódio e o ranking geral.</p></div>
        ${extra}
        <div class="podium">${step(ranked[1], 2, .35)}${step(ranked[0], 1, .7)}${step(ranked[2], 3, 0)}</div>
      </div>
      <section class="panel ranking" aria-labelledby="rkTitle"><h2 class="panel-title" id="rkTitle">${terr ? 'Territórios' : 'Ranking geral'}</h2><ol class="rk-list">${rows}</ol></section>
    </div>
    ${terr ? `<section class="panel terr-final">${terrSVG(s)}</section>` : ''}
    ${highlightsHTML(s)}
    <div class="row center pod-actions">${isHost() ? '<button class="btn primary pill" data-act="newMatch">Nova partida com a mesma sala</button>' : ''}${myRole() === 'tv' ? '' : '<button class="btn pill" data-act="leave">Sair da sala</button>'}</div>
    <div class="confetti" aria-hidden="true">${conf}</div>
  </section>`;
}

/* ---------- Chat ao vivo e reações flutuantes ---------- */
const Chat = { open: false, seen: 0, lastN: null, built: false };
const chatItem = (s, m) => m.sys
  ? `<li class="chat-sys">${esc(m.text)}</li>`
  : `<li class="chat-msg ${m.pid === Store.me.id ? 'me' : ''}">${avatar(s.players[m.pid] || { color: '#6B7280', avatar: '👤' }, 'sm')}
      <div class="chat-bubble"><b>${esc(m.name)}</b><p class="${m.hid ? 'hid' : ''}">${m.hid ? '🤐 Mensagem escondida: parecia a resposta da rodada.' : esc(m.text)}</p></div></li>`;
function renderChat() {
  const root = $('#chatRoot'), s = Store.room;
  document.body.classList.toggle('in-room', !!(s && Store.me));
  if (!s || !Store.me) {
    if (Chat.built) root.innerHTML = '';
    Object.assign(Chat, { open: false, seen: 0, lastN: null, built: false });
    return;
  }
  if (myRole() === 'tv') {
    const last = (s.chat || []).filter(m => !m.hid).slice(-4);
    root.innerHTML = `<div class="tv-ticker" aria-live="polite">${last.map(m => m.sys ? `<p class="sys">${esc(m.text)}</p>` : `<p><b>${esc(m.name)}</b>${esc(m.text)}</p>`).join('')}</div>`;
    Chat.built = false;
    return;
  }
  if (!Chat.built) {
    const reacts = REACTS.map(e => `<button type="button" data-act="react" data-v="${e}" aria-label="Reagir com ${e}">${e}</button>`).join('');
    root.innerHTML = `
      <div class="react-wrap"><div class="react-tray" id="reactTray" hidden>${reacts}</div>
        <button class="fab fab-react" data-act="reactTray" aria-label="Reações" aria-expanded="false">${icon('smile')}</button></div>
      <button class="fab fab-chat" data-act="chat" aria-label="Abrir o chat" aria-expanded="false">${icon('chat')}<span class="fab-badge" id="chatBadge" hidden></span></button>
      <section class="chat-panel" id="chatPanel" hidden aria-label="Chat da sala">
        <header class="chat-head"><b>Chat da sala</b><button class="icon-btn" data-act="chat" aria-label="Fechar o chat">${icon('close')}</button></header>
        <ul class="chat-list" id="chatList"></ul>
        <div class="chat-reacts">${reacts}</div>
        <form class="chat-form" data-form="chat" novalidate><label class="sr-only" for="chatIn">Mensagem</label>
          <input class="input" id="chatIn" maxlength="140" autocomplete="off" placeholder="Mande uma mensagem…">
          <button class="btn primary chat-send" aria-label="Enviar mensagem">${icon('send')}</button></form>
      </section>`;
    Chat.built = true;
  }
  const msgs = s.chat || [], maxN = msgs.length ? msgs[msgs.length - 1].n : 0, me = Store.me.id;
  if (Chat.lastN === null) Chat.lastN = Chat.seen = maxN;   // ao entrar, o histórico não conta como novo
  if (maxN > Chat.lastN) {
    if (msgs.some(m => m.n > Chat.lastN && !m.sys && m.pid !== me)) Sound.play('pop');
    Chat.lastN = maxN;
  }
  if (Chat.open) Chat.seen = maxN;
  const list = $('#chatList');
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
  list.innerHTML = msgs.map(m => chatItem(s, m)).join('') || '<li class="chat-sys">Ninguém falou nada ainda. Puxa o assunto!</li>';
  if (nearBottom || Chat.open) list.scrollTop = list.scrollHeight;
  const unread = msgs.filter(m => m.n > Chat.seen && !m.sys && m.pid !== me).length, badge = $('#chatBadge');
  badge.hidden = !unread;
  badge.textContent = unread > 9 ? '9+' : unread;
}
function spawnFx(e, p) {
  const layer = $('#fxLayer');

  layer.appendChild(el);

// Títulos dos destaques do pódio: quem mais pontuou em cada jogo.
const TITLES = { mane: 'Rei do chute', provavel: 'Termômetro da galera', impostor: 'Mestre do blefe', geo: 'Viajante do mundo', stop: 'Dicionário ambulante', fato: 'Caçador de fakes', desenho: 'Picasso da noite', termo: 'Gênio das palavras', reflexo: 'Mão mais rápida', emoji: 'Decifrador de emojis', mente: 'Mente sintonizada', bomba: 'Sangue frio' };
function highlightsHTML(s) {
  const byGame = s.match.byGame || {};
  const items = GAME_ORDER.filter(id => byGame[id]).map(id => {
    const entries = Object.entries(byGame[id]).filter(([pid]) => s.players[pid]);
    const pts = Math.max(0, ...entries.map(e => e[1]));
    const tops = entries.filter(e => e[1] === pts).map(e => e[0]);   // empates dividem o título
    if (!pts || !tops.length) return '';
    const m = Games[id];
    return `<li style="${gameVars(m)}"><span class="hl-ic">${gameIcon(m)}</span><span class="hl-txt"><b>${TITLES[id]}</b><small>${m.name}</small></span>
      <span class="hl-avs">${tops.map(pid => avatar(s.players[pid], 'sm')).join('')}</span><span class="hl-who">${tops.map(pid => esc(s.players[pid].name)).join(' e ')}<small>+${pts}</small></span></li>`;
  }).join('');
  return items ? `<section class="panel highlights" aria-labelledby="hlTitle"><h2 class="panel-title" id="hlTitle">Destaques da partida</h2><ul class="hl-list">${items}</ul></section>` : '';

/* ---------- Efeitos sonoros (sintetizados com Web Audio, sem arquivos) ---------- */
const Sound = {
  ctx: null,
  master: .9,
  on: (() => { try { return localStorage.getItem('playbox:sound') !== 'off'; } catch { return true; } })(),
  // O navegador só libera áudio depois de um toque ou tecla do usuário.
  unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ctx) { try { this.ctx = new AC(); } catch { return; } }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  toggle() {
    this.on = !this.on;
    try { localStorage.setItem('playbox:sound', this.on ? 'on' : 'off'); } catch {}
    if (this.on) { this.unlock(); setTimeout(() => this.play('correct'), 60); }
  },
  tone(freq, dur, o = {}) {
    const c = this.ctx, t = c.currentTime + (o.at || 0), osc = c.createOscillator(), gain = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    gain.gain.setValueAtTime(.0001, t);
    gain.gain.exponentialRampToValueAtTime((o.vol ?? .15) * this.master, t + .008);
    gain.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t); osc.stop(t + dur + .03);
  },
  noise(dur, o = {}) {
    const c = this.ctx, t = c.currentTime + (o.at || 0), n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = c.createBufferSource(), filter = c.createBiquadFilter(), gain = c.createGain();
    src.buffer = buf;
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(o.from || 2400, t);
    filter.frequency.exponentialRampToValueAtTime(o.to || 120, t + dur);
    gain.gain.value = (o.vol ?? .3) * this.master;
    src.connect(filter).connect(gain).connect(c.destination);
    src.start(t);
  },
  play(name) {
    if (!this.on || !this.ctx || this.ctx.state !== 'running' || !SFX[name]) return;
    try { SFX[name](this); } catch {}
  },
};
const SFX = {
  click: S => S.tone(720, .045, { type: 'triangle', vol: .06 }),
  key: S => S.tone(540, .03, { type: 'triangle', vol: .05 }),
  tick: S => S.tone(980, .04, { type: 'square', vol: .035 }),
  tickHi: S => S.tone(1320, .06, { type: 'square', vol: .06 }),
  phase: S => { S.tone(523, .08, { type: 'triangle', vol: .1 }); S.tone(784, .12, { type: 'triangle', vol: .1, at: .07 }); },
  start: S => [523, 659, 784, 1046].forEach((f, i) => S.tone(f, .14, { type: 'triangle', vol: .13, at: i * .08 })),
  correct: S => { S.tone(880, .09, { vol: .16 }); S.tone(1318, .2, { vol: .16, at: .08 }); },
  wrong: S => S.tone(196, .24, { type: 'sawtooth', vol: .07, slide: 110 }),
  reveal: S => [392, 523, 659, 784].forEach((f, i) => S.tone(f, .16, { type: 'triangle', vol: .12, at: i * .07 })),
  points: S => [988, 1318, 1760].forEach((f, i) => S.tone(f, .09, { type: 'square', vol: .05, at: i * .06 })),
  join: S => { S.tone(587, .1, { vol: .12 }); S.tone(880, .16, { vol: .12, at: .09 }); },
  go: S => { S.tone(1046, .12, { type: 'square', vol: .1 }); S.tone(1568, .2, { type: 'square', vol: .1, at: .1 }); },
  stop: S => { S.tone(330, .12, { type: 'square', vol: .11 }); S.tone(220, .26, { type: 'square', vol: .11, at: .11 }); },
  alarm: S => [0, .13, .26].forEach(at => S.tone(1250, .09, { type: 'square', vol: .07, at })),
  boom: S => { S.noise(1.1, { vol: .55, from: 1800, to: 80 }); S.tone(110, .7, { vol: .4, slide: 35 }); },
  pause: S => { S.tone(660, .1, { type: 'triangle', vol: .1 }); S.tone(440, .16, { type: 'triangle', vol: .1, at: .09 }); },
  resume: S => { S.tone(440, .1, { type: 'triangle', vol: .1 }); S.tone(660, .16, { type: 'triangle', vol: .1, at: .09 }); },
  pop: S => { S.tone(784, .05, { vol: .08 }); S.tone(1175, .08, { vol: .07, at: .045 }); },

// Sons que respondem ao que mudou na sala (vale para host e jogadores).
let soundPrev = null;
function soundCues(s) {
  const me = Store.me?.id, g = s?.game;
  const cur = s && me ? {
    screen: s.screen, gid: g?.id, round: g?.round, phase: g?.phase, paused: !!g?.paused,
    players: s.order.length, score: s.players[me]?.score ?? 0, vote: !!s.vote,
    holder: g?.id === 'bomba' ? g.data.holder : null,
    right: !!g && ((g.id === 'desenho' && me in (g.data.guessed || {})) || ((g.id === 'emoji' || g.id === 'termo') && me in (g.data.solved || {}))),
  } : null;
  const p = soundPrev;
  soundPrev = cur;
  if (!p || !cur) return;
  if (cur.screen !== p.screen) { Sound.play(cur.screen === 'game' ? 'start' : cur.screen === 'podium' ? 'fanfare' : 'phase'); return; }
  if (cur.screen === 'lobby' && cur.players > p.players) Sound.play('join');
  if (cur.screen === 'lobby' && cur.vote && !p.vote) Sound.play('phase');
  if (cur.screen !== 'game') return;
  if (cur.gid !== p.gid) { Sound.play('start'); return; }
  if (cur.paused !== p.paused) { Sound.play(cur.paused ? 'pause' : 'resume'); return; }
  if (cur.phase !== p.phase || cur.round !== p.round) {
    if (cur.phase === 'final') Sound.play('fanfare');
    else if (cur.gid === 'bomba' && cur.phase === 'reveal') Sound.play('boom');
    else if (cur.phase === 'reveal') Sound.play('reveal');
    else if (cur.gid === 'reflexo' && cur.phase === 'go') Sound.play('go');
    else if (cur.gid === 'stop' && cur.phase === 'stopped') Sound.play('stop');
    else Sound.play('phase');
  }
  if (cur.score > p.score) setTimeout(() => Sound.play('points'), 500);
  if (cur.holder === me && p.holder !== me) Sound.play('alarm');
  if (cur.right && !p.right) Sound.play('correct');
}
let lastTickKey = '';

/* ---------- Animação do timer e do multiplicador ---------- */
function frame() {
  const gNow = Store.room?.game?.paused ? Store.room.game.paused.at : now();
  $$('.timer').forEach(el => {
    const dl = +el.dataset.deadline, dur = +el.dataset.dur, left = Math.max(0, dl - gNow);
    const secN = Math.ceil(left / 1000);
    if (secN > 0 && secN <= 5 && lastTickKey !== dl + ':' + secN) { lastTickKey = dl + ':' + secN; Sound.play(secN <= 3 ? 'tickHi' : 'tick'); }
    el.style.setProperty('--p', dur ? left / (dur * 1000) : 0);
    const num = el.querySelector('.timer-num'), sec = String(Math.ceil(left / 1000));
    if (num.textContent !== sec + 's') num.textContent = sec + 's';
    el.classList.toggle('low', left < 5000);
  });
  $$('[data-mult-start]').forEach(el => {
    if (el.dataset.frozen) return;
    const m = fatoMult(now() - +el.dataset.multStart, +el.dataset.multDur);
    el.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('now', +x.dataset.m === m));
  });
  $$('[data-countdown]').forEach(el => { const v = String(Math.max(0, Math.ceil((+el.dataset.countdown - now()) / 1000))); if (el.textContent !== v) el.textContent = v; });
  $$('[data-show-at]').forEach(el => { const show = now() >= +el.dataset.showAt; if (el.hidden === show) el.hidden = !show; });
  requestAnimationFrame(frame);
}

}

// Quando a conexão com um servidor (re)abre, a sala se ressincroniza: o host reenvia o estado
// e o jogador pede o estado atual (ele pode ter perdido mensagens enquanto estava fora).
Transport.onLinkUp = role => {
  if (!Store.me || joinWait) return;
  if (role === 'host' && Store.room) Transport.send({ kind: 'state', state: Store.room });
  else if (role === 'client') Transport.send({ kind: 'hello' });
};
// Mantém a tela acesa durante a partida: no celular, tela apagada derruba a conexão.
const Wake = {
  lock: null,
  async on() {
    if (!('wakeLock' in navigator) || this.lock || document.visibilityState !== 'visible' || !Store.me) return;
    try { this.lock = await navigator.wakeLock.request('screen'); this.lock.addEventListener('release', () => { this.lock = null; }); } catch {}
  },
  off() { try { this.lock && this.lock.release(); } catch {} this.lock = null; },
};
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !Store.me) return;
  Wake.on();
  Transport.wake();
  if (isHost()) { if (Store.room) Transport.send({ kind: 'state', state: Store.room }); }
  else if (!joinWait) Transport.send({ kind: 'hello' });
});

async function boot() {
  Object.values(Games).forEach(addBetPhase);
  Store.local.profile = loadProfile();
  const hashPin = location.hash.slice(1).toUpperCase();
  if (/^[A-Z0-9]{4}$/.test(hashPin)) { Store.local.pinDraft = hashPin; Store.local.invite = true; Store.local.homeTab = 'join'; }
  requestAnimationFrame(frame);
  let sess = Session.load();
  // Um link de convite para outra sala vale mais que a sala antiga guardada nesta aba.
  if (sess && /^[A-Z0-9]{4}$/.test(hashPin) && sess.pin !== hashPin) { Session.clear(); sess = null; }
  if (sess?.isHost) {
    const saved = loadRoom(sess.pin);
    if (saved && saved.hostId === sess.id) {
      Store.me = sess; Store.room = saved;
      Object.values(saved.players).forEach(p => { p.lastSeen = now(); });
      Transport.open(sess.pin, onMessage, 'host');
      startHost();
      commit();
      Wake.on();
      return;
    }
    Session.clear();
  } else if (sess?.pin) {
    render();
    const res = await joinRoom(sess.pin, sess.profile, sess.id);
    if (!res.ok) { Session.clear(); render(); toast('A sala anterior não está mais aberta.'); }
    return;
  }
  render();
}
boot();
</script>
</body>
</html>
