        <input class="input" data-keep="stop-${g.round}-${k}" data-stop="${k}" ${k === 0 ? 'data-autofocus' : ''} autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="24" placeholder="Palavra…" ${locked ? 'disabled' : ''}>
        <span class="sf-cat" aria-hidden="true">${STOP_CATS[ci]}</span><span class="sf-ok" aria-hidden="true">${icon('check')}</span></label>`).join('');
      return `<div class="stop-letter" role="img" aria-label="Letra ${d.L}">${d.L}</div>
        <p class="hint center">Digite 3 palavras que começam com <b>${d.L}</b>, uma para cada categoria. O botão STOP libera quando as três estiverem certas.</p>
        <div class="stop-fields" data-letter="${d.L}">${fields}</div>
        ${g.phase === 'fill'
          ? (can ? `<button class="btn stop-btn" data-act="stop" id="stopBtn" disabled>STOP</button>` : '<p class="hint center">Você entra na próxima rodada.</p>')
          : `<p class="stop-banner">${d.stoppedBy ? `Stop! de ${esc(nameOf(s, d.stoppedBy))}` : 'Tempo esgotado!'}</p>`}`;
    }
    if (g.phase === 'validate') {
      const blocks = d.cats.map((ci, k) => {
        const rows = g.roster.filter(id => s.players[id]).map(pid => {
          const v = (d.answers[pid] || [])[k] || '', rej = d.rejects[pid + ':' + k] || [], mine = rej.includes(me), self = pid === me;
          const auto = !v ? 'Em branco' : !startsWith(v, d.L) ? `Não começa com ${d.L}` : null;
          const ctrl = auto ? `<span>${auto}</span>` : self ? '<span>Sua resposta</span>'
            : can ? `<button class="vbtn" data-act="reject" data-target="${pid}" data-cat="${k}" aria-pressed="${mine}">${mine ? 'Você anulou' : 'Anular'}</button>` : '';
          return `<li class="vrow ${auto ? 'bad' : ''}">${avatar(s.players[pid], 'sm')}<span class="vans">${v ? esc(v) : '—'}</span><span class="vname">${esc(nameOf(s, pid))}</span>
            <span class="vside">${ctrl}${rej.length ? `<span>${plural(rej.length, 'voto contra', 'votos contra')}</span>` : ''}</span></li>`;
        }).join('');
        return `<section class="vblock"><h3>${STOP_CATS[ci]}</h3><ul>${rows}</ul></section>`;
      }).join('');
      return `<p class="hint">Letra <b>${d.L}</b>. Marque as respostas que não valem; a maioria da mesa decide.</p><div class="vgrid">${blocks}</div>
        ${!can ? '' : d.ready[me] ? '<p class="hint center">Validação enviada. Esperando o resto da mesa.</p>' : '<button class="btn game big" data-act="ready">Terminei de validar</button>'}`;
    }
    const res = d.result || {};
    const blocks = d.cats.map((ci, k) => `<section class="vblock"><h3>${STOP_CATS[ci]}</h3><ul>${g.roster.filter(id => s.players[id]).map(pid => {
      const r = res[pid + ':' + k] || { v: '', ok: false, why: 'Em branco' };
      return `<li class="vrow ${r.ok ? '' : 'bad'}">${avatar(s.players[pid], 'sm')}<span class="vans">${r.v ? esc(r.v) : '—'}</span><span class="vname">${esc(nameOf(s, pid))}</span>
        <span class="vside">${r.ok ? `<span class="pts">+${r.pts}</span>` : `<span>${esc(r.why)}</span>`}</span></li>`;
    }).join('')}</ul></section>`).join('');
    return `<p class="verdict">${d.stoppedBy ? `Stop de ${esc(nameOf(s, d.stoppedBy))}` : 'Rodada encerrada'}</p><div class="vgrid">${blocks}</div>`;
  },
};

/* ---------- 6. Fato ou Fake ---------- */
const fatoMult = (t, dur) => { const f = t / (dur * 1000); return f < 1 / 3 ? 3 : f < 2 / 3 ? 2 : 1; };
Games.fato = {
  id: 'fato', name: 'Fato ou Fake', tag: 'Trivia expressa', icon: 'bolt', color: '#3B82F6', lip: '#1D4ED8', min: 1,
  how: 'Uma afirmação bizarra por rodada. Acertar vale 1 ponto multiplicado pela velocidade: x3 no começo, x2 no meio, x1 no fim.',
  first: 'answer',
  init(g) { g.data = { qi: drawItem(g, FATO_Q), answers: {}, result: null }; },
  phases: {
    answer: { label: 'Fato ou fake?', dur: 12, bot: [1.2, 9], next: 'reveal', allIn: (g, s) => active(g, s).every(id => id in g.data.answers) },
    reveal: { label: 'Resposta', dur: 12, enter(g, s) {
      const q = FATO_Q[g.data.qi], d = {};
      Object.entries(g.data.answers).forEach(([pid, a]) => { if (a.v === q.a) add(d, pid, fatoMult(a.t, Games.fato.phases.answer.dur)); });
      updateScores(s, d);
    } },
  },
  handle(g, s, pid, a) {
    if (!inRoster(g, pid) || g.phase !== 'answer' || a.type !== 'submit' || pid in g.data.answers) return false;
    g.data.answers[pid] = { v: !!a.value, t: now() - g.phaseStart }; return true;
  },
  done(g, pid) { return g.phase === 'answer' && pid in g.data.answers; },
  bot(g) { const q = FATO_Q[g.data.qi]; return { type: 'submit', value: Math.random() < .7 ? q.a : !q.a }; },
  view(g, s, me) {
    const q = FATO_Q[g.data.qi], mine = g.data.answers[me], can = inRoster(g, me);
    const P = `<blockquote class="ff-quote">“${esc(q.t)}”</blockquote>`;
    if (g.phase === 'answer') {
      const sel = v => mine && mine.v === v ? 'on' : '';
      const locked = mine ? fatoMult(mine.t, g.dur) : 0;
      return P + `<div class="ff-buttons"><button class="ff ff-true ${sel(true)}" data-act="fato" data-v="1" ${mine || !can ? 'disabled' : ''}>Verdadeiro</button>
        <button class="ff ff-false ${sel(false)}" data-act="fato" data-v="0" ${mine || !can ? 'disabled' : ''}>Falso</button></div>
        <div class="mult-wrap"><span class="hint">${mine ? 'Você garantiu' : 'Responda rápido: vale agora'}</span>
          <div class="mult-row" data-mult-start="${g.phaseStart}" data-mult-dur="${g.dur}" ${mine ? 'data-frozen="1"' : ''}>${[3, 2, 1].map(m => `<span data-m="${m}" class="${m === locked ? 'now' : ''}">x${m}</span>`).join('')}</div></div>
        ${mine ? `<p class="hint center">Você respondeu <b>${mine.v ? 'Verdadeiro' : 'Falso'}</b> em ${(mine.t / 1000).toFixed(1).replace('.', ',')} s.</p>` : ''}`;
    }
    const rows = Object.entries(g.data.answers).sort((a, b) => a[1].t - b[1].t).map(([pid, a]) => `<li class="res-row">${avatar(s.players[pid], 'sm')}
      <span class="res-who"><span class="res-name">${esc(nameOf(s, pid))}</span>${a.v === q.a ? '<span class="tag tag-good">Acertou</span>' : '<span class="tag tag-bad">Errou</span>'}</span>
      <span class="res-val">${a.v ? 'Verdadeiro' : 'Falso'}<span class="res-sub">${(a.t / 1000).toFixed(1).replace('.', ',')} s</span></span>${deltaBadge(g.roundDelta[pid])}</li>`).join('');
    return P + `<p class="verdict" style="color:${q.a ? 'var(--ok)' : 'var(--coral)'}">${q.a ? 'Verdadeiro!' : 'Falso!'}</p><p class="lede">${esc(q.x)}</p>
      <ul class="res-list">${rows || '<li class="res-row">Ninguém respondeu a tempo.</li>'}</ul>`;

};

/* =====================================================================
   Mini-jogos, segunda caixa
   Ganchos opcionais de um módulo (além de init/phases/handle/bot/done/view):
     tick(g, s)      -> host: ações com tempo próprio (bots que jogam várias vezes)
     mount(g, s, me) -> cliente: depois de desenhar a tela (eventos de ponteiro, foco)
     patch(g, s, me) -> cliente: atualiza só partes da tela quando a fase não mudou
     keydown(e, ...) -> cliente: teclado físico; devolve true se tratou a tecla
     ui / forms      -> handlers de data-act="g:nome" e data-form="g:nome"
     phases[x].hideTimer -> esconde o cronômetro (o tempo é segredo)
   ===================================================================== */

/* ---------- 7. Desenha Aí ---------- */
const DRAW_WORDS = ['casa','sol','gato','cachorro','árvore','carro','bicicleta','peixe','pizza','banana','guarda-chuva','avião','foguete','castelo','coração','estrela','lua','flor','bola','óculos','chapéu','sorvete','bolo','violão','televisão','relógio','cadeira','montanha','praia','cobra','tartaruga','girafa','elefante','robô','fantasma','dragão','pirata','sereia','palhaço','astronauta','chave','escada','ponte','barco','trem','nuvem','arco-íris','abacaxi','pinguim','vulcão'];
const DRAW_COLORS = ['#FFFFFF','#111827','#EF4444','#F97316','#FBBF24','#22C55E','#3B82F6','#8B5CF6','#EC4899','#92400E'];
const DRAW_SIZES = [5, 11, 22];
const drawKey = w => norm(w).replace(/[^a-z0-9]/g, '');
const DW = { cur: null, sent: 0, timer: null };

function dwPaintStroke(ctx, st) {
  const p = st.p;
  if (!p || p.length < 2) return;
  ctx.strokeStyle = ctx.fillStyle = DRAW_COLORS[st.c] || '#111827';
  ctx.lineWidth = DRAW_SIZES[st.w] || 11;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (p.length === 2) { ctx.beginPath(); ctx.arc(p[0], p[1], ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); return; }
  ctx.beginPath(); ctx.moveTo(p[0], p[1]);
  for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
  ctx.stroke();
}
function dwPaint(g) {
  const cv = $('#dwBoard');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cv.width, cv.height);
  g.data.strokes.forEach(st => { if (!DW.cur || st.id !== DW.cur.id) dwPaintStroke(ctx, st); });
  if (DW.cur) dwPaintStroke(ctx, DW.cur);
}
// Envia os pontos novos do traço atual em lotes (a cada 200 ms), não a cada movimento.
function dwFlush(final) {
  const c = DW.cur;
  if (!c) return;
  if (c.p.length > DW.sent) {
    const chunk = c.p.slice(DW.sent);
    DW.sent = c.p.length;
    dispatch({ type: 'stroke', id: c.id, c: c.c, w: c.w, p: chunk });
  }
  if (final) { clearInterval(DW.timer); DW.timer = null; DW.cur = null; DW.sent = 0; }
}
function dwAddStroke(d, a) {
  const pts = Array.isArray(a.p) ? a.p.slice(0, 400).map((n, i) => clamp(Math.round(+n) || 0, 0, i % 2 ? 750 : 1000)) : [];
  if (pts.length < 2 || pts.length % 2) return false;
  let st = d.strokes.find(x => x.id === a.id);
  if (!st) {
    if (d.strokes.length >= 400) return false;
    st = { id: String(a.id).slice(0, 12), c: clamp(a.c | 0, 0, DRAW_COLORS.length - 1), w: clamp(a.w | 0, 0, DRAW_SIZES.length - 1), p: [] };
    d.strokes.push(st);
  }
  if (st.p.length < 3000) st.p.push(...pts.slice(0, 3000 - st.p.length));
  return true;
}
const dwMask = w => {
  const n = w.replace(/[^a-zà-úç]/gi, '').length;
  return `<div class="dw-hint" aria-label="Palavra com ${n} letras">${[...w].map(ch => /[a-zà-úç]/i.test(ch) ? '<i></i>' : `<span>${esc(ch)}</span>`).join('')}</div>
    <p class="hint center">${n} letras</p>`;
};
const dwFeedHTML = (d, s) => d.feed.slice(-12).reverse().map(f => f.ok
  ? `<li class="ok">${avatar(s.players[f.pid], 'sm')}<span><b>${esc(nameOf(s, f.pid))}</b> acertou!</span></li>`
  : `<li>${avatar(s.players[f.pid], 'sm')}<span><b>${esc(nameOf(s, f.pid))}</b> ${esc(f.text)}</span></li>`).join('')
  || '<li class="dw-empty">Os chutes aparecem aqui.</li>';

Games.desenho = {
  id: 'desenho', name: 'Desenha Aí', tag: 'Desenhe e adivinhe', icon: 'brush', color: '#8B5CF6', lip: '#6D28D9', min: 2,
  how: 'Um jogador desenha a palavra secreta e o resto tenta adivinhar digitando. Quem acerta primeiro ganha mais, e quem desenha ganha um ponto por acerto.',
  first: 'pick',
  init(g, s) {
    const humans = g.roster.filter(id => !s.players[id]?.isBot);
    const drawer = humans.length ? humans[(g.round - 1) % humans.length] : g.roster[0];
    const choices = [];
    while (choices.length < 3) choices.push(DRAW_WORDS[drawItem(g, DRAW_WORDS)]);
    g.data = { drawer, choices, word: null, strokes: [], guessed: {}, order: [], feed: [] };
  },
  phases: {
    pick: { label: 'Escolhendo a palavra', dur: 12, bot: [1, 3], next: 'draw', allIn: g => !!g.data.word },
    draw: { label: 'Desenhe e adivinhe', dur: 80, bot: [12, 55], next: 'reveal',
      enter(g) { if (!g.data.word) g.data.word = g.data.choices[0]; },
      allIn: (g, s) => active(g, s).filter(id => id !== g.data.drawer).every(id => id in g.data.guessed) },
    reveal: { label: 'Era…', dur: 12, enter(g, s) {
      const d = g.data, deltas = {};
      d.order.forEach((pid, k) => add(deltas, pid, Math.max(1, 3 - k)));
      if (d.order.length) add(deltas, d.drawer, Math.min(3, d.order.length));
      updateScores(s, deltas);
    } },
  },
  handle(g, s, pid, a) {
    const d = g.data;
    if (!inRoster(g, pid)) return false;
    if (g.phase === 'pick' && a.type === 'choose' && pid === d.drawer && d.choices.includes(a.word)) { d.word = a.word; return true; }
    if (g.phase !== 'draw') return false;
    if (pid === d.drawer) {
      if (a.type === 'stroke') return dwAddStroke(d, a);
      if (a.type === 'undo') { d.strokes.pop(); return true; }
      if (a.type === 'clear') { d.strokes = []; return true; }
      return false;
    }
    if (a.type !== 'guess' || pid in d.guessed) return false;
    const text = String(a.text || '').trim().slice(0, 30);
    if (!text) return false;
    if (drawKey(text) === drawKey(d.word)) { d.guessed[pid] = d.order.length; d.order.push(pid); d.feed.push({ pid, ok: true }); }
    else d.feed.push({ pid, text });
    if (d.feed.length > 40) d.feed.shift();
    return true;
  },
  done(g, pid) { return g.phase === 'pick' ? pid === g.data.drawer && !!g.data.word : g.phase === 'draw' ? pid in g.data.guessed : false; },
  bot(g, s, pid) {
    const d = g.data;
    if (g.phase === 'pick' && pid === d.drawer) return { type: 'choose', word: pick(d.choices) };
    if (g.phase === 'draw' && pid !== d.drawer) return { type: 'guess', text: Math.random() < .6 ? d.word : pick(DRAW_WORDS.filter(w => w !== d.word)) };
    return null;
  },
  view(g, s, me) {
    const d = g.data, drawer = d.drawer === me, can = inRoster(g, me);
    if (g.phase === 'pick') {
      if (!drawer) return waitCard(`${avatar(s.players[d.drawer], 'lg')}<br>${esc(nameOf(s, d.drawer))} vai desenhar`, 'Escolhendo a palavra');
      return `<h2 class="ask center">Escolha o que desenhar</h2>
        <div class="dw-choices">${d.choices.map(w => `<button class="dw-choice ${d.word === w ? 'on' : ''}" data-act="g:choose" data-v="${esc(w)}" ${d.word ? 'disabled' : ''}>${esc(w)}</button>`).join('')}</div>
        <p class="hint center">Ninguém mais vê essas opções.</p>`;
    }
    const board = `<div class="dw-board-wrap"><canvas id="dwBoard" class="dw-board ${drawer && g.phase === 'draw' ? 'can-draw' : ''}" width="1000" height="750" role="img" aria-label="Quadro de desenho"></canvas></div>`;
    if (g.phase === 'reveal') {
      const solvers = d.order.map((pid, k) => `<li>${avatar(s.players[pid], 'sm')}<b>${esc(nameOf(s, pid))}</b><span>${k + 1}º</span></li>`).join('');
      return `<p class="verdict center">Era ${esc(d.word)}</p>${board}
        ${solvers ? `<ul class="dw-solvers">${solvers}</ul>` : '<p class="hint center">Ninguém acertou dessa vez.</p>'}`;
    }
    const top = drawer ? `<p class="dw-word">Desenhe: <b>${esc(d.word)}</b></p>` : dwMask(d.word);
    const tool = Store.local.dw;
    const tools = drawer ? `<div class="dw-tools" role="toolbar" aria-label="Ferramentas de desenho">
        ${DRAW_COLORS.map((c, i) => `<button class="dw-sw ${tool.c === i ? 'on' : ''} ${i === 0 ? 'is-eraser' : ''}" style="--c:${c}" data-act="g:color" data-v="${i}" aria-label="${i === 0 ? 'Borracha' : 'Cor ' + i}">${i === 0 ? icon('eraser') : ''}</button>`).join('')}
        <span class="dw-sep"></span>
        ${DRAW_SIZES.map((sz, i) => `<button class="dw-size ${tool.w === i ? 'on' : ''}" data-act="g:size" data-v="${i}" aria-label="Espessura ${i + 1}"><i style="--d:${6 + i * 6}px"></i></button>`).join('')}
        <span class="dw-sep"></span>
        <button class="icon-btn" data-act="g:undo" aria-label="Desfazer">${icon('undo')}</button>
        <button class="icon-btn" data-act="g:clear" aria-label="Limpar quadro">${icon('trash')}</button></div>` : '';
    let guess = '';
    if (!drawer && can) guess = me in d.guessed
      ? `<p class="dw-got" id="dwGuessBox">${icon('check')} Você acertou! Agora é torcer pela galera.</p>`
      : `<form class="dw-guess" id="dwGuessBox" data-form="g:guess" novalidate><label class="sr-only" for="dwGuess">Seu chute</label>
          <input class="input" id="dwGuess" data-keep="dwguess-${g.round}" maxlength="30" autocomplete="off" spellcheck="false" placeholder="Seu chute…">
          <button class="btn game pill">Chutar</button></form>`;

  },
  // Na fase de desenho, só atualiza o quadro, os chutes e o seu status (o quadro não pisca).
  patch(g, s, me) {
    const d = g.data;
    if (g.phase !== 'draw') { $('.stage-body').innerHTML = this.view(g, s, me); this.mount(g, s, me); return; }
    const feed = $('#dwFeed');
    if (feed) feed.innerHTML = dwFeedHTML(d, s);
    const box = $('#dwGuessBox');
    if (box && box.tagName === 'FORM' && me in d.guessed) box.outerHTML = `<p class="dw-got" id="dwGuessBox">${icon('check')} Você acertou! Agora é torcer pela galera.</p>`;
    dwPaint(g);
  },
  mount(g, s, me) {
    const d = g.data, cv = $('#dwBoard');
    const drawing = g.phase === 'draw' && d.drawer === me;
    if (!drawing && DW.cur) { clearInterval(DW.timer); DW.timer = null; DW.cur = null; }
    if (!cv) return;
    dwPaint(g);
    if (!drawing || cv.dataset.bound) return;
    cv.dataset.bound = '1';
    const pt = e => { const r = cv.getBoundingClientRect(); return [clamp(Math.round((e.clientX - r.left) / r.width * 1000), 0, 1000), clamp(Math.round((e.clientY - r.top) / r.height * 750), 0, 750)]; };
    cv.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch {}
      const t = Store.local.dw;
      DW.cur = { id: uid(6), c: t.c, w: t.w, p: pt(e) };
      DW.sent = 0;
      clearInterval(DW.timer); DW.timer = setInterval(() => dwFlush(false), 200);
      dwPaint(Store.room.game);
    });
    cv.addEventListener('pointermove', e => {
      if (!DW.cur) return;
      // Alguns navegadores devolvem a lista de eventos agrupados vazia: aí vale o próprio evento.
      const co = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
      const ctx = cv.getContext('2d'), evs = co && co.length ? co : [e];
      for (const ev of evs) {
        const p = DW.cur.p, [x, y] = pt(ev), lx = p[p.length - 2], ly = p[p.length - 1];
        if (Math.abs(x - lx) + Math.abs(y - ly) < 3 || p.length >= 2900) continue;
        p.push(x, y);
        ctx.strokeStyle = DRAW_COLORS[DW.cur.c]; ctx.lineWidth = DRAW_SIZES[DW.cur.w]; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x, y); ctx.stroke();
      }
    });
    const end = () => { if (DW.cur) dwFlush(true); };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    cv.addEventListener('lostpointercapture', end);
  },
  ui: {
    choose(el) { dispatch({ type: 'choose', word: el.dataset.v }); },
    color(el) { Store.local.dw.c = +el.dataset.v; $$('.dw-sw').forEach(b => b.classList.toggle('on', +b.dataset.v === Store.local.dw.c)); },
    size(el) { Store.local.dw.w = +el.dataset.v; $$('.dw-size').forEach(b => b.classList.toggle('on', +b.dataset.v === Store.local.dw.w)); },
    undo() { dispatch({ type: 'undo' }); },
    clear() { dispatch({ type: 'clear' }); },
  },
  forms: {
    guess() {
      const input = $('#dwGuess'), text = (input.value || '').trim();
      if (!text) return;
      input.value = '';
      dispatch({ type: 'guess', text });
      input.focus();
    },
  },
};

/* ---------- 8. Termo Relâmpago ---------- */
const TERMO_WORDS = ['CARRO','PRAIA','LIVRO','TEMPO','NOITE','PEDRA','VERDE','FESTA','MUNDO','PORTA','CAMPO','PRATO','LIMAO','MANGA','TIGRE','ZEBRA','PIANO','NUVEM','PLUMA','FORNO','SALTO','GRUPO','CINCO','FUGIR','SONHO','CHAVE','BOLSA','TROCA','VENTO','PEIXE','FOLHA','TERRA','NADAR','MOLHO','CAIXA','JOGAR','BRAVO','RISCO','LEITE','VIDRO','SORTE','FELIZ','TRIGO','POLVO','CERTO','LUGAR','HOTEL','AMIGO','ROUPA','CANTO','SAMBA','PAGAR','FALAR','BICHO','DOCES','TORTA'];
const termoKey = w => norm(w).toUpperCase().replace(/[^A-Z]/g, '');
function termoScore(guess, answer) {
  const res = Array(5).fill('x'), used = Array(5).fill(false);
  for (let i = 0; i < 5; i++) if (guess[i] === answer[i]) { res[i] = 'g'; used[i] = true; }
  for (let i = 0; i < 5; i++) {

function commit() {
  const s = Store.room;
  s.version = (s.version || 0) + 1;
  saveRoom(s);
  Transport.send({ kind: 'state', state: s });
  render();
}
function mkPlayer(id, pr, isBot) {
  return { id, name: pr.name, avatar: pr.avatar, color: pr.color, score: 0, isBot, connected: true, lastSeen: now() };
}
function uniqueName(s, name) {
  const taken = new Set(Object.values(s.players).map(p => norm(p.name)));
  if (!taken.has(norm(name))) return name;
  for (let i = 2; ; i++) if (!taken.has(norm(`${name} ${i}`))) return `${name} ${i}`;
}
const cleanName = n => String(n || '').replace(/\s+/g, ' ').trim().slice(0, 14);

function hostHandle(from, a) {
  const s = Store.room;
  if (!s || !a) return;
  let changed = false;
  const p = s.players[from];
  if (p && !p.isBot) {
    p.lastSeen = now();
    if (!p.connected) { p.connected = true; changed = true; }
  }
  if (a.type === 'join') {
    const pl = a.player || {};
    if (!pl.id) return;
    if (s.players[pl.id]) { changed = true; }
    else if (s.settings.locked) {
      Transport.send({ kind: 'reject', to: pl.id, reason: 'O host trancou esta sala. Peça para liberar a entrada e tente de novo.' });
      return;
    } else if (Object.keys(s.players).length >= MAX_PLAYERS) {
      Transport.send({ kind: 'reject', to: pl.id, reason: 'Essa sala já está cheia (12 jogadores).' });
      return;
    } else {
      const name = uniqueName(s, cleanName(pl.name) || 'Jogador');
      s.players[pl.id] = mkPlayer(pl.id, { name, avatar: AVATARS.includes(pl.avatar) ? pl.avatar : pick(AVATARS), color: COLORS.includes(pl.color) ? pl.color : pick(COLORS) }, false);
      s.order.push(pl.id);
      pushChat(s, { sys: true, text: `${name} entrou na sala` });
      changed = true;
    }
  } else if (a.type === 'ping') {
    // só presença
  } else if (a.type === 'leave') {
    if (p) {
      if (s.screen === 'lobby') { delete s.players[from]; s.order = s.order.filter(id => id !== from); }
      else p.connected = false;
      changed = true;
    }
  } else if (!p) {
    return;
  } else if (a.type === 'chat') {
    changed = hostChat(s, from, a.text) || changed;
  } else if (a.type === 'react') {
    hostReact(s, from, a.e);
  } else if (a.type.startsWith('host:')) {
    if (from === s.hostId) changed = hostCommand(s, a) || changed;
  } else if (s.game && s.game.phase && s.game.phase !== 'final' && !s.game.paused) {
    changed = Games[s.game.id].handle(s.game, s, from, a) || changed;
  }
  if (changed) commit();
}

function hostCommand(s, a) {
  switch (a.type) {
    case 'host:addBot': {
      if (Object.keys(s.players).length >= MAX_PLAYERS) return false;
      const used = new Set(Object.values(s.players).map(p => p.name));
      const name = BOT_NAMES.find(n => !used.has(n)) || uniqueName(s, 'Bot');
      const id = 'bot-' + uid(6);
      s.players[id] = mkPlayer(id, { name, avatar: pick(AVATARS), color: pick(COLORS) }, true);
      s.order.push(id);
      return true;
    }
    case 'host:kick':
      if (s.screen !== 'lobby' || a.id === s.hostId || !s.players[a.id]) return false;
      delete s.players[a.id];
      s.order = s.order.filter(id => id !== a.id);
      return true;
    case 'host:rounds':
      s.settings.rounds = clamp(Number(a.n) || 3, 1, 10);
      return true;
    case 'host:start': {
      const m = Games[a.game];
      if (!m || rosterOf(s).length < m.min) return false;
      engineStart(s, a.game, s.settings.rounds);
      return true;
    }
    case 'host:restart':
      if (!s.game) return false;
      markPlayed(s);
      engineStart(s, s.game.id, s.settings.rounds);
      return true;
    case 'host:next':
      if (!s.game || s.game.phase === 'final') return false;
      engineAdvance(s);
      return true;
    case 'host:lobby':
      markPlayed(s);
      s.game = null; s.screen = 'lobby';
      return true;
    case 'host:end':
      markPlayed(s);
      s.game = null; s.screen = 'podium';
      return true;
    case 'host:toggle':
      if (!['rush', 'auto', 'locked'].includes(a.key)) return false;
      s.settings[a.key] = !s.settings[a.key];
      return true;
    case 'host:random': {
      const ok = GAME_ORDER.filter(id => rosterOf(s).length >= Games[id].min);
      const fresh = ok.filter(id => !s.match.played.includes(id) && id !== s.game?.id);
      const id = pick(fresh.length ? fresh : ok);
      if (!id) return false;
      markPlayed(s);
      engineStart(s, id, s.settings.rounds);
      s.game.surprise = true;
      return true;
    }
    case 'host:pause':
      if (!s.game || s.game.phase === 'final' || s.game.paused) return false;
      s.game.paused = { at: now() };
      return true;
    case 'host:resume': {
      const g = s.game;
      if (!g || !g.paused) return false;
      const d = now() - g.paused.at;
      delete g.paused;
      shiftTimers(g, d);
      return true;
    }
    case 'host:addTime': {
      const g = s.game;
      if (!g || !g.deadline || g.phase === 'final' || g.paused || Games[g.id].phases[g.phase].hideTimer) return false;
      g.deadline = Math.max(g.deadline, now()) + 15000; g.dur += 15;
      return true;
    }
    case 'host:score': {
      const p = s.players[a.id];
      if (!p) return false;
      p.score = Math.max(0, p.score + (a.d > 0 ? 1 : -1));
      return true;
    }
    case 'host:newMatch':
      Object.values(s.players).forEach(p => { p.score = 0; });
      s.match.played = []; s.match.byGame = {}; s.game = null; s.screen = 'lobby';
      return true;
  }
  return false;
}

const REACTS = ['😂', '🔥', '👏', '😱', '❤️', '🤯'];

function pushChat(s, m) {
  s.chat = s.chat || [];

  if (s.chat.length > 40) s.chat.splice(0, s.chat.length - 40);
}
// Mensagens que entregariam a resposta da rodada ficam escondidas (cada jogo diz o que é segredo).
function chatLeaks(s, text) {
  const g = s.game, mod = g && g.phase && g.phase !== 'final' ? Games[g.id] : null;
  if (!mod || !mod.secret) return false;
  const flat = norm(text).replace(/[^a-z0-9]/g, '');
  return (mod.secret(g, s) || []).map(x => norm(x).replace(/[^a-z0-9]/g, '')).some(x => x.length >= 3 && flat.includes(x));
}
function hostChat(s, pid, raw) {
  const text = String(raw || '').replace(/\s+/g, ' ').trim().slice(0, 140);
  if (!text || now() - (ChatRT.last[pid] || 0) < 600) return false;
  ChatRT.last[pid] = now();
  const hid = chatLeaks(s, text);
  pushChat(s, { pid, name: s.players[pid].name, text: hid ? '' : text, hid });
  return true;
}
function hostReact(s, pid, e) {
  // Margem menor que a do aparelho (350 ms) para absorver atrasos da rede.
  if (!REACTS.includes(e) || now() - (ChatRT.lastReact[pid] || 0) < 200) return;
  ChatRT.lastReact[pid] = now();
  Transport.send({ kind: 'fx', pid, e });
  if (pid !== Store.me?.id) spawnFx(e, s.players[pid]);
}
// Bots reagem aos resultados (e de vez em quando comentam no chat).
function botsReact(s) {
  if (!isHost() || !s.game) return;
  s.game.roster.filter(id => s.players[id]?.isBot).forEach(id => {
    if (Math.random() < .45) setTimeout(() => { if (Store.room?.players[id]) hostReact(Store.room, id, pick(REACTS)); }, rand(500, 2600));
    if (Math.random() < .12) setTimeout(() => {
      const room = Store.room, p = room?.players[id];
      if (p && isHost()) { pushChat(room, { pid: id, name: p.name, text: pick(BOT_CHAT) }); commit(); }
    }, rand(1500, 4500));
  });
}

// Depois de uma pausa, empurra para frente todos os horários marcados da partida.
function shiftTimers(g, d) {
  if (g.deadline) g.deadline += d;
  g.phaseStart += d;
  Object.keys(HostRT.botAt).forEach(k => { HostRT.botAt[k] += d; });
  if (HostRT.allInAt) HostRT.allInAt += d;
  const x = g.data || {};
  if (x.botStopAt) x.botStopAt += d;
  if (x.botAt) x.botAt += d;
  if (x.bots) Object.values(x.bots).forEach(pl => { pl.times = pl.times.map(t => t + d); });
}
// Jogos em sequência: sorteia um jogo ainda não jogado; se acabaram, vai para o pódio.
function autoNext(s) {
  markPlayed(s);
  const ok = GAME_ORDER.filter(id => rosterOf(s).length >= Games[id].min && !s.match.played.includes(id));
  if (!ok.length) { s.game = null; s.screen = 'podium'; return; }
  engineStart(s, pick(ok), s.settings.rounds);
  s.game.surprise = true;
}
function markPlayed(s) {
  if (s.game && s.game.phase === 'final' && !s.match.played.includes(s.game.id)) s.match.played.push(s.game.id);
}

function hostTick() {
  const s = Store.room;
  if (!s || !isHost()) return;
  let changed = false;
  for (const p of Object.values(s.players)) {
    if (!p.isBot && p.id !== s.hostId && p.connected && now() - p.lastSeen > 10000) { p.connected = false; changed = true; }
  }
  const g = s.game;
  if (g && g.phase === 'final' && s.settings.auto) {
    if (!g.autoAt) { g.autoAt = now() + 9000; changed = true; }
    else if (now() >= g.autoAt) { autoNext(s); changed = true; }
  }
  if (g && g.phase && g.phase !== 'final' && !g.paused) {
    const mod = Games[g.id], ph = mod.phases[g.phase];
    if (ph.bot) {
      for (const id of g.roster) {
        if (!s.players[id]?.isBot) continue;
        const key = `${g.pkey}:${id}`;
        if (HostRT.botDone.has(key)) continue;
        if (!HostRT.botAt[key]) { HostRT.botAt[key] = now() + rand(ph.bot[0], ph.bot[1]) * 1000 * (rushOn(s, ph) ? RUSH : 1); continue; }
        if (now() < HostRT.botAt[key]) continue;
        HostRT.botDone.add(key); delete HostRT.botAt[key];
        for (const act of [].concat(mod.bot(g, s, id) || [])) if (mod.handle(g, s, id, act)) changed = true;
      }
    }
    if (mod.tick && mod.tick(g, s)) changed = true;
    const cur = mod.phases[g.phase];
    if (g.deadline && now() >= g.deadline) { engineAdvance(s); changed = true; }
    else if (cur.allIn && cur.allIn(g, s)) {
      if (!HostRT.allInAt) HostRT.allInAt = now() + (s.settings.rush ? 300 : 700);
      else if (now() >= HostRT.allInAt) { engineAdvance(s); changed = true; }
    } else HostRT.allInAt = null;
  }
  if (changed) commit();
}
function startHost() {
  stopHost();
  HostRT.timer = setInterval(hostTick, 200);
  HostRT.beat = setInterval(() => Transport.send({ kind: 'beat' }), 2500);
}
function stopHost() {
  clearInterval(HostRT.timer); clearInterval(HostRT.beat);
  HostRT.timer = HostRT.beat = null; HostRT.botAt = {}; HostRT.botDone = new Set(); HostRT.allInAt = null;
}

/* =====================================================================
   Cliente: conexão com a sala
   ===================================================================== */
let joinWait = null, lastHostSignal = 0, pingTimer = null;

function onMessage(msg) {
  const me = Store.me;
  if (!me) return;
  if (isHost()) {
    // Ações do próprio host nunca chegam pela rede; ignora quem tenta se passar por ele.
    if (msg.kind === 'action' && msg.from && msg.from !== me.id) hostHandle(msg.from, msg.action);
    else if (msg.kind === 'hello') Transport.send({ kind: 'state', state: Store.room });
    return;
  }
  if (msg.kind === 'state' && msg.state) {
    lastHostSignal = now();
    const inside = !!msg.state.players[me.id];
    if (joinWait) {
      if (!inside) return;
      const w = joinWait; joinWait = null; w.done({ ok: true });
    } else if (!inside) {
      leaveRoom('Você foi removido da sala.', true);
      return;
    }
    if (Store.room && msg.state.version < Store.room.version && msg.state.pin === Store.room.pin) return;
    Store.room = msg.state;
    if (Store.hostLost) Store.hostLost = false;
    render();
  } else if (msg.kind === 'fx') {
    if (msg.pid !== me.id) spawnFx(msg.e, Store.room?.players[msg.pid]);
  } else if (msg.kind === 'beat') {
    lastHostSignal = now();
    if (Store.hostLost) { Store.hostLost = false; render(); }
  } else if (msg.kind === 'closed') {
    leaveRoom('O host encerrou a sala.', true);
  } else if (msg.kind === 'reject' && msg.to === me.id && joinWait) {
    const w = joinWait; joinWait = null; w.done({ ok: false, reason: msg.reason });
  }
}

function dispatch(action) {
  const me = Store.me;
  if (!me) return;
  if (me.isHost) hostHandle(me.id, action);
  else Transport.send({ kind: 'action', from: me.id, action });
}

function startPresence() {
  clearInterval(pingTimer);
  pingTimer = setInterval(() => {
    if (!Store.me || isHost()) return;
    dispatch({ type: 'ping' });
    const lost = now() - lastHostSignal > 9000;
    if (lost !== Store.hostLost) { Store.hostLost = lost; render(); }
  }, 3000);
}

function genPin() {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let pin;
  do { pin = Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join(''); } while (loadRoom(pin));
  return pin;
}

/** Cria a sala; quem cria vira host e também joga. */
function createRoom(profile) {
  const pin = genPin(), id = 'p-' + uid(8);
  Store.me = { id, pin, isHost: true, profile };
  Store.room = { pin, hostId: id, createdAt: now(), version: 0, screen: 'lobby', players: { [id]: mkPlayer(id, profile, false) }, order: [id], settings: { rounds: 3, rush: false, auto: false, locked: false }, match: { played: [] }, game: null };
  Session.save(Store.me);
  Transport.open(pin, onMessage, 'host');
  startHost();
  history.replaceState(null, '', '#' + pin);
  commit();
  Wake.on();
  return pin;
}

/** Entra numa sala (outra aba ou outro aparelho). Resolve com { ok, reason }. */
function joinRoom(pin, profile, existingId, onProgress) {
  pin = String(pin || '').toUpperCase().trim();
  const id = existingId || 'p-' + uid(8);
  Store.me = { id, pin, isHost: false, profile };
  Transport.open(pin, onMessage, 'client');
  const started = now();
  let lastAsk = now();
  const ask = () => { lastAsk = now(); Transport.send({ kind: 'action', from: id, action: { type: 'join', player: { id, ...profile } } }); };
  return new Promise(resolve => {
    joinWait = { done: res => {
      clearInterval(watch);
      if (res.ok) {
        Session.save(Store.me);
        lastHostSignal = now();
        startPresence();
        Wake.on();
        history.replaceState(null, '', '#' + pin);
      } else { Transport.close(); Store.me = null; }
      resolve(res);
    } };
    const fail = reason => { if (!joinWait) return; const w = joinWait; joinWait = null; w.done({ ok: false, reason }); };
    // Reenvia o pedido até o host responder. Cobre conexão lenta e host que acabou de voltar à tela.
    const watch = setInterval(() => {
      const t = now() - started;
      onProgress && onProgress(t);
      if (now() - lastAsk > 2500) ask();
      if (t > 25000) fail(Transport.status === 'offline'
        ? 'Sem conexão com a internet. Verifique a rede e tente de novo.'
        : `A sala ${pin} não respondeu. Confira o código e peça para quem criou a sala deixar a tela do PlayBox aberta.`);
    }, 500);
    ask();
  });
}

function leaveRoom(msg, silent) {
  const me = Store.me;
  if (me) {
    if (me.isHost) { Transport.send({ kind: 'closed' }); stopHost(); dropRoom(me.pin); }
    else if (!silent) dispatch({ type: 'leave' });
  }
  clearInterval(pingTimer);
  Transport.close();
  Wake.off();
  Store.local.invite = false;
  Store.me = null; Store.room = null; Store.hostLost = false; joinWait = null;
  Session.clear();
  history.replaceState(null, '', location.pathname + location.search);
  render();
  if (msg) toast(msg);
}

   Renderização
   ===================================================================== */
const nameOf = (s, id) => s.players[id]?.name ?? 'Alguém';
function avatar(p, size = 'md') {
  if (!p) return '';
  return `<span class="av av-${size}" style="--c:${p.color}" aria-hidden="true">${p.avatar}</span>`;
}
const gameVars = m => `--g:${m.color};--gl:${m.lip}`;
const waitCard = (main, sub) => `<div class="wait"><div class="wait-main">${main}</div><p class="hint">${sub}<span class="dots"></span></p></div>`;
const deltaBadge = n => n ? `<span class="delta">+${n}</span>` : '<span></span>';

let lastSig = '';
function render() {
  const s = Store.room, app = $('#app');
  soundCues(s);
  renderChat();
  renderTop();
  // Brilho radial do fundo segue a cor do jogo ativo (índigo fora das partidas).
  document.body.style.setProperty('--glow', s && Store.me && s.screen === 'game' && s.game ? Games[s.game.id].color : '#6366F1');
  let html, sig;
  if (!s || !Store.me) { sig = 'home'; html = viewHome(); }
  else if (s.screen === 'lobby') { sig = 'lobby'; html = viewLobby(s); }
  else if (s.screen === 'game' && s.game) {
    sig = `game:${s.game.id}:${s.game.round}:${s.game.phase}${s.game.paused ? ':p' : ''}`;
    // Mesma fase e o jogo sabe se atualizar por partes: não redesenha a tela toda.
    const mod = Games[s.game.id];
    if (sig === lastSig && mod.patch && s.game.phase !== 'final' && !Store.hostLost && !$('.banner', app) && $('.stage-body', app)) {
      mod.patch(s.game, s, Store.me.id);
      const strip = $('.strip', app);
      if (strip) strip.outerHTML = stripHTML(s, s.game, mod);
      return;
    }
    html = viewGame(s);
  }
  else { sig = 'podium'; html = viewPodium(s); }
  if (s && !isHost() && Store.hostLost) html = `<div class="banner" role="alert">Sem sinal do host há alguns segundos. Se a aba do host foi fechada, a sala acabou.</div>` + html;
  const kept = captureInputs(app);
  app.innerHTML = html;
  restoreInputs(app, kept);
  if (sig !== lastSig) {
    // Pausar ou continuar não conta como tela nova: sem animação de entrada e sem voltar ao topo.
    const same = sig.replace(/:p$/, '') === lastSig.replace(/:p$/, '');
    lastSig = sig;
    if (!same) { $('.screen', app)?.classList.add('enter'); window.scrollTo({ top: 0 }); }
    const af = $('[data-autofocus]', app);
    if (af && !af.disabled && matchMedia('(pointer:fine)').matches) af.focus({ preventScroll: true });
  }
  afterRender(s);
}

function captureInputs(root) {
  const vals = {};
  let focus = null;
  $$('[data-keep]', root).forEach(el => {
    vals[el.dataset.keep] = el.value;
    if (el === document.activeElement) focus = { k: el.dataset.keep, a: el.selectionStart, b: el.selectionEnd };
  });
  return { vals, focus };
}
function restoreInputs(root, { vals, focus }) {
  $$('[data-keep]', root).forEach(el => { if (el.dataset.keep in vals) el.value = vals[el.dataset.keep]; });
  if (focus) {
    const el = root.querySelector(`[data-keep="${focus.k}"]`);
    if (el && !el.disabled) { el.focus({ preventScroll: true }); try { el.setSelectionRange(focus.a, focus.b); } catch {} }
  }
}

function afterRender(s) {
  syncPinSlots();
  const g = s?.game;
  if (!g || s.screen !== 'game') return;
  if (g.id === 'stop') {
    refreshStopUI();
    const key = `${g.round}:${g.phaseStart}`;
    if (g.phase === 'stopped' && Store.local.stopSent !== key && inRoster(g, Store.me.id)) {
      Store.local.stopSent = key;
      const answers = stopInputs();
      setTimeout(() => dispatch({ type: 'submit', answers }), 0);
    }
  }
  const mod = Games[g.id];
  if (g.phase !== 'final' && mod.mount) mod.mount(g, s, Store.me.id);
}

function renderTop() {
  const el = $('#topRight'), s = Store.room;
  const snd = `<button class="icon-btn snd" data-act="sound" aria-pressed="${Sound.on}" aria-label="${Sound.on ? 'Desligar os sons' : 'Ligar os sons'}" title="${Sound.on ? 'Sons ligados' : 'Sons desligados'}">${icon(Sound.on ? 'volume' : 'mute')}</button>`;
  if (!s || !Store.me) { el.innerHTML = snd; return; }
  const me = s.players[Store.me.id];
  el.innerHTML = `${snd}<span class="room-chip"><span>Sala </span><b>${s.pin}</b></span>${me ? avatar(me, 'sm') : ''}<button class="btn ghost xs" data-act="leave">Sair</button>`;
}

const icon = (name, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
const gameIcon = m => icon(m.icon);
const cubeArt = () => `<svg class="cube-art" viewBox="0 0 240 240" aria-hidden="true">
  <defs><linearGradient id="cuT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A5B4FC"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
  <linearGradient id="cuL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#4338CA"/></linearGradient>
  <linearGradient id="cuR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#312E81"/></linearGradient></defs>
  <path d="M120 36 196 78 120 120 44 78Z" fill="url(#cuT)"/><path d="M44 78 120 120v86L44 164Z" fill="url(#cuL)"/><path d="M196 78 120 120v86l76-42Z" fill="url(#cuR)"/>
  <path d="M120 36 196 78 120 120 44 78Z" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>
  <g stroke-width="4" stroke-linecap="round"><path d="M38 40l10 10" stroke="#FBBF24"/><path d="M206 44l-8 12" stroke="#EC4899"/><path d="M214 140h-12" stroke="#14B8A6"/><path d="M28 132h12" stroke="#A3E635"/><path d="M200 200l-8-8" stroke="#3B82F6"/></g>
</svg>`;

function viewLobby(s) {
  const host = isHost(), me = Store.me.id;
  const ids = s.order.filter(id => s.players[id]);
  const scored = ids.some(id => s.players[id].score > 0);
  const list = scored ? [...ids].sort((a, b) => s.players[b].score - s.players[a].score) : ids;
  const leader = scored ? list[0] : s.hostId;
  const rows = list.map(id => {
    const p = s.players[id], on = p.connected || p.isBot;
    const tags = `${id === s.hostId ? '<span class="tag tag-host">Host</span>' : ''}${p.isBot ? '<span class="tag">Bot</span>' : ''}${on ? '' : '<span class="tag">Sem sinal</span>'}${id === me ? '<span class="tag tag-me">Você</span>' : ''}`;
    return `<li class="pl-row ${on ? '' : 'off'}">${avatar(p, 'sm')}<span class="pl-name">${esc(p.name)}${tags}</span>
      ${host ? `<span class="pl-adj"><button data-act="score" data-id="${id}" data-d="-1" aria-label="Tirar 1 ponto de ${esc(p.name)}" ${p.score ? '' : 'disabled'}>−</button><span class="pl-pts">${p.score} pts</span><button data-act="score" data-id="${id}" data-d="1" aria-label="Dar 1 ponto para ${esc(p.name)}">+</button></span>`
        : `<span class="pl-pts">${p.score} pts</span>`}<span class="crown" ${id === leader ? `title="${scored ? 'Na liderança' : 'Host da sala'}"` : ''}>${id === leader ? icon('crown') : ''}</span>
      ${host && id !== s.hostId ? `<button class="pl-kick" data-act="kick" data-id="${id}" aria-label="Remover ${esc(p.name)} da sala">×</button>` : ''}</li>`;
  }).join('');
  const waiting = ids.length < MAX_PLAYERS ? `<li class="pl-row waiting"><span class="wait-dot">${icon('user')}</span><span>Aguardando<span class="dots"></span></span><span></span><span class="ring"></span></li>` : '';
  const n = rosterOf(s).length;
  const cards = GAME_ORDER.map(id => {
    const m = Games[id], lacking = n < m.min, played = s.match.played.includes(id);
    const inner = `<span class="gc-icon">${gameIcon(m)}</span><span class="gc-name">${m.name}</span>
      <span class="gc-tag">${lacking ? `Precisa de ${m.min} jogadores` : m.tag}</span>${played ? `<span class="gc-done" title="Já jogado nesta partida">${icon('check')}</span>` : ''}`;
    return host ? `<button class="game-card" style="${gameVars(m)}" data-act="startGame" data-game="${id}" ${lacking ? 'disabled' : ''}>${inner}</button>`
      : `<div class="game-card" style="${gameVars(m)}">${inner}</div>`;
  }).join('');
  const set = s.settings;
  const toggle = (key, ic, title, desc) => `<button class="tgl" role="switch" aria-checked="${!!set[key]}" data-act="toggle" data-k="${key}">
    <span class="tgl-ic">${icon(ic)}</span><span class="tgl-txt"><b>${title}</b><small>${desc}</small></span><span class="tgl-sw" aria-hidden="true"><i></i></span></button>`;
  const settingsPanel = host ? `<section class="panel" aria-labelledby="setTitle"><h2 class="panel-title" id="setTitle">Ajustes da partida</h2>
    <div class="tgl-list">${toggle('rush', 'bolt', 'Modo Rush', 'Tempos e transições quase pela metade.')}
    ${toggle('auto', 'shuffle', 'Jogos em sequência', 'Quando um jogo acaba, um jogo surpresa começa sozinho.')}
    ${toggle('locked', 'lock', 'Trancar a sala', 'Ninguém novo entra. Quem já está continua.')}</div></section>`
    : (set.rush || set.auto || set.locked) ? `<p class="set-chips">${set.rush ? `<span class="tag tag-rush">${icon('bolt')}Modo Rush</span>` : ''}${set.auto ? '<span class="tag">Jogos em sequência</span>' : ''}${set.locked ? '<span class="tag">Sala trancada</span>' : ''}</p>` : '';
  const seg = [3, 5, 7].map(k => `<button data-act="rounds" data-n="${k}" aria-pressed="${s.settings.rounds === k}">${k}</button>`).join('');
  return `<section class="screen lobby">
    <p class="lobby-caption">Sala criada por <b>${esc(nameOf(s, s.hostId))}</b></p>
    <div class="lobby-grid">
      <div class="lobby-left">
        <section class="panel pin-block" aria-label="PIN da sala">
          <p class="label-caps">PIN da sala</p>
          <div class="pin-keys" aria-label="${s.pin.split('').join(' ')}">${s.pin.split('').map(c => `<span class="key" aria-hidden="true">${c}</span>`).join('')}</div>
          <div class="row center"><button class="btn xs primary" data-act="share">${icon('link')}Convidar</button><button class="btn xs" data-act="copyCode">${icon('copy')}Copiar código</button><button class="btn xs" data-act="qr">${icon('qr')}QR code</button></div>
          ${netStatusHTML()}
        </section>
        <section class="panel" aria-labelledby="plTitle">
          <div class="panel-head"><h2 class="panel-title" id="plTitle">Jogadores (${ids.length}/${MAX_PLAYERS})</h2>
            ${host ? `<button class="btn xs" data-act="addBot" ${ids.length >= MAX_PLAYERS ? 'disabled' : ''}>${icon('plus')}Bot</button>` : ''}</div>
          <ul class="pl-list">${rows}${set.locked ? '' : waiting}</ul>
        </section>
        ${settingsPanel}
      </div>
      <section class="panel" aria-labelledby="gmTitle">
        <div class="gp-head">
          <div><h2 class="panel-title" id="gmTitle">${host ? 'Escolha um jogo' : 'O host escolhe o jogo'}</h2><p class="hint">Rodadas por jogo</p></div>
          ${host ? `<div class="seg" role="group" aria-label="Rodadas por jogo">${seg}</div>` : `<span class="seg-static">${s.settings.rounds}</span>`}
        </div>
        ${host ? `<button class="btn primary pill surprise-btn" data-act="random">${icon('shuffle')}Jogo surpresa</button>` : ''}
        <div class="game-grid is-12">${cards}</div>
        ${host ? `<div class="lobby-foot"><p class="hint">${scored ? 'O placar soma todos os jogos desta partida.' : 'Os pontos de cada jogo vão para um placar geral.'}</p>
          <button class="btn xs" data-act="endMatch" ${scored ? '' : 'disabled'}>Encerrar partida e ver pódio</button></div>` : ''}
      </section>
    </div>
  </section>`;
}

// Link limpo da sala: sem parâmetros de teste (como ?rede=), só a página e o código.
const roomLink = () => location.origin + location.pathname + '#' + Store.room.pin;

function netStatusHTML() {
  const st = Transport.status;
  const text = st === 'online'
    ? (isHost() ? 'Online. Mande o convite e deixe esta tela aberta: a sala roda neste aparelho.' : 'Online. Você está conectado à sala.')
    : st === 'connecting' ? 'Conectando à internet…'
    : 'Sem internet: só outras abas deste navegador conseguem entrar.';
  const fileNote = location.protocol === 'file:' && st === 'online'
    ? '<p class="hint">O arquivo está aberto direto do disco, então o link só funciona neste computador. Nos outros aparelhos, abra o PlayBox e digite o código.</p>' : '';
  return `<p class="net-status is-${st === 'online' ? 'on' : st === 'connecting' ? 'wait' : 'off'}" role="status"><span class="net-dot" aria-hidden="true"></span>${text}</p>${fileNote}`;
}

function viewGame(s) {
  const g = s.game, mod = Games[g.id], me = Store.me.id, host = isHost();
  if (g.phase === 'final') return viewGameFinal(s);
  const ph = mod.phases[g.phase];
  const firstStep = g.round === 1 && g.phase === mod.first;
  const reveal = g.phase === 'reveal';
  const showTimer = !!g.deadline && !ph.hideTimer;
  const left = showTimer ? Math.max(0, g.deadline - now()) : 0;
  const timerAttrs = showTimer ? `data-deadline="${g.deadline}" data-dur="${g.dur}" style="--p:${g.dur ? left / (g.dur * 1000) : 0}"` : '';
  const rush = s.settings.rush;
  return `<section class="screen game ${rush ? 'is-rush' : ''}" style="${gameVars(mod)}">
    <div class="game-top ${showTimer ? 'timer' : ''} ${showTimer && left < 5000 ? 'low' : ''}" ${timerAttrs}>
      <button class="icon-btn" data-act="${host ? 'toLobby' : 'leave'}" aria-label="${host ? 'Voltar ao lobby' : 'Sair da partida'}">${icon('back')}</button>
      <span class="gt-round">Rodada ${g.round}/${g.total}${rush ? `<span class="rush-pill">${icon('bolt')}Rush</span>` : ''}</span>
      <span class="gt-time">${showTimer ? `${icon('clock')}<span class="timer-num">${Math.ceil(left / 1000)}s</span>` : ph.hideTimer ? `${icon('clock')}<span>???</span>` : ''}</span>
      <div class="timer-track" role="progressbar" aria-label="Tempo restante"><div class="timer-fill"></div></div>
    </div>
    <div class="stage">
      <header class="stage-head"><span class="sh-icon">${gameIcon(mod)}</span>
        <div><h1 class="sh-name">${mod.name}</h1><p class="sh-sub">${ph.label}</p></div></header>
      ${firstStep && g.surprise ? `<p class="surprise-pill">${icon('shuffle')}Jogo surpresa!</p>` : ''}
      ${firstStep ? `<p class="sh-how">${esc(mod.how)}</p>` : ''}
      <div class="stage-body">${mod.view(g, s, me)}</div>
      ${stripHTML(s, g, mod)}
      ${g.paused ? `<div class="pause-veil" role="status"><span class="pv-ic">${icon('pause')}</span><b>Jogo pausado</b>
        <span>${host ? 'Toque em Continuar quando a galera estiver pronta.' : 'O host pausou o jogo. Já, já continua.'}</span></div>` : ''}
    </div>
    ${host ? `<div class="hostbar"><span class="hb-label">Controles do host</span>
      <button class="btn sm pill" data-act="${g.paused ? 'resume' : 'pause'}">${icon(g.paused ? 'play' : 'pause')}${g.paused ? 'Continuar' : 'Pausar'}</button>
      ${showTimer && !reveal ? `<button class="btn sm pill" data-act="addTime" ${g.paused ? 'disabled' : ''} title="Dar mais 15 segundos nesta etapa">${icon('plus')}15s</button>` : ''}
      ${reveal ? `<button class="btn primary sm pill" data-act="next">${g.round >= g.total ? 'Ver resultado do jogo' : 'Próxima rodada'}</button>` : `<button class="btn sm pill" data-act="next">Pular etapa</button>`}</div>`
      : reveal ? '<p class="hint center" style="margin-top:14px">A próxima rodada começa quando o tempo acabar ou o host avançar.</p>' : ''}
  </section>`;
}

function stripHTML(s, g, mod) {
  const ids = [...g.roster, ...s.order.filter(id => !g.roster.includes(id))].filter(id => s.players[id]);
  return `<ul class="strip" aria-label="Jogadores">${ids.map(id => {
    const p = s.players[id], inR = inRoster(g, id), done = inR && mod.done(g, id), delta = g.phase === 'reveal' ? g.roundDelta[id] || 0 : 0;
    const stat = delta ? `<span class="sp-stat delta">+${delta}</span>`
      : done ? `<span class="sp-stat is-ok" title="Já jogou">${icon('check')}</span>`
      : `<span class="sp-stat ${inR ? 'is-wait' : 'is-out'}" title="${inR ? 'Ainda pensando' : 'Entra na próxima rodada'}"></span>`;
    return `<li class="sp ${p.connected || p.isBot ? '' : 'off'} ${id === Store.me.id ? 'me' : ''}">${avatar(p, 'md')}
      <span class="sp-name">${esc(p.name)}</span><span class="sp-pts">${p.score} pts</span>${stat}</li>`;
  }).join('')}</ul>`;
}

function rankRows(items) {
  // items: [{ p, main, sub, value }] já ordenados; a barra é proporcional ao maior value.
  const max = Math.max(1, ...items.map(x => x.value));
  return items.map((x, i) => `<li class="rk-row"><span class="rk-pos">${i === 0 && x.value > 0 ? icon('crown') : i + 1}</span>${avatar(x.p, 'sm')}
    <div class="rk-mid"><span class="rk-name">${esc(x.p.name)}</span><span class="rk-bar"><i style="--w:${Math.max(2, x.value / max * 100)}%;--c:${x.p.color}"></i></span></div>
    <span class="rk-score">${x.main}${x.sub ? `<small>${x.sub}</small>` : ''}</span></li>`).join('');
}

function viewGameFinal(s) {
  const g = s.game, mod = Games[g.id], host = isHost();
  const ids = [...new Set([...g.roster, ...Object.keys(g.earned)])].filter(id => s.players[id]).sort((a, b) => (g.earned[b] || 0) - (g.earned[a] || 0) || s.players[b].score - s.players[a].score);
  const top = ids[0] && g.earned[ids[0]] ? nameOf(s, ids[0]) : null;
  const rows = rankRows(ids.map(id => ({ p: s.players[id], value: g.earned[id] || 0, main: `+${g.earned[id] || 0}`, sub: `${s.players[id].score} no total` })));
  return `<section class="screen game game-final" style="${gameVars(mod)}">
    <div class="panel stage">
      <header class="stage-head"><span class="sh-icon">${gameIcon(mod)}</span>
        <div><h1 class="sh-name">${mod.name} acabou</h1><p class="sh-sub">${top ? `${esc(top)} fez mais pontos neste jogo.` : 'Ninguém pontuou neste jogo.'}</p></div></header>
      <ol class="rk-list">${rows}</ol>
      ${s.settings.auto && g.autoAt ? `<p class="auto-next">${icon('shuffle')}<span>Próximo jogo surpresa em <b data-countdown="${g.autoAt}">${Math.max(0, Math.ceil((g.autoAt - now()) / 1000))}</b>s</span>
        ${host ? '<button class="btn xs" data-act="toggle" data-k="auto">Parar sequência</button>' : ''}</p>` : ''}
      ${host ? `<div class="row"><button class="btn primary pill" data-act="toLobby">Escolher outro jogo</button><button class="btn pill" data-act="restart">Jogar de novo</button>
        <button class="btn ghost pill" data-act="endMatch">Encerrar partida</button></div>` : '<p class="hint">O host vai escolher o próximo jogo<span class="dots"></span></p>'}
    </div>
  </section>`;
}

function viewPodium(s) {
  const ranked = s.order.map(id => s.players[id]).filter(Boolean).sort((a, b) => b.score - a.score);
  const best = ranked[0]?.score ?? 0;
  const winners = ranked.filter(p => p.score === best);
  const sub = !ranked.length ? '' : winners.length > 1 ? `Empate no topo entre ${winners.map(p => esc(p.name)).join(' e ')}.` : `${esc(winners[0].name)} venceu com ${plural(best, 'ponto', 'pontos')}.`;
  const step = (p, place, d) => p ? `<div class="pod pod-${place}" style="--d:${d}s">
      <div class="pod-who">${place === 1 ? `<span class="pod-crown">${icon('crown')}</span>` : ''}${avatar(p, 'xl')}<b>${esc(p.name)}</b><span class="pod-pts">${p.score} pts</span></div>
      <div class="pod-step">${place}</div></div>` : '<div class="pod"></div>';
  const rows = rankRows(ranked.map(p => ({ p, value: p.score, main: p.score })));
  const conf = Array.from({ length: 34 }, () => `<i style="--x:${rand(0, 100).toFixed(1)}%;--c:${pick(['#FBBF24','#EC4899','#14B8A6','#3B82F6','#A3E635','#FF5F57','#6366F1'])};--d:${rand(1.6, 3.4).toFixed(2)}s;--t:${rand(3, 5).toFixed(2)}s;--dx:${rand(-70, 70).toFixed(0)}px;--r:${rand(240, 900).toFixed(0)}deg"></i>`).join('');
  return `<section class="screen podium-screen">
    <div class="pod-layout">
      <div>
        <div class="pod-head"><span class="crown-big">${icon('crown')}</span><h1 class="podium-title">Fim de jogo!</h1><p class="lede">${sub} Confira o pódio e o ranking geral.</p></div>
        <div class="podium">${step(ranked[1], 2, .35)}${step(ranked[0], 1, .7)}${step(ranked[2], 3, 0)}</div>
      </div>
      <section class="panel ranking" aria-labelledby="rkTitle"><h2 class="panel-title" id="rkTitle">Ranking geral</h2><ol class="rk-list">${rows}</ol></section>
    </div>
    ${highlightsHTML(s)}
    <div class="row center pod-actions">${isHost() ? '<button class="btn primary pill" data-act="newMatch">Nova partida com a mesma sala</button>' : ''}<button class="btn pill" data-act="leave">Sair da sala</button></div>
    <div class="confetti" aria-hidden="true">${conf}</div>
  </section>`;
}

/* ---------- Chat ao vivo e reações flutuantes ---------- */
const Chat = { open: false, seen: 0, lastN: null, built: false };

/* ---------- Efeitos sonoros (sintetizados com Web Audio, sem arquivos) ---------- */
const Sound = {
  ctx: null,
  master: .9,
  on: (() => { try { return localStorage.getItem('playbox:sound') !== 'off'; } catch { return true; } })(),
  // O navegador só libera áudio depois de um toque ou tecla do usuário.
  unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ctx) { try { this.ctx = new AC(); } catch { return; } }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  toggle() {
    this.on = !this.on;
    try { localStorage.setItem('playbox:sound', this.on ? 'on' : 'off'); } catch {}
    if (this.on) { this.unlock(); setTimeout(() => this.play('correct'), 60); }
  },
  tone(freq, dur, o = {}) {
    const c = this.ctx, t = c.currentTime + (o.at || 0), osc = c.createOscillator(), gain = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    gain.gain.setValueAtTime(.0001, t);
    gain.gain.exponentialRampToValueAtTime((o.vol ?? .15) * this.master, t + .008);
    gain.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t); osc.stop(t + dur + .03);
  },
  noise(dur, o = {}) {
    const c = this.ctx, t = c.currentTime + (o.at || 0), n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = c.createBufferSource(), filter = c.createBiquadFilter(), gain = c.createGain();
    src.buffer = buf;
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(o.from || 2400, t);
    filter.frequency.exponentialRampToValueAtTime(o.to || 120, t + dur);
    gain.gain.value = (o.vol ?? .3) * this.master;
    src.connect(filter).connect(gain).connect(c.destination);
    src.start(t);
  },
  play(name) {
    if (!this.on || !this.ctx || this.ctx.state !== 'running' || !SFX[name]) return;
    try { SFX[name](this); } catch {}
  },
};
const SFX = {
  click: S => S.tone(720, .045, { type: 'triangle', vol: .06 }),
  key: S => S.tone(540, .03, { type: 'triangle', vol: .05 }),
  tick: S => S.tone(980, .04, { type: 'square', vol: .035 }),
  tickHi: S => S.tone(1320, .06, { type: 'square', vol: .06 }),
  phase: S => { S.tone(523, .08, { type: 'triangle', vol: .1 }); S.tone(784, .12, { type: 'triangle', vol: .1, at: .07 }); },
  start: S => [523, 659, 784, 1046].forEach((f, i) => S.tone(f, .14, { type: 'triangle', vol: .13, at: i * .08 })),
  correct: S => { S.tone(880, .09, { vol: .16 }); S.tone(1318, .2, { vol: .16, at: .08 }); },
  wrong: S => S.tone(196, .24, { type: 'sawtooth', vol: .07, slide: 110 }),
  reveal: S => [392, 523, 659, 784].forEach((f, i) => S.tone(f, .16, { type: 'triangle', vol: .12, at: i * .07 })),
  points: S => [988, 1318, 1760].forEach((f, i) => S.tone(f, .09, { type: 'square', vol: .05, at: i * .06 })),
  join: S => { S.tone(587, .1, { vol: .12 }); S.tone(880, .16, { vol: .12, at: .09 }); },
  go: S => { S.tone(1046, .12, { type: 'square', vol: .1 }); S.tone(1568, .2, { type: 'square', vol: .1, at: .1 }); },
  stop: S => { S.tone(330, .12, { type: 'square', vol: .11 }); S.tone(220, .26, { type: 'square', vol: .11, at: .11 }); },
  alarm: S => [0, .13, .26].forEach(at => S.tone(1250, .09, { type: 'square', vol: .07, at })),
  boom: S => { S.noise(1.1, { vol: .55, from: 1800, to: 80 }); S.tone(110, .7, { vol: .4, slide: 35 }); },
  pause: S => { S.tone(660, .1, { type: 'triangle', vol: .1 }); S.tone(440, .16, { type: 'triangle', vol: .1, at: .09 }); },
  resume: S => { S.tone(440, .1, { type: 'triangle', vol: .1 }); S.tone(660, .16, { type: 'triangle', vol: .1, at: .09 }); },
  pop: S => { S.tone(784, .05, { vol: .08 }); S.tone(1175, .08, { vol: .07, at: .045 }); },
  react: S => S.tone(1400, .06, { type: 'triangle', vol: .045, slide: 2100 }),
  fanfare: S => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => S.tone(f, i === 5 ? .45 : .13, { type: 'triangle', vol: .14, at: i * .12 })),
};

// Sons que respondem ao que mudou na sala (vale para host e jogadores).
let soundPrev = null;
function soundCues(s) {
  const me = Store.me?.id, g = s?.game;
  const cur = s && me ? {
    screen: s.screen, gid: g?.id, round: g?.round, phase: g?.phase, paused: !!g?.paused,
    players: s.order.length, score: s.players[me]?.score ?? 0,
    holder: g?.id === 'bomba' ? g.data.holder : null,
    right: !!g && ((g.id === 'desenho' && me in (g.data.guessed || {})) || ((g.id === 'emoji' || g.id === 'termo') && me in (g.data.solved || {}))),
  } : null;
  const p = soundPrev;
  soundPrev = cur;
  if (!p || !cur) return;
  if (cur.screen !== p.screen) { Sound.play(cur.screen === 'game' ? 'start' : cur.screen === 'podium' ? 'fanfare' : 'phase'); return; }
  if (cur.screen === 'lobby' && cur.players > p.players) Sound.play('join');
  if (cur.screen !== 'game') return;
  if (cur.gid !== p.gid) { Sound.play('start'); return; }
  if (cur.paused !== p.paused) { Sound.play(cur.paused ? 'pause' : 'resume'); return; }
  if (cur.phase !== p.phase || cur.round !== p.round) {
    if (cur.phase === 'final') Sound.play('fanfare');
    else if (cur.gid === 'bomba' && cur.phase === 'reveal') Sound.play('boom');
    else if (cur.phase === 'reveal') Sound.play('reveal');
    else if (cur.gid === 'reflexo' && cur.phase === 'go') Sound.play('go');
    else if (cur.gid === 'stop' && cur.phase === 'stopped') Sound.play('stop');
    else Sound.play('phase');
  }
  if (cur.score > p.score) setTimeout(() => Sound.play('points'), 500);
  if (cur.holder === me && p.holder !== me) Sound.play('alarm');
  if (cur.right && !p.right) Sound.play('correct');
}
let lastTickKey = '';

/* ---------- Animação do timer e do multiplicador ---------- */
function frame() {
  const gNow = Store.room?.game?.paused ? Store.room.game.paused.at : now();
  $$('.timer').forEach(el => {
    const dl = +el.dataset.deadline, dur = +el.dataset.dur, left = Math.max(0, dl - gNow);
    const secN = Math.ceil(left / 1000);
    if (secN > 0 && secN <= 5 && lastTickKey !== dl + ':' + secN) { lastTickKey = dl + ':' + secN; Sound.play(secN <= 3 ? 'tickHi' : 'tick'); }
    el.style.setProperty('--p', dur ? left / (dur * 1000) : 0);
    const num = el.querySelector('.timer-num'), sec = String(Math.ceil(left / 1000));
    if (num.textContent !== sec + 's') num.textContent = sec + 's';
    el.classList.toggle('low', left < 5000);
  });
  $$('[data-mult-start]').forEach(el => {
    if (el.dataset.frozen) return;
    const m = fatoMult(now() - +el.dataset.multStart, +el.dataset.multDur);
    el.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('now', +x.dataset.m === m));
  });
  $$('[data-countdown]').forEach(el => { const v = String(Math.max(0, Math.ceil((+el.dataset.countdown - now()) / 1000))); if (el.textContent !== v) el.textContent = v; });
  $$('[data-show-at]').forEach(el => { const show = now() >= +el.dataset.showAt; if (el.hidden === show) el.hidden = !show; });
  requestAnimationFrame(frame);
}

    input.focus();
  },
  home(form, submitter) {
    // No PC as duas ações ficam visíveis lado a lado; no celular vale a aba aberta.
    const visible = submitter && submitter.offsetParent !== null;
    const mode = visible ? (submitter.id === 'createBtn' ? 'create' : 'join') : Store.local.homeTab;
    if (mode === 'join') return Forms.join(form);
    const pr = profileOrError(); if (pr) createRoom(pr);
  },
  async join(form) {
    const pin = ($('#pin').value || '').toUpperCase().trim(), err = $('#joinErr');
    err.textContent = '';
    const pr = profileOrError(); if (!pr) return;
    if (!/^[A-Z0-9]{4}$/.test(pin)) { err.textContent = 'O código da sala tem 4 letras ou números.'; $('#pin').focus(); return; }
    const btn = $('#joinBtn'); btn.disabled = true; btn.textContent = 'Procurando a sala…';
    const arrow = $('#joinArrow'); if (arrow) arrow.disabled = true;
    const res = await joinRoom(pin, pr, null, t => {
      if (t < 6000) return;
      const b = $('#joinBtn'); if (b) b.textContent = 'Ainda procurando…';
      const hint = $('#joinHint');
      if (hint) { hint.hidden = false; hint.textContent = `Conectando à sala ${pin}. Se demorar, peça para quem criou a sala abrir a tela do PlayBox.`; }
    });
    if (!res.ok) {
      render();
      const e2 = $('#joinErr'); if (e2) e2.textContent = res.reason;
    }
  },
  mane() {
    const el = $('#maneIn'), v = parseNum(el.value);
    if (!Number.isFinite(v)) { $('#formErr').textContent = 'Digite um número, por exemplo 1500 ou 2,5.'; el.focus(); return; }
    PlayBox.submitAnswer({ value: v });
  },
  clue() {
    const g = Store.room.game, d = g.data;
    const word = d.impostor === Store.me.id ? null : IMP_WORDS[d.wi].w;
    const c = checkClue($('#clueIn').value, word);
    if (c.err) { $('#formErr').textContent = c.err; $('#clueIn').focus(); return; }
    PlayBox.submitAnswer({ clue: c.v });
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, gm = Store.room?.game;
  const ui = act.startsWith('g:') && gm ? Games[gm.id].ui : null;
  const fn = Actions[act] || (ui && ui[act.slice(2)] && ui[act.slice(2)].bind(ui));
  if (fn) { e.preventDefault(); Sound.play(act === 'g:key' ? 'key' : 'click'); fn(el, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const name = f.dataset.form, gm = Store.room?.game;
  if (name.startsWith('g:')) { const forms = gm && Games[gm.id].forms; forms && forms[name.slice(2)] && forms[name.slice(2)](f); return; }
  Forms[name]?.(f, e.submitter);
});
document.addEventListener('focusin', e => { if (e.target.id === 'pin') syncPinSlots(); });
document.addEventListener('focusout', e => { if (e.target.id === 'pin') syncPinSlots(); });
let draftT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pin') {
    const v = t.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v !== t.value) t.value = v;
    Store.local.pinDraft = v;
    syncPinSlots();
  } else if (t.id === 'nick') {
    Store.local.profile.name = t.value; saveProfile();
    const err = $('#nickErr'); if (err) err.textContent = '';
  } else if (t.id === 'clueIn') {
    const v = t.value.replace(/\s+/g, '');
    if (v !== t.value) t.value = v;
  } else if (t.dataset.stop !== undefined) {
    refreshStopUI();
    clearTimeout(draftT);
    draftT = setTimeout(() => dispatch({ type: 'draft', answers: stopInputs() }), 250);
  }
});
document.addEventListener('keydown', e => {
  // Enter num campo do Stop pula para o próximo; no último, aperta Stop se puder.
  const t = e.target;
  if (e.key === 'Escape') { closeOverlays(); return; }
  const gm = Store.room?.screen === 'game' && Store.room.game;
  if (gm && Games[gm.id].keydown && !['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName) && Games[gm.id].keydown(e, gm, Store.room, Store.me?.id)) return;
  if (t.getAttribute?.('role') === 'tab' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    selectTab(Store.local.homeTab === 'join' ? 'create' : 'join', true);
    return;
  }
  if (e.key !== 'Enter' || t.dataset?.stop === undefined) return;
  e.preventDefault();
  const next = $(`[data-stop="${+t.dataset.stop + 1}"]`);
  if (next) next.focus(); else { const b = $('#stopBtn'); if (b && !b.disabled) b.click(); }
});

/* =====================================================================
   API pública (para plugar backend ou automatizar testes)
   ===================================================================== */
const PlayBox = window.PlayBox = {
  createRoom,
  joinRoom,
  leaveRoom,
  startGame: gameId => dispatch({ type: 'host:start', game: gameId }),
  submitAnswer: payload => dispatch({ type: 'submit', ...payload }),
  castVote: (target, extra = {}) => dispatch({ type: 'vote', target, ...extra }),
  pressStop: answers => dispatch({ type: 'stop', answers }),
  nextRound: () => dispatch({ type: 'host:next' }),
  endMatch: () => dispatch({ type: 'host:end' }),
  updateScores: deltas => { if (isHost() && Store.room) { updateScores(Store.room, deltas); commit(); } },
  get state() { return Store.room; },
  Games, Transport,
};

/* =====================================================================
   Início
   ===================================================================== */
// Atualiza o aviso de conexão do lobby quando o estado da rede muda.
Transport.onStatus = () => { if (Store.room && Store.me && Store.room.screen === 'lobby') render(); };
// Quando a conexão com um servidor (re)abre, a sala se ressincroniza: o host reenvia o estado
// e o jogador pede o estado atual (ele pode ter perdido mensagens enquanto estava fora).
Transport.onLinkUp = role => {
  if (!Store.me || joinWait) return;
  if (role === 'host' && Store.room) Transport.send({ kind: 'state', state: Store.room });
  else if (role === 'client') Transport.send({ kind: 'hello' });
};
// Mantém a tela acesa durante a partida: no celular, tela apagada derruba a conexão.
const Wake = {
  lock: null,
  async on() {
    if (!('wakeLock' in navigator) || this.lock || document.visibilityState !== 'visible' || !Store.me) return;
    try { this.lock = await navigator.wakeLock.request('screen'); this.lock.addEventListener('release', () => { this.lock = null; }); } catch {}
  },
  off() { try { this.lock && this.lock.release(); } catch {} this.lock = null; },
};
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !Store.me) return;
  Wake.on();
  Transport.wake();
  if (isHost()) { if (Store.room) Transport.send({ kind: 'state', state: Store.room }); }
  else if (!joinWait) Transport.send({ kind: 'hello' });
});

async function boot() {
  Store.local.profile = loadProfile();
  const hashPin = location.hash.slice(1).toUpperCase();
  if (/^[A-Z0-9]{4}$/.test(hashPin)) { Store.local.pinDraft = hashPin; Store.local.invite = true; Store.local.homeTab = 'join'; }
  requestAnimationFrame(frame);
  let sess = Session.load();
  // Um link de convite para outra sala vale mais que a sala antiga guardada nesta aba.
  if (sess && /^[A-Z0-9]{4}$/.test(hashPin) && sess.pin !== hashPin) { Session.clear(); sess = null; }
  if (sess?.isHost) {
    const saved = loadRoom(sess.pin);
    if (saved && saved.hostId === sess.id) {
      Store.me = sess; Store.room = saved;
      Object.values(saved.players).forEach(p => { p.lastSeen = now(); });
      Transport.open(sess.pin, onMessage, 'host');
      startHost();
      commit();
      Wake.on();
      return;
    }
    Session.clear();
  } else if (sess?.pin) {
    render();
    const res = await joinRoom(sess.pin, sess.profile, sess.id);
    if (!res.ok) { Session.clear(); render(); toast('A sala anterior não está mais aberta.'); }
    return;
  }
  render();
}
boot();
</script>
