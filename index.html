<!--
  PlayBox · Party Edition
  ------------------------------------------------------------------
  Arquitetura (tudo neste arquivo):

  Transport  -> camada de rede. Abas do mesmo navegador: BroadcastChannel +
                evento "storage". Outros aparelhos: retransmissor MQTT via WebSocket.
                Para um backend real, troque só este objeto mantendo
                open(pin, onMessage) / send(msg) / close().
  Host       -> a aba que cria a sala é a autoridade: recebe ações,
                aplica as regras (Games[*].handle), roda o relógio,
                controla os bots e transmite o estado inteiro ("state").
  Clientes   -> só enviam ações (dispatch) e desenham o estado recebido.
  Games      -> cada mini-jogo é um módulo com init / phases / handle /
                bot / done / view. Para criar um jogo novo, registre outro
                objeto em Games e adicione o id em GAME_ORDER.
  API pública: window.PlayBox (createRoom, joinRoom, submitAnswer,
                castVote, pressStop, startGame, nextRound, updateScores,
                endMatch, leaveRoom).

  Observação: nesta simulação local o estado completo (incluindo
  respostas) circula entre as abas; a interface só mostra a cada um o
  que é dele. Num backend real, o servidor filtraria o estado por jogador.
-->

  --ink:#F3F4F6; --white:#FFFFFF; --muted:#9CA3AF; --dim:#6B7280;
  --primary:#6366F1; --primary-2:#4F46E5; --blue:#3B82F6;
  --amber:#FBBF24; --pink:#EC4899; --coral:#FF5F57; --red:#EF4444; --teal:#14B8A6; --lime:#A3E635;
  --ok:#22C55E; --gold:#FBBF24;

  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  min-height:100dvh;background-color:var(--bg);color:var(--ink);
  background-image:radial-gradient(1000px 560px at 50% -240px,color-mix(in srgb,var(--glow) 24%,transparent),transparent 72%);
  background-repeat:no-repeat;background-attachment:fixed;
  font-family:var(--font);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit}
ul,ol{padding:0;list-style:none}
b,strong{font-weight:700}
:focus-visible{outline:2px solid #818CF8;outline-offset:3px;border-radius:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:20px;height:20px;flex:none}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));
  background:rgba(11,11,15,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--white)}
.cube{width:30px;height:30px;flex:none;filter:drop-shadow(0 4px 12px rgba(99,102,241,.45))}
.wordmark{font-weight:800;font-size:1.3rem;letter-spacing:-.025em;line-height:1}
.top-right{display:flex;align-items:center;gap:10px}
.room-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:.82rem;color:var(--muted)}
.room-chip b{color:var(--ink);letter-spacing:.14em;font-size:.9rem}
@media (max-width:420px){ .room-chip span{display:none} }

/* ---------- Layout ---------- */
#app{padding:22px 16px 56px;max-width:1120px;margin:0 auto}
.screen.enter{animation:screenIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}}
.panel{
  background:var(--surface);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:var(--r-xl);padding:20px;
}
.panel-title{font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.label-caps{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sec-title{font-size:1rem;font-weight:700;margin-bottom:12px}
.lede{color:var(--muted);font-size:1.02rem;max-width:52ch}
.hint{color:var(--muted);font-size:.9rem}
.hint b{color:var(--ink)}
.center{text-align:center;margin-left:auto;margin-right:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.center{justify-content:center}
.err{color:#FCA5A5;font-size:.88rem;font-weight:600}
.err:empty{display:none}
.note{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;margin:12px 0;font-size:.92rem}
.banner{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#FECACA;border-radius:var(--r-md);padding:12px 16px;margin-bottom:16px;font-weight:600;font-size:.92rem}

/* ---------- Botões ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;
  border-radius:14px;background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line-2);
  font-weight:700;font-size:.97rem;letter-spacing:-.005em;line-height:1.1;white-space:nowrap;
  transition:background .18s ease,filter .18s ease,transform .12s ease,box-shadow .18s ease;
}
.btn .ic{width:18px;height:18px}
.btn:not(.primary):not(.game):hover:not(:disabled){background:rgba(255,255,255,.08)}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#6366F1,#4F46E5);border-color:transparent;color:#fff;box-shadow:0 8px 20px -4px rgba(99,102,241,.45)}
.btn.game{background:var(--g);border-color:transparent;color:var(--on-color);box-shadow:0 8px 20px -6px color-mix(in srgb,var(--g) 55%,transparent)}
.btn.ghost{background:transparent}
.btn.pill{border-radius:999px}
.btn.big{width:100%;min-height:54px;font-size:1.02rem}
.btn.sm{min-height:40px;padding:0 16px;font-size:.9rem;border-radius:12px}
.btn.xs{min-height:34px;padding:0 14px;font-size:.84rem;border-radius:999px}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.03);transition:background .15s,color .15s}
.icon-btn:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.linkish{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;font-size:.9rem;padding:6px 2px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(156,163,175,.4)}
.linkish:hover{color:var(--ink)}
.linkish .ic{width:16px;height:16px}

/* ---------- Campos ---------- */
.field{display:grid;gap:7px}
.field>span,.field>label{font-size:.8rem;font-weight:600;color:var(--muted)}
.input{
  width:100%;min-height:50px;padding:0 16px;border-radius:var(--r-md);background:var(--bg-2);
  border:1px solid var(--line-in);color:var(--ink);font-size:1rem;transition:border-color .15s,box-shadow .15s;
}
.input::placeholder{color:var(--dim)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.22)}
.input:disabled{opacity:.6}

/* ---------- Avatares e tags ---------- */
.av{
  --s:40px;display:inline-grid;place-items:center;flex:none;width:var(--s);height:var(--s);border-radius:50%;
  background:color-mix(in srgb,var(--c) 26%,#12131A);box-shadow:inset 0 0 0 2px var(--c);
  font-size:calc(var(--s) * .52);line-height:1;
}
.av-sm{--s:32px}
.av-md{--s:40px}
.av-lg{--s:52px}
.av-xl{--s:76px;box-shadow:inset 0 0 0 3px var(--c)}
.tag{display:inline-block;font-size:.68rem;font-weight:700;line-height:1;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.tag-host{color:var(--gold);border-color:rgba(251,191,36,.3)}
.tag-me{color:#A5B4FC;border-color:rgba(99,102,241,.4)}
.tag-good{color:#86EFAC;border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.1)}
.tag-bad{color:#FCA5A5;border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.1)}

/* ---------- Cards dos jogos ---------- */
.game-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.game-card{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;
  min-height:122px;padding:16px 8px 14px;border-radius:16px;color:var(--on-color);
  background:linear-gradient(165deg,color-mix(in srgb,var(--g) 82%,#fff) 0%,var(--g) 48%,color-mix(in srgb,var(--g) 82%,#000) 100%);
  border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 30px -16px color-mix(in srgb,var(--g) 75%,transparent);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
}
button.game-card:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 20px 36px -16px color-mix(in srgb,var(--g) 85%,transparent)}
button.game-card:active:not(:disabled){transform:scale(.98)}
button.game-card:disabled{filter:grayscale(.9) brightness(.45);cursor:not-allowed}
.gc-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(11,11,15,.88);color:var(--g)}
.gc-icon .ic{width:22px;height:22px}
.gc-name{font-weight:700;font-size:.84rem;line-height:1.15}
.gc-tag{font-size:.7rem;font-weight:600;line-height:1.2;opacity:.7}
.gc-done{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(11,11,15,.85);color:var(--g)}
.gc-done .ic{width:12px;height:12px;stroke-width:3}
@media (max-width:420px){ .gc-tag{display:none} .game-card{min-height:106px} }

/* ---------- Início ---------- */
.home{display:grid;gap:22px;max-width:520px;margin:0 auto;grid-template-areas:"hero" "form" "games"}
.home-hero{grid-area:hero}
.home-art{grid-area:art;display:none}
.home-form{grid-area:form;display:grid;gap:14px}
.showcase{grid-area:games}
.hero-title{display:grid;font-size:clamp(2.2rem,8vw,4.2rem);font-weight:800;line-height:1.04;letter-spacing:-.04em;color:var(--white)}
.hero-title .accent{color:var(--primary)}
.home-hero .lede{margin-top:12px;max-width:42ch}
.profile{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 14px;padding:14px 16px}
.av-btn{border-radius:50%}
.av-btn .av{transition:transform .15s}
.av-btn:hover .av{transform:scale(1.04)}
.profile-main{display:grid;gap:8px;min-width:0}
.nick-field{display:grid;gap:2px}
.nick-field>label{font-size:.74rem;font-weight:600;color:var(--muted)}
.nick-wrap{display:flex;align-items:center;gap:6px;color:var(--dim)}
.nick-input{width:100%;min-width:0;background:transparent;border:0;color:var(--ink);font-weight:700;font-size:1.05rem;padding:2px 0;border-bottom:1px solid transparent}
.nick-input:focus{outline:none;border-bottom-color:var(--primary)}
.nick-input::placeholder{color:var(--dim);font-weight:500}
.nick-wrap .ic{width:15px;height:15px}
.swatches{display:flex;flex-wrap:nowrap;gap:7px}
.sw{flex:none;width:17px;height:17px;border-radius:50%;background:var(--c);transition:transform .15s}
.sw:hover{transform:scale(1.15)}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.chev .ic{transition:transform .2s}
.chev[aria-expanded="true"] .ic{transform:rotate(180deg)}
.picker{grid-column:1 / -1;display:grid;gap:10px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.picker[hidden]{display:none}
.picker.opening{animation:pickerIn .22s ease}
@keyframes pickerIn{from{opacity:0;transform:translateY(-4px)}}
.emoji-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.emo{aspect-ratio:1;border-radius:50%;font-size:1.25rem;display:grid;place-items:center;transition:background .12s}
.emo:hover{background:rgba(255,255,255,.06)}
.emo.on{background:rgba(99,102,241,.18);box-shadow:inset 0 0 0 2px var(--primary)}
.profile .err{grid-column:1 / -1}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line)}
.tab{min-height:40px;border-radius:999px;font-weight:700;font-size:.9rem;color:var(--muted);transition:background .18s,color .18s,box-shadow .18s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:linear-gradient(180deg,#6366F1,#4F46E5);color:#fff;box-shadow:0 6px 16px -6px rgba(99,102,241,.6)}
.tab-body{display:grid;gap:14px}
.tab-body[hidden]{display:none}
.tb-title{display:none;font-weight:700;font-size:.98rem}
.pin-row{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.pin-slots{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.slot{
  display:grid;place-items:center;height:58px;border-radius:13px;background:var(--bg-2);border:1px solid var(--line-in);
  font-size:1.5rem;font-weight:700;color:var(--ink);transition:border-color .15s,box-shadow .15s;
}
.slot.empty::after{content:"";width:12px;height:2px;border-radius:2px;background:var(--dim);opacity:.6}
.slot.active{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.22)}
.pin-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;font-size:16px;cursor:text;text-transform:uppercase}
.pin-go{display:none;width:58px;min-height:58px;padding:0;border-radius:13px}
.pin-go .ic{width:20px;height:20px}
.create-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:999px;
  background:linear-gradient(180deg,#6366F1,#4F46E5);color:#fff;font-weight:700;font-size:1.05rem;
  box-shadow:0 8px 20px -4px rgba(99,102,241,.45);transition:filter .18s,transform .12s;
}
.create-btn:hover{filter:brightness(1.1)}
.create-btn:active{transform:scale(.98)}
.quick{justify-self:center}
/* Convite: quem chega pelo link vê só a entrada naquela sala */
.home-form.invite .tabs,.home-form.invite #panel-create{display:none !important}
.home-form.invite .tb-title{display:block;font-size:1.05rem}
#joinHint{text-align:center}
@media (min-width:900px){ .home-form.invite .join-card{grid-column:1 / -1;max-width:560px;width:100%;justify-self:center} }
@media (min-width:900px){
  .home{
    max-width:1000px;padding-top:32px;row-gap:28px;column-gap:40px;
    grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);grid-template-areas:"hero art" "form form" "games games";
  }
  .home-art{display:grid;place-items:center}
  .home-hero{align-self:center}
  .home-form{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .profile{grid-column:1 / -1;grid-template-columns:auto minmax(0,1fr) auto}
  .profile-main{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:24px}
  .tabs{display:none}
  .tab-body[hidden]{display:grid}
  .tb-title{display:block}
  .join-card{padding:18px 20px}
  .pin-row{grid-template-columns:minmax(0,1fr) auto}
  .pin-go{display:inline-flex}
  .join-big{display:none}
  .create-card{align-content:center;gap:12px}
  .create-btn{min-height:96px;border-radius:20px;font-size:1.2rem}
  .create-card .hint{text-align:center}
  .home .game-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
}
.cube-art{width:min(240px,100%);height:auto;filter:drop-shadow(0 30px 60px rgba(99,102,241,.45))}

/* ---------- Lobby ---------- */
.net-status{display:flex;align-items:flex-start;gap:8px;font-size:.84rem;color:var(--muted);text-align:left;max-width:36ch}
.net-dot{flex:none;width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--dim)}
.net-status.is-on .net-dot{background:var(--ok);box-shadow:0 0 10px rgba(34,197,94,.7)}
.net-status.is-wait .net-dot{background:var(--amber);animation:blink 1s ease-in-out infinite alternate}
.net-status.is-off .net-dot{background:var(--red)}
@keyframes blink{to{opacity:.3}}
.lobby-caption{text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:16px}
.lobby-caption b{color:var(--ink)}
.lobby-grid{display:grid;gap:16px;max-width:560px;margin:0 auto}
.lobby-left{display:grid;gap:16px}
@media (min-width:960px){
  .lobby-grid{max-width:none;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start}
  .lobby-left{position:sticky;top:84px}
}
.pin-block{display:grid;gap:14px;justify-items:center;text-align:center}
.pin-keys{display:flex;gap:10px}
.key{
  display:grid;place-items:center;width:clamp(54px,15vw,64px);height:clamp(60px,17vw,70px);border-radius:14px;
  background:var(--bg-2);border:1px solid var(--line-2);font-weight:800;font-size:clamp(1.7rem,7vw,2.1rem);color:var(--white);
}
.pl-list{display:grid;gap:2px}
.pl-row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto 22px;align-items:center;gap:12px;padding:9px 6px;border-radius:12px}
.pl-row:hover{background:rgba(255,255,255,.025)}
.pl-row.off{opacity:.45}
.pl-name{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:600;font-size:.95rem;min-width:0}
.pl-pts{font-size:.85rem;color:var(--muted);font-weight:600}
.crown{display:grid;place-items:center;color:var(--gold)}
.crown .ic{width:18px;height:18px}
.pl-kick{position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;color:var(--dim);font-size:1.1rem;line-height:1;opacity:0;transition:opacity .15s}
.pl-row:hover .pl-kick,.pl-kick:focus-visible{opacity:1}
.pl-kick:hover{color:var(--ink);background:rgba(255,255,255,.06)}
@media (hover:none){ .pl-kick{opacity:1;position:static;transform:none} .pl-row{grid-template-columns:auto minmax(0,1fr) auto 22px 26px} }
.pl-row.waiting{color:var(--dim);border:1px dashed var(--line-2);margin-top:6px;font-size:.9rem}
.wait-dot{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px dashed var(--line-2);color:var(--dim)}
.wait-dot .ic{width:16px;height:16px}
.ring{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dim);justify-self:center}
.gp-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line)}
.seg button{min-width:40px;height:32px;border-radius:999px;font-weight:700;font-size:.9rem;color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:0 4px 14px -4px rgba(59,130,246,.6)}
.seg-static{font-weight:700;color:var(--ink)}
.lobby-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}

/* ---------- Partida ---------- */
.game{max-width:760px;margin:0 auto}
.game-top{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;margin-bottom:14px}
.gt-round{text-align:center;font-weight:600;font-size:.92rem;color:var(--ink)}
.gt-time{display:inline-flex;align-items:center;gap:6px;min-width:38px;justify-content:flex-end;color:var(--g);font-weight:700}
.gt-time .ic{width:18px;height:18px}
.timer-num{font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.game-top .timer-track{grid-column:1 / -1;height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.timer-fill{height:100%;border-radius:999px;background:var(--g);transform-origin:left center;transform:scaleX(var(--p,0));box-shadow:0 0 12px color-mix(in srgb,var(--g) 70%,transparent)}
.game-top:not(.timer) .timer-fill{transform:scaleX(0)}
.timer.low .gt-time{color:var(--red)}
.timer.low .timer-fill{background:var(--red)}
.stage{
  position:relative;overflow:hidden;border-radius:var(--r-xl);padding:clamp(18px,4vw,26px);
  /* Sem backdrop-filter aqui: ele "achata" o 3D da carta do Impostor no Chrome. */
  background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--g) 20%,transparent),transparent 65%),rgba(18,19,26,.92);
  border:1px solid color-mix(in srgb,var(--g) 28%,var(--line));
  box-shadow:0 30px 80px -40px color-mix(in srgb,var(--g) 60%,transparent);
}
.stage-head{display:flex;align-items:center;gap:14px}
.sh-icon{display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:50%;background:var(--g);color:var(--on-color);box-shadow:0 0 24px -4px color-mix(in srgb,var(--g) 70%,transparent)}
.sh-icon .ic{width:22px;height:22px}
.sh-name{font-size:1.15rem;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.sh-sub{font-size:.86rem;color:var(--muted)}
.sh-how{margin-top:12px;font-size:.88rem;color:var(--muted);max-width:62ch}
.stage-body{margin-top:20px}
.stage-body>*+*{margin-top:16px}
.prompt{font-size:clamp(1.25rem,4.2vw,1.65rem);font-weight:700;line-height:1.25;letter-spacing:-.02em;max-width:34ch}
.prompt.sm{font-size:clamp(1rem,3.2vw,1.12rem);color:var(--muted);font-weight:600}
.ask{font-size:1.12rem;font-weight:700;letter-spacing:-.01em}
.hostbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.hb-label{font-size:.8rem;color:var(--dim);font-weight:600;margin-right:auto}
.strip{
  display:flex;gap:6px;overflow-x:auto;justify-content:safe center;margin:22px calc(-1 * clamp(18px,4vw,26px)) calc(-1 * clamp(18px,4vw,26px));
  padding:14px clamp(12px,3vw,20px) 16px;border-top:1px solid var(--line);background:rgba(11,11,15,.35);scrollbar-width:none;
}
.strip::-webkit-scrollbar{display:none}
.sp{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;max-width:76px;text-align:center}
.sp.off{opacity:.4}
.sp.me .av{box-shadow:inset 0 0 0 2px var(--c),0 0 0 2px var(--bg),0 0 0 4px var(--primary)}
.sp-name{font-size:.74rem;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-pts{font-size:.66rem;color:var(--dim);line-height:1}
.sp-stat{display:grid;place-items:center;width:18px;height:18px;margin-top:2px;border-radius:50%}
.sp-stat.is-ok{background:var(--ok);color:#052e16}
.sp-stat.is-ok .ic{width:11px;height:11px;stroke-width:3.2}
.sp-stat.is-wait{border:1.5px solid var(--dim)}
.sp-stat.is-out{border:1.5px dashed var(--line-2)}
.delta{width:auto;padding:2px 7px;border-radius:999px;background:var(--gold);color:#1C1300;font-weight:800;font-size:.72rem;line-height:1.2}
.enter .delta{animation:pop .5s .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}

/* Peças comuns dos jogos */
.wait{display:grid;gap:8px;place-items:center;text-align:center;padding:30px 10px}
.wait-main{font-weight:700;font-size:1.2rem}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.answer-form{display:grid;gap:12px;max-width:460px}
.num-field{position:relative}
.num-field .input{font-weight:800;font-size:1.6rem;min-height:62px;padding-right:110px}
.unit{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pick{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:var(--r-lg);text-align:center;
  background:var(--bg-2);border:1px solid var(--line-in);transition:border-color .15s,background .15s,transform .12s;
}
.pick:hover:not(:disabled){border-color:color-mix(in srgb,var(--g) 50%,var(--line-in))}
.pick:active:not(:disabled){transform:scale(.98)}
.pick:disabled{cursor:default;opacity:.5}
.pick.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 14%,var(--bg-2));box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 22%,transparent)}
.pick-name{font-weight:600;font-size:.9rem;line-height:1.2}
.pick-val{font-weight:800;font-size:1.2rem;line-height:1.15;word-break:break-word}
.answer-big{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px}
.ab-num{font-weight:800;font-size:clamp(2.6rem,10vw,4rem);line-height:1;letter-spacing:-.04em;color:var(--g)}
.ab-unit{font-weight:600;color:var(--muted)}
.res-list{display:grid;gap:6px}
.res-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line)}
.res-who{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.res-name{font-weight:600}
.res-val{font-weight:700;text-align:right}
.res-sub{display:block;font-size:.76rem;color:var(--muted);font-weight:500}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.bar-track{position:relative;height:34px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden}
.bar-fill{height:100%;width:var(--w);background:linear-gradient(90deg,color-mix(in srgb,var(--g) 55%,transparent),var(--g));transform-origin:left}
.enter .bar-fill{animation:barGrow .7s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes barGrow{from{transform:scaleX(0)}}
.bar-label{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:600;font-size:.88rem;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.bar-n{font-weight:800;min-width:2ch;text-align:right}
.verdict{font-size:clamp(1.5rem,5.5vw,2.1rem);font-weight:800;line-height:1.1;letter-spacing:-.03em}
.reminder{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 14px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line-2);font-size:.88rem;color:var(--muted)}
.reminder b{color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
.reminder.imp{border-color:rgba(255,95,87,.4);color:#FECACA}

/* Impostor */
.role-wrap{display:grid;gap:14px;justify-items:center;text-align:center}
.role-deck{position:relative;width:min(210px,58vw);aspect-ratio:3/4;margin:6px 0 10px}
.role-deck::before,.role-deck::after{
  content:"";position:absolute;inset:6% -4%;border-radius:22px;background:linear-gradient(160deg,#2A2C3A,#16171F);
  border:1px solid var(--line);transform:rotate(-12deg) translateX(-26%);z-index:0;
}
.role-deck::after{transform:rotate(12deg) translateX(26%)}
.role-card{position:absolute;inset:0;z-index:1;perspective:1100px;border-radius:22px}
.rc-face{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;
  border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .55s cubic-bezier(.3,.7,.2,1);
}
.rc-front{background:linear-gradient(165deg,#FF7A73,#EF4444 60%,#C81E2E);color:#1C0303;box-shadow:0 24px 50px -16px rgba(239,68,68,.6);border:1px solid rgba(255,255,255,.25)}
.rc-front small{font-size:.78rem;font-weight:700;opacity:.65}
.rc-mask{width:64px;height:64px}
.rc-back{background:linear-gradient(165deg,#1C1E29,#12131A);border:1px solid var(--line-2);color:var(--ink);transform:rotateY(180deg)}
.rc-back b{font-size:clamp(1.5rem,7vw,2rem);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.rc-back small{font-size:.8rem;color:var(--muted);font-weight:600}
.rc-back span{font-size:.82rem;color:var(--muted);line-height:1.4}
.rc-back.is-imp{background:linear-gradient(165deg,#3B0D10,#1A0A0C);border-color:rgba(255,95,87,.5)}
.rc-back.is-imp b{color:var(--coral)}
.role-card.flipped .rc-front{transform:rotateY(-180deg)}
.role-card.flipped .rc-back{transform:rotateY(0)}
.role-title{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.clue-pill{display:grid;justify-items:center;gap:0;min-width:min(260px,80%);padding:10px 28px 12px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line-2);position:relative;margin-top:8px}
.clue-pill small{position:absolute;top:-10px;left:50%;transform:translateX(-50%);padding:2px 10px;border-radius:999px;background:var(--surface-solid);border:1px solid var(--line-2);font-size:.7rem;font-weight:600;color:var(--muted)}
.clue-pill b{font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase}
.role-wrap .btn{max-width:360px}

/* Onde fica isso? */
.postcard{display:block;width:min(100%, calc(36vh * 1.6));height:auto;margin-inline:auto;border-radius:18px;border:1px solid var(--line-2)}
.geo-kind{display:flex;justify-content:center}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;min-height:58px;padding:10px 16px;
  border-radius:16px;background:var(--bg-2);border:1px solid var(--line-in);text-align:left;font-weight:600;font-size:.98rem;line-height:1.2;
  transition:border-color .15s,background .15s,transform .12s;
}
.choice:hover:not(:disabled){border-color:color-mix(in srgb,var(--g) 50%,var(--line-in))}
.choice:active:not(:disabled){transform:scale(.98)}
.choice:disabled{cursor:default}
.choice.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 16%,var(--bg-2))}
.choice.right{border-color:var(--ok);background:rgba(34,197,94,.14)}
.choice.wrong{opacity:.45}
.choice-who{display:flex;flex-wrap:wrap;gap:4px}
.choice-who .av{--s:22px;font-size:12px}

/* Stop */
.stop-letter{
  display:grid;place-items:center;width:84px;height:84px;margin:0 auto;border-radius:50%;background:var(--bg);
  border:2px solid var(--lime);box-shadow:0 0 22px -2px rgba(163,230,53,.55),inset 0 0 18px -6px rgba(163,230,53,.45);
  font-size:2.5rem;font-weight:800;color:var(--white);line-height:1;
}
.stop-fields{display:grid;gap:8px}
.stop-field{position:relative;display:block}
.stop-field .input{padding-left:40px;padding-right:118px;background:rgba(11,11,15,.55)}
.sf-num{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--dim);font-weight:600;font-size:.92rem;pointer-events:none}
.sf-cat{position:absolute;right:44px;top:50%;transform:translateY(-50%);font-size:.72rem;font-weight:700;color:var(--muted);padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);pointer-events:none}
.sf-ok{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);color:transparent;transition:background .15s,border-color .15s}
.sf-ok .ic{width:11px;height:11px;stroke-width:3.2}
.stop-field.ok .sf-ok{background:var(--lime);border-color:var(--lime);color:#1A2E05}
.stop-btn{
  width:100%;min-height:54px;border-radius:999px;border:0;background:var(--lime);color:#1A2E05;font-weight:800;font-size:1.05rem;letter-spacing:.06em;
  box-shadow:0 8px 22px -6px rgba(163,230,53,.55);
}
.stop-banner{text-align:center;font-size:clamp(1.5rem,6vw,2.1rem);font-weight:800;color:var(--lime);letter-spacing:-.02em}
.enter .stop-banner{animation:slam .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes slam{from{transform:scale(1.6);opacity:0}}
.vgrid{display:grid;gap:14px}
@media (min-width:720px){ .vgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.vblock h3{font-size:.95rem;font-weight:700;margin-bottom:8px}
.vblock ul{display:grid;gap:6px}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:6px 8px 6px 6px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line)}
.vrow .av{grid-row:span 2}
.vans{font-weight:700;font-size:.98rem;line-height:1.2;word-break:break-word}
.vname{grid-column:2;font-size:.74rem;color:var(--muted);line-height:1.2}
.vside{grid-column:3;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:.74rem;color:var(--muted);text-align:right}
.vrow.bad .vans{text-decoration:line-through;color:var(--dim)}
.vbtn{font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:999px;color:var(--muted);border:1px solid var(--line-2)}
.vbtn[aria-pressed="true"]{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.5);color:#FCA5A5}
.pts{font-weight:800;color:var(--lime)}

/* Fato ou Fake */
.ff-quote{padding:20px 22px;border-radius:18px;background:rgba(11,11,15,.6);border:1px solid color-mix(in srgb,var(--g) 30%,var(--line));font-size:clamp(1.05rem,3.6vw,1.3rem);font-weight:600;line-height:1.45;text-align:center}
.ff-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ff{min-height:54px;border-radius:999px;font-weight:700;font-size:1rem;transition:filter .15s,transform .12s,opacity .2s}
.ff:active:not(:disabled){transform:scale(.98)}
.ff-true{background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;box-shadow:0 8px 20px -4px rgba(59,130,246,.5)}
.ff-false{background:rgba(11,11,15,.55);border:1px solid var(--line-2);color:var(--ink)}
.ff:hover:not(:disabled){filter:brightness(1.12)}
.ff:disabled{cursor:default}
.ff:disabled:not(.on){opacity:.3}
.ff.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.mult-wrap{display:grid;justify-items:center;gap:8px}
.mult-row{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:min(280px,100%);padding:4px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line)}
.mult-row span{display:grid;place-items:center;height:32px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--dim);transition:background .2s,color .2s}
.mult-row span.now{background:var(--blue);color:#fff;box-shadow:0 4px 14px -4px rgba(59,130,246,.6)}

/* ---------- Desenha Aí ---------- */
.dw-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dw-choice{
  min-height:96px;padding:12px;border-radius:18px;background:var(--bg-2);border:1px solid var(--line-in);
  font-weight:800;font-size:clamp(.95rem,3.4vw,1.15rem);text-transform:capitalize;line-height:1.15;transition:border-color .15s,transform .12s,background .15s;
}
.dw-choice:hover:not(:disabled){border-color:var(--g);background:color-mix(in srgb,var(--g) 12%,var(--bg-2))}
.dw-choice:active:not(:disabled){transform:scale(.97)}
.dw-choice.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 22%,var(--bg-2))}
.dw-board-wrap{position:relative}
.dw-board{
  display:block;width:100%;height:auto;aspect-ratio:4/3;background:#fff;border-radius:18px;touch-action:none;
  box-shadow:0 18px 40px -20px color-mix(in srgb,var(--g) 80%,transparent),0 0 0 1px rgba(255,255,255,.08);
}
.dw-board.can-draw{cursor:crosshair;box-shadow:0 18px 40px -20px color-mix(in srgb,var(--g) 80%,transparent),0 0 0 3px var(--g)}
.dw-word{text-align:center;font-size:1rem;color:var(--muted)}
.dw-word b{display:block;margin-top:2px;font-size:clamp(1.5rem,6vw,2rem);font-weight:800;color:var(--white);text-transform:uppercase;letter-spacing:.04em}
.dw-hint{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:7px;min-height:30px}
.dw-hint i{display:block;width:clamp(16px,4.5vw,24px);height:4px;border-radius:2px;background:var(--ink)}
.dw-hint span{font-weight:800;line-height:1}
.dw-hint+.hint{margin-top:6px}
.dw-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;padding:10px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line)}
.dw-sw{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);transition:transform .12s}
.dw-sw:hover{transform:scale(1.1)}
.dw-sw.on{box-shadow:0 0 0 2px var(--bg-2),0 0 0 4px var(--g)}
.dw-sw.is-eraser{color:#374151}
.dw-sw.is-eraser .ic{width:16px;height:16px}
.dw-sep{width:1px;height:24px;background:var(--line-2);margin:0 2px}
.dw-size{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line)}
.dw-size i{display:block;width:var(--d);height:var(--d);border-radius:50%;background:var(--ink)}
.dw-size.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 18%,transparent)}
.dw-guess{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.dw-tools{flex-direction:column;align-items:stretch;gap:9px}
.dw-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px}
.dw-tool{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.03);transition:background .15s,color .15s,border-color .15s}
.dw-tool:hover{color:var(--ink)}
.dw-tool.on{color:var(--ink);border-color:var(--g);background:color-mix(in srgb,var(--g) 22%,transparent)}
.dw-row .dw-sw{width:28px;height:28px}
.dw-custom{position:relative;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;cursor:pointer;background:conic-gradient(#EF4444,#FBBF24,#22C55E,#3B82F6,#8B5CF6,#EC4899,#EF4444);box-shadow:0 0 0 2px var(--bg-2),0 0 0 3.5px var(--c)}
.dw-custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.dw-size-row{gap:12px}
.dw-size-row input[type=range]{flex:1;max-width:260px;accent-color:var(--g)}
.dw-size-dot{display:grid;place-items:center;width:44px;height:44px;flex:none}
.dw-size-dot::after{content:"";width:var(--d);height:var(--d);border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--line-2)}
.dw-size-n{min-width:40px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.dw-hint i.open{display:grid;place-items:end center;height:30px;background:none;border-bottom:4px solid var(--g);border-radius:0;font-style:normal;font-weight:800;font-size:20px;line-height:1;padding-bottom:3px}
.help-btn{display:inline-flex;align-items:center;gap:8px;margin:12px auto 0;padding:8px 14px 8px 11px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--warn,#FBBF24) 70%,transparent);background:color-mix(in srgb,#FBBF24 9%,transparent);color:var(--ink);font-weight:700;font-size:14px;transition:background .15s,transform .12s}
.help-btn:not(:disabled):hover{background:color-mix(in srgb,#FBBF24 18%,transparent);transform:translateY(-1px)}
.help-btn .ic{width:18px;height:18px;color:#FBBF24}
.help-btn small{font-size:12px;font-weight:700;color:var(--muted);padding-left:8px;border-left:1px solid var(--line-2)}
.help-btn:disabled{opacity:.55;cursor:not-allowed}
.stage-body .help-btn{display:flex;width:max-content}
.help-note{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px auto 0;padding:9px 14px;border-radius:14px;background:color-mix(in srgb,#FBBF24 12%,transparent);font-size:14px;text-align:center}
.help-note .ic{width:18px;height:18px;flex:none;color:#FBBF24}
.choice.cut{opacity:.28;text-decoration:line-through}
/* Mentira Convincente */
.fib-fact{margin-inline:auto}
.fib-blank{display:inline-block;min-width:3em;padding:0 .3em;border-bottom:3px dashed var(--g);color:var(--g);text-align:center}
.fib-blank.is-true{border-bottom-style:solid;border-color:var(--ok);color:var(--ok)}
.fib-choices .choice{flex-direction:row;align-items:center;justify-content:space-between}
.fib-list{display:grid;gap:8px;list-style:none;padding:0;margin:14px 0 0}
.fib-row{padding:12px 14px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line)}
.fib-row.is-true{border-color:var(--ok);background:rgba(34,197,94,.1)}
.fib-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.fib-by,.fib-who{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.fib-who{display:flex;margin-top:8px}
/* Legenda Maluca */
.cap-scene{max-width:460px;margin:0 auto 14px;padding:18px;border-radius:22px;background:var(--bg-2);border:1px solid var(--line);text-align:center}
.cap-emoji{font-size:clamp(3.2rem,14vw,5rem);line-height:1.15;letter-spacing:.06em}
.cap-scene figcaption{margin-top:8px;color:var(--muted);font-size:14px}
.cap-list{display:grid;gap:8px}
.cap-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 16px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line);text-align:left;font-weight:600;font-size:1.02rem;line-height:1.3;transition:border-color .15s,background .15s,transform .12s}
.cap-opt:not(:disabled):hover{border-color:color-mix(in srgb,var(--g) 50%,var(--line))}
.cap-opt:not(:disabled):active{transform:scale(.99)}
.cap-opt.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 16%,var(--bg-2))}
.cap-opt:disabled{opacity:.6;cursor:default}
.res-row.is-top{border-color:var(--g);background:color-mix(in srgb,var(--g) 12%,var(--bg-2))}
.res-row.is-over{opacity:.55}
/* Preço Certo */
.pc-card{display:flex;align-items:center;gap:14px;max-width:520px;margin:0 auto 14px;padding:16px 18px;border-radius:20px;background:var(--bg-2);border:1px solid var(--line)}
.pc-emoji{font-size:2.6rem;line-height:1}
.pc-item{margin:0 0 6px;font-size:1.12rem;font-weight:700;line-height:1.25}
.pc-field{display:flex;align-items:center;gap:10px}
.pc-field .unit{position:static;transform:none;flex:none;font-size:1.05rem}
.pc-field .input{flex:1;min-width:0;padding-right:16px}
/* Linha do Tempo */
.tl-list{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.tl-item{display:flex;align-items:center;gap:8px}
.tl-main{flex:1;display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line);text-align:left;font-weight:600;line-height:1.25;transition:border-color .15s,background .15s,transform .15s}
button.tl-main:hover{border-color:color-mix(in srgb,var(--g) 45%,var(--line))}
.tl-item.sel .tl-main{border-color:var(--g);background:color-mix(in srgb,var(--g) 18%,var(--bg-2));transform:scale(1.015)}
.tl-n{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--g) 22%,transparent);font-size:13px;font-weight:800}
.tl-year{flex:none;min-width:48px;font-weight:800;color:var(--g);font-variant-numeric:tabular-nums}
.tl-arrows{display:flex;gap:6px}
.tl-item.ok .tl-main{border-color:var(--ok)}
.tl-item.bad .tl-main{border-color:rgba(239,68,68,.55)}
.tl-list.is-answer{margin-bottom:14px}
.tl-edge{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tl-edge .ic{width:14px;height:14px}
.ic.flip-y{transform:scaleY(-1)}
/* Duelo de Digitação */
.ty-ready{display:grid;justify-items:center;gap:10px;padding:20px 0}
.ty-count{font-size:clamp(4rem,18vw,6.5rem);font-weight:800;line-height:1;color:var(--g);font-variant-numeric:tabular-nums}
.ty-target{margin:0 auto 12px;padding:16px 18px;border-radius:18px;background:var(--bg-2);border:1px solid var(--line);font-size:clamp(1.15rem,4.4vw,1.45rem);font-weight:600;line-height:1.6;user-select:none;-webkit-user-select:none}
.ty-c{color:var(--muted);border-radius:3px}
.ty-c.ok{color:var(--ink)}
.ty-c.bad{color:#fff;background:#EF4444}
.ty-c.cur{color:var(--ink);box-shadow:inset 0 -3px 0 var(--g)}
.ty-target.is-done{color:var(--ink);text-align:center}
.ty-input{font-size:1.1rem}
.ty-input.is-wrong{border-color:#EF4444;box-shadow:0 0 0 3px rgba(239,68,68,.2)}
.ty-lanes{display:grid;gap:8px;list-style:none;padding:0;margin:14px 0 0}
.ty-lane{display:grid;grid-template-columns:auto minmax(56px,110px) minmax(0,1fr) 30px;align-items:center;gap:10px;font-size:14px}
.ty-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ty-track{height:10px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden}
.ty-track i{display:block;height:100%;border-radius:inherit;background:var(--g);transition:width .35s ease}
.ty-lane.is-done .ty-track i{background:var(--ok)}
.ty-pos{text-align:right;color:var(--g)}
/* Logo */
.logo-mark{border-radius:9px;object-fit:cover;filter:drop-shadow(0 4px 12px rgba(139,92,246,.5))}
.logo-art{display:block;width:min(320px,100%);height:auto;border-radius:22%;filter:drop-shadow(0 30px 60px rgba(139,92,246,.45));animation:logoFloat 5s ease-in-out infinite}
@keyframes logoFloat{50%{transform:translateY(-10px) rotate(-1.5deg)}}
@media (prefers-reduced-motion:reduce){.logo-art{animation:none}}
.tv-logo{display:block;margin:0 auto 10px;width:clamp(72px,8vw,120px);height:auto;border-radius:22%;filter:drop-shadow(0 16px 40px rgba(139,92,246,.5))}
/* Tela de jogo do tamanho da janela: topo, cabeçalho, placar e botões sempre à vista */
body.in-game.in-room #app{padding-top:10px;padding-bottom:10px}
body.in-game .screen.game{--chrome-h:360px;display:flex;flex-direction:column;height:calc(100dvh - var(--top-h,60px) - 20px);min-height:440px}
body.in-game .screen.game > *{flex-shrink:0}
body.in-game .screen.game > .stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
body.in-game .stage > *{flex-shrink:0}
body.in-game .stage > .stage-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 6px 10px;margin-inline:-6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
body.in-game .hostbar{padding-right:64px}
body.in-game .game-top{margin-bottom:10px}
/* Quadros e mapas encolhem para caber na altura disponível */
body.in-game #dwBoard,body.in-game #telBoard{width:min(100%,calc((100dvh - var(--chrome-h) - 130px) * 4 / 3));margin-inline:auto}
body.in-game .dw-board-wrap{display:flex;justify-content:center}
body.in-game .map-wrap{width:min(100%,calc((100dvh - var(--chrome-h) - 150px) * 2));margin-inline:auto}
body.in-game .sp-pair{max-width:calc((100dvh - var(--chrome-h)) / .7 * 2 + 10px);margin-inline:auto}
body.in-game .rt-pad{width:min(70vw,260px,calc(100dvh - var(--chrome-h) - 40px))}
/* Telas baixas (notebook, Chromebook, celular deitado): tudo mais compacto */
@media (max-height:780px){
  body.in-game .stage{padding:14px 18px}
  body.in-game .stage-body{margin-top:12px}
  body.in-game .stage-body>*+*{margin-top:12px}
  body.in-game .sh-icon{width:38px;height:38px}
  body.in-game .sh-how{margin-top:6px;font-size:.82rem}
  body.in-game .strip{margin-top:12px;padding-top:8px;padding-bottom:10px}
  body.in-game .strip .av-md{--s:34px}
  body.in-game .hostbar{margin-top:8px}
  body.in-game .screen.game{--chrome-h:300px}
}
@media (max-height:560px){ body.in-game .sh-how,body.in-game .stage-head .sh-sub{display:none} body.in-game .screen.game{--chrome-h:240px} }
/* Telas largas (monitor, notebook): placar numa coluna ao lado do jogo */
@media (min-width:1180px) and (min-height:600px){
  #app{max-width:1320px}
  body.in-game .game{max-width:1240px}
  body.in-game .screen.game{--chrome-h:270px}
  body.in-game .stage{padding-right:calc(250px + 28px)}
  body.in-game .stage > .strip{position:absolute;top:0;right:0;bottom:0;width:250px;margin:0;flex-direction:column;justify-content:flex-start;gap:2px;overflow-y:auto;border-top:0;border-left:1px solid var(--line);padding:16px 10px}
  body.in-game .stage > .strip::before{content:"Placar";padding:0 8px 8px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  body.in-game .strip .sp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"av name st" "av pts st";align-items:center;column-gap:10px;row-gap:0;min-width:0;max-width:none;text-align:left;padding:6px 8px;border-radius:12px}
  body.in-game .strip .sp.me{background:rgba(255,255,255,.05)}
  body.in-game .strip .sp > .throw-tgt{grid-area:av}
  body.in-game .strip .sp-name{grid-area:name;font-size:.86rem}
  body.in-game .strip .sp-pts{grid-area:pts;font-size:.74rem}
  body.in-game .strip .sp-stat{grid-area:st;margin:0}
}
/* Tela inicial em notebook baixo: logo e título menores para o formulário aparecer sem rolar */
@media (min-width:900px) and (max-height:820px){ .home{padding-top:4px;row-gap:16px} .home-hero .hero-title{font-size:clamp(2rem,7.2vh,3.6rem)} .logo-art{width:min(320px,34vh)} }
/* Seções que abrem e fecham */
.fold-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.fold-head .panel-title{margin:0}
.fold-head small{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;color:var(--muted);text-align:right}
.fold-head .ic{flex:none;color:var(--muted);transition:transform .2s}
.fold.is-open .fold-head .ic{transform:rotate(180deg)}
.fold:not(.is-open) .fold-body{display:none}
.fold .fold-body{margin-top:14px}
/* Termo em tela larga e baixa: tabuleiro ao lado do teclado */
@media (min-width:900px) and (max-height:900px){
  body.in-game .stage-body:has(> .tm-board:first-child){display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:28px;align-items:center;align-content:center}
  body.in-game .stage-body:has(> .tm-board:first-child) > *{grid-column:2;margin-top:10px}
  body.in-game .stage-body:has(> .tm-board:first-child) > .tm-board{grid-column:1;grid-row:1 / span 4;margin-top:0}
}
/* Desenho em tela larga e baixa: ferramentas ao lado do quadro */
@media (min-width:900px) and (max-height:900px){
  body.in-game .stage-body:has(.can-draw){display:grid;grid-template-columns:auto minmax(240px,300px);column-gap:20px;align-content:start;justify-content:center}
  body.in-game .stage-body:has(.can-draw) > *{grid-column:1 / -1}
  body.in-game .stage-body:has(.can-draw) > .dw-board-wrap{grid-column:1;grid-row:span 8}
  body.in-game .stage-body:has(.can-draw) > .dw-board-wrap ~ *{grid-column:2}
  body.in-game .stage-body:has(.can-draw) > .dw-tools{margin-top:0}
}
body.in-game .tm-row{grid-template-columns:repeat(5,clamp(34px,min(12vw,6.6vh),56px))}
body.in-game .tm-k{height:clamp(38px,6.4vh,52px)}
@media (max-height:780px){ body.in-game .postcard{width:min(100%,calc(28vh * 1.6))} body.in-game .choice{min-height:48px} }
/* Celular em jogo: barra do host numa linha só, explicação recolhida e placar mais baixo */
@media (max-width:600px){
  body.in-game .hb-label{display:none}
  body.in-game .hostbar{flex-wrap:nowrap;gap:6px;padding-right:58px}
  body.in-game .hostbar .btn{min-height:34px;padding:0 10px;font-size:.8rem;white-space:nowrap}
  body.in-game .sh-how{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  body.in-game .sh-how:focus{-webkit-line-clamp:unset;outline:none}
  body.in-game .joker-btn{flex-direction:row;gap:6px;padding:5px 12px;font-size:12.5px;margin-bottom:6px}
  body.in-game .joker-btn small{display:none}
  body.in-game .strip{margin:10px -16px -14px;padding:8px 58px 8px 12px;justify-content:flex-start}
  body.in-game .strip .av-md{--s:34px}
  body.in-game .sp{min-width:54px}
  body.in-game .stage{padding:14px 16px}
}
/* Celular deitado e telas bem baixas: sem barra do topo durante o jogo e placar na lateral */
@media (max-height:520px) and (orientation:landscape){
  body.in-game .topbar{display:none}
  body.in-game .screen.game{min-height:0;--chrome-h:150px}
  body.in-game .game-top{margin-bottom:6px}
  body.in-game .stage{padding:10px 14px;padding-right:calc(190px + 14px)}
  body.in-game .stage-head .sh-icon{display:none}
  body.in-game .sh-name{font-size:.95rem}
  body.in-game .stage-body{margin-top:6px}
  body.in-game .stage > .strip{position:absolute;top:0;right:0;bottom:0;width:190px;margin:0;flex-direction:column;justify-content:flex-start;gap:2px;overflow-y:auto;border-top:0;border-left:1px solid var(--line);padding:8px 6px}
  body.in-game .strip .sp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"av name st" "av pts st";align-items:center;column-gap:8px;min-width:0;max-width:none;text-align:left;padding:4px 6px}
  body.in-game .strip .sp > .throw-tgt{grid-area:av}
  body.in-game .strip .sp-name{grid-area:name;font-size:.8rem}
  body.in-game .strip .sp-pts{grid-area:pts}
  body.in-game .strip .sp-stat{grid-area:st;margin:0}
  body.in-game .strip .av-md{--s:28px}
  body.in-game .hostbar{margin-top:6px}
  body.in-game .hb-label{display:none}
}
/* ---------- Visual: fundo vivo, brilhos e detalhes ---------- */
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;will-change:transform;
  background:radial-gradient(30% 26% at 18% 28%,color-mix(in srgb,var(--glow) 22%,transparent),transparent 70%),
    radial-gradient(28% 24% at 82% 66%,rgba(236,72,153,.12),transparent 70%),
    radial-gradient(24% 22% at 62% 16%,rgba(20,184,166,.09),transparent 70%),
    radial-gradient(28% 24% at 30% 86%,rgba(251,191,36,.06),transparent 70%);
  animation:aurora 26s ease-in-out infinite alternate}
@keyframes aurora{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(4%,-3%,0) rotate(6deg)}100%{transform:translate3d(-3%,4%,0) rotate(-5deg)}}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--glow) 75%,transparent),transparent);pointer-events:none}
.wordmark{background:linear-gradient(90deg,#fff 0%,#C7D2FE 55%,#F9A8D4 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand:hover .logo-mark{animation:gcWiggle .6s ease}
.hero-title .accent{background:linear-gradient(90deg,#818CF8,#EC4899,#F59E0B,#818CF8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:heroShift 9s linear infinite}
@keyframes heroShift{to{background-position:300% 0}}
.panel{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 24px 48px -32px rgba(0,0,0,.9);transition:border-color .2s}
.panel:hover{border-color:var(--line-2)}
.stage::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--g) 85%,#fff),transparent);opacity:.8;pointer-events:none}
.game-top .timer-fill{box-shadow:0 0 12px color-mix(in srgb,var(--g) 80%,transparent)}
/* Brilho que passa pelos botões principais */
.btn.primary,.btn.game,.create-btn{position:relative;overflow:hidden;isolation:isolate}
.btn.primary::after,.btn.game::after,.create-btn::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.34) 50%,transparent 65%);transform:translateX(-130%);transition:transform .7s ease}
.btn.primary:hover:not(:disabled)::after,.btn.game:hover:not(:disabled)::after,.create-btn:hover::after{transform:translateX(130%)}
.create-btn,.join-big{animation:ctaGlow 3.2s ease-in-out infinite}
@keyframes ctaGlow{50%{box-shadow:0 10px 34px -4px rgba(129,140,248,.75)}}
/* Cartões dos jogos: brilho e ícone que balança */
button.game-card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);background-size:260% 100%;background-position:130% 0;transition:background-position .8s ease}
button.game-card:hover:not(:disabled)::after{background-position:-30% 0}
button.game-card:hover:not(:disabled){transform:translateY(-4px) rotate(-.6deg)}
button.game-card:hover:not(:disabled) .gc-icon{animation:gcWiggle .5s ease}
@keyframes gcWiggle{30%{transform:rotate(-10deg) scale(1.12)}60%{transform:rotate(8deg) scale(1.12)}}
/* PIN da sala flutuando */
.pin-keys .key{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02)),var(--bg-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 24px -14px rgba(99,102,241,.7);animation:keyFloat 3.2s ease-in-out infinite}
.pin-keys .key:nth-child(2){animation-delay:.2s}
.pin-keys .key:nth-child(3){animation-delay:.4s}
.pin-keys .key:nth-child(4){animation-delay:.6s}
@keyframes keyFloat{50%{transform:translateY(-5px)}}
/* Botão do chat pulsando quando tem mensagem nova */
.fab-chat:has(.fab-badge:not([hidden])){animation:fabPulse 2s ease-in-out infinite}
@keyframes fabPulse{0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,.55),0 10px 24px -8px rgba(0,0,0,.7)}50%{box-shadow:0 0 0 12px rgba(99,102,241,0),0 10px 24px -8px rgba(0,0,0,.7)}}
::selection{background:rgba(99,102,241,.5);color:#fff}
html{scrollbar-color:rgba(255,255,255,.18) transparent}
@media (min-width:1600px){ #app{max-width:1480px} body.in-game .game{max-width:1380px} }
/* No celular, campos com letra pequena faziam o iPhone dar zoom sozinho */
@media (pointer:coarse){ .cry-field .input,.cust-form textarea,.chat-form .input,.cfg-inline .input,.dw-guess .input{font-size:16px} }
/* Zoeira: bandeja de reações, arremessos, buzina, grito, chuva */
/* As colunas do lobby podem encolher: a fileira de filtros rola em vez de alargar a página */
.lobby-left,.lobby-right,.lobby-grid .panel{min-width:0}
.cat-chips{max-width:100%}
body .react-wrap{align-items:flex-end}
#reactTray{align-items:stretch;gap:2px;width:min(88vw,272px);max-height:62vh;overflow-y:auto;border-radius:20px;padding:8px}
#reactTray[hidden]{display:none}
.tray-row{display:flex;flex-wrap:wrap;gap:2px}
.tray-row button.on{background:color-mix(in srgb,var(--accent,#6366F1) 35%,transparent);border-radius:10px}
.tray-sep{margin:6px 4px 2px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tray-sep small{font-weight:600;text-transform:none;letter-spacing:0;margin-left:4px}
.throw-tgt{display:inline-grid;cursor:pointer;border-radius:50%;transition:transform .12s}
.throw-tgt:hover{transform:scale(1.08) rotate(-4deg)}
.fx-proj{position:fixed;left:0;top:0;margin:-20px 0 0 -20px;font-size:40px;line-height:1;will-change:transform;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.fx-hit{position:fixed;transform:translate(-50%,-50%);font-size:54px;animation:fxHit .9s ease-out forwards}
@keyframes fxHit{0%{transform:translate(-50%,-50%) scale(.3)}30%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.fx-splat{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;background:radial-gradient(circle,rgba(220,38,38,.45),rgba(220,38,38,.12) 60%,transparent);animation:fxSplat 1.8s ease forwards}
.fx-splat.is-nice{background:radial-gradient(circle,rgba(236,72,153,.4),rgba(236,72,153,.1) 60%,transparent)}
.fx-splat span{font-size:min(40vw,220px);line-height:1;animation:fxHit2 .5s cubic-bezier(.2,1.6,.4,1)}
.fx-splat b{padding:8px 16px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:18px}
@keyframes fxSplat{0%,70%{opacity:1}100%{opacity:0}}
@keyframes fxHit2{from{transform:scale(.2) rotate(-30deg)}to{transform:none}}
.fx-emote{position:fixed;transform:translate(-50%,-110%);font-size:44px;animation:fxEmote 1.7s ease forwards}
@keyframes fxEmote{0%{transform:translate(-50%,-60%) scale(.3)}20%{transform:translate(-50%,-120%) scale(1.2) rotate(-12deg)}40%{transform:translate(-50%,-120%) rotate(12deg)}60%{transform:translate(-50%,-125%) rotate(-12deg)}80%{opacity:1;transform:translate(-50%,-130%) rotate(8deg)}100%{opacity:0;transform:translate(-50%,-160%)}}
.fx-shout{position:fixed;left:50%;top:22%;display:flex;align-items:center;gap:14px;max-width:92vw;padding:14px 22px;border-radius:22px;background:linear-gradient(120deg,#F43F5E,#F97316);color:#fff;box-shadow:0 20px 50px -10px rgba(244,63,94,.6);transform:translateX(-50%);animation:fxShout 2.8s cubic-bezier(.2,1.4,.4,1) forwards}
.fx-shout span{display:grid;font-size:clamp(1.3rem,5vw,2.2rem);font-weight:900;line-height:1.1;text-transform:uppercase;word-break:break-word}
.fx-shout small{font-size:12px;font-weight:700;text-transform:none;opacity:.85}
@keyframes fxShout{0%{transform:translateX(-50%) scale(.3) rotate(-6deg);opacity:0}12%{transform:translateX(-50%) scale(1.08) rotate(2deg);opacity:1}20%{transform:translateX(-50%) scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-30px)}}
.fx-rain{position:fixed;top:-60px;animation:fxRain linear forwards}
@keyframes fxRain{to{transform:translateY(calc(100vh + 120px)) rotate(540deg)}}
body.fx-shake #app{animation:fxShake .6s}
@keyframes fxShake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-10px) rotate(-.5deg)}40%,60%{transform:translateX(10px) rotate(.5deg)}}
/* Chat: enquete, menções, figurinhas, respostas rápidas, modos */
.chat-poll{padding:10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:grid;gap:6px}
.poll-q{margin:0;display:grid;gap:2px}
.poll-q small{font-size:11px;color:var(--muted)}
.poll-opt{position:relative;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);overflow:hidden;font-size:13px;font-weight:600;text-align:left;background:linear-gradient(90deg,color-mix(in srgb,var(--accent,#6366F1) 30%,transparent) var(--w),transparent var(--w))}
.poll-opt.on{border-color:var(--accent,#6366F1)}
.poll-opt:disabled{opacity:.8;cursor:default}
.chat-msg.is-mention .chat-bubble{box-shadow:0 0 0 2px #FBBF24}
.chat-bubble .at{color:#FBBF24}
.chat-bubble p.big{font-size:2.2rem;line-height:1.15;background:none}
.chat-sys.is-act{font-style:italic;color:var(--ink)}
.chat-quick{display:flex;gap:6px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none}
.chat-quick::-webkit-scrollbar{display:none}
.chat-quick button{flex:none;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:700;background:rgba(255,255,255,.04)}
#chatRoot[data-mode="reacoes"] .chat-form,#chatRoot[data-mode="reacoes"] .chat-quick,#chatRoot[data-mode="off"] .chat-form,#chatRoot[data-mode="off"] .chat-quick,#chatRoot[data-mode="off"] .react-wrap,#chatRoot[data-mode="off"] .chat-reacts{display:none}
/* Personalizar a sala */
.cfg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600}
.cfg-row.is-col{flex-direction:column;align-items:stretch}
.cfg-step{display:inline-flex;align-items:center;gap:4px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2)}
.cfg-step button{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:18px;font-weight:700}
.cfg-step button:hover:not(:disabled){background:rgba(255,255,255,.08)}
.cfg-step button:disabled{opacity:.3}
.cfg-step b{min-width:64px;text-align:center;font-size:13px}
.cfg-title{display:grid;gap:6px;margin-bottom:8px}
.cfg-title label{font-size:13px;font-weight:700}
.cfg-inline{display:flex;gap:8px}
.cfg-inline .input{flex:1;min-width:0}
.room-title{margin:0 0 4px;text-align:center;font-size:clamp(1.4rem,5vw,2rem);font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#A5B4FC,#F0ABFC);-webkit-background-clip:text;background-clip:text;color:transparent}
.game-card.is-off{opacity:.45}
.gc-off{font-size:11px;font-weight:700;color:var(--muted)}
.gc-sug{position:absolute;top:8px;right:8px;padding:2px 7px;border-radius:999px;background:#FBBF24;color:#111;font-size:11px;font-weight:800}
.game-card{position:relative}
.game-card.is-sug{box-shadow:0 0 0 2px #FBBF24}
.sug-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}
/* Jogadores: pronto, coringa, frase de vitória, GG, esquenta */
.ready-btn.is-on{background:var(--ok);border-color:var(--ok);color:#06210F}
.joker-btn{display:flex;flex-direction:column;align-items:center;margin:0 auto 10px;padding:8px 16px;border-radius:16px;border:1px dashed #FBBF24;background:rgba(251,191,36,.1);font-weight:800;font-size:14px;transition:transform .12s,background .15s}
.joker-btn:hover{transform:translateY(-1px);background:rgba(251,191,36,.18)}
.joker-btn small{font-weight:600;font-size:11px;color:var(--muted)}
.joker-pill{width:max-content;max-width:100%;margin:0 auto 10px;padding:6px 14px;border-radius:999px;background:rgba(251,191,36,.18);border:1px solid rgba(251,191,36,.5);font-size:13px;font-weight:700;text-align:center}
.sp-joker{position:absolute;top:-4px;left:-4px;font-size:16px}
.sp{position:relative}
.cry-bubble{display:flex;align-items:center;gap:10px;width:max-content;max-width:100%;margin:12px auto 0;padding:10px 16px;border-radius:18px 18px 18px 4px;background:linear-gradient(120deg,rgba(99,102,241,.3),rgba(236,72,153,.3));border:1px solid rgba(236,72,153,.4);font-size:15px;animation:evIn .5s cubic-bezier(.2,1.4,.4,1)}
/* Uma linha só: com sala cheia, rola para o lado em vez de empurrar o jogo para baixo */
.kudos{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;margin-top:12px;padding:4px 2px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.kudos > *{flex:none}
.kudos > :first-child{margin-left:auto}
.kudos > :last-child{margin-right:auto}
.kudos > span{font-size:12px;font-weight:800;color:var(--muted);margin-right:4px}
.kudos button{border-radius:50%;transition:transform .12s}
.kudos button:hover{transform:scale(1.12)}
.cry-field{display:grid;gap:4px;grid-column:1 / -1;margin-top:6px}
.cry-field label{font-size:12px;font-weight:700;color:var(--muted)}
.cry-field label small{font-weight:500;margin-left:4px}
.cry-field .input{min-height:40px;padding:8px 12px;font-size:14px}
.warm-btn{display:grid;justify-items:center;width:100%;padding:18px;border-radius:20px;font-size:2.6rem;line-height:1;background:linear-gradient(140deg,#F97316,#EF4444);color:#fff;box-shadow:0 14px 30px -12px #F97316;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .06s}
.warm-btn:active{transform:scale(.95)}
.warm-btn small{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.warm-top{display:grid;gap:4px;list-style:none;padding:0;margin:10px 0 0}
.warm-top li{display:flex;align-items:center;gap:8px;font-size:13px}
.warm-top li b{margin-left:auto}
.warm-pop{position:fixed;font-size:22px;pointer-events:none;animation:fxHit .6s ease-out forwards;z-index:40}
/* Palavra Proibida */
.tb-card{max-width:360px;margin:0 auto 12px;padding:16px 18px;border-radius:20px;background:var(--bg-2);border:2px solid var(--g);text-align:center}
.tb-word{margin:0;font-size:clamp(1.6rem,6vw,2.1rem);font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
.tb-label{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#F87171}
.tb-label .ic{width:15px;height:15px}
.tb-list{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;list-style:none;padding:0;margin:0}
.tb-list li{padding:5px 11px;border-radius:999px;background:rgba(239,68,68,.14);color:#FCA5A5;font-weight:700;font-size:14px;text-decoration:line-through;text-decoration-thickness:2px}
.tb-giver{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.tb-feed .tb-clue{background:color-mix(in srgb,var(--g) 14%,var(--bg-2));border-color:color-mix(in srgb,var(--g) 40%,var(--line));font-weight:700}
.tb-feed .tb-clue .ic,.tb-feed .tb-buzz .ic{width:18px;height:18px;flex:none;color:var(--g)}
.tb-feed .tb-buzz{color:#FCA5A5}
.tb-feed .tb-buzz .ic{color:#F87171}
/* Telefone sem Fio */
.tel-step{margin:0 0 8px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stage-body > .tel-cv{max-width:420px;margin:0 auto 12px}
.tel-album{display:grid;gap:14px}
.tel-chain{padding:14px;border-radius:20px;background:var(--bg-2);border:1px solid var(--line)}
.tel-chain-title{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--muted)}
.tel-steps{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:10px;overflow-x:auto;list-style:none;padding:0 0 6px;margin:0;scroll-snap-type:x mandatory}
.tel-entry{position:relative;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start}
.tel-who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-height:24px}
.tel-text{display:grid;place-items:center;flex:1;margin:0;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px dashed var(--line-2);font-weight:700;text-align:center;line-height:1.3;aspect-ratio:4/3}
.tel-entry .tel-cv{border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.tel-entry.is-missing .hint{display:grid;place-items:center;aspect-ratio:4/3;margin:0;border-radius:14px;border:1px dashed var(--line)}
.tel-fav{position:absolute;right:8px;bottom:8px;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:rgba(17,24,39,.75);color:#fff;font-size:18px;line-height:1;border:1px solid rgba(255,255,255,.2);transition:transform .12s,background .15s}
.tel-fav:hover{transform:scale(1.08)}
.tel-fav.on{background:#F43F5E;border-color:#F43F5E}
.tel-best{max-width:420px;margin:12px auto 6px}
.tel-budget:empty{display:none}
/* Mapa Misterioso */
.map-card .map-ask{margin:0 0 2px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.map-wrap{position:relative}
.map-cv{display:block;width:100%;height:auto;aspect-ratio:2/1;border-radius:16px;background:#0B2A4A;touch-action:none;box-shadow:0 0 0 1px rgba(255,255,255,.08);user-select:none;-webkit-user-select:none}
.map-cv.can-pin{cursor:crosshair;box-shadow:0 0 0 3px var(--g)}
.map-cv.is-zoomed{cursor:grab}
.map-cv.is-zoomed.can-pin{cursor:crosshair}
.map-cv.is-grab.is-zoomed{cursor:grabbing}
.map-ctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px}
.map-ctl button{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:rgba(11,11,15,.78);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:1.15rem;font-weight:800;line-height:1;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .12s,background .12s}
.map-ctl button:hover{background:rgba(30,30,40,.9);transform:scale(1.06)}
.map-ctl button:active{transform:scale(.94)}
.map-info{position:absolute;left:8px;top:8px;max-width:calc(100% - 60px);margin:0;padding:5px 11px;border-radius:999px;background:rgba(11,11,15,.82);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;animation:pickerIn .2s ease}
.map-info[hidden]{display:none}
.map-tip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);margin:0;padding:3px 10px;border-radius:999px;background:rgba(11,11,15,.7);color:rgba(255,255,255,.85);font-size:.72rem;font-weight:600;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.map-tip.is-off{opacity:0}
@media (max-width:520px){ .map-ctl button{width:30px;height:30px;font-size:1rem} .map-tip{font-size:.66rem} }
/* Celular em pé: mapa mais alto para sobrar espaço ao dar zoom */
@media (max-width:600px) and (orientation:portrait){ .map-cv{aspect-ratio:4/3} body.in-game .map-wrap{width:100%} }
.map-loading{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:#fff;font-weight:700;pointer-events:none}
.stage-body .map-wrap + .res-list{margin-top:14px}
/* Lobisomem Relâmpago */
.wolf-card{display:flex;align-items:flex-start;gap:14px;margin:0 auto 12px;max-width:520px;padding:16px 18px;border-radius:20px;background:var(--bg-2);border:1px solid var(--line)}
.wolf-card.role-lobo{border-color:#EF4444;background:rgba(239,68,68,.1)}
.wolf-e{font-size:2.6rem;line-height:1}
.wolf-role{margin:0 0 4px;font-size:1.1rem}
.wolf-card .hint{margin:2px 0 0}
.wolf-flip{max-width:520px;margin:0 auto}
.wolf-cover{display:grid;justify-items:center;gap:6px;width:100%;padding:34px 18px;border-radius:22px;background:linear-gradient(160deg,#1E1B4B,#312E81);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:3rem;line-height:1}
.wolf-cover b{font-size:1.05rem}
.wolf-cover small{font-size:13px;color:rgba(255,255,255,.7)}
.wolf-people{display:grid;gap:6px;list-style:none;padding:0;margin:12px 0 0}
.wolf-people li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line)}
.wolf-people li > span:nth-child(2){font-weight:600}
.wolf-people li .btn{margin-left:auto}
.wolf-people li.is-dead{opacity:.5}
.wolf-people li.is-dead > span:nth-child(2){text-decoration:line-through}
.wolf-rip{margin-left:auto}
.wolf-votes{letter-spacing:-.15em}
.wolf-seen{display:grid;gap:6px;list-style:none;padding:0;margin:12px 0 0}
.wolf-seen li{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line)}
.wolf-seen b{margin-left:auto;color:var(--ok)}
.wolf-seen b.is-wolf{color:#F87171}
.wolf-news{max-width:46ch;margin:6px auto 0;text-align:center;font-size:1.08rem}
/* Filtro de categorias no lobby */
.cat-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;scrollbar-width:none}
.cat-chips::-webkit-scrollbar{display:none}
.cat-chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-size:13px;font-weight:700;transition:background .15s,color .15s,border-color .15s}
.cat-chip:hover{color:var(--ink)}
.cat-chip[aria-pressed="true"]{color:var(--ink);border-color:var(--accent,#6366F1);background:color-mix(in srgb,var(--accent,#6366F1) 20%,transparent)}
.cat-chip small{margin-left:4px;opacity:.7}
/* Celular como controle: com telão ligado, some o que a TV já mostra */
.ctrl .stage-body::before{content:"📺 A pergunta está no telão";display:block;margin:0 auto 12px;padding:8px 14px;width:max-content;max-width:100%;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.ctrl .stage-body :is(.prompt,.fib-fact,.emj-card,.emj-meta,.cap-scene,.postcard,.geo-kind,.pc-card .pc-emoji,.tm-others,.mm-seq,.tb-card,.qd-text,.vod-card p,.auc-lot .auc-e),
.ctrl .stage-body .dw-board-wrap:not(:has(.can-draw)),.ctrl .sh-how{display:none}
.ctrl .stage-body .qd-card .qd-who{margin-top:0}
/* Eventos e rodada final */
.ev-pill{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:0 auto 10px;padding:8px 14px;width:max-content;max-width:100%;border-radius:999px;background:linear-gradient(90deg,rgba(168,85,247,.25),rgba(236,72,153,.25));border:1px solid rgba(236,72,153,.45);font-size:14px;text-align:center;animation:evIn .5s cubic-bezier(.2,1.4,.4,1)}
.ev-pill b{margin-right:4px}
.ev-pill.is-final{background:linear-gradient(90deg,rgba(249,115,22,.28),rgba(251,191,36,.28));border-color:rgba(251,191,36,.55)}
.ev-note{margin:10px auto 0;text-align:center;font-weight:700;color:#FBBF24}
@keyframes evIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.tv .ev-pill{font-size:22px;padding:12px 22px}
/* Sequência de jogos */
.seq-bar{display:grid;gap:8px;margin-bottom:12px}
.seq-bar > .btn{justify-self:start}
.seq-list{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.seq-list li{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 6px;border-radius:999px;background:color-mix(in srgb,var(--g) 18%,var(--bg-2));border:1px solid color-mix(in srgb,var(--g) 45%,transparent);font-size:13px;font-weight:700}
.seq-n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--g);color:var(--on-color,#111);font-size:11px}
.seq-list button{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;color:var(--muted);font-size:15px;line-height:1}
.seq-list button:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.seq-bar.is-edit + .cat-chips + .game-grid .game-card{outline:2px dashed color-mix(in srgb,var(--g) 60%,transparent);outline-offset:2px}
/* Conteúdo da sala */
.cust-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cat-chips.wrap{flex-wrap:wrap;overflow:visible}
.cust-form{display:grid;gap:8px;margin-top:10px}
.cust-form label{font-size:13px;font-weight:700}
.cust-form label small{font-weight:500;color:var(--muted);margin-left:4px}
.cust-form textarea{min-height:0;resize:vertical;font-size:14px;line-height:1.4;padding:10px 12px}
.cust-form > .btn{justify-self:start}
/* Pódio: medalhas, momentos e números */
.md-list,.mo-list{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.md-list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line)}
.md-e{grid-row:span 2;font-size:2rem;line-height:1}
.md-txt{display:grid}
.md-txt small{color:var(--muted);font-size:12px}
.md-who{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;font-weight:600}
.mo-item{padding:12px 14px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line)}
.mo-item b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mo-item p{margin:4px 0 0;font-size:15px}
.mo-e{font-size:1.4rem}
.mo-cv{max-width:300px;margin-top:8px}
.medals,.moments{margin-top:16px}
.my-stats{margin-top:16px}
.ms-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.ms-grid div{padding:10px 6px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line)}
.ms-grid b{display:block;font-size:1.4rem;font-weight:800}
.ms-grid small{font-size:12px;color:var(--muted)}
.ms-medals{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.ms-medal{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);font-size:18px}
.ms-medal small{font-size:12px;font-weight:700;color:var(--muted)}
.tel-chain-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tel-chain-title .icon-btn{width:32px;height:32px}
/* Quem Disse Isso? */
.qd-cards{display:grid;gap:10px}
.qd-card{padding:14px;border-radius:18px;background:var(--bg-2);border:1px solid var(--line)}
.qd-text{margin:0 0 10px;font-size:1.12rem;font-weight:700;text-align:center}
.qd-who{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.qd-pick{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:13px;font-weight:600;transition:border-color .15s,background .15s}
.qd-pick.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 20%,transparent)}
.qd-author{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:0}
/* Mímica de Emoji */
.mm-seq{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;min-height:76px;margin:0 auto 12px;padding:12px;border-radius:20px;background:var(--bg-2);border:1px solid var(--line);font-size:clamp(2rem,9vw,3rem);line-height:1}
.mm-seq span{animation:evIn .35s ease}
.mm-seq small{font-size:14px;color:var(--muted)}
.mm-tools{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.mm-pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;max-height:236px;overflow-y:auto;padding:8px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line)}
.mm-pal button{display:grid;place-items:center;aspect-ratio:1;border-radius:10px;font-size:24px;transition:background .12s,transform .1s}
.mm-pal button:hover{background:rgba(255,255,255,.08)}
.mm-pal button:active{transform:scale(.88)}
.dw-choice small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
/* Leilão Maluco */
.auc-lot{display:flex;align-items:center;gap:16px;max-width:460px;margin:0 auto 12px;padding:18px;border-radius:22px;background:linear-gradient(140deg,rgba(245,158,11,.18),rgba(245,158,11,.04));border:1px solid rgba(245,158,11,.45)}
.auc-lot.is-open{animation:evIn .5s ease}
.auc-e{font-size:3.2rem;line-height:1}
.auc-name{margin:0 0 4px;font-size:1.2rem;font-weight:800}
.auc-lot .hint{margin:0}
.auc-bank{margin:0 0 10px;text-align:center;font-weight:700}
.auc-form .row{gap:8px}
.auc-form .row .btn.big{flex:1}
.delta.neg{background:rgba(239,68,68,.18);color:#FCA5A5}
/* Caça ao Detalhe */
.sp-count{margin:0 0 10px;text-align:center;font-weight:700}
.sp-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;touch-action:manipulation}
@media (max-width:700px){.sp-pair{grid-template-columns:1fr}}
.sp-scene{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.1);user-select:none;-webkit-user-select:none}
.sp-pair.can-tap .sp-scene{cursor:crosshair}
.sp-pair.is-locked{animation:spShake .35s;opacity:.6}
.sp-mark{fill:none;stroke:#EF4444;stroke-width:8;stroke-dasharray:14 8}
