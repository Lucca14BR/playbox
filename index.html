<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlayBox Party Edition</title>
<meta name="theme-color" content="#160F2B">
<meta name="description" content="PlayBox: party games para jogar na mesma sala, cada um no seu celular.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<!--
  PlayBox · Party Edition
  ------------------------------------------------------------------
  Arquitetura (tudo neste arquivo):

  Transport  -> camada de rede. Hoje: BroadcastChannel + evento "storage"
                do localStorage (sincroniza abas do mesmo navegador).
                Para um backend real, troque só este objeto mantendo
                open(pin, onMessage) / send(msg) / close().
  Host       -> a aba que cria a sala é a autoridade: recebe ações,
                aplica as regras (Games[*].handle), roda o relógio,
                controla os bots e transmite o estado inteiro ("state").
  Clientes   -> só enviam ações (dispatch) e desenham o estado recebido.
  Games      -> cada mini-jogo é um módulo com init / phases / handle /
                bot / done / view. Para criar um jogo novo, registre outro
                objeto em Games e adicione o id em GAME_ORDER.
  API pública: window.PlayBox (createRoom, joinRoom, submitAnswer,
                castVote, pressStop, startGame, nextRound, updateScores,
                endMatch, leaveRoom).

  Observação: nesta simulação local o estado completo (incluindo
  respostas) circula entre as abas; a interface só mostra a cada um o
  que é dele. Num backend real, o servidor filtraria o estado por jogador.
-->
<style>
:root{
  --bg:#160F2B; --bg-2:#1C1336; --surface:#241A45; --raised:#30245A; --line:#433573;
  --ink:#F7F2FF; --muted:#B9ACE0; --dim:#8577B3; --deep:#0F0A1F;
  --violet:#8C6CFF; --violet-lip:#5534D6;
  --amber:#FFB02E; --pink:#FF6FB5; --coral:#FF5F57; --teal:#33D6B0; --lime:#A6E05A; --blue:#6C9BFF;
  --on-color:#1B1033;
  --f-display:'Bricolage Grotesque','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-xl:28px; --r-lg:20px; --r-md:14px;
  --g:var(--violet); --gl:var(--violet-lip);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:1rem;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit}
ul,ol{padding:0;list-style:none}
b,strong{font-weight:700}
:focus-visible{outline:3px solid #FFD66B;outline-offset:3px;border-radius:10px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));
  background:rgba(22,15,43,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.cube{width:34px;height:34px;flex:none}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:-.035em;font-variation-settings:'wdth' 80;line-height:1}
.edition{
  font-family:var(--f-display);font-weight:700;font-size:.72rem;line-height:1;white-space:nowrap;
  padding:5px 8px 4px;border-radius:999px;background:var(--amber);color:#2B1700;transform:rotate(-5deg);
}
.top-right{display:flex;align-items:center;gap:10px}
.room-chip{font-size:.9rem;color:var(--muted)}
.room-chip b{font-family:var(--f-display);font-weight:800;color:var(--ink);letter-spacing:.08em;font-size:1.05rem}
@media (max-width:420px){ .room-chip span{display:none} .edition{display:none} }

/* ---------- Layout ---------- */
#app{padding:20px 16px 48px;max-width:1120px;margin:0 auto}
.screen.enter{animation:screenIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}}
.panel{background:var(--surface);border-radius:var(--r-xl);padding:22px}
.panel-title{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.015em;line-height:1.15}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.lede{color:var(--muted);font-size:1.075rem;max-width:52ch}
.hint{color:var(--muted);font-size:.93rem}
.hint b{color:var(--ink)}
.center{text-align:center;margin-left:auto;margin-right:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.center{justify-content:center}
.err{color:#FF9A93;font-size:.93rem;font-weight:700;min-height:1.4em}
.err:empty{min-height:0}
.note{background:var(--raised);border-radius:var(--r-md);padding:10px 14px;margin:12px 0;font-size:.95rem}
.banner{background:#4A1F2E;color:#FFD3D0;border-radius:var(--r-md);padding:12px 16px;margin-bottom:16px;font-weight:700}

/* ---------- Buttons ---------- */
.btn{
  --b:var(--raised);--bl:var(--deep);--bi:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:50px;padding:.7em 1.35em;
  border-radius:16px;background:var(--b);color:var(--bi);
  font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:-.005em;line-height:1.1;
  box-shadow:0 5px 0 var(--bl);transform:translateY(0);
  transition:transform .08s ease,box-shadow .08s ease,filter .15s ease;user-select:none;
}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--bl)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{--b:var(--violet);--bl:var(--violet-lip);--bi:#fff}
.btn.game{--b:var(--g);--bl:var(--gl);--bi:var(--on-color)}
.btn.big{width:100%;min-height:62px;font-size:1.25rem;border-radius:18px}
.btn.sm{min-height:42px;padding:.45em 1em;font-size:.97rem;border-radius:13px;box-shadow:0 4px 0 var(--bl)}
.btn.xs{min-height:36px;padding:.3em .85em;font-size:.9rem;border-radius:11px;box-shadow:0 3px 0 var(--bl)}
.btn.ghost{--b:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 0 0 2px var(--line)}
.linkish{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-weight:700;padding:6px 2px}
.linkish:hover{color:var(--ink)}

/* ---------- Fields ---------- */
.field{display:grid;gap:6px}
.field>span,.pick-label{font-weight:700;font-size:.9rem;color:var(--muted)}
.input{
  width:100%;min-height:54px;padding:12px 16px;border-radius:var(--r-md);
  background:var(--bg-2);border:2px solid var(--line);color:var(--ink);font-size:1.12rem;
}
.input::placeholder{color:var(--dim)}
.input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px rgba(140,108,255,.28)}
.input:disabled{opacity:.6}
.pin-input{font-family:var(--f-display);font-weight:800;font-size:1.7rem;letter-spacing:.32em;text-transform:uppercase;text-align:center;padding-left:calc(16px + .32em)}

/* ---------- Avatars ---------- */
.av{
  --s:46px;display:inline-grid;place-items:center;flex:none;width:var(--s);height:var(--s);
  border-radius:32%;background:var(--c);font-size:calc(var(--s) * .56);line-height:1;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);
}
.av-sm{--s:30px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.av-md{--s:50px}
.av-lg{--s:84px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;line-height:1;padding:4px 7px;border-radius:999px;background:var(--raised);color:var(--muted)}
.tag-host{background:var(--amber);color:#2B1700}
.tag-me{background:var(--violet);color:#fff}
.tag-good{background:var(--teal);color:#06261F}
.tag-bad{background:var(--coral);color:#2A0705}

/* ---------- Home ---------- */
.home{display:grid;gap:32px;grid-template-areas:"hero" "play" "games";max-width:560px;margin:0 auto;padding-top:8px}
@media (min-width:900px){
  .home{max-width:1040px;grid-template-columns:minmax(0,1fr) minmax(360px,420px);grid-template-areas:"hero play" "games play";column-gap:72px;row-gap:44px;padding-top:48px;align-items:start}
  .play-card{position:sticky;top:96px}
}
.home-hero{grid-area:hero}
.hero-title{
  font-family:var(--f-display);font-weight:800;font-variation-settings:'wdth' 78;
  font-size:clamp(2.5rem,8vw,4.6rem);line-height:.94;letter-spacing:-.04em;margin-bottom:16px;
}
.home-hero .lede{max-width:44ch}

/* Vitrine dos jogos: informativa e discreta */
.showcase{grid-area:games}
.showcase-title{font-size:.95rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.showcase ul{display:grid;column-gap:28px}
@media (min-width:560px){ .showcase ul{grid-template-columns:repeat(2,minmax(0,1fr))} }
.sc-item{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
.sc-glyph{
  display:grid;place-items:center;width:40px;height:40px;border-radius:12px;font-size:1.25rem;
  background:var(--surface);background:color-mix(in srgb,var(--g) 16%,transparent);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--g) 40%,transparent);
}
.sc-name{display:block;font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.2}
.sc-tag{display:block;font-size:.86rem;color:var(--muted);line-height:1.3}

/* Card de ação */
.play-card{grid-area:play;display:grid;gap:20px;background:var(--surface);border-radius:var(--r-xl);padding:clamp(18px,4vw,28px)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:15px;background:var(--bg-2)}
.tab{min-height:44px;border-radius:11px;font-family:var(--f-display);font-weight:700;font-size:.98rem;color:var(--muted);transition:background .15s,color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:0 2px 0 var(--deep)}
.ident{display:flex;align-items:flex-end;gap:14px}
.grow{flex:1;min-width:0}
.av-btn{position:relative;flex:none;border-radius:32%;margin-bottom:1px}
.av-btn .av{--s:54px}
.av-edit{
  position:absolute;right:-5px;bottom:-5px;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;
  background:var(--ink);color:var(--on-color);font-size:.72rem;box-shadow:0 0 0 3px var(--surface);transition:transform .15s;
}
.av-btn[aria-expanded="true"] .av-edit{transform:rotate(180deg)}
.picker{display:grid;gap:14px;padding:14px;border-radius:18px;background:var(--bg-2);margin-top:-6px}
.picker[hidden]{display:none}
.picker.opening{animation:pickerIn .22s ease}
@keyframes pickerIn{from{opacity:0;transform:translateY(-6px)}}
.emoji-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.emo{aspect-ratio:1;border-radius:10px;font-size:1.3rem;display:grid;place-items:center;transition:background .12s}
.emo:hover{background:var(--surface)}
.emo.on{background:var(--raised);box-shadow:inset 0 0 0 2px var(--violet)}
.swatches{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;justify-items:center}
.sw{width:min(100%,30px);aspect-ratio:1;border-radius:10px;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.sw.on{outline:2px solid var(--ink);outline-offset:3px}
.tab-body{display:grid;gap:14px}
.tab-body[hidden]{display:none}
.tab-body .hint{margin-top:-4px}
.play-card .err:empty{display:none}
.quick{justify-self:center;font-size:.93rem}

/* ---------- Lobby ---------- */
.lobby{display:grid;gap:16px}
@media (min-width:960px){ .lobby{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);align-items:start} .lobby-left{position:sticky;top:84px} }
.lobby-left{display:grid;gap:16px}
.pin-block{display:grid;gap:14px;justify-items:start}
.pin-keys{display:flex;gap:10px}
.key{
  display:grid;place-items:center;width:clamp(58px,17vw,74px);aspect-ratio:5/6;border-radius:18px;
  background:var(--raised);font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,9vw,3rem);line-height:1;
  box-shadow:0 7px 0 var(--k);
}
.key:nth-child(1){--k:var(--amber)} .key:nth-child(2){--k:var(--pink)} .key:nth-child(3){--k:var(--teal)} .key:nth-child(4){--k:var(--blue)}
.count{font-family:var(--f-body);font-weight:700;font-size:.95rem;color:var(--muted);margin-left:6px}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.pl{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;border-radius:var(--r-lg);background:var(--raised);text-align:center}
.pl.off{opacity:.5}
.pl-name{font-weight:700;line-height:1.2;word-break:break-word}
.pl-meta{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:19px}
.pl-score{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.pl-kick{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:9px;color:var(--muted);font-size:1.2rem;line-height:1}
.pl-kick:hover{background:var(--bg-2);color:var(--ink)}
.empty-slot{display:grid;place-items:center;border:2px dashed var(--line);border-radius:var(--r-lg);color:var(--dim);font-size:.9rem;padding:14px;text-align:center;min-height:120px}
.host-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.seg{display:inline-flex;background:var(--bg-2);border-radius:13px;padding:4px;gap:4px}
.seg button{min-width:44px;min-height:36px;border-radius:10px;font-family:var(--f-display);font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--violet);color:#fff}
.game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:640px){ .game-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.game-card{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;
  padding:16px 15px 17px;border-radius:22px;background:var(--g);color:var(--on-color);min-height:170px;
  box-shadow:0 6px 0 var(--gl);transition:transform .08s ease,box-shadow .08s ease,filter .15s ease;
}
button.game-card:hover:not(:disabled){filter:brightness(1.06)}
button.game-card:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--gl)}
button.game-card:disabled{filter:saturate(.2) brightness(.65);cursor:not-allowed}
.gc-glyph{font-size:2.1rem;line-height:1;margin-bottom:8px}
.gc-name{font-family:var(--f-display);font-weight:800;font-size:1.22rem;line-height:1.08;letter-spacing:-.015em}
.gc-tag{font-size:.88rem;font-weight:700;opacity:.72}
.gc-foot{margin-top:auto;padding-top:10px;font-size:.84rem;line-height:1.35}
.gc-done{position:absolute;top:12px;right:12px;font-size:.75rem;font-weight:700;background:rgba(27,16,51,.16);padding:4px 8px;border-radius:999px}
.lobby-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:2px solid var(--line)}

/* ---------- Game shell ---------- */
.game{max-width:780px;margin:0 auto}
.game-head{display:grid;gap:14px;margin-bottom:14px}
.gh-id{display:flex;align-items:center;gap:14px}
.gh-glyph{display:grid;place-items:center;width:56px;height:56px;flex:none;border-radius:17px;background:var(--g);font-size:1.8rem;box-shadow:0 5px 0 var(--gl)}
.gh-name{font-family:var(--f-display);font-weight:800;font-size:clamp(1.45rem,5vw,1.9rem);line-height:1.05;letter-spacing:-.025em}
.gh-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:5px;color:var(--muted);font-size:.93rem}
.phase-pill{background:var(--g);color:var(--on-color);font-weight:700;font-size:.8rem;padding:3px 9px;border-radius:999px}
.gh-how{color:var(--muted);font-size:.95rem;max-width:62ch}
.timer{display:flex;align-items:center;gap:12px}
.timer-track{flex:1;height:14px;border-radius:999px;background:var(--bg-2);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
.timer-fill{height:100%;border-radius:999px;background:var(--g);transform-origin:left center;transform:scaleX(var(--p,1))}
.timer.low .timer-fill{background:var(--coral)}
.timer.low .timer-num{color:var(--coral)}
.timer-num{font-family:var(--f-display);font-weight:800;font-size:1.5rem;min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.stage{position:relative;background:var(--surface);border-radius:var(--r-xl);padding:clamp(18px,4vw,30px);box-shadow:inset 0 6px 0 var(--g);min-height:300px}
.stage>*+*{margin-top:16px}
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(1.45rem,4.6vw,2.05rem);line-height:1.14;letter-spacing:-.02em;max-width:32ch}
.prompt.sm{font-size:clamp(1.1rem,3.4vw,1.3rem);color:var(--muted);font-weight:600}
.ask{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.015em}
.hostbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:var(--r-lg);background:var(--bg-2)}
.hb-label{font-size:.88rem;color:var(--muted);font-weight:700;margin-right:auto}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{position:relative;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface);font-size:.92rem}
.chip.me{box-shadow:inset 0 0 0 2px var(--violet)}
.chip.off{opacity:.45}
.chip .av{border-radius:50%}
.chip-name{font-weight:700;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-score{font-family:var(--f-display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.chip-done{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#06261F;font-size:.75rem;font-weight:700}
.delta{font-family:var(--f-display);font-weight:800;font-size:.85rem;padding:2px 7px;border-radius:999px;background:var(--amber);color:#2B1700;line-height:1.2}
.enter .delta{animation:pop .5s .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}

/* Shared game pieces */
.wait{display:grid;gap:8px;place-items:center;text-align:center;padding:34px 10px}
.wait-main{font-family:var(--f-display);font-weight:700;font-size:1.35rem}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.answer-form{display:grid;gap:12px;max-width:460px}
.num-field{position:relative}
.num-field .input{font-family:var(--f-display);font-weight:800;font-size:1.8rem;min-height:66px;padding-right:110px}
.unit{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;pointer-events:none}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.pick{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:var(--r-lg);
  background:var(--raised);text-align:center;box-shadow:0 4px 0 var(--deep);transition:transform .08s,box-shadow .08s;
}
.pick:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.pick:disabled{cursor:default;opacity:.55}
.pick.on{background:var(--g);color:var(--on-color);box-shadow:0 4px 0 var(--gl)}
.pick-name{font-weight:700;line-height:1.2}
.pick-val{font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1.1;word-break:break-word}
.answer-big{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px}

@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(var(--dx),112vh) rotate(var(--r))}}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));z-index:40;transform:translate(-50%,160%);

}
#toast.show{transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .confetti{display:none}
}

/* =====================================================================
   Transporte (troque por Socket.io / Firebase / Supabase no futuro)
   ===================================================================== */
const Transport = (() => {
  let bc = null, pin = null, handler = null;
  const src = uid(10), seen = new Set(), seenQ = [];
  const remember = id => { seen.add(id); seenQ.push(id); if (seenQ.length > 400) seen.delete(seenQ.shift()); };
  function deliver(msg) {
    if (!msg || msg.src === src || seen.has(msg.mid)) return;
    remember(msg.mid);
    handler && handler(msg);
  }
  function onStorage(e) {
    if (e.key !== 'playbox:bus:' + pin || !e.newValue) return;
    try { deliver(JSON.parse(e.newValue)); } catch {}
  }
  return {
    open(p, h) {
      this.close();
      pin = p; handler = h;
      if ('BroadcastChannel' in window) { bc = new BroadcastChannel('playbox:' + p); bc.onmessage = e => deliver(e.data); }
      window.addEventListener('storage', onStorage);
    },
    send(msg) {
      if (!pin) return;
      msg = { ...msg, src, mid: uid(12) };
      remember(msg.mid);
      try { bc && bc.postMessage(msg); } catch {}
      try { localStorage.setItem('playbox:bus:' + pin, JSON.stringify(msg)); } catch {}
    },
    close() {
      if (bc) { bc.close(); bc = null; }
      window.removeEventListener('storage', onStorage);
      pin = null; handler = null;
    },
  };
})();

/* =====================================================================
   Motor do host: fases, rodadas e pontuação
   ===================================================================== */
const HostRT = { timer: null, beat: null, botAt: {}, botDone: new Set(), allInAt: null };

function rosterOf(s) { return s.order.filter(id => s.players[id] && (s.players[id].connected || s.players[id].isBot)); }
function active(g, s) { return g.roster.filter(id => { const p = s.players[id]; return p && (p.isBot || p.connected); }); }
const inRoster = (g, pid) => g.roster.includes(pid);
function drawItem(g, list) {
  let pool = list.map((_, i) => i).filter(i => !g.used.includes(i));
  if (!pool.length) { g.used = []; pool = list.map((_, i) => i); }
  const i = pick(pool); g.used.push(i); return i;
}

function engineStart(s, gameId, rounds) {
  s.screen = 'game';
  s.game = { id: gameId, round: 0, total: rounds, phase: null, phaseStart: 0, deadline: null, dur: 0, data: {}, earned: {}, roundDelta: {}, used: [], roster: [] };
  engineNextRound(s);
}
function engineNextRound(s) {
  const g = s.game;
  g.round++; g.roundDelta = {};
  if (g.round > g.total) { g.phase = 'final'; g.deadline = null; return; }
  g.roster = rosterOf(s);
  const mod = Games[g.id];
  mod.init(g, s);
  enginePhase(s, mod.first);
}
function enginePhase(s, name) {
  const g = s.game, ph = Games[g.id].phases[name];
  g.phase = name; g.phaseStart = now(); g.dur = ph.dur || 0;
  g.deadline = ph.dur ? now() + ph.dur * 1000 : null;
  HostRT.allInAt = null;
  ph.enter && ph.enter(g, s);
}
function engineAdvance(s) {
  const g = s.game, ph = Games[g.id].phases[g.phase];
  if (ph.next) enginePhase(s, ph.next); else engineNextRound(s);
}
/** Soma pontos no placar geral e no placar do mini-jogo atual. deltas = { playerId: pontos } */
function updateScores(s, deltas) {
  const g = s.game;
  for (const [pid, pts] of Object.entries(deltas)) {
    if (!pts || !s.players[pid]) continue;
    s.players[pid].score += pts;
    if (g) { add(g.earned, pid, pts); add(g.roundDelta, pid, pts); }
  }
}

   Mini-jogos

const Games = {};
const GAME_ORDER = ['mane', 'provavel', 'impostor', 'geo', 'stop', 'fato'];

function voteCounts(votes) {
  const counts = {};
  Object.values(votes).forEach(t => add(counts, t, 1));
  const max = Math.max(0, ...Object.values(counts));
  return { counts, max, top: max ? Object.keys(counts).filter(k => counts[k] === max) : [] };
}

/* ---------- 1. O Mané ---------- */
const maneTargets = (g, pid) => Object.keys(g.data.guesses).filter(id => id !== pid);
Games.mane = {
  id: 'mane', name: 'O Mané', tag: 'Estimativa e votação', glyph: '🤔', color: '#FFB02E', lip: '#B97A10', min: 2,

  phases: {
    answer: { label: 'Palpite secreto', dur: 40, bot: [4, 16], next: 'vote', allIn: (g, s) => active(g, s).every(id => id in g.data.guesses) },
    vote: { label: 'Caça ao Mané', dur: 30, bot: [3, 10], next: 'reveal', allIn: (g, s) => active(g, s).every(id => id in g.data.votes || !maneTargets(g, id).length) },
    reveal: { label: 'Gabarito', dur: 25, enter(g, s) {
      const ans = MANE_Q[g.data.qi].a, d = {};
      const e = Object.entries(g.data.guesses).map(([pid, v]) => ({ pid, dist: Math.abs(v - ans) }));
      let closest = [], mane = [];
      if (e.length) {
        const min = Math.min(...e.map(x => x.dist)), max = Math.max(...e.map(x => x.dist));
        closest = e.filter(x => x.dist === min).map(x => x.pid);
        closest.forEach(p => add(d, p, 2));
        if (e.length > 1 && max > min) {
          mane = e.filter(x => x.dist === max).map(x => x.pid);
          Object.entries(g.data.votes).forEach(([voter, t]) => { if (mane.includes(t)) add(d, voter, 1); });
        }
      }
      g.data.result = { closest, mane };
      updateScores(s, d);
    } },
  },
  handle(g, s, pid, a) {
    if (!inRoster(g, pid)) return false;
    if (g.phase === 'answer' && a.type === 'submit') {
      const v = parseNum(a.value);
      if (!Number.isFinite(v)) return false;
      g.data.guesses[pid] = v; return true;
    }
    if (g.phase === 'vote' && a.type === 'vote') {
      if (!maneTargets(g, pid).includes(a.target)) return false;
      g.data.votes[pid] = a.target; return true;
    }
    return false;
  },
  done(g, pid) { return g.phase === 'answer' ? pid in g.data.guesses : g.phase === 'vote' ? pid in g.data.votes : false; },
  bot(g, s, pid) {
    const q = MANE_Q[g.data.qi];
    if (g.phase === 'answer') {
      if (q.y) return { type: 'submit', value: Math.round(q.a + gauss() * 9) };
      let f = Math.exp(gauss() * 0.45);
      if (Math.random() < .2) f *= Math.random() < .5 ? 3.5 : 0.3;
      return { type: 'submit', value: Math.max(0, q.a < 20 ? Math.round(q.a * f) || 1 : Math.round(q.a * f)) };
    }
    if (g.phase === 'vote') {
      const t = maneTargets(g, pid);
      if (!t.length) return null;
      const vals = Object.values(g.data.guesses).sort((a, b) => a - b), med = vals[Math.floor(vals.length / 2)];
      const far = [...t].sort((a, b) => Math.abs(g.data.guesses[b] - med) - Math.abs(g.data.guesses[a] - med));

      }).join('');
      return `<p class="prompt sm">${esc(q.t)}</p><h2 class="ask">Quem foi o Mané?</h2>
        <p class="hint">Vote no chute que você acha mais longe da resposta. Dá para trocar o voto até o tempo acabar.</p><div class="pick-grid">${cards}</div>`;
    }
    const r = g.data.result || { closest: [], mane: [] };
    const rows = Object.entries(g.data.guesses).sort((a, b) => Math.abs(a[1] - q.a) - Math.abs(b[1] - q.a)).map(([pid, v]) => {
      const nv = Object.values(g.data.votes).filter(t => t === pid).length;
      return `<li class="res-row">${avatar(s.players[pid], 'sm')}<span class="res-who"><span class="res-name">${esc(nameOf(s, pid))}</span>

/* ---------- 3. O Impostor ---------- */
function checkClue(raw, word) {
  const v = String(raw || '').trim();
  if (!v) return { err: 'Escreva uma pista.' };
  if (/\s/.test(v)) return { err: 'A pista precisa ser uma palavra só.' };
  if (v.length > 20) return { err: 'Use uma palavra de até 20 letras.' };
  if (word && norm(v) === norm(word)) return { err: 'A pista não pode ser a própria palavra.' };
  return { v };
}
Games.impostor = {
  id: 'impostor', name: 'O Impostor', tag: 'Blefe rápido', glyph: '🕵️', color: '#FF5F57', lip: '#B8302A', min: 3,
  how: 'Todo mundo recebe a mesma palavra, menos o impostor. Cada um dá uma pista de uma palavra só, e a mesa vota em quem está blefando.',
  first: 'role',
  init(g) { g.data = { wi: drawItem(g, IMP_WORDS), impostor: pick(g.roster), seen: {}, clues: {}, votes: {}, result: null }; },
  phases: {
    role: { label: 'Seu papel', dur: 20, bot: [1, 4], next: 'clue', allIn: (g, s) => active(g, s).every(id => g.data.seen[id]) },
    clue: { label: 'Uma pista', dur: 40, bot: [4, 15], next: 'vote', allIn: (g, s) => active(g, s).every(id => id in g.data.clues) },
    vote: { label: 'Discussão e voto', dur: 50, bot: [8, 22], next: 'reveal', allIn: (g, s) => active(g, s).every(id => id in g.data.votes) },
    reveal: { label: 'Desmascarado?', dur: 25, enter(g, s) {
      const d = g.data, r = voteCounts(d.votes), deltas = {};
      const caught = r.top.length === 1 && r.top[0] === d.impostor;
      Object.entries(d.votes).forEach(([v, t]) => { if (t === d.impostor && v !== d.impostor) add(deltas, v, 2); });
      if (!caught) add(deltas, d.impostor, 3);
      d.result = { ...r, caught };
      updateScores(s, deltas);
    } },
  },
  handle(g, s, pid, a) {
    if (!inRoster(g, pid)) return false;
    const d = g.data;
    if (g.phase === 'role' && a.type === 'ready') { d.seen[pid] = true; return true; }
    if (g.phase === 'clue' && a.type === 'submit') {
      const c = checkClue(a.clue, IMP_WORDS[d.wi].w);
      if (c.err) return false;
      d.clues[pid] = c.v; return true;
    }
    if (g.phase === 'vote' && a.type === 'vote') {
      if (a.target === pid || !inRoster(g, a.target)) return false;
      d.votes[pid] = a.target; return true;
    }
    return false;
  },
  done(g, pid) { const d = g.data; return g.phase === 'role' ? !!d.seen[pid] : g.phase === 'clue' ? pid in d.clues : g.phase === 'vote' ? pid in d.votes : false; },
  bot(g, s, pid) {
    const d = g.data, W = IMP_WORDS[d.wi];
    if (g.phase === 'role') return { type: 'ready' };
    if (g.phase === 'clue') {
      const used = Object.values(d.clues).map(norm);
      let pool;
      if (pid === d.impostor) {
        const same = IMP_WORDS.filter((x, i) => i !== d.wi && x.c === W.c).flatMap(x => x.k);
        pool = same.length && Math.random() < .6 ? same : VAGUE;
      } else pool = W.k;
      const fresh = pool.filter(c => !used.includes(norm(c)) && norm(c) !== norm(W.w));
      return { type: 'submit', clue: pick(fresh.length ? fresh : VAGUE) };
    }
    if (g.phase === 'vote') {
      const cands = g.roster.filter(id => id !== pid && s.players[id]);
      if (!cands.length) return null;
      const known = W.k.map(norm);
      const sus = cands.filter(id => !(id in d.clues) || !known.includes(norm(d.clues[id])));
      const pool = pid !== d.impostor && sus.length && Math.random() < .75 ? sus : cands;
      return { type: 'vote', target: pick(pool) };
    }
    return null;
  },
  view(g, s, me) {
    const d = g.data, W = IMP_WORDS[d.wi], imp = d.impostor === me, can = inRoster(g, me);

    if (g.phase === 'role') {
      if (!can) return waitCard('Você entra na próxima rodada', 'Os papéis já foram sorteados.');
      const flipped = Store.local.flip === `${g.round}`;
      return `<div class="role-wrap">
        <button class="role-card ${flipped ? 'flipped' : ''}" data-act="flip" aria-pressed="${flipped}" aria-label="Ver seu papel secreto">
          <span class="rc-face rc-front"><span class="rc-q">?</span><span>Toque para ver seu papel</span><small>Esconda a tela dos outros.</small></span>
          <span class="rc-face rc-back ${imp ? 'is-imp' : ''}">${imp
            ? `<small>Você é</small><b>o impostor</b><span>Categoria: ${esc(W.c)}. Você não sabe a palavra: dê uma pista vaga e se misture.</span>`
            : `<small>A palavra é</small><b>${esc(W.w)}</b><span>Categoria: ${esc(W.c)}. Alguém aqui não sabe disso.</span>`}</span>
        </button>
        ${d.seen[me] ? '<p class="hint">Pronto. Esperando o resto da mesa.</p>' : `<button class="btn game big" data-act="ready" id="roleOk" ${flipped ? '' : 'disabled'}>Entendi meu papel</button>`}
      </div>`;
    }
    if (g.phase === 'clue') {
      if (!can) return waitCard('Pistas sendo escritas', 'Você joga na próxima rodada.');
      if (me in d.clues) return reminder + waitCard(`Sua pista: <b>${esc(d.clues[me])}</b>`, 'Esperando as outras pistas');
      return reminder + `<form class="answer-form" data-form="clue" novalidate>
        <label class="field"><span>Sua pista (uma palavra)</span><input class="input" id="clueIn" data-keep="clue-${g.round}" data-autofocus maxlength="20" autocomplete="off" spellcheck="false" placeholder="${imp ? 'Algo vago…' : 'Algo que lembre a palavra'}"></label>
        <button class="btn game big">Enviar pista</button><p class="err" id="formErr" role="alert"></p></form>
        <p class="hint">${imp ? 'Leia as pistas dos outros depois e tente descobrir a palavra.' : 'Nem óbvia demais (o impostor descobre), nem vaga demais (você vira suspeito).'}</p>`;
    }
    if (g.phase === 'vote') {
      const myVote = d.votes[me];
      const cards = g.roster.filter(id => s.players[id]).map(pid => {
        const self = pid === me;
        return `<button class="pick ${myVote === pid ? 'on' : ''}" data-act="vote" data-id="${pid}" ${self || !can ? 'disabled' : ''} aria-pressed="${myVote === pid}">

    }
    const r = d.result || { counts: {}, caught: false };
    const rows = g.roster.filter(id => s.players[id]).sort((a, b) => (r.counts[b] || 0) - (r.counts[a] || 0)).map(pid =>
      `<li class="res-row">${avatar(s.players[pid], 'sm')}<span class="res-who"><span class="res-name">${esc(nameOf(s, pid))}</span>${pid === d.impostor ? '<span class="tag tag-bad">Impostor</span>' : ''}</span>
        <span class="res-val">${esc(d.clues[pid] || '—')}<span class="res-sub">${plural(r.counts[pid] || 0, 'voto', 'votos')}</span></span>${deltaBadge(g.roundDelta[pid])}</li>`).join('');
    return `<p class="verdict">${r.caught ? 'Pegaram o impostor!' : 'O impostor escapou!'}</p>
      <p class="lede">${esc(nameOf(s, d.impostor))} era o impostor. A palavra era <b>${esc(W.w)}</b>.</p><ul class="res-list">${rows}</ul>`;
  },
};

Games.stop = {
  id: 'stop', name: 'Stop relâmpago', tag: 'Adedonha contra o relógio', glyph: '✋', color: '#A6E05A', lip: '#6A9A2A', min: 1,
  how: 'Uma letra e três categorias. Quem completar tudo primeiro aperta Stop e trava todo mundo. Resposta única vale 2, repetida vale 1.',
  first: 'fill',
  init(g, s) {
    const letters = Object.keys(STOP_BOT).filter(l => !g.used.includes(l));
    const L = pick(letters.length ? letters : Object.keys(STOP_BOT));
    g.used.push(L);
    const hasBots = g.roster.some(id => s.players[id]?.isBot);
    g.data = { L, cats: shuffle(STOP_CATS.map((_, i) => i)).slice(0, 3), answers: {}, stoppedBy: null, rejects: {}, ready: {}, botFollow: {}, result: null,
      botStopAt: hasBots ? now() + rand(30, 52) * 1000 : 0 };
  },
  phases: {
    fill: { label: 'Preencha rápido', dur: 75, bot: [6, 26], next: 'stopped' },
    stopped: { label: 'Stop!', dur: 2.5, next: 'validate' },
    validate: { label: 'Validação', dur: 45, bot: [4, 10], next: 'reveal',
      allIn: (g, s) => active(g, s).every(id => g.data.ready[id]) && !Object.values(g.data.botFollow).some(t => t > 0) },
    reveal: { label: 'Pontos da rodada', dur: 25, enter(g, s) {
      const d = g.data, voters = active(g, s), res = {}, deltas = {};
      d.cats.forEach((ci, k) => {
        const count = {};
        g.roster.forEach(pid => {
          const v = (d.answers[pid] || [])[k] || '';
          const others = voters.filter(x => x !== pid).length, rej = (d.rejects[pid + ':' + k] || []).length;
          const why = !v ? 'Em branco' : !startsWith(v, d.L) ? `Não começa com ${d.L}` : norm(v).length < 2 ? 'Curta demais' : (others && rej * 2 > others) ? 'Anulada pela mesa' : null;
          res[pid + ':' + k] = { v, ok: !why, why };
          if (!why) add(count, norm(v), 1);
        });
        g.roster.forEach(pid => {
          const r = res[pid + ':' + k];
          if (r.ok) { r.pts = count[norm(r.v)] > 1 ? 1 : 2; add(deltas, pid, r.pts); }
        });
      });
      d.result = res;
      updateScores(s, deltas);
    } },
  },
  handle(g, s, pid, a) {
    if (!inRoster(g, pid)) return false;
    const d = g.data;
    if ((a.type === 'draft' || a.type === 'submit') && (g.phase === 'fill' || g.phase === 'stopped')) {
      d.answers[pid] = cleanAnswers(a.answers);
      return a.type === 'submit';   // rascunhos não geram broadcast
    }
    if (a.type === 'stop' && g.phase === 'fill') {
      const ans = cleanAnswers(a.answers);
      if (!ans.every(x => stopValid(x, d.L))) return false;
      d.answers[pid] = ans; d.stoppedBy = pid;
      enginePhase(s, 'stopped');
      return true;
    }
    if (a.type === 'reject' && g.phase === 'validate') {
      if (a.target === pid || !inRoster(g, a.target) || ![0, 1, 2].includes(a.cat)) return false;
      const key = a.target + ':' + a.cat, arr = d.rejects[key] || (d.rejects[key] = []), i = arr.indexOf(pid);
      if (i >= 0) arr.splice(i, 1); else arr.push(pid);
      return true;
    }
    if (a.type === 'ready' && g.phase === 'validate') { d.ready[pid] = true; return true; }
    return false;
  },
  tick(g, s) {
    const d = g.data;
    if (g.phase === 'validate') {
      // Bots acompanham a mesa: quando alguém anula uma resposta, cada bot tende a anular também, alguns segundos depois.
      let changed = false;
      for (const [key, arr] of Object.entries(d.rejects)) {
        if (!arr.length) continue;
        const target = key.split(':')[0];
        for (const id of g.roster) {
          if (!s.players[id]?.isBot || id === target || arr.includes(id)) continue;
          const fk = key + '|' + id;
          if (!(fk in d.botFollow)) d.botFollow[fk] = Math.random() < .75 ? now() + rand(1500, 4500) : 0;
          else if (d.botFollow[fk] && now() >= d.botFollow[fk]) { d.botFollow[fk] = 0; arr.push(id); changed = true; }
        }
      }
      return changed;
    }
    if (g.phase !== 'fill' || !d.botStopAt || now() < d.botStopAt) return false;
    d.botStopAt = 0;
    const bot = g.roster.find(id => s.players[id]?.isBot && (d.answers[id] || []).length === 3 && d.answers[id].every(x => stopValid(x, d.L)));
    if (!bot) return false;
    d.stoppedBy = bot;
    enginePhase(s, 'stopped');
    return true;
  },
  done(g, pid) { return g.phase === 'validate' && !!g.data.ready[pid]; },
  bot(g, s, pid) {
    const d = g.data;
    if (g.phase === 'fill') return { type: 'draft', answers: d.cats.map(ci => Math.random() < .8 ? (STOP_BOT[d.L][ci] || '') : '') };
    if (g.phase === 'validate') return { type: 'ready' };
    return null;
  },
  view(g, s, me) {
    const d = g.data, can = inRoster(g, me);
    if (g.phase === 'fill' || g.phase === 'stopped') {
      const locked = g.phase === 'stopped' || !can;
      const fields = d.cats.map((ci, k) => `<label class="stop-field"><span class="sf-cat">${STOP_CATS[ci]}</span>
        <input class="input" data-keep="stop-${g.round}-${k}" data-stop="${k}" ${k === 0 ? 'data-autofocus' : ''} autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="24" placeholder="${d.L}…" ${locked ? 'disabled' : ''}>
        <span class="sf-ok" aria-hidden="true">✓</span></label>`).join('');
      return `<div class="stop-top"><div class="letter-tile" aria-label="Letra ${d.L}">${d.L}</div>
        <p class="hint">Tudo precisa começar com <b>${d.L}</b>. O botão Stop libera quando as três respostas estiverem preenchidas.</p></div>
        <div class="stop-fields" data-letter="${d.L}">${fields}</div>
        ${g.phase === 'fill'
          ? (can ? `<button class="btn stop-btn" data-act="stop" id="stopBtn" disabled>Stop!</button>` : '<p class="hint">Você entra na próxima rodada.</p>')
          : `<p class="stop-banner">${d.stoppedBy ? `Stop! de ${esc(nameOf(s, d.stoppedBy))}` : 'Tempo esgotado!'}</p>`}`;
    }
    if (g.phase === 'validate') {
      const blocks = d.cats.map((ci, k) => {
        const rows = g.roster.filter(id => s.players[id]).map(pid => {
          const v = (d.answers[pid] || [])[k] || '', rej = d.rejects[pid + ':' + k] || [], mine = rej.includes(me), self = pid === me;
          const auto = !v ? 'Em branco' : !startsWith(v, d.L) ? `Não começa com ${d.L}` : null;
          const ctrl = auto ? `<span>${auto}</span>` : self ? '<span>Sua resposta</span>'
            : can ? `<button class="vbtn" data-act="reject" data-target="${pid}" data-cat="${k}" aria-pressed="${mine}">${mine ? 'Você anulou' : 'Anular'}</button>` : '';
          return `<li class="vrow ${auto ? 'bad' : ''}">${avatar(s.players[pid], 'sm')}<span class="vans">${v ? esc(v) : '—'}</span><span class="vname">${esc(nameOf(s, pid))}</span>
            <span class="vside">${ctrl}${rej.length ? `<span>${plural(rej.length, 'voto contra', 'votos contra')}</span>` : ''}</span></li>`;
        }).join('');
        return `<section class="vblock"><h3>${STOP_CATS[ci]}</h3><ul>${rows}</ul></section>`;
      }).join('');
      return `<p class="hint">Letra <b>${d.L}</b>. Marque as respostas que não valem; a maioria da mesa decide.</p><div class="vgrid">${blocks}</div>
        ${!can ? '' : d.ready[me] ? '<p class="hint center">Validação enviada. Esperando o resto da mesa.</p>' : '<button class="btn game big" data-act="ready">Terminei de validar</button>'}`;
    }
    const res = d.result || {};
    const blocks = d.cats.map((ci, k) => `<section class="vblock"><h3>${STOP_CATS[ci]}</h3><ul>${g.roster.filter(id => s.players[id]).map(pid => {
      const r = res[pid + ':' + k] || { v: '', ok: false, why: 'Em branco' };
      return `<li class="vrow ${r.ok ? '' : 'bad'}">${avatar(s.players[pid], 'sm')}<span class="vans">${r.v ? esc(r.v) : '—'}</span><span class="vname">${esc(nameOf(s, pid))}</span>
        <span class="vside">${r.ok ? `<span class="pts">+${r.pts}</span>` : `<span>${esc(r.why)}</span>`}</span></li>`;
    }).join('')}</ul></section>`).join('');
    return `<p class="verdict">${d.stoppedBy ? `Stop de ${esc(nameOf(s, d.stoppedBy))}` : 'Rodada encerrada'}</p><div class="vgrid">${blocks}</div>`;
  },
};

/* ---------- 6. Fato ou Fake ---------- */
const fatoMult = (t, dur) => { const f = t / (dur * 1000); return f < 1 / 3 ? 3 : f < 2 / 3 ? 2 : 1; };
Games.fato = {

    reveal: { label: 'Resposta', dur: 12, enter(g, s) {
      const q = FATO_Q[g.data.qi], d = {};
      Object.entries(g.data.answers).forEach(([pid, a]) => { if (a.v === q.a) add(d, pid, fatoMult(a.t, Games.fato.phases.answer.dur)); });
      updateScores(s, d);

  handle(g, s, pid, a) {
    if (!inRoster(g, pid) || g.phase !== 'answer' || a.type !== 'submit' || pid in g.data.answers) return false;

  },
  done(g, pid) { return g.phase === 'answer' && pid in g.data.answers; },
  bot(g) { const q = FATO_Q[g.data.qi]; return { type: 'submit', value: Math.random() < .7 ? q.a : !q.a }; },
  view(g, s, me) {
    const q = FATO_Q[g.data.qi], mine = g.data.answers[me], can = inRoster(g, me);
    const P = `<p class="prompt">${esc(q.t)}</p>`;

      const sel = v => mine && mine.v === v ? 'on' : '';

        <button class="ff ff-false ${sel(false)}" data-act="fato" data-v="0" ${mine || !can ? 'disabled' : ''}>Fake</button></div>
        ${mine ? `<p class="hint center">Você cravou <b>${mine.v ? 'Fato' : 'Fake'}</b> em ${(mine.t / 1000).toFixed(1).replace('.', ',')} s (x${fatoMult(mine.t, g.dur)}).</p>` : ''}`;
    }
    const rows = Object.entries(g.data.answers).sort((a, b) => a[1].t - b[1].t).map(([pid, a]) => `<li class="res-row">${avatar(s.players[pid], 'sm')}
      <span class="res-who"><span class="res-name">${esc(nameOf(s, pid))}</span>${a.v === q.a ? '<span class="tag tag-good">Acertou</span>' : '<span class="tag tag-bad">Errou</span>'}</span>
      <span class="res-val">${a.v ? 'Fato' : 'Fake'}<span class="res-sub">${(a.t / 1000).toFixed(1).replace('.', ',')} s</span></span>${deltaBadge(g.roundDelta[pid])}</li>`).join('');
    return P + `<p class="verdict" style="color:${q.a ? 'var(--teal)' : 'var(--coral)'}">${q.a ? 'É fato!' : 'É fake!'}</p><p class="lede">${esc(q.x)}</p>

/* =====================================================================
   Host: processa ações e transmite o estado
   ===================================================================== */
function commit() {
  const s = Store.room;
  s.version = (s.version || 0) + 1;
  saveRoom(s);
  Transport.send({ kind: 'state', state: s });
  render();
}
function mkPlayer(id, pr, isBot) {
  return { id, name: pr.name, avatar: pr.avatar, color: pr.color, score: 0, isBot, connected: true, lastSeen: now() };
}
function uniqueName(s, name) {
  const taken = new Set(Object.values(s.players).map(p => norm(p.name)));
  if (!taken.has(norm(name))) return name;
  for (let i = 2; ; i++) if (!taken.has(norm(`${name} ${i}`))) return `${name} ${i}`;
}
const cleanName = n => String(n || '').replace(/\s+/g, ' ').trim().slice(0, 14);

function hostHandle(from, a) {
  const s = Store.room;
  if (!s || !a) return;
  let changed = false;
  const p = s.players[from];
  if (p && !p.isBot) {
    p.lastSeen = now();
    if (!p.connected) { p.connected = true; changed = true; }
  }
  if (a.type === 'join') {
    const pl = a.player || {};
    if (!pl.id) return;
    if (s.players[pl.id]) { changed = true; }
    else if (Object.keys(s.players).length >= MAX_PLAYERS) {
      Transport.send({ kind: 'reject', to: pl.id, reason: 'Essa sala já está cheia (12 jogadores).' });
      return;
    } else {
      const name = uniqueName(s, cleanName(pl.name) || 'Jogador');
      s.players[pl.id] = mkPlayer(pl.id, { name, avatar: AVATARS.includes(pl.avatar) ? pl.avatar : pick(AVATARS), color: COLORS.includes(pl.color) ? pl.color : pick(COLORS) }, false);
      s.order.push(pl.id);
      changed = true;
    }
  } else if (a.type === 'ping') {
    // só presença
  } else if (a.type === 'leave') {
    if (p) {
      if (s.screen === 'lobby') { delete s.players[from]; s.order = s.order.filter(id => id !== from); }
      else p.connected = false;
      changed = true;
    }
  } else if (!p) {
    return;
  } else if (a.type.startsWith('host:')) {
    if (from === s.hostId) changed = hostCommand(s, a) || changed;
  } else if (s.game && s.game.phase && s.game.phase !== 'final') {
    changed = Games[s.game.id].handle(s.game, s, from, a) || changed;
  }
  if (changed) commit();
}

function hostCommand(s, a) {
  switch (a.type) {
    case 'host:addBot': {
      if (Object.keys(s.players).length >= MAX_PLAYERS) return false;
      const used = new Set(Object.values(s.players).map(p => p.name));
      const name = BOT_NAMES.find(n => !used.has(n)) || uniqueName(s, 'Bot');
      const id = 'bot-' + uid(6);
      s.players[id] = mkPlayer(id, { name, avatar: pick(AVATARS), color: pick(COLORS) }, true);
      s.order.push(id);
      return true;
    }
    case 'host:kick':
      if (s.screen !== 'lobby' || a.id === s.hostId || !s.players[a.id]) return false;
      delete s.players[a.id];
      s.order = s.order.filter(id => id !== a.id);
      return true;
    case 'host:rounds':
      s.settings.rounds = clamp(Number(a.n) || 3, 1, 10);
      return true;
    case 'host:start': {
      const m = Games[a.game];
      if (!m || rosterOf(s).length < m.min) return false;
      engineStart(s, a.game, s.settings.rounds);
      return true;
    }
    case 'host:restart':
      if (!s.game) return false;
      markPlayed(s);
      engineStart(s, s.game.id, s.settings.rounds);
      return true;
    case 'host:next':
      if (!s.game || s.game.phase === 'final') return false;
      engineAdvance(s);
      return true;
    case 'host:lobby':
      markPlayed(s);
      s.game = null; s.screen = 'lobby';
      return true;
    case 'host:end':
      markPlayed(s);
      s.game = null; s.screen = 'podium';
      return true;
    case 'host:newMatch':
      Object.values(s.players).forEach(p => { p.score = 0; });
      s.match.played = []; s.game = null; s.screen = 'lobby';
      return true;
  }
  return false;
}
function markPlayed(s) {
  if (s.game && s.game.phase === 'final' && !s.match.played.includes(s.game.id)) s.match.played.push(s.game.id);
}

function hostTick() {
  const s = Store.room;
  if (!s || !isHost()) return;
  let changed = false;
  for (const p of Object.values(s.players)) {
    if (!p.isBot && p.id !== s.hostId && p.connected && now() - p.lastSeen > 10000) { p.connected = false; changed = true; }
  }
  const g = s.game;
  if (g && g.phase && g.phase !== 'final') {
    const mod = Games[g.id], ph = mod.phases[g.phase];
    if (ph.bot) {
      for (const id of g.roster) {
        if (!s.players[id]?.isBot) continue;
        const key = `${g.id}:${g.round}:${g.phase}:${g.phaseStart}:${id}`;
        if (HostRT.botDone.has(key)) continue;
        if (!HostRT.botAt[key]) { HostRT.botAt[key] = now() + rand(ph.bot[0], ph.bot[1]) * 1000; continue; }
        if (now() < HostRT.botAt[key]) continue;
        HostRT.botDone.add(key); delete HostRT.botAt[key];
        for (const act of [].concat(mod.bot(g, s, id) || [])) if (mod.handle(g, s, id, act)) changed = true;
      }
    }
    if (mod.tick && mod.tick(g, s)) changed = true;
    const cur = mod.phases[g.phase];
    if (g.deadline && now() >= g.deadline) { engineAdvance(s); changed = true; }
    else if (cur.allIn && cur.allIn(g, s)) {
      if (!HostRT.allInAt) HostRT.allInAt = now() + 700;
      else if (now() >= HostRT.allInAt) { engineAdvance(s); changed = true; }
    } else HostRT.allInAt = null;
  }
  if (changed) commit();
}
function startHost() {
  stopHost();
  HostRT.timer = setInterval(hostTick, 200);
  HostRT.beat = setInterval(() => Transport.send({ kind: 'beat' }), 2500);
}
function stopHost() {
  clearInterval(HostRT.timer); clearInterval(HostRT.beat);
  HostRT.timer = HostRT.beat = null; HostRT.botAt = {}; HostRT.botDone = new Set(); HostRT.allInAt = null;
}

/* =====================================================================
   Cliente: conexão com a sala
   ===================================================================== */
let joinWait = null, lastHostSignal = 0, pingTimer = null;

function onMessage(msg) {
  const me = Store.me;
  if (!me) return;
  if (isHost()) {
    if (msg.kind === 'action' && msg.from) hostHandle(msg.from, msg.action);
    else if (msg.kind === 'hello') Transport.send({ kind: 'state', state: Store.room });
    return;
  }
  if (msg.kind === 'state' && msg.state) {
    lastHostSignal = now();
    const inside = !!msg.state.players[me.id];
    if (joinWait) {
      if (!inside) return;
      const w = joinWait; joinWait = null; w.done({ ok: true });
    } else if (!inside) {
      leaveRoom('Você foi removido da sala.', true);
      return;
    }
    if (Store.room && msg.state.version < Store.room.version && msg.state.pin === Store.room.pin) return;
    Store.room = msg.state;
    if (Store.hostLost) Store.hostLost = false;
    render();
  } else if (msg.kind === 'beat') {
    lastHostSignal = now();
    if (Store.hostLost) { Store.hostLost = false; render(); }
  } else if (msg.kind === 'closed') {
    leaveRoom('O host encerrou a sala.', true);
  } else if (msg.kind === 'reject' && msg.to === me.id && joinWait) {
    const w = joinWait; joinWait = null; w.done({ ok: false, reason: msg.reason });
  }
}

function dispatch(action) {
  const me = Store.me;
  if (!me) return;
  if (me.isHost) hostHandle(me.id, action);
  else Transport.send({ kind: 'action', from: me.id, action });
}

function startPresence() {
  clearInterval(pingTimer);
  pingTimer = setInterval(() => {
    if (!Store.me || isHost()) return;
    dispatch({ type: 'ping' });
    const lost = now() - lastHostSignal > 9000;
    if (lost !== Store.hostLost) { Store.hostLost = lost; render(); }
  }, 3000);
}

function genPin() {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let pin;
  do { pin = Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join(''); } while (loadRoom(pin));
  return pin;
}

/** Cria a sala; quem cria vira host e também joga. */
function createRoom(profile) {
  const pin = genPin(), id = 'p-' + uid(8);
  Store.me = { id, pin, isHost: true, profile };
  Store.room = { pin, hostId: id, createdAt: now(), version: 0, screen: 'lobby', players: { [id]: mkPlayer(id, profile, false) }, order: [id], settings: { rounds: 3 }, match: { played: [] }, game: null };
  Session.save(Store.me);
  Transport.open(pin, onMessage);
  startHost();
  history.replaceState(null, '', '#' + pin);
  commit();
  return pin;
}

/** Entra numa sala aberta em outra aba. Resolve com { ok, reason }. */
function joinRoom(pin, profile, existingId) {
  pin = String(pin || '').toUpperCase().trim();
  const id = existingId || 'p-' + uid(8);
  Store.me = { id, pin, isHost: false, profile };
  Transport.open(pin, onMessage);
  return new Promise(resolve => {
    joinWait = { done: res => {
      clearTimeout(t);
      if (res.ok) {
        Session.save(Store.me);
        lastHostSignal = now();
        startPresence();
        history.replaceState(null, '', '#' + pin);
      } else { Transport.close(); Store.me = null; }
      resolve(res);
    } };
    const t = setTimeout(() => {
      if (!joinWait) return;
      const w = joinWait; joinWait = null;
      w.done({ ok: false, reason: `Nenhuma sala ${pin} respondeu. Confira o código e se a aba do host continua aberta.` });
    }, 2600);
    Transport.send({ kind: 'action', from: id, action: { type: 'join', player: { id, ...profile } } });
  });
}

function leaveRoom(msg, silent) {
  const me = Store.me;
  if (me) {
    if (me.isHost) { Transport.send({ kind: 'closed' }); stopHost(); dropRoom(me.pin); }
    else if (!silent) dispatch({ type: 'leave' });
  }
  clearInterval(pingTimer);
  Transport.close();
  Store.me = null; Store.room = null; Store.hostLost = false; joinWait = null;
  Session.clear();
  history.replaceState(null, '', location.pathname + location.search);
  render();
  if (msg) toast(msg);
}

const nameOf = (s, id) => s.players[id]?.name ?? 'Alguém';
function avatar(p, size = 'md') {
  if (!p) return '';
  return `<span class="av av-${size}" style="--c:${p.color}" aria-hidden="true">${p.avatar}</span>`;
}
const gameVars = m => `--g:${m.color};--gl:${m.lip}`;
const waitCard = (main, sub) => `<div class="wait"><div class="wait-main">${main}</div><p class="hint">${sub}<span class="dots"></span></p></div>`;
const deltaBadge = n => n ? `<span class="delta">+${n}</span>` : '<span></span>';

let lastSig = '';
function render() {
  const s = Store.room, app = $('#app');
  renderTop();
  let html, sig;
  if (!s || !Store.me) { sig = 'home'; html = viewHome(); }
  else if (s.screen === 'lobby') { sig = 'lobby'; html = viewLobby(s); }
  else if (s.screen === 'game' && s.game) { sig = `game:${s.game.id}:${s.game.round}:${s.game.phase}`; html = viewGame(s); }
  else { sig = 'podium'; html = viewPodium(s); }
  if (s && !isHost() && Store.hostLost) html = `<div class="banner" role="alert">Sem sinal do host há alguns segundos. Se a aba do host foi fechada, a sala acabou.</div>` + html;
  const kept = captureInputs(app);
  app.innerHTML = html;
  restoreInputs(app, kept);
  if (sig !== lastSig) {
    lastSig = sig;
    $('.screen', app)?.classList.add('enter');
    window.scrollTo({ top: 0 });
    const af = $('[data-autofocus]', app);
    if (af && !af.disabled && matchMedia('(pointer:fine)').matches) af.focus({ preventScroll: true });
  }
  afterRender(s);
}

function captureInputs(root) {
  const vals = {};
  let focus = null;
  $$('[data-keep]', root).forEach(el => {
    vals[el.dataset.keep] = el.value;
    if (el === document.activeElement) focus = { k: el.dataset.keep, a: el.selectionStart, b: el.selectionEnd };
  });
  return { vals, focus };
}
function restoreInputs(root, { vals, focus }) {
  $$('[data-keep]', root).forEach(el => { if (el.dataset.keep in vals) el.value = vals[el.dataset.keep]; });
  if (focus) {
    const el = root.querySelector(`[data-keep="${focus.k}"]`);
    if (el && !el.disabled) { el.focus({ preventScroll: true }); try { el.setSelectionRange(focus.a, focus.b); } catch {} }
  }
}

function afterRender(s) {
  const g = s?.game;
  if (!g || s.screen !== 'game') return;
  if (g.id === 'stop') {
    refreshStopUI();
    const key = `${g.round}:${g.phaseStart}`;
    if (g.phase === 'stopped' && Store.local.stopSent !== key && inRoster(g, Store.me.id)) {
      Store.local.stopSent = key;
      const answers = stopInputs();
      setTimeout(() => dispatch({ type: 'submit', answers }), 0);
    }
  }
}

function timerHTML(g) {
  const left = Math.max(0, g.deadline - now());
  return `<div class="timer ${left < 5000 ? 'low' : ''}" data-deadline="${g.deadline}" data-dur="${g.dur}" style="--p:${g.dur ? left / (g.dur * 1000) : 0}">

    <span class="timer-num">${Math.ceil(left / 1000)}</span></div>`;
}

function viewGame(s) {
  const g = s.game, mod = Games[g.id], me = Store.me.id, host = isHost();
  if (g.phase === 'final') return viewGameFinal(s);
  const ph = mod.phases[g.phase];
  const firstStep = g.round === 1 && g.phase === mod.first;
  const reveal = g.phase === 'reveal';
  return `<section class="screen game" style="${gameVars(mod)}">
    <header class="game-head">
      <div class="gh-id"><span class="gh-glyph" aria-hidden="true">${mod.glyph}</span>
        <div><h1 class="gh-name">${mod.name}</h1><p class="gh-sub"><span>Rodada ${g.round} de ${g.total}</span><span class="phase-pill">${ph.label}</span></p></div></div>
      ${firstStep ? `<p class="gh-how">${esc(mod.how)}</p>` : ''}
      ${g.deadline ? timerHTML(g) : ''}
    </header>
    <div class="stage">${mod.view(g, s, me)}</div>
    ${host ? `<div class="hostbar"><span class="hb-label">Controles do host</span>
      ${reveal ? `<button class="btn primary sm" data-act="next">${g.round >= g.total ? 'Ver resultado do jogo' : 'Próxima rodada'}</button>` : `<button class="btn ghost sm" data-act="next">Pular etapa</button>`}
      <button class="btn ghost sm" data-act="toLobby">Voltar ao lobby</button></div>`
      : reveal ? '<p class="hint center" style="margin-top:14px">A próxima rodada começa quando o tempo acabar ou o host avançar.</p>' : ''}
    ${stripHTML(s, g, mod)}
  </section>`;
}

function stripHTML(s, g, mod) {
  const ids = [...g.roster, ...s.order.filter(id => !g.roster.includes(id))].filter(id => s.players[id]);
  return `<ul class="strip" aria-label="Placar geral">${ids.map(id => {
    const p = s.players[id], done = inRoster(g, id) && mod.done(g, id), delta = g.phase === 'reveal' ? g.roundDelta[id] || 0 : 0;
    return `<li class="chip ${p.connected || p.isBot ? '' : 'off'} ${id === Store.me.id ? 'me' : ''}">${avatar(p, 'sm')}<span class="chip-name">${esc(p.name)}</span>
      <span class="chip-score">${p.score}</span>${done ? '<span class="chip-done" title="Já respondeu">✓</span>' : ''}${delta ? `<span class="delta">+${delta}</span>` : ''}</li>`;
  }).join('')}</ul>`;
}

function viewGameFinal(s) {
  const g = s.game, mod = Games[g.id], host = isHost();
  const ids = [...new Set([...g.roster, ...Object.keys(g.earned)])].filter(id => s.players[id]).sort((a, b) => (g.earned[b] || 0) - (g.earned[a] || 0) || s.players[b].score - s.players[a].score);
  const top = ids[0] && g.earned[ids[0]] ? nameOf(s, ids[0]) : null;
  const rows = ids.map((id, i) => `<li><span class="rank-pos">${i + 1}</span>${avatar(s.players[id], 'md')}
    <span><b>${esc(nameOf(s, id))}</b><span class="res-sub">+${g.earned[id] || 0} neste jogo</span></span><span class="rank-total">${s.players[id].score}</span></li>`).join('');
  return `<section class="screen game game-final" style="${gameVars(mod)}">
    <div class="final-head"><span class="gh-glyph" aria-hidden="true">${mod.glyph}</span><div><h1 class="gh-name">${mod.name} acabou</h1>
      <p class="gh-sub">${top ? `${esc(top)} fez mais pontos neste jogo.` : 'Ninguém pontuou neste jogo.'}</p></div></div>
    <p class="hint">À direita, o total de cada um na partida.</p>
    <ol class="rank">${rows}</ol>
    ${host ? `<div class="row"><button class="btn primary" data-act="toLobby">Escolher outro jogo</button><button class="btn" data-act="restart">Jogar de novo</button>
      <button class="btn ghost" data-act="endMatch">Encerrar partida e ver pódio</button></div>` : '<p class="hint">O host vai escolher o próximo jogo<span class="dots"></span></p>'}
  </section>`;
}

function viewPodium(s) {
  const ranked = s.order.map(id => s.players[id]).filter(Boolean).sort((a, b) => b.score - a.score);
  const best = ranked[0]?.score ?? 0;
  const winners = ranked.filter(p => p.score === best);
  const title = !ranked.length ? 'Fim de partida' : winners.length > 1 ? `Empate no topo: ${winners.map(p => esc(p.name)).join(' e ')}!` : `${esc(winners[0].name)} venceu a partida!`;
  const colors = { 1: 'var(--amber)', 2: 'var(--blue)', 3: 'var(--pink)' };
  const step = (p, place, h, d) => p ? `<div class="pod" style="--h:${h}%;--pc:${colors[place]};--d:${d}s">
      <div class="pod-who">${avatar(p, 'lg')}<b>${esc(p.name)}</b><span class="pod-pts">${plural(p.score, 'pt', 'pts')}</span></div>
      <div class="pod-step">${place}º</div></div>` : '<div class="pod"></div>';
  const rest = ranked.slice(3).map((p, i) => `<li><span class="rank-pos">${i + 4}º</span>${avatar(p, 'sm')}<span>${esc(p.name)}</span><b>${p.score}</b></li>`).join('');
  const conf = Array.from({ length: 46 }, () => `<i style="--x:${rand(0, 100).toFixed(1)}%;--c:${pick(['#FFB02E','#FF6FB5','#33D6B0','#6C9BFF','#A6E05A','#FF5F57'])};--d:${rand(1.6, 3.4).toFixed(2)}s;--t:${rand(2.6, 4.4).toFixed(2)}s;--dx:${rand(-80, 80).toFixed(0)}px;--r:${rand(240, 900).toFixed(0)}deg"></i>`).join('');
  return `<section class="screen podium-screen">
    <h1 class="podium-title">${title}</h1>
    <p class="lede center">Placar final somando todos os jogos da partida.</p>
    <div class="podium">${step(ranked[1], 2, 52, .35)}${step(ranked[0], 1, 72, .7)}${step(ranked[2], 3, 36, 0)}</div>
    ${rest ? `<ol class="rest">${rest}</ol>` : '<div style="height:22px"></div>'}
    <div class="row center">${isHost() ? '<button class="btn primary" data-act="newMatch">Nova partida com a mesma sala</button>' : ''}<button class="btn ghost" data-act="leave">Sair da sala</button></div>
    <div class="confetti" aria-hidden="true">${conf}</div>
  </section>`;
}

/* ---------- Animação do timer e do multiplicador ---------- */
function frame() {
  $$('.timer').forEach(el => {
    const dl = +el.dataset.deadline, dur = +el.dataset.dur, left = Math.max(0, dl - now());
    el.style.setProperty('--p', dur ? left / (dur * 1000) : 0);
    const num = el.querySelector('.timer-num'), sec = String(Math.ceil(left / 1000));
    if (num.textContent !== sec) num.textContent = sec;
    el.classList.toggle('low', left < 5000);
  });
  $$('[data-mult-start]').forEach(el => {
    if (el.dataset.frozen) return;
    const m = fatoMult(now() - +el.dataset.multStart, +el.dataset.multDur);
    el.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('now', +x.dataset.m === m));
  });
  requestAnimationFrame(frame);
}

/* ---------- Stop: helpers de interface ---------- */
const stopInputs = () => [0, 1, 2].map(k => $(`[data-stop="${k}"]`)?.value || '');
function refreshStopUI() {
  const box = $('.stop-fields');
  if (!box) return;
  const L = box.dataset.letter;
  let all = true;
  $$('[data-stop]', box).forEach(el => {
    const ok = stopValid(el.value, L);
    el.closest('.stop-field').classList.toggle('ok', ok);
    if (!ok) all = false;
  });
  const btn = $('#stopBtn');
  if (btn) btn.disabled = !all;
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch {}
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  ta.remove(); return ok;
}

   Eventos de interface
   ===================================================================== */
function profileOrError() {
  const pr = Store.local.profile, name = cleanName($('#nick')?.value ?? pr.name);
  if (!name) {
    const err = $('#nickErr'); if (err) err.textContent = 'Digite um apelido para jogar.';
    $('#nick')?.focus();
    return null;
  }
  pr.name = name; saveProfile();
  return { name, avatar: pr.avatar, color: pr.color };
}

const Actions = {
  brand(el, e) { e.preventDefault(); if (!Store.room) render(); },
  avatar(el) { Store.local.profile.avatar = el.dataset.v; saveProfile(); syncPicker(); },
  color(el) { Store.local.profile.color = el.dataset.v; saveProfile(); syncPicker(); },
  picker(el) {
    const open = !Store.local.pickerOpen, box = $('#picker');
    Store.local.pickerOpen = open;
    el.setAttribute('aria-expanded', open);
    box.hidden = !open;
    box.classList.toggle('opening', open);
  },
  tab(el) { selectTab(el.dataset.v, true); },
  create() { const pr = profileOrError(); if (pr) createRoom(pr); },
  quick() {
    const pr = profileOrError(); if (!pr) return;
    createRoom(pr);
    for (let i = 0; i < 3; i++) dispatch({ type: 'host:addBot' });
    toast('Sala criada com 3 bots. Escolha um jogo.');
  },
  async copyCode() { toast(await copyText(Store.room.pin) ? `Código ${Store.room.pin} copiado` : `O código é ${Store.room.pin}`); },
  async copyLink() {
    const link = location.href.split('#')[0] + '#' + Store.room.pin;
    toast(await copyText(link) ? 'Link da sala copiado' : 'Não deu para copiar. Use o código da sala.');
  },
  leave() {
    if (isHost() && Store.room?.order.some(id => id !== Store.me.id && !Store.room.players[id]?.isBot) && !confirm('Sair encerra a sala para todo mundo. Encerrar?')) return;
    leaveRoom(isHost() ? 'Sala encerrada.' : 'Você saiu da sala.');
  },
  addBot() { dispatch({ type: 'host:addBot' }); },
  kick(el) { dispatch({ type: 'host:kick', id: el.dataset.id }); },
  rounds(el) { dispatch({ type: 'host:rounds', n: +el.dataset.n }); },
  startGame(el) { PlayBox.startGame(el.dataset.game); },
  next() { PlayBox.nextRound(); },
  restart() { dispatch({ type: 'host:restart' }); },
  toLobby() {
    const g = Store.room?.game;
    if (g && g.phase !== 'final' && !confirm('Voltar ao lobby agora? Os pontos já ganhos neste jogo continuam no placar.')) return;
    dispatch({ type: 'host:lobby' });
  },
  endMatch() { PlayBox.endMatch(); },
  newMatch() { dispatch({ type: 'host:newMatch' }); },
  vote(el) { PlayBox.castVote(el.dataset.id); },
  choose(el) { PlayBox.submitAnswer({ choice: el.dataset.v }); },
  fato(el) { PlayBox.submitAnswer({ value: el.dataset.v === '1' }); },
  ready() { dispatch({ type: 'ready' }); },
  flip(el) {
    const g = Store.room.game, key = `${g.round}`;
    const on = Store.local.flip !== key;
    Store.local.flip = on ? key : null;
    el.classList.toggle('flipped', on);
    el.setAttribute('aria-pressed', on);
    const ok = $('#roleOk'); if (ok && on) ok.disabled = false;
  },
  reject(el) { dispatch({ type: 'reject', target: el.dataset.target, cat: +el.dataset.cat }); },
  stop() { PlayBox.pressStop(stopInputs()); },
};

// Atualiza o seletor de avatar sem redesenhar a tela (evita piscar e perder o foco).
function syncPicker() {
  const pr = Store.local.profile;
  $('#avPreview').innerHTML = avatar(pr, 'md');
  $$('.emo').forEach(b => { const on = b.dataset.v === pr.avatar; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  $$('.sw').forEach(b => { const on = b.dataset.v === pr.color; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
}
function selectTab(id, focus) {
  Store.local.homeTab = id;
  $$('[role="tab"]').forEach(t => { const on = t.dataset.v === id; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; if (on && focus) t.focus(); });
  $$('.tab-body').forEach(p => { p.hidden = p.id !== 'panel-' + id; });
  const err = $('#joinErr'); if (err) err.textContent = '';
}

const Forms = {
  home(form) {
    if (Store.local.homeTab === 'join') return Forms.join(form);
    const pr = profileOrError(); if (pr) createRoom(pr);
  },
  async join(form) {
    const pin = ($('#pin').value || '').toUpperCase().trim(), err = $('#joinErr');
    err.textContent = '';
    const pr = profileOrError(); if (!pr) return;
    if (!/^[A-Z0-9]{4}$/.test(pin)) { err.textContent = 'O código da sala tem 4 letras ou números.'; $('#pin').focus(); return; }
    const btn = $('#joinBtn'); btn.disabled = true; btn.textContent = 'Entrando…';
    const res = await joinRoom(pin, pr);
    if (!res.ok) {
      render();
      const e2 = $('#joinErr'); if (e2) e2.textContent = res.reason;
    }
  },
  mane() {
    const el = $('#maneIn'), v = parseNum(el.value);
    if (!Number.isFinite(v)) { $('#formErr').textContent = 'Digite um número, por exemplo 1500 ou 2,5.'; el.focus(); return; }
    PlayBox.submitAnswer({ value: v });
  },
  clue() {
    const g = Store.room.game, d = g.data;
    const word = d.impostor === Store.me.id ? null : IMP_WORDS[d.wi].w;
    const c = checkClue($('#clueIn').value, word);
    if (c.err) { $('#formErr').textContent = c.err; $('#clueIn').focus(); return; }
    PlayBox.submitAnswer({ clue: c.v });
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = Actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  Forms[f.dataset.form]?.(f);
});
let draftT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pin') {
    const v = t.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v !== t.value) t.value = v;
    Store.local.pinDraft = v;
  } else if (t.id === 'nick') {
    Store.local.profile.name = t.value; saveProfile();
    const err = $('#nickErr'); if (err) err.textContent = '';
  } else if (t.id === 'clueIn') {
    const v = t.value.replace(/\s+/g, '');
    if (v !== t.value) t.value = v;
  } else if (t.dataset.stop !== undefined) {
    refreshStopUI();
    clearTimeout(draftT);
    draftT = setTimeout(() => dispatch({ type: 'draft', answers: stopInputs() }), 250);
  }
});
document.addEventListener('keydown', e => {
  // Enter num campo do Stop pula para o próximo; no último, aperta Stop se puder.
  const t = e.target;
  if (t.getAttribute?.('role') === 'tab' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    selectTab(Store.local.homeTab === 'join' ? 'create' : 'join', true);
    return;
  }
  if (e.key !== 'Enter' || t.dataset?.stop === undefined) return;
  e.preventDefault();
  const next = $(`[data-stop="${+t.dataset.stop + 1}"]`);
  if (next) next.focus(); else { const b = $('#stopBtn'); if (b && !b.disabled) b.click(); }
});

/* =====================================================================
   API pública (para plugar backend ou automatizar testes)
   ===================================================================== */
const PlayBox = window.PlayBox = {
  createRoom,
  joinRoom,
  leaveRoom,
  startGame: gameId => dispatch({ type: 'host:start', game: gameId }),
  submitAnswer: payload => dispatch({ type: 'submit', ...payload }),
  castVote: (target, extra = {}) => dispatch({ type: 'vote', target, ...extra }),
  pressStop: answers => dispatch({ type: 'stop', answers }),
  nextRound: () => dispatch({ type: 'host:next' }),
  endMatch: () => dispatch({ type: 'host:end' }),
  updateScores: deltas => { if (isHost() && Store.room) { updateScores(Store.room, deltas); commit(); } },
  get state() { return Store.room; },
  Games, Transport,
};

/* =====================================================================
   Início
   ===================================================================== */
async function boot() {
  Store.local.profile = loadProfile();
  const hashPin = location.hash.slice(1).toUpperCase();
  if (/^[A-Z0-9]{4}$/.test(hashPin)) Store.local.pinDraft = hashPin;
  requestAnimationFrame(frame);
  const sess = Session.load();
  if (sess?.isHost) {
    const saved = loadRoom(sess.pin);
    if (saved && saved.hostId === sess.id) {
      Store.me = sess; Store.room = saved;
      Object.values(saved.players).forEach(p => { p.lastSeen = now(); });
      Transport.open(sess.pin, onMessage);
      startHost();
      commit();
      return;
    }
    Session.clear();
  } else if (sess?.pin) {
    render();
    const res = await joinRoom(sess.pin, sess.profile, sess.id);
    if (!res.ok) { Session.clear(); render(); toast('A sala anterior não está mais aberta.'); }
    return;
  }
  render();
}
boot();
</script>
