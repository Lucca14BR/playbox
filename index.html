.pod-who{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:10px;width:100%;text-align:center}
.pod-crown{color:var(--gold);margin-bottom:-4px}
.pod-crown .ic{width:24px;height:24px}
.pod-who b{margin-top:6px;font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pod-pts{font-size:.8rem;color:var(--muted);font-weight:600}
.pod-step{
  width:100%;height:var(--h);display:flex;justify-content:center;padding-top:12px;border-radius:14px 14px 4px 4px;
  font-size:clamp(2rem,8vw,2.8rem);font-weight:800;color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.14);
}
.pod-1 .pod-step{--h:62%;background:linear-gradient(180deg,#FCD34D,#F59E0B 60%,#B45309);color:#3A2300;box-shadow:0 20px 50px -16px rgba(251,191,36,.55)}
.pod-2 .pod-step{--h:44%;background:linear-gradient(180deg,#64748B,#475569 60%,#334155)}
.pod-3 .pod-step{--h:32%;background:linear-gradient(180deg,#F59E5B,#C2410C 70%,#9A3412)}
.pod-1 .av-xl{box-shadow:inset 0 0 0 3px var(--gold),0 0 30px -4px rgba(251,191,36,.6)}
.enter .pod-step{transform-origin:bottom;animation:grow .9s var(--d) cubic-bezier(.2,.9,.25,1) both}
.enter .pod-who{animation:drop .55s calc(var(--d) + .7s) cubic-bezier(.3,1.5,.5,1) both}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes drop{from{opacity:0;transform:translateY(-30px)}}
.ranking .panel-title{margin-bottom:14px}
.pod-actions{margin-top:24px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-20px;left:var(--x);width:6px;height:12px;border-radius:2px;background:var(--c);opacity:0;animation:fall var(--t) var(--d) linear forwards}
@keyframes fall{0%{opacity:.9;transform:translate(0,0) rotate(0)}100%{opacity:.9;transform:translate(var(--dx),112vh) rotate(var(--r))}}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));z-index:40;transform:translate(-50%,160%);
  background:rgba(22,24,34,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line-2);
  color:var(--ink);font-weight:600;font-size:.92rem;padding:11px 20px;border-radius:999px;max-width:calc(100vw - 32px);
  box-shadow:0 14px 30px -10px rgba(0,0,0,.7);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);text-align:center;
}
#toast.show{transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .confetti{display:none}
}

/* =====================================================================
   Transporte (troque por Socket.io / Firebase / Supabase no futuro)
   ===================================================================== */
// Dois caminhos ao mesmo tempo, com mensagens deduplicadas pelo id (mid):
//  1. Local: BroadcastChannel + evento "storage" (abas do mesmo navegador, instantâneo).
//  2. Rede: retransmissor MQTT sobre WebSocket seguro, em dois servidores públicos gratuitos
//     ao mesmo tempo. Como tudo passa por uma conexão WebSocket comum, funciona entre
//     quaisquer redes (Wi-Fi diferentes, 4G/5G), sem depender de conexão direta.
//     Tópicos: <ns>/<PIN>/up (jogadores -> host) e <ns>/<PIN>/down (host -> jogadores).
// Toda vez que um servidor (re)conecta, onLinkUp avisa o app para ressincronizar a sala.
// ?rede=local desliga a rede; ?rede=internet desliga o canal local (útil para testar).
const RELAYS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const RELAY_NS = 'playbox-v2';
const Transport = (() => {
  let bc = null, pin = null, handler = null, role = null;
  let relays = [];
  let net = 'off';            // off | connecting | online | offline
  const mode = new URLSearchParams(location.search).get('rede');
  const useLocal = mode !== 'internet', useNet = mode !== 'local';
  const src = uid(10), seen = new Set(), seenQ = [];
  const remember = id => { seen.add(id); seenQ.push(id); if (seenQ.length > 400) seen.delete(seenQ.shift()); };
  const topic = (p, k) => `${RELAY_NS}/${p}/${k}`;
  function setNet(v) {
    if (net === v) return;
    net = v;
    Transport.onStatus && Transport.onStatus(v);
  }
  function refreshNet() {
    if (!relays.length) return setNet('offline');
    if (relays.some(r => r.state === 'up')) setNet('online');
    else if (relays.every(r => r.state === 'down')) setNet('offline');
    else setNet('connecting');
  }
  function deliver(msg) {
    if (typeof msg === 'string') { try { msg = JSON.parse(msg); } catch { return; } }
    if (!msg || msg.src === src || seen.has(msg.mid)) return;
    remember(msg.mid);
    handler && handler(msg);
  }
  function onStorage(e) {
    if (e.key !== 'playbox:bus:' + pin || !e.newValue) return;
    try { deliver(JSON.parse(e.newValue)); } catch {}
  }
  function startRelays() {
    const inbox = topic(pin, role === 'host' ? 'up' : 'down');
    relays = RELAYS.map(url => {
      const r = { state: 'connecting', client: null };
      const c = mqtt.connect(url, { clientId: 'pb_' + uid(12), clean: true, connectTimeout: 10000, reconnectPeriod: 2000, keepalive: 20 });
      r.client = c;
      c.on('connect', () => {
        r.state = 'up';
        c.subscribe(inbox, { qos: 0 });
        refreshNet();
        Transport.onLinkUp && Transport.onLinkUp(role);
      });
      c.on('close', () => { if (r.state !== 'closed') { r.state = 'down'; refreshNet(); } });
      c.on('error', () => {});
      c.on('message', (t, payload) => deliver(payload.toString()));
      return r;
    });
  }

  const Transport = {
    onStatus: null,
    onLinkUp: null,
    get status() { return net; },
    get networkAvailable() { return useNet && typeof window.mqtt === 'object' && typeof window.mqtt.connect === 'function'; },
    open(p, h, r = 'client') {
      this.close();
      pin = p; handler = h; role = r;
      if (useLocal) {
        if ('BroadcastChannel' in window) { bc = new BroadcastChannel('playbox:' + p); bc.onmessage = e => deliver(e.data); }
        window.addEventListener('storage', onStorage);
      }
      if (this.networkAvailable) {
        setNet('connecting');
        try { startRelays(); } catch { setNet('offline'); }
      } else setNet('offline');
    },
    send(msg) {
      if (!pin) return;
      msg = { ...msg, src, mid: uid(12) };
      remember(msg.mid);
      if (useLocal) {
        try { bc && bc.postMessage(msg); } catch {}
        try { localStorage.setItem('playbox:bus:' + pin, JSON.stringify(msg)); } catch {}
      }
      // Enquanto conecta, o MQTT.js guarda as mensagens e envia assim que a conexão abrir.
      const t = topic(pin, role === 'host' ? 'down' : 'up'), text = JSON.stringify(msg);
      relays.forEach(r => { try { r.client.publish(t, text, { qos: 0 }); } catch {} });
    },
    // Ao voltar para a tela (o celular pode ter suspendido a conexão), reconecta na hora.
    wake() {
      relays.forEach(r => { if (r.state !== 'closed' && r.client && !r.client.connected && !r.client.reconnecting) try { r.client.reconnect(); } catch {} });
    },
    close() {
      relays.forEach(r => { r.state = 'closed'; try { r.client.end(false); } catch {} });
      relays = [];
      if (bc) { bc.close(); bc = null; }
      window.removeEventListener('storage', onStorage);
      pin = null; handler = null; role = null;
      setNet('off');
    },
  };
  return Transport;
})();

function loadProfile() {

  return { name: '', avatar: pick(AVATARS), color: pick(COLORS) };
}

/* =====================================================================
   Motor do host: fases, rodadas e pontuação
   ===================================================================== */
const HostRT = { timer: null, beat: null, botAt: {}, botDone: new Set(), allInAt: null };

function rosterOf(s) { return s.order.filter(id => plays(s, id) && (s.players[id].connected || s.players[id].isBot)); }
function active(g, s) { return g.roster.filter(id => { const p = s.players[id]; return p && (p.isBot || p.connected); }); }
const inRoster = (g, pid) => g.roster.includes(pid);
function drawItem(g, list) {
  let pool = list.map((_, i) => i).filter(i => !g.used.includes(i));
  if (!pool.length) { g.used = []; pool = list.map((_, i) => i); }
  const i = pick(pool); g.used.push(i); return i;
}

function engineStart(s, gameId, rounds) {
  s.screen = 'game';
  s.vote = null;
  // Alguns jogos longos (como o Lobisomem) limitam o número de rodadas.
  s.game = { id: gameId, round: 0, total: Games[gameId].rounds ? Math.min(Games[gameId].rounds, rounds) : rounds, phase: null, phaseStart: 0, deadline: null, dur: 0, data: {}, earned: {}, roundDelta: {}, used: [], roster: [] };
  engineNextRound(s);
}
function engineNextRound(s) {
  const g = s.game;
  g.round++; g.roundDelta = {};
  if (g.round > g.total) { g.phase = 'final'; g.deadline = null; return; }
  g.roster = rosterOf(s);
  g.bets = {}; g.applause = {}; delete g.betResult; delete g.conquest;
  const mod = Games[g.id];
  mod.init(g, s);
  enginePhase(s, modeOf(s) === 'apostas' && mod.phases.bet ? 'bet' : mod.first);
}
// Modo Rush: cada fase dura esta fração do tempo normal (bots também ficam mais rápidos).
const RUSH = .55;
const rushOn = (s, ph) => !!s.settings?.rush && (!ph || ph.rush !== false);
function enginePhase(s, name) {
  const g = s.game, ph = Games[g.id].phases[name];
  g.phase = name; g.phaseStart = now(); g.dur = ph.dur || 0;
  g.pkey = uid(8);  // identifica esta fase para os temporizadores dos bots (não muda na pausa)
  g.deadline = ph.dur ? now() + ph.dur * 1000 : null;
  HostRT.allInAt = null;
  ph.enter && ph.enter(g, s);
  if (g.deadline && rushOn(s, ph)) { g.dur *= RUSH; g.deadline = g.phaseStart + g.dur * 1000; }
  if (name === 'reveal') {
    if (modeOf(s) === 'apostas') settleBets(s);
    if (modeOf(s) === 'territorio') conquer(s);
    botsReact(s);
  }
}
function engineAdvance(s) {
  const g = s.game, ph = Games[g.id].phases[g.phase];
  const nx = typeof ph.next === 'function' ? ph.next(g, s) : ph.next;
  if (nx) enginePhase(s, nx); else engineNextRound(s);
}
/** Soma pontos no placar geral e no placar do mini-jogo atual. deltas = { playerId: pontos } */
function updateScores(s, deltas) {
  const g = s.game;
  for (const [pid, pts] of Object.entries(deltas)) {
    if (!pts || !s.players[pid]) continue;
    s.players[pid].score += pts;
    if (g) {
      add(g.earned, pid, pts); add(g.roundDelta, pid, pts);
      s.match.byGame = s.match.byGame || {};
      add(s.match.byGame[g.id] || (s.match.byGame[g.id] = {}), pid, pts);
    }
  }
}

/* =====================================================================
   Mini-jogos
   ===================================================================== */
const Games = {};
const GAME_ORDER = ['mane', 'provavel', 'impostor', 'geo', 'stop', 'fato'];

function voteCounts(votes) {
  const counts = {};
  Object.values(votes).forEach(t => add(counts, t, 1));
  const max = Math.max(0, ...Object.values(counts));
  return { counts, max, top: max ? Object.keys(counts).filter(k => counts[k] === max) : [] };
}

/* ---------- 1. O Mané ---------- */
const maneTargets = (g, pid) => Object.keys(g.data.guesses).filter(id => id !== pid);
Games.mane = {
  id: 'mane', name: 'O Mané', tag: 'Estimativa e votação', icon: 'question', color: '#FBBF24', lip: '#B45309', min: 2,
  how: 'Chute um número. Antes do gabarito, vote em quem errou mais feio. Mais perto vale +2; acertar o Mané vale +1.',
  first: 'answer',
  init(g) { g.data = { qi: drawItem(g, MANE_Q), guesses: {}, votes: {}, result: null }; },
  phases: {
    answer: { label: 'Palpite secreto', dur: 40, bot: [4, 16], next: 'vote', allIn: (g, s) => active(g, s).every(id => id in g.data.guesses) },
    vote: { label: 'Caça ao Mané', dur: 30, bot: [3, 10], next: 'reveal', allIn: (g, s) => active(g, s).every(id => id in g.data.votes || !maneTargets(g, id).length) },
    reveal: { label: 'Gabarito', dur: 25, enter(g, s) {
      const ans = MANE_Q[g.data.qi].a, d = {};
      const e = Object.entries(g.data.guesses).map(([pid, v]) => ({ pid, dist: Math.abs(v - ans) }));
      let closest = [], mane = [];
      if (e.length) {
        const min = Math.min(...e.map(x => x.dist)), max = Math.max(...e.map(x => x.dist));
        closest = e.filter(x => x.dist === min).map(x => x.pid);
        closest.forEach(p => add(d, p, 2));
        if (e.length > 1 && max > min) {
          mane = e.filter(x => x.dist === max).map(x => x.pid);
          Object.entries(g.data.votes).forEach(([voter, t]) => { if (mane.includes(t)) add(d, voter, 1); });
        }
      }
      g.data.result = { closest, mane };
      updateScores(s, d);
    } },
  },
  handle(g, s, pid, a) {
    if (!inRoster(g, pid)) return false;
    if (g.phase === 'answer' && a.type === 'submit') {
      const v = parseNum(a.value);
      if (!Number.isFinite(v)) return false;
      g.data.guesses[pid] = v; return true;
    }
    if (g.phase === 'vote' && a.type === 'vote') {
      if (!maneTargets(g, pid).includes(a.target)) return false;
      g.data.votes[pid] = a.target; return true;
    }
    return false;
  },
  done(g, pid) { return g.phase === 'answer' ? pid in g.data.guesses : g.phase === 'vote' ? pid in g.data.votes : false; },
  bot(g, s, pid) {
    const q = MANE_Q[g.data.qi];
    if (g.phase === 'answer') {
      if (q.y) return { type: 'submit', value: Math.round(q.a + gauss() * 9) };
      let f = Math.exp(gauss() * 0.45);
      if (Math.random() < .2) f *= Math.random() < .5 ? 3.5 : 0.3;
      return { type: 'submit', value: Math.max(0, q.a < 20 ? Math.round(q.a * f) || 1 : Math.round(q.a * f)) };
    }
    if (g.phase === 'vote') {
      const t = maneTargets(g, pid);
      if (!t.length) return null;
      const vals = Object.values(g.data.guesses).sort((a, b) => a - b), med = vals[Math.floor(vals.length / 2)];
      const far = [...t].sort((a, b) => Math.abs(g.data.guesses[b] - med) - Math.abs(g.data.guesses[a] - med));
      return { type: 'vote', target: Math.random() < .7 ? far[0] : pick(t) };
    }
    return null;

    const q = MANE_Q[g.data.qi], mine = g.data.guesses[me];

    const fmtNum = v => q.y ? String(Math.round(v)) : fmtNumBR(v);
    const P =`<p class="prompt">${esc(q.t)}</p>`;
    if (g.phase === 'answer') {
      if (mine !== undefined) return P + waitCard(`Seu palpite: <b>${fmtNum(mine)}</b> ${esc(q.u)}`, 'Esperando os outros palpites');
      if (!inRoster(g, me)) return P + waitCard('Você entra na próxima rodada', 'Assista essa daqui de camarote.');
      return P + `<form class="answer-form" data-form="mane" novalidate>

    }
    if (g.phase === 'vote') {

      const entries = Object.entries(g.data.guesses);
      if (entries.length < 2) return P + waitCard('Poucos palpites para votar', 'Vamos direto ao gabarito.');
      const cards = entries.map(([pid, v]) => {
        const self = pid === me;
        return `<button class="pick ${myVote === pid ? 'on' : ''}" data-act="vote" data-id="${pid}" ${self || !targets.length ? 'disabled' : ''} aria-pressed="${myVote === pid}">
          ${avatar(s.players[pid], 'md')}<span class="pick-name">${esc(nameOf(s, pid))}${self ? ' (você)' : ''}</span><span class="pick-val">${fmtNum(v)}</span></button>`;
      }).join('');
      return `<p class="prompt sm">${esc(q.t)}</p><h2 class="ask">Quem foi o Mané?</h2>

    }
    const r = g.data.result || { closest: [], mane: [] };
    const rows = Object.entries(g.data.guesses).sort((a, b) => Math.abs(a[1] - q.a) - Math.abs(b[1] - q.a)).map(([pid, v]) => {
      const nv = Object.values(g.data.votes).filter(t => t === pid).length;
      return `<li class="res-row">${avatar(s.players[pid], 'sm')}<span class="res-who"><span class="res-name">${esc(nameOf(s, pid))}</span>
        ${r.closest.includes(pid) ? '<span class="tag tag-good">Mais perto</span>' : ''}${r.mane.includes(pid) ? '<span class="tag tag-bad">Mané</span>' : ''}</span>
        <span class="res-val">${fmtNum(v)}<span class="res-sub">${nv ? plural(nv, 'voto', 'votos') : ''}</span></span>${deltaBadge(g.roundDelta[pid])}</li>`;

    const myVote = g.data.votes[me];
    return `<p class="prompt sm">${esc(q.t)}</p>
      <div class="answer-big"><span class="ab-num">${fmtNum(q.a)}</span>${q.u ? `<span class="ab-unit">${esc(q.u)}</span>` : ''}</div>

function checkClue(raw, word) {
  const v = String(raw || '').trim();
  if (!v) return { err: 'Escreva uma pista.' };
  if (/\s/.test(v)) return { err: 'A pista precisa ser uma palavra só.' };
  if (v.length > 20) return { err: 'Use uma palavra de até 20 letras.' };
  if (word && norm(v) === norm(word)) return { err: 'A pista não pode ser a própria palavra.' };
  return { v };
}

        g.roster.forEach(pid => {
          const v = (d.answers[pid] || [])[k] || '';
          const others = voters.filter(x => x !== pid).length, rej = (d.rejects[pid + ':' + k] || []).length;
          const why = !v ? 'Em branco' : !startsWith(v, d.L) ? `Não começa com ${d.L}` : norm(v).length < 2 ? 'Curta demais' : (others && rej * 2 > others) ? 'Anulada pela mesa' : null;

  },
  handle(g, s, pid, a) {

// Valida e guarda um traço vindo de quem desenha (pedaços de pincel ou formas inteiras).
function addStroke(list, a, maxFills = 25) {
  const k = ['f', 'l', 'r', 'o', 'b'].includes(a.k) ? a.k : 'f';
  const pts = Array.isArray(a.p) ? a.p.slice(0, k === 'f' ? 400 : k === 'b' ? 2 : 4).map((n, i) => clamp(Math.round(+n) || 0, 0, i % 2 ? 750 : 1000)) : [];
  if (pts.length < 2 || pts.length % 2) return false;
  if (k === 'b' && list.filter(x => x.k === 'b').length >= maxFills) return false;
  const col = /^#[0-9a-f]{6}$/i.test(a.col) ? a.col : '#111827', s = clamp(Math.round(+a.s) || 11, 2, 48);
  let st = list.find(x => x.id === a.id);
  if (!st) {
    if (list.length >= 400) return false;
    st = { id: String(a.id).slice(0, 12), k, col, s, p: [] };
    list.push(st);
  }
  if (k === 'f') { if (st.p.length < 3000) st.p.push(...pts.slice(0, 3000 - st.p.length)); }

}

/* ---------- 8. Termo Relâmpago ---------- */
const TERMO_WORDS = ['CARRO','PRAIA','LIVRO','TEMPO','NOITE','PEDRA','VERDE','FESTA','MUNDO','PORTA','CAMPO','PRATO','LIMAO','MANGA','TIGRE','ZEBRA','PIANO','NUVEM','PLUMA','FORNO','SALTO','GRUPO','CINCO','FUGIR','SONHO','CHAVE','BOLSA','TROCA','VENTO','PEIXE','FOLHA','TERRA','NADAR','MOLHO','CAIXA','JOGAR','BRAVO','RISCO','LEITE','VIDRO','SORTE','FELIZ','TRIGO','POLVO','CERTO','LUGAR','HOTEL','AMIGO','ROUPA','CANTO','SAMBA','PAGAR','FALAR','BICHO','DOCES','TORTA'];
const termoKey = w => norm(w).toUpperCase().replace(/[^A-Z]/g, '');
function termoScore(guess, answer) {
  const res = Array(5).fill('x'), used = Array(5).fill(false);
  for (let i = 0; i < 5; i++) if (guess[i] === answer[i]) { res[i] = 'g'; used[i] = true; }
  for (let i = 0; i < 5; i++) {
    if (res[i] === 'g') continue;
    const j = [...answer].findIndex((ch, k) => !used[k] && ch === guess[i]);
    if (j >= 0) { res[i] = 'y'; used[j] = true; }
  }
  return res;
}
const termoDone = (g, pid) => pid in g.data.solved || (g.data.tries[pid] || []).length >= 6;
function termoTry(g, pid, word) {
  const d = g.data, w = termoKey(word);
  if (w.length !== 5 || termoDone(g, pid)) return false;
  const list = d.tries[pid] || (d.tries[pid] = []);
  list.push(w);
  if (w === d.answer) {
    d.solved[pid] = { n: list.length, t: now() - g.phaseStart };
    if (!d.first) d.first = pid;
  }
  return true;
}
function termoBotPlan(answer) {
  const solve = Math.random() < .8, n = solve ? 2 + Math.floor(Math.random() * 5) : 6;
  const pool = shuffle(TERMO_WORDS.filter(w => w !== answer));
  const words = pool.slice(0, n - 1);
  words.push(solve ? answer : pool[n - 1]);
  let t = now();
  return { words, times: words.map(() => (t += rand(7000, 16000))), i: 0 };
}
function termoInput(k) {
  const s = Store.room, g = s?.game, me = Store.me?.id;
  if (!g || g.id !== 'termo' || g.phase !== 'play' || !inRoster(g, me) || termoDone(g, me)) return;
  const T = Store.local.termo;
  if (T.pending) return;
  if (k === 'ENTER') {
    if (T.draft.length !== 5) { Sound.play('wrong'); $('.tm-row.cur')?.classList.remove('shake'); void $('.tm-row.cur')?.offsetWidth; $('.tm-row.cur')?.classList.add('shake'); return; }
    T.anim = (g.data.tries[me] || []).length;
    T.pending = T.draft; T.draft = '';
    dispatch({ type: 'try', word: T.pending });
    render();
    return;
  }
  if (k === 'BACK') T.draft = T.draft.slice(0, -1);
  else if (/^[A-Z]$/.test(k) && T.draft.length < 5) T.draft += k;
  $$('.tm-row.cur .tm-tile').forEach((el, i) => { el.textContent = T.draft[i] || ''; el.classList.toggle('filled', !!T.draft[i]); });
}

Games.termo = {

function rxTap() {
  const g = Store.room?.game, me = Store.me?.id;
  if (!g || g.id !== 'reflexo' || !inRoster(g, me) || g.data.taps[me]) return;
  const key = `${g.round}`;
  if (Store.local.rxTap?.key === key) return;
  if (g.phase === 'wait') {
    Store.local.rxTap = { key, early: true };
    Sound.play('wrong');
    dispatch({ type: 'tap', early: true });
  } else if (g.phase === 'go') {
    const go = Store.local.rxGo, ms = go && go.key === `${g.round}:${g.phaseStart}` ? Math.round(performance.now() - go.t) : 9999;
    Store.local.rxTap = { key, ms };
    dispatch({ type: 'tap', ms });
  } else return;
  render();
}

    const rows = Object.entries(d.orders).map(([pid, o]) => ({ pid, n: tlScore(o, d.ev) })).sort((a, b) => b.n - a.n);

  'o sabiá não sabia que o sábio sabia assobiar', 'a aranha arranha a rã e a rã arranha a aranha', 'água mole em pedra dura tanto bate até que fura',
  'em terra de cego quem tem um olho é rei', 'quem não tem cão caça com gato', 'o tempo perguntou ao tempo quanto tempo o tempo tem',
  'casa de ferreiro espeto de pau', 'Pedro pregou um prego na porta preta', 'Deus ajuda quem cedo madruga',
  'mais vale um pássaro na mão do que dois voando', 'num ninho de mafagafos há sete mafagafinhos', 'não adianta chorar pelo leite derramado',
  'o pato pateta pintou o caneco', 'quem espera sempre alcança', 'de grão em grão a galinha enche o papo',
];
const tyKey = c => c.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const tyMatch = (typed, target) => { let n = 0; while (n < typed.length && n < target.length && tyKey(typed[n]) === tyKey(target[n])) n++; return n; };
const tyWpm = (len, ms) => Math.round(len / 5 / (ms / 60000));

Games.digita = {
  id: 'digita', name: 'Duelo de Digitação', tag: 'Corrida de teclado', icon: 'keyboard', color: '#6366F1', lip: '#4338CA', min: 1,
  how: 'Todo mundo digita a mesma frase ao mesmo tempo. Acentos e maiúsculas não contam. O primeiro a terminar ganha +3, o segundo +2 e todo mundo que terminar leva +1.',
  first: 'ready',
  init(g, s) {
    const text = TYPE_Q[drawItem(g, TYPE_Q)];
    g.data = { text, prog: {}, fin: {}, order: [], bots: {} };
    // Bots digitam entre 3,5 e 6,5 letras por segundo.
    g.roster.forEach(id => { if (s.players[id]?.isBot) g.data.bots[id] = { cps: 3.5 + Math.random() * 3 }; });
  },
  phases: {
    ready: { label: 'Preparar…', dur: 4, hideTimer: true, next: 'race' },
    race: { label: 'Digite!', dur: 60, next: 'reveal', allIn: (g, s) => active(g, s).every(id => id in g.data.fin) },
    reveal: { label: 'Resultado', dur: 14, enter(g, s) {
      const deltas = {};
      g.data.order.forEach((pid, k) => add(deltas, pid, Math.max(1, 3 - k)));
      updateScores(s, deltas);
    } },
  },
  handle(g, s, pid, a) {
    const d = g.data;
    if (!inRoster(g, pid) || g.phase !== 'race' || pid in d.fin) return false;
    if (a.type === 'prog') { const n = clamp(a.n | 0, 0, 9); if (n <= (d.prog[pid] || 0)) return false; d.prog[pid] = n; return true; }
    if (a.type === 'finish') {
      const t = String(a.text || ''), ms = now() - g.phaseStart;
      // Mais de 15 letras por segundo não é humano.
      if (t.length !== d.text.length || tyMatch(t, d.text) !== d.text.length || ms < d.text.length / 15 * 1000) return false;
      d.fin[pid] = ms; d.prog[pid] = 10; d.order.push(pid); return true;
    }
    return false;
  },
  tick(g) {
    const d = g.data;
    if (g.phase !== 'race') return false;
    let changed = false;
    for (const [pid, b] of Object.entries(d.bots)) {
      if (pid in d.fin) continue;
      const ms = now() - g.phaseStart, done = b.cps * (ms - 900) / 1000;
      if (done >= d.text.length) { d.fin[pid] = ms; d.prog[pid] = 10; d.order.push(pid); changed = true; continue; }
      const n = clamp(Math.floor(done / d.text.length * 10), 0, 9);
      if (n > (d.prog[pid] || 0)) { d.prog[pid] = n; changed = true; }
    }
    return changed;
  },
  done(g, pid) { return g.phase === 'race' && pid in g.data.fin; },
  lanesHTML(g, s) {
    const d = g.data;
    return g.roster.filter(id => s.players[id]).map(id => {
      const k = d.order.indexOf(id);
      return `<li class="ty-lane ${id in d.fin ? 'is-done' : ''}">${avatar(s.players[id], 'sm')}<span class="ty-name">${esc(nameOf(s, id))}</span>
        <span class="ty-track"><i style="width:${(d.prog[id] || 0) * 10}%"></i></span><b class="ty-pos">${k >= 0 ? `${k + 1}º` : ''}</b></li>`;
    }).join('');
  },
  targetHTML(text) { return [...text].map((ch, i) => `<span class="ty-c" data-i="${i}">${ch === ' ' ? '&nbsp;' : esc(ch)}</span>`).join(''); },
  doneHTML(g, me) {
    const d = g.data, k = d.order.indexOf(me);
    return `<p class="dw-got" id="tyBox">${icon('check')} Terminou em ${(d.fin[me] / 1000).toFixed(1).replace('.', ',')} s (${tyWpm(d.text.length, d.fin[me])} palavras por minuto). Você foi o ${k + 1}º.</p>`;
  },
  view(g, s, me) {
    const d = g.data, can = inRoster(g, me);
    if (g.phase === 'ready') return `<div class="ty-ready"><p class="ask center">Prepare os dedos…</p><span class="ty-count" data-count-to="${g.phaseStart + g.dur * 1000}">3</span>
      <p class="hint center">A frase aparece quando a contagem acabar.</p></div>`;
    const lanes = `<ul class="ty-lanes" id="tyLanes" aria-label="Corrida">${this.lanesHTML(g, s)}</ul>`;
    if (g.phase === 'race') {
      let box = '';
      if (can) box = me in d.fin ? this.doneHTML(g, me)
        : `<div id="tyBox"><label class="sr-only" for="tyIn">Digite a frase</label>
          <input class="input ty-input" id="tyIn" data-keep="ty-${g.round}" data-autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Comece a digitar…"></div>`;
      return `<div class="ty-target" id="tyTarget" aria-label="${esc(d.text)}">${this.targetHTML(d.text)}</div>${box}${lanes}`;
    }
    const rows = d.order.map(pid => ({ pid, ms: d.fin[pid] }));
    const missed = g.roster.filter(id => !(id in d.fin) && s.players[id]);
    return `<div class="ty-target is-done">${esc(d.text)}</div>
      <ul class="res-list">${rows.map(({ pid, ms }, k) => `<li class="res-row">${avatar(s.players[pid], 'sm')}<span class="res-who"><span class="res-name">${esc(nameOf(s, pid))}</span>${k === 0 ? '<span class="tag tag-good">Mais rápido</span>' : ''}</span>
        <span class="res-val">${(ms / 1000).toFixed(1).replace('.', ',')} s<span class="res-sub">${tyWpm(d.text.length, ms)} ppm</span></span>${deltaBadge(g.roundDelta[pid])}</li>`).join('')}
      ${missed.map(pid => `<li class="res-row">${avatar(s.players[pid], 'sm')}<span class="res-who"><span class="res-name">${esc(nameOf(s, pid))}</span></span><span class="res-val">Não terminou</span><span></span></li>`).join('')}</ul>`;
  },
  // Durante a corrida, só as pistas mudam: o campo de digitação não é redesenhado.
  patch(g, s, me) {
    if (g.phase !== 'race') { $('.stage-body').innerHTML = this.view(g, s, me); this.mount(g, s, me); return; }
    const lanes = $('#tyLanes');
    if (lanes) lanes.innerHTML = this.lanesHTML(g, s);
    const box = $('#tyBox');
    if (box && box.tagName === 'DIV' && me in g.data.fin) box.outerHTML = this.doneHTML(g, me);
  },
  mount(g, s, me) {
    if (g.phase === 'ready') {
      const el = $('.ty-count');
      clearInterval(this.cd);
      const step = () => { const left = Math.ceil((+el.dataset.countTo - now()) / 1000); if (!el.isConnected) return clearInterval(this.cd); el.textContent = left > 0 ? left : 'Já!'; };
      if (el) { step(); this.cd = setInterval(step, 200); }
      return;
    }
    const input = $('#tyIn');
    if (g.phase !== 'race' || !input || input.dataset.bound) return;
    input.dataset.bound = '1';
    const text = g.data.text, spans = $$('#tyTarget .ty-c');
    let sent = 0;
    const paint = () => {
      const v = input.value, ok = tyMatch(v, text);
      spans.forEach((sp, i) => { sp.className = 'ty-c' + (i < ok ? ' ok' : i < v.length ? ' bad' : i === v.length ? ' cur' : ''); });
      input.classList.toggle('is-wrong', ok < v.length);
      const n = Math.min(9, Math.floor(ok / text.length * 10));
      if (n > sent) { sent = n; dispatch({ type: 'prog', n }); }
      if (ok === text.length && v.length === text.length) { input.disabled = true; Sound.play('correct'); dispatch({ type: 'finish', text: v }); }
    };
    ['paste', 'drop'].forEach(ev => input.addEventListener(ev, e => e.preventDefault()));
    input.addEventListener('input', paint);
    paint();
    if (!input.disabled) input.focus({ preventScroll: true });
  },
};

const tabooTokens = t => norm(t).split(/[^a-z0-9]+/).filter(Boolean);
// Devolve a palavra proibida usada na dica (ou null). Pega também plural e variações ("praias", "solzinho").
function tabooHit(card, clue) {
  const toks = tabooTokens(clue);
  for (const f of [card.w, ...card.f]) {
    const ft = tabooTokens(f);
    if (ft.length > 1 ? norm(clue).includes(norm(f)) : toks.some(t => t === ft[0] || (ft[0].length >= 4 && t.startsWith(ft[0].slice(0, Math.max(4, ft[0].length - 1)))))) return f;
  }
  return null;
}

Games.proibida = {
  id: 'proibida', name: 'Palavra Proibida', tag: 'Dicas sem as palavras óbvias', icon: 'ban', color: '#EAB308', lip: '#A16207', min: 2,
  how: 'Um jogador recebe uma palavra secreta e escreve dicas para a galera adivinhar, sem usar a própria palavra nem as quatro proibidas. Quem acerta primeiro ganha mais, e quem dá as dicas ganha um ponto por acerto.',
  first: 'play',
  init(g, s) {
    const humans = g.roster.filter(id => !s.players[id]?.isBot);
    const giver = humans.length ? humans[(g.round - 1) % humans.length] : g.roster[0];
    g.data = { giver, ci: drawItem(g, TABOO_Q), clues: [], feed: [], guessed: {}, order: [], buzz: 0, botClue: 0 };
  },
  phases: {
    play: { label: 'Dê dicas e adivinhe', dur: 75, bot: [15, 60], next: 'reveal',

      const d = g.data, deltas = {};
      d.order.forEach((pid, k) => add(deltas, pid, Math.max(1, 3 - k)));
      if (d.order.length) add(deltas, d.giver, Math.min(3, d.order.length));
      updateScores(s, deltas);

  handle(g, s, pid, a) {

    if (pid === d.giver) {
      if (a.type !== 'clue') return false;

      if (!text || d.clues.length >= 12) return false;
      if (tabooHit(card, text)) { d.buzz++; d.feed.push({ pid, buzz: true }); return true; }

    if (g.phase !== 'play') { $('.stage-body').innerHTML = this.view(g, s, me); return; }
    const feed = $('#tbFeed');

      dispatch({ type: 'clue', text });
      input.focus();
    },
    guess() {
      const input = $('#tbGuess'), text = (input.value || '').trim();
      if (!text) return;
      input.value = '';
      dispatch({ type: 'guess', text });
      input.focus();
    },
  },
};

/* ---------- 19. Telefone sem Fio ---------- */
const TEL_STARTS = ['um gato astronauta', 'dinossauro andando de skate', 'vovó lutando caratê', 'peixe tomando sorvete', 'pizza voadora', 'robô apaixonado', 'banana de óculos escuros', 'cachorro pilotando avião', 'fantasma com medo do escuro', 'elefante de bicicleta', 'sereia no deserto', 'polvo tocando bateria', 'vaca na praia', 'macaco jogando videogame', 'girafa de cachecol', 'tubarão no aquário de casa'];
const TEL_BUDGET = 1600;  // pontos por desenho: mantém a sala leve para quem está longe
const telPts = list => list.reduce((n, st) => n + (st.p ? st.p.length / 2 : 0), 0);
// Na etapa k, quem está na posição i da roda cuida da corrente (i - k).
const telChain = (d, pid, k = d.step) => { const i = d.ring.indexOf(pid), n = d.ring.length; return i < 0 ? -1 : ((i - k) % n + n) % n; };
const telPrev = (d, pid) => { const c = telChain(d, pid); return c < 0 || !d.step ? null : d.chains[c][d.step - 1] || { missing: true }; };
function telClean(raw) {
  const list = [];
  (Array.isArray(raw) ? raw.slice(0, 200) : []).forEach(st => addStroke(list, { ...st, id: String(st?.id || uid(6)) }, 6));
  while (list.length && telPts(list) > TEL_BUDGET) list.pop();
  return list;
}
// Rabisco de bot: três curvas tortas. No telefone sem fio, isso já é metade da graça.
function telScribble() {
  const col = pick(PALETTE.slice(0, 12));
  return [0, 1, 2].map(() => {

  view(g, s, me) {

    const card = `<div class="pc-card map-card"><span class="pc-emoji" aria-hidden="true">${q.e}</span><div><p class="map-ask">Onde fica?</p><p class="pc-item">${esc(q.t)}</p></div></div>`;
    const board = `<div class="map-wrap"><canvas id="mapBoard" class="map-cv ${g.phase === 'guess' && can && !mine ? 'can-pin' : ''}" width="1000" height="500" role="img" aria-label="Mapa-múndi"></canvas>
      ${!MapBase.rings && !MapBase.failed ? '<p class="map-loading">Carregando o mapa…</p>' : ''}</div>`;
    if (g.phase === 'guess') {
      const L = this.local(g);
      const foot = !can ? '<p class="hint center">Você joga na próxima rodada.</p>'
        : mine ? '<p class="hint center">Marcado! Esperando a galera.</p>'
        : `<button class="btn game big" data-act="g:confirm" ${L.pin ? '' : 'disabled'} style="display:flex;margin:12px auto 0">${L.pin ? 'Confirmar este ponto' : 'Toque no mapa'}</button>`;
      return card + board + foot + (MapBase.failed ? '<p class="hint center">Não deu para baixar o mapa. Use as linhas: o equador fica no meio.</p>' : '');
    }
    const rows = Object.entries(d.guesses).map(([pid, p]) => ({ pid, km: mapKm(p, q) })).sort((a, b) => a.km - b.km);
    return card + board + `<ul class="res-list">${rows.map(({ pid, km }) => `<li class="res-row">${avatar(s.players[pid], 'sm')}<span class="res-who"><span class="res-name">${esc(nameOf(s, pid))}</span></span>
      <span class="res-val">${mapKmText(km)}</span>${deltaBadge(g.roundDelta[pid])}</li>`).join('') || '<li class="hint">Ninguém marcou.</li>'}</ul>`;
  },
  mount(g, s, me) {
    const cv = $('#mapBoard');
    if (!cv) return;
    if (!MapBase.rings && !MapBase.failed) mapLoad();
    const d = g.data, q = MAP_Q[d.qi], ctx = cv.getContext('2d');
    const paint = () => {
      ctx.drawImage(mapBaseImage(), 0, 0);
      if (g.phase === 'reveal') {
        const [tx, ty] = mapXY(q.lat, q.lon);
        Object.entries(d.guesses).forEach(([pid, p]) => {
          const [x, y] = mapXY(p.lat, p.lon);
          ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.55)';
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]);
          mapDot(ctx, p.lat, p.lon, s.players[pid]?.color || '#fff', 8);
        });
        ctx.font = '34px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        mapDot(ctx, q.lat, q.lon, '#FBBF24', 13, '#111827'); ctx.fillText('⭐', tx, ty - 30);
        return;
      }
      const mine = d.guesses[me], pin = mine || this.local(g).pin;
      if (pin) mapDot(ctx, pin.lat, pin.lon, s.players[me]?.color || '#F43F5E', 10);
    };
    paint();
    if (g.phase !== 'guess' || !inRoster(g, me) || d.guesses[me] || cv.dataset.bound) return;
    cv.dataset.bound = '1';
    cv.addEventListener('pointerdown', e => {
      const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 1000, y = (e.clientY - r.top) / r.height * 500;
      this.local(g).pin = { lat: clamp(90 - y / 500 * 180, -90, 90), lon: clamp(x / 1000 * 360 - 180, -180, 180) };
      Sound.play('click');
      paint();
      const b = $('[data-act="g:confirm"]');
      if (b) { b.disabled = false; b.textContent = 'Confirmar este ponto'; }
    });
  },
  ui: { confirm() { const p = Games.mapa.local(Store.room.game).pin; if (p) dispatch({ type: 'submit', lat: p.lat, lon: p.lon }); } },
};

/* ---------- 21. Lobisomem Relâmpago ---------- */
const WOLF_ROLES = {
  lobo: { name: 'Lobisomem', e: '🐺', team: 'lobos', desc: 'À noite, escolha alguém para atacar. De dia, finja que é inocente.' },
  vidente: { name: 'Vidente', e: '🔮', team: 'vila', desc: 'Toda noite, descubra se alguém é o lobisomem. Use a informação com cuidado.' },
  medico: { name: 'Médico', e: '🩺', team: 'vila', desc: 'Toda noite, escolha alguém para proteger (pode ser você).' },
  aldeao: { name: 'Aldeão', e: '🧑‍🌾', team: 'vila', desc: 'Converse, desconfie e vote para tirar o lobisomem da vila.' },
};
const wolfAlive = (d, team) => d.alive.filter(id => !team || WOLF_ROLES[d.roles[id]].team === team);
const wolfWinner = d => !wolfAlive(d, 'lobos').length ? 'vila' : wolfAlive(d, 'lobos').length >= wolfAlive(d, 'vila').length ? 'lobos' : null;
const wolfPowers = (g, s) => active(g, s).filter(id => g.data.alive.includes(id) && g.data.roles[id] !== 'aldeao');

Games.lobisomem = {
  id: 'lobisomem', name: 'Lobisomem Relâmpago', tag: 'Dedução social', icon: 'moon', color: '#7C3AED', lip: '#5B21B6', min: 4, rounds: 1,
  how: 'Cada um recebe um papel secreto. À noite o lobisomem ataca, a vidente investiga e o médico protege. De dia, a vila conversa no chat e vota para eliminar alguém. A vila vence se tirar o lobisomem; os lobos vencem se ficarem em igual número. O time vencedor ganha +3, e quem sobrevive leva +1.',
  first: 'roles',
  init(g) {
    const ids = shuffle(g.roster), n = ids.length, nw = n >= 7 ? 2 : 1, roles = {};
    ids.forEach((id, i) => { roles[id] = i < nw ? 'lobo' : i === nw ? 'vidente' : i === nw + 1 && n >= 5 ? 'medico' : 'aldeao'; });
    g.data = { roles, alive: [...g.roster], ok: {}, night: 0, act: {}, votes: {}, seen: {}, dawn: null, dusk: null, winner: null };
  },
  phases: {
    roles: { label: 'Seu papel', dur: 15, bot: [1, 3], next: 'night', allIn: (g, s) => active(g, s).every(id => g.data.ok[id]) },
    night: { label: 'Noite', dur: 25, bot: [2, 12], next: 'dawn', hideTimer: false,
      enter(g) { g.data.night++; g.data.act = {}; },
      allIn: (g, s) => wolfPowers(g, s).every(id => id in g.data.act) },
    dawn: { label: 'Amanheceu', dur: 7, next: g => g.data.winner ? 'reveal' : 'day',
      enter(g) {
        const d = g.data, picks = {};
        Object.entries(d.act).forEach(([pid, t]) => { if (d.roles[pid] === 'lobo') add(picks, t, 1); });
        const max = Math.max(0, ...Object.values(picks)), top = Object.keys(picks).filter(t => picks[t] === max);
        const target = top.length ? pick(top) : null;
        const saved = Object.entries(d.act).some(([pid, t]) => d.roles[pid] === 'medico' && t === target);
        d.dawn = { target, saved };
        if (target && !saved) d.alive = d.alive.filter(id => id !== target);
        d.winner = wolfWinner(d);
      } },
    day: { label: 'Votação da vila', dur: 50, bot: [8, 35], next: 'dusk', enter(g) { g.data.votes = {}; },
      allIn: (g, s) => active(g, s).filter(id => g.data.alive.includes(id)).every(id => id in g.data.votes) },
    dusk: { label: 'A vila decidiu', dur: 7, next: g => g.data.winner || g.data.night >= 3 ? 'reveal' : 'night',
      enter(g) {
        const d = g.data, { top } = voteCounts(d.votes), out = top.length === 1 ? top[0] : null;
        d.dusk = { out, tie: top.length > 1 };
        if (out) d.alive = d.alive.filter(id => id !== out);
        d.winner = wolfWinner(d);
      } },
    reveal: { label: 'Fim de jogo', dur: 18, enter(g, s) {
      const d = g.data, deltas = {};
      if (!d.winner) d.winner = wolfAlive(d, 'lobos').length ? 'lobos' : 'vila';
      g.roster.forEach(id => { if (WOLF_ROLES[d.roles[id]].team === d.winner) add(deltas, id, 3 + (d.alive.includes(id) ? 1 : 0)); });
      updateScores(s, deltas);
    } },
  },
  handle(g, s, pid, a) {
    const d = g.data, role = d.roles[pid], alive = d.alive.includes(pid);
    if (!inRoster(g, pid)) return false;
    if (g.phase === 'roles' && a.type === 'ok') { d.ok[pid] = 1; return true; }
    if (g.phase === 'night' && a.type === 'night' && alive && role !== 'aldeao' && !(pid in d.act) && d.alive.includes(a.target)) {
      if (role === 'lobo' && d.roles[a.target] === 'lobo') return false;
      if (role === 'vidente' && a.target === pid) return false;
      d.act[pid] = a.target;
      if (role === 'vidente') (d.seen[pid] = d.seen[pid] || []).push({ id: a.target, wolf: d.roles[a.target] === 'lobo' });
      return true;
    }
    if (g.phase === 'day' && a.type === 'vote' && alive && a.target !== pid && d.alive.includes(a.target)) { d.votes[pid] = a.target; return true; }
    return false;
  },
  done(g, pid) {
    const d = g.data;
    return g.phase === 'roles' ? !!d.ok[pid] : g.phase === 'night' ? pid in d.act || d.roles[pid] === 'aldeao' || !d.alive.includes(pid)
      : g.phase === 'day' ? pid in d.votes || !d.alive.includes(pid) : false;
  },
  bot(g, s, pid) {
    const d = g.data, role = d.roles[pid], others = d.alive.filter(id => id !== pid);
    if (g.phase === 'roles') return { type: 'ok' };
    if (!d.alive.includes(pid)) return null;
    if (g.phase === 'night') {
      if (role === 'lobo') { const t = others.filter(id => d.roles[id] !== 'lobo'); return t.length ? { type: 'night', target: pick(t) } : null; }
      if (role === 'vidente') { const seen = (d.seen[pid] || []).map(x => x.id), t = others.filter(id => !seen.includes(id)); return { type: 'night', target: pick(t.length ? t : others) }; }
      if (role === 'medico') return { type: 'night', target: Math.random() < .3 ? pid : pick(others) };
      return null;
    }
    if (g.phase === 'day') {
      // Vidente-bot que já achou o lobo vota nele; lobo-bot nunca vota no parceiro.
      const found = (d.seen[pid] || []).find(x => x.wolf && d.alive.includes(x.id));
      const pool = role === 'lobo' ? others.filter(id => d.roles[id] !== 'lobo') : others;
      return pool.length ? { type: 'vote', target: found ? found.id : pick(pool) } : null;
    }
    return null;
  },
  view(g, s, me) {
    const d = g.data, role = d.roles[me], R = role && WOLF_ROLES[role], alive = d.alive.includes(me);
    // Plateia vê os papéis de todo mundo; o telão (que a mesa toda olha) não.
    const omni = myRole() === 'spectator', who = id => `${avatar(s.players[id], 'sm')}<span>${esc(nameOf(s, id))}</span>`;
    const roleTag = id => omni || g.phase === 'reveal' ? `<span class="tag wolf-tag">${WOLF_ROLES[d.roles[id]].e} ${WOLF_ROLES[d.roles[id]].name}</span>` : '';
    const villagers = `<ul class="wolf-people">${g.roster.filter(id => s.players[id]).map(id => `<li class="${d.alive.includes(id) ? '' : 'is-dead'}">${who(id)}${roleTag(id)}${d.alive.includes(id) ? '' : '<span class="wolf-rip">💀</span>'}</li>`).join('')}</ul>`;
    const mates = role === 'lobo' ? g.roster.filter(id => id !== me && d.roles[id] === 'lobo') : [];
    const myCard = R ? `<div class="wolf-card role-${role}"><span class="wolf-e">${R.e}</span><div><p class="wolf-role">Você é: <b>${R.name}</b></p><p class="hint">${R.desc}</p>
      ${mates.length ? `<p class="hint">Seu parceiro: <b>${mates.map(id => esc(nameOf(s, id))).join(', ')}</b></p>` : ''}</div></div>` : '';
    const pickList = (act, ids, chosen) => `<div class="pick-grid">${ids.map(id => `<button class="pick ${chosen === id ? 'on' : ''}" data-act="${act}" data-id="${id}" ${chosen ? 'disabled' : ''}>${avatar(s.players[id], 'md')}<span class="pick-name">${esc(nameOf(s, id))}</span></button>`).join('')}</div>`;
    if (g.phase === 'roles') {
      if (!R) return `<p class="verdict center">🌕 A vila vai dormir…</p>${villagers}<p class="hint center">Cada jogador está vendo o próprio papel em segredo.</p>`;
      const flipped = Store.local.wolfFlip === `${g.round}:${me}`;
      return `<div class="wolf-flip ${flipped ? 'is-open' : ''}">${flipped ? myCard : `<button class="wolf-cover" data-act="g:flip">🌕<b>Toque para ver seu papel</b><small>Esconda a tela dos outros!</small></button>`}</div>
        ${flipped && !d.ok[me] ? `<button class="btn game big" data-act="g:ok" style="display:flex;margin:14px auto 0">Entendi</button>` : d.ok[me] ? '<p class="hint center">Pronto. Esperando a galera.</p>' : ''}`;
    }
    if (g.phase === 'night') {
      const head = `<p class="verdict center">🌙 Noite ${d.night}</p>`;
      if (!R || !alive) return head + `<p class="hint center">${R ? 'Você foi eliminado. Agora é só assistir.' : 'A vila dorme. Os poderes estão agindo em segredo.'}</p>${villagers}`;
      const chosen = d.act[me];
      if (role === 'aldeao') return head + myCard + waitCard('Feche os olhos… a vila dorme', 'Os lobos estão escolhendo uma vítima');
      if (role === 'lobo') {
        const mate = mates.filter(id => id in d.act).map(id => `${esc(nameOf(s, id))} quer atacar ${esc(nameOf(s, d.act[id]))}`).join('. ');
        return head + `<h2 class="ask center">Quem você vai atacar?</h2>${pickList('g:target', d.alive.filter(id => d.roles[id] !== 'lobo'), chosen)}${mate ? `<p class="hint center">${mate}.</p>` : ''}`;
      }
      if (role === 'vidente') {
        const seen = (d.seen[me] || []).map(x => `<li>${who(x.id)}<b class="${x.wolf ? 'is-wolf' : ''}">${x.wolf ? 'É LOBISOMEM! 🐺' : 'é inocente'}</b></li>`).join('');
        return head + (chosen ? '' : `<h2 class="ask center">Quem você quer investigar?</h2>${pickList('g:target', d.alive.filter(id => id !== me), chosen)}`) + (seen ? `<ul class="wolf-seen">${seen}</ul>` : '');
      }
      return head + `<h2 class="ask center">Quem você quer proteger?</h2>${pickList('g:target', d.alive, chosen)}`;
    }
    if (g.phase === 'dawn') {
      const t = d.dawn?.target;
      return `<p class="verdict center">☀️ Amanheceu</p><p class="wolf-news">${!t ? 'Os lobos não atacaram ninguém.' : d.dawn.saved ? `Os lobos atacaram <b>${esc(nameOf(s, t))}</b>, mas o médico chegou a tempo!` : `<b>${esc(nameOf(s, t))}</b> foi atacado durante a noite. 💀`}</p>${villagers}`;
    }
    if (g.phase === 'day') {
      const { counts } = voteCounts(d.votes), mine = d.votes[me];
      const tally = `<ul class="wolf-people">${d.alive.map(id => `<li>${who(id)}${roleTag(id)}<span class="wolf-votes">${counts[id] ? '🗳️'.repeat(counts[id]) : ''}</span>
        ${alive && R && id !== me ? `<button class="btn ${mine === id ? 'game' : 'ghost'} pill sm" data-act="g:vote" data-id="${id}">${mine === id ? 'Seu voto' : 'Votar'}</button>` : ''}</li>`).join('')}</ul>`;
      return `<p class="verdict center">Quem é o lobisomem?</p>${R && alive ? myCard : ''}
        <p class="hint center">${R && alive ? 'Converse no chat e vote. Dá para trocar o voto até o tempo acabar.' : 'A vila está votando.'}</p>${tally}`;
    }
    if (g.phase === 'dusk') {
      const o = d.dusk?.out;
      return `<p class="verdict center">🌆 A vila decidiu</p><p class="wolf-news">${o ? `<b>${esc(nameOf(s, o))}</b> foi eliminado. Era <b>${WOLF_ROLES[d.roles[o]].e} ${WOLF_ROLES[d.roles[o]].name}</b>!` : 'Empate! Ninguém saiu hoje.'}</p>${villagers}`;
    }
    const win = d.winner === 'lobos';
    return `<p class="verdict center">${win ? '🐺 Os lobos venceram!' : '🏡 A vila venceu!'}</p>${villagers}`;
  },
  ui: {
    flip() { const g = Store.room.game; Store.local.wolfFlip = `${g.round}:${Store.me.id}`; render(); },
    ok() { dispatch({ type: 'ok' }); },
    target(el) { dispatch({ type: 'night', target: el.dataset.id }); },
    vote(el) { dispatch({ type: 'vote', target: el.dataset.id }); },
  },
};
