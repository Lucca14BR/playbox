// Link limpo da sala: sem parâmetros de teste (como ?rede=), só a página e o código.
const roomLink = () => location.origin + location.pathname + '#' + Store.room.pin;

function netStatusHTML() {
  const st = Transport.status;
  const text = st === 'online'
    ? (isHost() ? 'Online. Mande o convite e deixe esta tela aberta: a sala roda neste aparelho.' : 'Online. Você está conectado à sala.')
    : st === 'connecting' ? 'Conectando à internet…'
    : 'Sem internet: só outras abas deste navegador conseguem entrar.';
  const fileNote = location.protocol === 'file:' && st === 'online'
    ? '<p class="hint">O arquivo está aberto direto do disco, então o link só funciona neste computador. Nos outros aparelhos, abra o PlayBox e digite o código.</p>' : '';
  return `<p class="net-status is-${st === 'online' ? 'on' : st === 'connecting' ? 'wait' : 'off'}" role="status"><span class="net-dot" aria-hidden="true"></span>${text}</p>${fileNote}`;
}

function viewGame(s) {
  const g = s.game, mod = Games[g.id], me = Store.me.id, host = isHost();
  if (g.phase === 'final') return viewGameFinal(s);
  const ph = mod.phases[g.phase], watcher = isWatcher(), role = myRole(), mode = modeOf(s);
  const firstStep = g.round === 1 && (g.phase === mod.first || ph.betting);
  const reveal = g.phase === 'reveal';
  const showTimer = !!g.deadline && !ph.hideTimer;
  const left = showTimer ? Math.max(0, g.deadline - now()) : 0;
  const timerAttrs = showTimer ? `data-deadline="${g.deadline}" data-dur="${g.dur}" style="--p:${g.dur ? left / (g.dur * 1000) : 0}"` : '';
  const rush = s.settings.rush;
  let body = ph.betting ? betView(g, s, me) : mod.view(g, s, me);
  // Plateia e telão não "entram na próxima rodada": estão assistindo.
  if (watcher) body = body.replace(/Você (entra|joga) na próxima rodada\.?/g, 'Você está assistindo.');
  let teamPill = '';
  if (mode === 'equipes') { const sc = teamScores(s); teamPill = `<span class="team-pill" title="Placar das equipes"><i style="--c:${TEAMS.a.color}"></i>${sc.a} × ${sc.b}<i style="--c:${TEAMS.b.color}"></i></span>`; }
  return `<section class="screen game ${rush ? 'is-rush' : ''}" style="${gameVars(mod)}">
    <div class="game-top ${showTimer ? 'timer' : ''} ${showTimer && left < 5000 ? 'low' : ''}" ${timerAttrs}>
      ${role === 'tv' ? '<span></span>' : `<button class="icon-btn" data-act="${host ? 'toLobby' : 'leave'}" aria-label="${host ? 'Voltar ao lobby' : 'Sair da partida'}">${icon('back')}</button>`}
      <span class="gt-round">Rodada ${g.round}/${g.total}${rush ? `<span class="rush-pill">${icon('bolt')}Rush</span>` : ''}${teamPill}</span>
      <span class="gt-time">${showTimer ? `${icon('clock')}<span class="timer-num">${Math.ceil(left / 1000)}s</span>` : ph.hideTimer ? `${icon('clock')}<span>???</span>` : ''}</span>
      <div class="timer-track" role="progressbar" aria-label="Tempo restante"><div class="timer-fill"></div></div>
    </div>
    ${watcher && role !== 'tv' ? `<p class="watch-pill">${icon('eye')}${host ? 'Você está só apresentando' : 'Você está na plateia'}</p>` : ''}
    <div class="stage">
      <header class="stage-head"><span class="sh-icon">${gameIcon(mod)}</span>
        <div><h1 class="sh-name">${mod.name}</h1><p class="sh-sub">${ph.label}</p></div></header>
      ${firstStep && g.surprise ? `<p class="surprise-pill">${icon('shuffle')}Jogo surpresa!</p>` : ''}
      ${firstStep && g.voted ? `<p class="surprise-pill">${icon('vote')}A galera escolheu!</p>` : ''}
      ${eventPillsHTML(g)}${jokerHTML(s, g, me)}
      ${firstStep ? `<p class="sh-how" tabindex="0" title="Toque para ler tudo">${esc(mod.how)}</p>` : ''}
      <div class="stage-body">${body}</div>
      ${modeRevealHTML(s, g)}
      ${cryHTML(s, g)}
      ${watcher && role === 'spectator' && reveal ? applauseHTML(s, g, me) : ''}
      ${!watcher && reveal ? kudosHTML(s, g, me) : ''}
      ${stripHTML(s, g, mod)}
      ${g.paused ? `<div class="pause-veil" role="status"><span class="pv-ic">${icon('pause')}</span><b>Jogo pausado</b>
        <span>${host ? 'Toque em Continuar quando a galera estiver pronta.' : 'O host pausou o jogo. Já, já continua.'}</span></div>` : ''}
    </div>
    ${host ? `<div class="hostbar"><span class="hb-label">Controles do host</span>
      <button class="btn sm pill" data-act="${g.paused ? 'resume' : 'pause'}">${icon(g.paused ? 'play' : 'pause')}${g.paused ? 'Continuar' : 'Pausar'}</button>
      ${showTimer && !reveal ? `<button class="btn sm pill" data-act="addTime" ${g.paused ? 'disabled' : ''} title="Dar mais 15 segundos nesta etapa">${icon('plus')}15s</button>` : ''}
      ${reveal ? `<button class="btn primary sm pill" data-act="next">${g.round >= g.total ? 'Ver resultado do jogo' : 'Próxima rodada'}</button>` : `<button class="btn sm pill" data-act="next">Pular etapa</button>`}</div>`
      : reveal && role !== 'tv' ? '<p class="hint center" style="margin-top:14px">A próxima rodada começa quando o tempo acabar ou o host avançar.</p>' : ''}
  </section>`;
}

function stripHTML(s, g, mod) {
  const ph = mod.phases[g.phase] || {}, team = modeOf(s) === 'equipes' ? s.teams || {} : null;
  const ids = [...g.roster, ...s.order.filter(id => !g.roster.includes(id) && plays(s, id))].filter(id => s.players[id]);
  return `<ul class="strip" aria-label="Jogadores">${ids.map(id => {
    const p = s.players[id], inR = inRoster(g, id), delta = g.phase === 'reveal' ? g.roundDelta[id] || 0 : 0;
    const done = inR && (ph.betting ? id in (g.bets || {}) : mod.done(g, id));
    const stat = delta ? `<span class="sp-stat delta ${delta < 0 ? 'neg' : ''}">${delta > 0 ? '+' : ''}${delta}</span>`
      : done ? `<span class="sp-stat is-ok" title="Já jogou">${icon('check')}</span>`
      : `<span class="sp-stat ${inR ? 'is-wait' : 'is-out'}" title="${inR ? 'Ainda pensando' : 'Entra na próxima rodada'}"></span>`;
    return `<li class="sp ${p.connected || p.isBot ? '' : 'off'} ${id === Store.me.id ? 'me' : ''} ${team && team[id] ? 'team-' + team[id] : ''}" data-pid="${id}"><span class="throw-tgt" data-act="throwAt" data-id="${id}" title="Toque para arremessar">${avatar(p, 'md')}</span>${(g.jokers || {})[id] ? '<span class="sp-joker" title="Coringa: pontos em dobro">🃏</span>' : ''}
      <span class="sp-name">${esc(p.name)}</span><span class="sp-pts">${p.score} pts</span>${stat}</li>`;
  }).join('')}</ul>`;
}

function rankRows(items) {
  // items: [{ p, main, sub, value }] já ordenados; a barra é proporcional ao maior value.
  const max = Math.max(1, ...items.map(x => x.value));
  return items.map((x, i) => `<li class="rk-row"><span class="rk-pos">${i === 0 && x.value > 0 ? icon('crown') : i + 1}</span>${avatar(x.p, 'sm')}
    <div class="rk-mid"><span class="rk-name">${esc(x.p.name)}</span><span class="rk-bar"><i style="--w:${Math.max(2, x.value / max * 100)}%;--c:${x.p.color}"></i></span></div>
    <span class="rk-score">${x.main}${x.sub ? `<small>${x.sub}</small>` : ''}</span></li>`).join('');
}

function viewGameFinal(s) {
  const g = s.game, mod = Games[g.id], host = isHost();
  const ids = [...new Set([...g.roster, ...Object.keys(g.earned)])].filter(id => s.players[id]).sort((a, b) => (g.earned[b] || 0) - (g.earned[a] || 0) || s.players[b].score - s.players[a].score);
  const top = ids[0] && g.earned[ids[0]] ? nameOf(s, ids[0]) : null;
  const rows = rankRows(ids.map(id => ({ p: s.players[id], value: g.earned[id] || 0, main: `+${g.earned[id] || 0}`, sub: `${s.players[id].score} no total` })));
  return `<section class="screen game game-final" style="${gameVars(mod)}">
    <div class="panel stage">
      <header class="stage-head"><span class="sh-icon">${gameIcon(mod)}</span>
        <div><h1 class="sh-name">${mod.name} acabou</h1><p class="sh-sub">${top ? `${esc(top)} fez mais pontos neste jogo.` : 'Ninguém pontuou neste jogo.'}</p></div></header>
      <ol class="rk-list">${rows}</ol>
      ${(s.settings.auto || (s.playlist || []).length) && g.autoAt ? `<p class="auto-next">${icon('shuffle')}<span>${(s.playlist || []).length && Games[s.playlist[0]] ? `Próximo da sequência (${Games[s.playlist[0]].name}) em` : 'Próximo jogo surpresa em'} <b data-countdown="${g.autoAt}">${Math.max(0, Math.ceil((g.autoAt - now()) / 1000))}</b>s</span>
        ${host ? '<button class="btn xs" data-act="toggle" data-k="auto">Parar sequência</button>' : ''}</p>` : ''}
      ${host ? `<div class="row"><button class="btn primary pill" data-act="toLobby">Escolher outro jogo</button><button class="btn pill" data-act="openVote">${icon('vote')}Galera vota</button><button class="btn pill" data-act="restart">Jogar de novo</button>
        <button class="btn ghost pill" data-act="endMatch">Encerrar partida</button></div>` : '<p class="hint">O host vai escolher o próximo jogo<span class="dots"></span></p>'}
    </div>
  </section>`;
}

function viewPodium(s) {
  const mode = modeOf(s), terr = mode === 'territorio';
  const val = p => terr ? terrCount(s, p.id) : p.score;
  const unit = n => terr ? plural(n, 'território', 'territórios') : plural(n, 'ponto', 'pontos');
  const ranked = s.order.filter(id => plays(s, id)).map(id => s.players[id]).sort((a, b) => val(b) - val(a) || b.score - a.score);
  const best = ranked[0] ? val(ranked[0]) : 0;
  const winners = ranked.filter(p => val(p) === best);
  let title = 'Fim de jogo!';
  let sub = !ranked.length ? '' : winners.length > 1 ? `Empate no topo entre ${winners.map(p => esc(p.name)).join(' e ')}.` : `${esc(winners[0].name)} venceu com ${unit(best)}.`;
  let extra = '';
  if (mode === 'equipes') {
    const sc = teamScores(s), w = sc.a === sc.b ? null : sc.a > sc.b ? 'a' : 'b', mx = Math.max(1, sc.a, sc.b);
    title = w ? `${TEAMS[w].name} venceu!` : 'Empate entre as equipes!';
    sub = `${TEAMS.a.short} ${sc.a} × ${sc.b} ${TEAMS.b.short}. Destaque individual: ${ranked[0] ? esc(ranked[0].name) : '—'}.`;
    extra = `<div class="team-result">${['a', 'b'].map(k => `<div class="tr-row" style="--t:${TEAMS[k].color}"><b>${TEAMS[k].name}</b><span class="tr-bar"><i style="--w:${sc[k] / mx * 100}%"></i></span><span>${sc[k]}</span></div>`).join('')}</div>`;
  }
  if (terr && ranked[0] && best) title = `${esc(ranked[0].name)} dominou o mapa!`;
  const step = (p, place, d) => p ? `<div class="pod pod-${place}" style="--d:${d}s">
      <div class="pod-who">${place === 1 ? `<span class="pod-crown">${icon('crown')}</span>` : ''}${avatar(p, 'xl')}<b>${esc(p.name)}</b><span class="pod-pts">${terr ? unit(val(p)) : p.score + ' pts'}</span></div>
      <div class="pod-step">${place}</div></div>` : '<div class="pod"></div>';
  const rows = rankRows(ranked.map(p => ({ p, value: val(p), main: val(p), sub: terr ? `${p.score} pts` : '' })));
  const conf = Array.from({ length: 34 }, () => `<i style="--x:${rand(0, 100).toFixed(1)}%;--c:${pick(['#FBBF24','#EC4899','#14B8A6','#3B82F6','#A3E635','#FF5F57','#6366F1'])};--d:${rand(1.6, 3.4).toFixed(2)}s;--t:${rand(3, 5).toFixed(2)}s;--dx:${rand(-70, 70).toFixed(0)}px;--r:${rand(240, 900).toFixed(0)}deg"></i>`).join('');
  return `<section class="screen podium-screen">
    <div class="pod-layout">
      <div>
        <div class="pod-head"><span class="crown-big">${icon('crown')}</span><h1 class="podium-title">${title}</h1><p class="lede">${sub} Confira o pódio e o ranking geral.</p></div>
        ${extra}
        <div class="podium">${step(ranked[1], 2, .35)}${step(ranked[0], 1, .7)}${step(ranked[2], 3, 0)}</div>
      </div>
      <section class="panel ranking" aria-labelledby="rkTitle"><h2 class="panel-title" id="rkTitle">${terr ? 'Territórios' : 'Ranking geral'}</h2><ol class="rk-list">${rows}</ol></section>
    </div>
    ${terr ? `<section class="panel terr-final">${terrSVG(s)}</section>` : ''}
    ${highlightsHTML(s)}${medalsHTML(s)}${momentsHTML(s)}
    <div class="row center pod-actions">${isHost() ? '<button class="btn primary pill" data-act="newMatch">Nova partida com a mesma sala</button>' : ''}<button class="btn pill" data-act="podiumPng">${icon('download')}Baixar imagem do pódio</button>${myRole() === 'tv' ? '' : '<button class="btn pill" data-act="leave">Sair da sala</button>'}</div>
    <div class="confetti" aria-hidden="true">${conf}</div>
  </section>`;
}

function goalCheck(s) {
  const goal = cfg(s, 'goal'), g = s.game;
  if (!goal || !g || g.phase !== 'final') return false;
  const top = playerIds(s).filter(id => s.players[id]).sort((a, b) => s.players[b].score - s.players[a].score)[0];

  s.game = null; s.screen = 'podium';
  pushChat(s, { sys: true, text: `🏁 ${s.players[top].name} bateu a meta de ${goal} pontos!` });
  return true;
}

let soundPrev = null;
function soundCues(s) {
  const me = Store.me?.id, g = s?.game;
  const cur = s && me ? {
    screen: s.screen, gid: g?.id, round: g?.round, phase: g?.phase, paused: !!g?.paused,
    players: s.order.length, score: s.players[me]?.score ?? 0, vote: !!s.vote,
    holder: g?.id === 'bomba' ? g.data.holder : null,
    right: !!g && ((g.id === 'desenho' && me in (g.data.guessed || {})) || ((g.id === 'emoji' || g.id === 'termo') && me in (g.data.solved || {}))),
  } : null;
  const p = soundPrev;
  soundPrev = cur;
  if (!p || !cur) return;
  narrateCues(s, cur, p);
  if (cur.screen !== p.screen) { Sound.play(cur.screen === 'game' ? 'start' : cur.screen === 'podium' ? 'fanfare' : 'phase'); return; }
  if (cur.screen === 'lobby' && cur.players > p.players) Sound.play('join');
  if (cur.screen === 'lobby' && cur.vote && !p.vote) Sound.play('phase');
  if (cur.screen !== 'game') return;
  if (cur.gid !== p.gid) { Sound.play('start'); return; }
  if (cur.paused !== p.paused) { Sound.play(cur.paused ? 'pause' : 'resume'); return; }
  if (cur.phase !== p.phase || cur.round !== p.round) {
    if (cur.phase === 'final') Sound.play('fanfare');
    else if (cur.gid === 'bomba' && cur.phase === 'reveal') Sound.play('boom');
    else if (cur.phase === 'reveal') Sound.play('reveal');
    else if (cur.gid === 'reflexo' && cur.phase === 'go') Sound.play('go');
    else if (cur.gid === 'stop' && cur.phase === 'stopped') Sound.play('stop');
    else Sound.play('phase');
  }
  if (cur.score > p.score) setTimeout(() => Sound.play('points'), 500);
  if (cur.holder === me && p.holder !== me) Sound.play('alarm');
  if (cur.right && !p.right) Sound.play('correct');
}

/* ---------- Animação do timer e do multiplicador ---------- */
function frame() {
  const gNow = Store.room?.game?.paused ? Store.room.game.paused.at : now();
  $$('.timer').forEach(el => {
    const dl = +el.dataset.deadline, dur = +el.dataset.dur, left = Math.max(0, dl - gNow);
    const secN = Math.ceil(left / 1000);
    if (secN > 0 && secN <= 5 && lastTickKey !== dl + ':' + secN) { lastTickKey = dl + ':' + secN; Sound.play(secN <= 3 ? 'tickHi' : 'tick'); if (secN <= 3) buzz(20); }
    el.style.setProperty('--p', dur ? left / (dur * 1000) : 0);
    const num = el.querySelector('.timer-num'), sec = String(Math.ceil(left / 1000));
    if (num.textContent !== sec + 's') num.textContent = sec + 's';
    el.classList.toggle('low', left < 5000);
  });
  $$('[data-mult-start]').forEach(el => {
    if (el.dataset.frozen) return;
    const m = fatoMult(now() - +el.dataset.multStart, +el.dataset.multDur);
    el.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('now', +x.dataset.m === m));
  });
  $$('[data-countdown]').forEach(el => { const v = String(Math.max(0, Math.ceil((+el.dataset.countdown - now()) / 1000))); if (el.textContent !== v) el.textContent = v; });
  $$('[data-show-at]').forEach(el => { const show = now() >= +el.dataset.showAt; if (el.hidden === show) el.hidden = !show; });
  requestAnimationFrame(frame);
}

  react(el) {
    const e = el.dataset.v;
    // Uma reação a cada 350 ms: o que aparece aqui é o mesmo que os outros veem.
    if (now() - (Actions.lastReact || 0) < 350) return;
    Actions.lastReact = now();
    spawnFx(e, Store.room?.players[Store.me.id]);
    dispatch({ type: 'react', e });
  },
  qr() {
    let svg = '';
    try { const q = qrcode(0, 'M'); q.addData(roomLink()); q.make(); svg = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true }); } catch {}
    $('#modalRoot').innerHTML = `<div class="modal" data-act="closeModal"><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="qrTitle" data-keep-open>
      <h2 id="qrTitle">Entre pela câmera</h2><p class="hint">Aponte a câmera do celular para o código e toque no link que aparecer.</p>
      ${svg ? `<div class="qr-box">${svg}</div>` : '<p class="err">Não deu para gerar o QR code agora. Use o código da sala.</p>'}
      <p class="qr-pin">Sala <b>${Store.room.pin}</b></p>
      <button class="btn primary pill" data-act="closeModal">Fechar</button></div></div>`;
    $('#modalRoot .modal-card .btn')?.focus();
  },
  tour() { Tour.i = null; Tour.open(0); },
  tourGo(el) { Tour.open(+el.dataset.i); },
  preset(el) { dispatch({ type: 'host:preset', key: el.dataset.k }); },
  closeModal(el, e) {
    // Clique dentro do cartão não fecha; só no fundo escuro ou no botão Fechar.
    if (el.classList.contains('modal') && e.target.closest('[data-keep-open]')) return;
    $('#modalRoot').innerHTML = '';
  },
  toggle(el) { dispatch({ type: 'host:toggle', key: el.dataset.k }); },
  random() { dispatch({ type: 'host:random' }); },
  pause() { dispatch({ type: 'host:pause' }); },
  resume() { dispatch({ type: 'host:resume' }); },
  addTime() { dispatch({ type: 'host:addTime' }); },
  score(el) { dispatch({ type: 'host:score', id: el.dataset.id, d: +el.dataset.d }); },
  kick(el) { dispatch({ type: 'host:kick', id: el.dataset.id }); },
  rounds(el) { dispatch({ type: 'host:rounds', n: +el.dataset.n }); },
  startGame(el) { if (Store.local.offEdit) { dispatch({ type: 'host:gameOff', game: el.dataset.game }); return; } if (Store.local.plEdit) { dispatch({ type: 'host:plAdd', game: el.dataset.game }); return; } PlayBox.startGame(el.dataset.game); },
  next() { PlayBox.nextRound(); },
  restart() { dispatch({ type: 'host:restart' }); },
  toLobby() {
    const g = Store.room?.game;
    if (g && g.phase !== 'final' && !confirm('Voltar ao lobby agora? Os pontos já ganhos neste jogo continuam no placar.')) return;
    dispatch({ type: 'host:lobby' });
  },
  endMatch() { PlayBox.endMatch(); },
  newMatch() { dispatch({ type: 'host:newMatch' }); },
  vote(el) { PlayBox.castVote(el.dataset.id); },
  choose(el) { PlayBox.submitAnswer({ choice: el.dataset.v }); },
  fato(el) { PlayBox.submitAnswer({ value: el.dataset.v === '1' }); },
  help() { dispatch({ type: 'help' }); },
  gcat(el) { Store.local.gcat = el.dataset.v; render(); },
  plEdit() { Store.local.plEdit = !Store.local.plEdit; render(); },
  plDel(el) { dispatch({ type: 'host:plDel', i: +el.dataset.i }); },
  plClear() { dispatch({ type: 'host:plClear' }); },
  plStart() { Store.local.plEdit = false; dispatch({ type: 'host:plStart' }); },
  theme(el) { dispatch({ type: 'host:theme', theme: el.dataset.v }); },
  custOpen() { Store.local.custOpen = !Store.local.custOpen; render(); },
  narr() { Narrator.toggle(); render(); },
  vib() { try { localStorage.setItem('playbox:vib', vibOn() ? 'off' : 'on'); } catch {} buzz(60); render(); },
  podiumPng() { shareCanvas(podiumImage(Store.room), 'playbox-podio.png'); },
  throwAt(el) {
    const s = Store.room, id = el.dataset.id;
    if (!s || id === Store.me.id || s.settings.zoeira === false || myRole() === 'tv' || cfg(s, 'chatMode') === 'off' || now() - (Actions.lastThrow || 0) < 1200) return;
    Actions.lastThrow = now();
    const e = Store.local.proj || '🍅';
    runFx({ pid: Store.me.id, t: 'throw', e, to: id });
    dispatch({ type: 'fx', t: 'throw', e, to: id });
  },
  proj(el) { Store.local.proj = el.dataset.v; $$('[data-act="proj"]').forEach(b => b.classList.toggle('on', b.dataset.v === Store.local.proj)); },
  horn() {
    if (Store.room?.settings.zoeira === false || now() - (Actions.lastHorn || 0) < 6000) return;
    Actions.lastHorn = now(); runFx({ pid: Store.me.id, t: 'horn' }); dispatch({ type: 'fx', t: 'horn' });
  },
  zfx(el) {
    const k = el.dataset.v, s = Store.room;
    if (!s || s.settings.zoeira === false || myRole() === 'tv' || !FX_GAP[k]) return;
    const mine = FX_GAP[k] - (now() - ((Actions.lastZfx || {})[k] || 0)), room = CHAOS_ROOM_GAP - (now() - (FxRT.lastChaos || 0));
    if (mine > 0) { toast(`${el.textContent} recarregando: mais ${Math.ceil(mine / 1000)} s`); return; }
    if (room > 0) { toast(`Calma! O caos volta em ${Math.ceil(room / 1000)} s`); return; }
    (Actions.lastZfx = Actions.lastZfx || {})[k] = now();
    el.classList.remove('is-cool'); void el.offsetWidth; el.classList.add('is-cool');
    el.style.setProperty('--cd', FX_GAP[k] + 'ms');
    runFx({ pid: Store.me.id, t: k }); dispatch({ type: 'fx', t: k });
  },
  emote(el) {
    if (now() - (Actions.lastEmote || 0) < 1500) return;
    Actions.lastEmote = now(); runFx({ pid: Store.me.id, t: 'emote', e: el.dataset.v }); dispatch({ type: 'fx', t: 'emote', e: el.dataset.v });
  },
  chatQuick(el) { dispatch({ type: 'chat', text: el.dataset.v }); },
  pollVote(el) { dispatch({ type: 'pollVote', i: +el.dataset.i }); },
  lobbyReady() { dispatch({ type: 'lobbyReady' }); },
  suggest(el) { dispatch({ type: 'suggest', game: el.dataset.game }); },
  warm(el, e) {
    Store.local.warmN = (Store.local.warmN || 0) + 1;
    const pop = document.createElement('span'); pop.className = 'warm-pop'; pop.textContent = '🔥';
    pop.style.left = (e?.clientX || innerWidth / 2) - 10 + 'px'; pop.style.top = (e?.clientY || innerHeight / 2) - 20 + 'px';
    document.body.appendChild(pop); setTimeout(() => pop.remove(), 650);
    if (!Store.local.warmT) Store.local.warmT = setTimeout(() => { const n = Store.local.warmN; Store.local.warmN = 0; Store.local.warmT = null; if (n) dispatch({ type: 'warm', n }); }, 900);
  },
  joker() { dispatch({ type: 'joker' }); },
  kudos(el) { const to = el.dataset.id; runFx({ pid: Store.me.id, t: 'kudos', to }); dispatch({ type: 'kudos', to }); },
  cfg(el) { const k = el.dataset.k; dispatch({ type: 'host:set', key: k, v: cfg(Store.room, k) + CFG[k].step * +el.dataset.d }); },
  cfgSet(el) { dispatch({ type: 'host:set', key: el.dataset.k, v: el.dataset.v }); },
  fold(el) { const f = Store.local.fold || (Store.local.fold = {}); f[el.dataset.k] = !f[el.dataset.k]; render(); },
  offEdit() { Store.local.offEdit = !Store.local.offEdit; Store.local.plEdit = false; render(); },
  ready() { dispatch({ type: 'ready' }); },
  flip() {
    const g = Store.room.game, key = `${g.round}`;
    const on = Store.local.flip !== key;
    Store.local.flip = on ? key : null;
    const card = $('.role-card');
    if (card) { card.classList.toggle('flipped', on); card.setAttribute('aria-pressed', on); }
    const ok = $('#roleOk'); if (ok && on) ok.disabled = false;
    const link = $('#flipLink'); if (link) link.innerHTML = `${on ? 'Esconder a carta' : 'Vire a carta'}${icon('next')}`;
  },
  reject(el) { dispatch({ type: 'reject', target: el.dataset.target, cat: +el.dataset.cat }); },
  stop() { PlayBox.pressStop(stopInputs()); },
};

// Atualiza o seletor de avatar sem redesenhar a tela (evita piscar e perder o foco).
function syncPicker() {
  const pr = Store.local.profile;
  $('#avPreview').innerHTML = avatar(pr, 'md');
  $$('.emo').forEach(b => { const on = b.dataset.v === pr.avatar; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  $$('.sw').forEach(b => { const on = b.dataset.v === pr.color; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
}
// Espelha o valor do campo de PIN (invisível) nas 4 caixinhas.
function syncPinSlots() {
  const input = $('#pin');
  if (!input) return;
  const v = input.value, focused = document.activeElement === input;
  $$('.slot').forEach((el, i) => {
    el.textContent = v[i] || '';
    el.classList.toggle('empty', !v[i]);
    el.classList.toggle('active', focused && i === Math.min(v.length, 3));
  });
}
function selectTab(id, focus) {
  Store.local.homeTab = id;
  $$('[role="tab"]').forEach(t => { const on = t.dataset.v === id; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; if (on && focus) t.focus(); });
  $$('.tab-body').forEach(p => { p.hidden = p.id !== 'panel-' + id; });
  const err = $('#joinErr'); if (err) err.textContent = '';
}

const Forms = {
  chat() {
    const input = $('#chatIn'), text = (input.value || '').trim();
    if (!text) return;
    input.value = '';
    dispatch({ type: 'chat', text });
    input.focus();
  },
  title() { dispatch({ type: 'host:set', key: 'title', v: $('#roomTitle').value }); },
  custom() {
    Store.local.custOpen = false;
    dispatch({ type: 'host:custom', words: $('#cuWords').value, facts: $('#cuFacts').value, prices: $('#cuPrices').value, only: $('#cuOnly').checked });
  },
  home(form, submitter) {
    // No PC as duas ações ficam visíveis lado a lado; no celular vale a aba aberta.
    const visible = submitter && submitter.offsetParent !== null;
    const mode = visible ? (submitter.id === 'createBtn' ? 'create' : 'join') : Store.local.homeTab;
    if (mode === 'join') return Forms.join(form);
    const pr = profileOrError(); if (pr) createRoom(pr);
  },
  async join(form) {
    const pin = ($('#pin').value || '').toUpperCase().trim(), err = $('#joinErr');
    err.textContent = '';
    const pr = profileOrError(); if (!pr) return;
    if (!/^[A-Z0-9]{4}$/.test(pin)) { err.textContent = 'O código da sala tem 4 letras ou números.'; $('#pin').focus(); return; }
    const btn = $('#joinBtn'); btn.disabled = true; btn.textContent = 'Procurando a sala…';
    const arrow = $('#joinArrow'); if (arrow) arrow.disabled = true;
    if ($('#asAudience')?.checked) pr.role = 'spectator';
    const res = await joinRoom(pin, pr, null, t => {
      if (t < 6000) return;
      const b = $('#joinBtn'); if (b) b.textContent = 'Ainda procurando…';
      const hint = $('#joinHint');
      if (hint) { hint.hidden = false; hint.textContent = `Conectando à sala ${pin}. Se demorar, peça para quem criou a sala abrir a tela do PlayBox.`; }
    });
    if (!res.ok) {
      render();
      const e2 = $('#joinErr'); if (e2) e2.textContent = res.reason;
    }
  },
  mane() {
    const el = $('#maneIn'), v = parseNum(el.value);
    if (!Number.isFinite(v)) { $('#formErr').textContent = 'Digite um número, por exemplo 1500 ou 2,5.'; el.focus(); return; }
    PlayBox.submitAnswer({ value: v });
  },
  clue() {
    const g = Store.room.game, d = g.data;
    const word = d.impostor === Store.me.id ? null : IMP_WORDS[d.wi].w;
    const c = checkClue($('#clueIn').value, word);
    if (c.err) { $('#formErr').textContent = c.err; $('#clueIn').focus(); return; }
    PlayBox.submitAnswer({ clue: c.v });
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, gm = Store.room?.game;
  const ui = act.startsWith('g:') && gm ? Games[gm.id].ui : null;
  const fn = Actions[act] || (ui && ui[act.slice(2)] && ui[act.slice(2)].bind(ui));
  if (fn) { e.preventDefault(); Sound.play(act === 'g:key' ? 'key' : 'click'); fn(el, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const name = f.dataset.form, gm = Store.room?.game;
  if (name.startsWith('g:')) { const forms = gm && Games[gm.id].forms; forms && forms[name.slice(2)] && forms[name.slice(2)](f); return; }
  Forms[name]?.(f, e.submitter);
});
document.addEventListener('focusin', e => { if (e.target.id === 'pin') syncPinSlots(); });
document.addEventListener('focusout', e => { if (e.target.id === 'pin') syncPinSlots(); });
let draftT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pin') {
    const v = t.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v !== t.value) t.value = v;
    Store.local.pinDraft = v;
    syncPinSlots();
  } else if (t.id === 'nick') {
    Store.local.profile.name = t.value; saveProfile();
    const err = $('#nickErr'); if (err) err.textContent = '';
  } else if (t.id === 'clueIn') {
    const v = t.value.replace(/\s+/g, '');
    if (v !== t.value) t.value = v;
  } else if (t.dataset.stop !== undefined) {
    refreshStopUI();
    clearTimeout(draftT);
    draftT = setTimeout(() => dispatch({ type: 'draft', answers: stopInputs() }), 250);
  }
});
document.addEventListener('keydown', e => {
  // Enter num campo do Stop pula para o próximo; no último, aperta Stop se puder.
  const t = e.target;
  if (e.key === 'Escape') { closeOverlays(); return; }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && $('#modalRoot .tour-card')) { e.preventDefault(); Tour.open(Tour.i + (e.key === 'ArrowRight' ? 1 : -1)); return; }
  const gm = Store.room?.screen === 'game' && Store.room.game;
  if (gm && Games[gm.id].keydown && !['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName) && Games[gm.id].keydown(e, gm, Store.room, Store.me?.id)) return;
  if (t.getAttribute?.('role') === 'tab' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    selectTab(Store.local.homeTab === 'join' ? 'create' : 'join', true);
    return;
  }
  if (e.key !== 'Enter' || t.dataset?.stop === undefined) return;
  e.preventDefault();
  const next = $(`[data-stop="${+t.dataset.stop + 1}"]`);
  if (next) next.focus(); else { const b = $('#stopBtn'); if (b && !b.disabled) b.click(); }
});

/* =====================================================================
   API pública (para plugar backend ou automatizar testes)
   ===================================================================== */
const PlayBox = window.PlayBox = {
  createRoom,
  joinRoom,
  leaveRoom,
  startGame: gameId => dispatch({ type: 'host:start', game: gameId }),
  submitAnswer: payload => dispatch({ type: 'submit', ...payload }),
  castVote: (target, extra = {}) => dispatch({ type: 'vote', target, ...extra }),
  pressStop: answers => dispatch({ type: 'stop', answers }),
  nextRound: () => dispatch({ type: 'host:next' }),
  endMatch: () => dispatch({ type: 'host:end' }),
  updateScores: deltas => { if (isHost() && Store.room) { updateScores(Store.room, deltas); commit(); } },
  get state() { return Store.room; },
  Games, Transport,
};

/* =====================================================================
   Início
   ===================================================================== */
// Atualiza o aviso de conexão do lobby quando o estado da rede muda.
Transport.onStatus = () => { if (Store.room && Store.me && Store.room.screen === 'lobby') render(); };
// Quando a conexão com um servidor (re)abre, a sala se ressincroniza: o host reenvia o estado
// e o jogador pede o estado atual (ele pode ter perdido mensagens enquanto estava fora).
Transport.onLinkUp = role => {
  if (!Store.me || joinWait) return;
  if (role === 'host' && Store.room) Transport.send({ kind: 'state', state: Store.room });
  else if (role === 'client') Transport.send({ kind: 'hello' });
};
// Mantém a tela acesa durante a partida: no celular, tela apagada derruba a conexão.
const Wake = {
  lock: null,
  async on() {
    if (!('wakeLock' in navigator) || this.lock || document.visibilityState !== 'visible' || !Store.me) return;
    try { this.lock = await navigator.wakeLock.request('screen'); this.lock.addEventListener('release', () => { this.lock = null; }); } catch {}
  },
  off() { try { this.lock && this.lock.release(); } catch {} this.lock = null; },
};
// Arrastar uma imagem (a logo, um avatar) e soltar na página fazia o navegador abrir a imagem
// no lugar do PlayBox, derrubando a pessoa da sala (e a sala inteira, se fosse o host).
document.addEventListener('dragstart', e => { if (e.target instanceof HTMLImageElement || e.target instanceof HTMLCanvasElement) e.preventDefault(); });
['dragover', 'drop'].forEach(ev => document.addEventListener(ev, e => { if (!e.target.closest?.('input,textarea')) e.preventDefault(); }));
// Recarregar ou fechar sem querer: o navegador pergunta antes (o host derrubaria a sala de todo mundo).
addEventListener('beforeunload', e => {
  const s = Store.room;
  if (!Store.me || !s) return;
  const others = s.order.some(id => id !== Store.me.id && s.players[id] && !s.players[id].isBot);
  if ((isHost() && others) || (!isHost() && s.screen === 'game')) { e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !Store.me) return;
  Wake.on();
  Transport.wake();
  if (isHost()) { if (Store.room) Transport.send({ kind: 'state', state: Store.room }); }
  else if (!joinWait) Transport.send({ kind: 'hello' });
});

async function boot() {
  Object.values(Games).forEach(addBetPhase);
  Store.local.profile = loadProfile();
  const hashRaw = location.hash.slice(1).toUpperCase(), tvLink = /^[A-Z0-9]{4}-TV$/.test(hashRaw);
  const hashPin = tvLink ? hashRaw.slice(0, 4) : hashRaw;
  if (/^[A-Z0-9]{4}$/.test(hashPin)) { Store.local.pinDraft = hashPin; Store.local.invite = true; Store.local.homeTab = 'join'; }
  requestAnimationFrame(frame);
  let sess = Session.load();
  // Um link de convite para outra sala vale mais que a sala antiga guardada nesta aba.
  if (sess && /^[A-Z0-9]{4}$/.test(hashPin) && sess.pin !== hashPin) { Session.clear(); sess = null; }
  if (sess?.isHost) {
    const saved = loadRoom(sess.pin);
    if (saved && saved.hostId === sess.id) {
      Store.me = sess; Store.room = saved;
      Object.values(saved.players).forEach(p => { p.lastSeen = now(); });
      Transport.open(sess.pin, onMessage, 'host');
      startHost();
      commit();
      Wake.on();
      return;
    }
    Session.clear();
  } else if (sess?.pin) {
    render();
    const res = await joinRoom(sess.pin, sess.profile, sess.id);
    if (!res.ok) { Session.clear(); render(); toast('A sala anterior não está mais aberta.'); }
    return;
  }
  render();
  if (tvLink) Actions.joinTv();
}
boot();
</script>
